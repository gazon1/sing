[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sgate"
version = "0.1.0"
description = "Unified CLI for singularity-todo gate scripts"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "loguru>=0.7",
    "rich>=13.0",
]

[project.scripts]
sgate = "sgate.cli:main"

# scripts/src/sgate/ is the project root; the sgate package lives directly in it
# (not in a src/ subdirectory). pyproject.toml and sgate/ are siblings.
# A .pth file is installed alongside the package to add this directory to sys.path.
[tool.setuptools]
packages = []
