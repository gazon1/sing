# Scenario specification for AUTH-SEED-01.
#
# A user scenario from the auth/sync test plan (the project's auth & sync
# test plan, §7, flow UX-D). Linkage to automation is *not*
# here — it lives in code (@DisplayName for Kotlin, a `scenario:AUTH-SEED-01` Maestro tag).
#
# The plan states that screen names are provisional: the steps and the checks stand
# even if the screen is arranged differently, and only the locators change. This spec
# records the behaviour, not the layout, so that a redesign does not invalidate it.

id: AUTH-SEED-01
title: Sign in on a device that already holds local data
priority: P1
status: confirmed
targets: [android, desktop]
preconditions: The device holds 20 tasks, 3 projects and 2 profiles created without an account.
steps:
  - Sign in to an account.
  - Minimize the app part way through, then bring it back.
  - Turn the network off part way through, then restore it.
expected: >-
  The local data is uploaded, the application stays usable while it happens, and the upload survives being interrupted and resumes. No task is lost and none is duplicated. Signing in again on the same device does not upload a second time.
