# Scenario specification for SETTINGS-03.
#
# Claimed on `android`, carried by Maestro flow
# `Maestro/flows/settings/03-cycle-tabs.yaml` (`scenario:SETTINGS-03`).
#
# This is a standing regression guard for a crash that shipped once: Settings is
# a rail of 11 tabs, every one of them is reachable only through it, and a crash
# on any tab makes the whole screen — including the preferences above — unusable.
#
# The scenario claims each tab opens. It does not pin the count at 11, because
# that number will change and the crash it guards against is not about the
# number.

id: SETTINGS-03
title: "Every tab in the Settings rail opens without crashing"
area: feature.settings
priority: P2
status: confirmed
targets: [android]
preconditions: >-
  The app is running; Settings is reached from the Menu sheet.
steps:
  - Open Settings from the menu sheet.
  - Visit every tab in the rail.
expected: >-
  Each tab opens without a crash, so every Settings section is reachable. A
  crash on any one tab would make the rest of the screen unreachable too.