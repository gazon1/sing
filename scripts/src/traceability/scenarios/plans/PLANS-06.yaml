# Scenario PLANS-06 — the Plans tab stopped being the project list.
#
# Both halves are asserted. The tab must show the timeline, and the projects
# must have gone somewhere rather than disappeared: they are in the menu, as a
# tree. A screen that simply stopped listing projects would pass a check on
# the tab alone and lose a feature.

id: PLANS-06
title: "The Plans tab no longer shows a project list"
area: feature.plans
priority: P1
status: confirmed
targets: [android, desktop]
preconditions: >-
  Two or more projects exist.
steps:
  - "Open the Plans tab and look at what is listed."
  - "Open the app menu and look at its Projects section."
expected: >-
  The Plans tab lists tasks grouped by date and shows no project list. The
  projects appear in the menu's Projects section as a tree, so none of them has
  been lost with the list.
