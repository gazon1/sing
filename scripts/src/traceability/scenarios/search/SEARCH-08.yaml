# Scenario specification for SEARCH-08.

id: SEARCH-08
title: A term matches the beginning of a word, and not its middle
area: feature.search
priority: P1
status: confirmed
targets: [android]
preconditions: >-
  A task exists whose title holds the word "architecture", and another whose
  title holds the word "airport". Nothing else carries either word, so both
  answers are unambiguous.
steps:
  - Open the quick search from the menu sheet.
  - Type "arch".
  - Observe the results.
  - Clear the query and type "port".
  - Observe the results.
expected: >-
  The first search finds the task titled "architecture": a term matches the
  beginning of a word. The second does not find the task titled "airport": the
  term matches the beginning of a word and not its middle. The search answers
  one question — "which records carry this word" — and the index answers it.
