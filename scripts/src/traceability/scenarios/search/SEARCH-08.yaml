# Scenario specification for SEARCH-08.
#
# The Maestro flow `Maestro/flows/search/08-word-prefix.yaml` that carried this
# on Android was retired: the rule is owned by the desktop carrier below, which
# asks the search screen the two questions the flow asked — "arch" finds
# "architecture", "port" does not find "airport". The index half of the same
# rule — the FTS expression behind those two answers — is owned by
# `SearchUseCaseFtsTest` in `shared/src/jvmTest`, against a real SQLite, and the
# rule itself by `SearchContainsModeTest` in `shared/src/commonTest`.
#
# The flow's Android-only residue is not this guarantee: the quick-search entry
# path (`menu_quick_search` → `search_input`) and the on-device Room index are
# exercised by the other search flows in this area
# (`search/04-filter-description.yaml` types a word-prefix query on the device
# and asserts the rows it finds).
#
# The retired flow entered its text with Maestro's `inputText`, which injects
# the text instead of typing it through the device's installed keyboard
# (`search/02-cyrillic.yaml` records the measurement: the flow does not depend
# on which IME is installed). So the flow never owned the IME either, and the
# retirement gives up no IME coverage: the IME-driven typing in the search
# field is owned by no test today — the device tests inject the text with the
# shell's `input text` command, which does not go through the installed
# keyboard either — and this retirement does not change that.

id: SEARCH-08
title: A term matches the beginning of a word, and not its middle
area: feature.search
priority: P1
status: confirmed
targets: [desktop]
preconditions: >-
  A task exists whose title holds the word "architecture", and another whose
  title holds the word "airport". Nothing else carries either word, so both
  answers are unambiguous.
steps:
  - Open the search screen.
  - Type "arch".
  - Observe the results.
  - Replace the query with "port".
  - Observe the results.
expected: >-
  The first search finds the task titled "architecture": a term matches the
  beginning of a word. The second does not find the task titled "airport": the
  term matches the beginning of a word and not its middle. The search answers
  one question — "which records carry this word" — and the index answers it.
