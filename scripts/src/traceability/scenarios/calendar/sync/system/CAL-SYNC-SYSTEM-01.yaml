# Scenario specification for CAL-SYNC-SYSTEM-01.
#
# Linkage lives in code (`@DisplayName` in a user-flow test source set).
# `area` is derived from the path; the id prefix CAL-SYNC-SYSTEM is checked
# against calendar/sync/system.

id: CAL-SYNC-SYSTEM-01
title: The system-calendar projection says so when the platform cannot do it
area: feature.calendar
priority: P2
status: confirmed
targets: [desktop]
preconditions: >-
  Settings → Calendar is open and the provider is the system calendar. On
  desktop, or any platform with no calendar provider the app can reach.
steps:
  - Select the system calendar in the provider selector.
expected: >-
  The panel states that system calendar sync needs Android and that the user's
  tasks are unaffected, rather than rendering an enable switch and an empty
  calendar list over providers that were never asked. The Google half stays
  reachable, because the two are alternatives and one being impossible must not
  hide the other.

# `android` is not a target of this scenario, and that is not an oversight: on
# Android the panel's unavailable branch is unreachable by construction. The
# branch is gated on `state.deviceSyncSupported`, the conjunction of
# `calendarProvider.isSupported && syncRepo.isSupported && appQueries.isSupported
# && scheduler.isSupported`, and on Android all four seams are real, so the
# panel takes the available branch. The Maestro flow that claimed this scenario
# on Android (`Maestro/flows/calendar_sync/02-system-calendar-unavailable.yaml`)
# asserted a state no Android device can produce and failed in every sampled run;
# gazon1/sing#3115 removed it. Desktop reaches the branch by construction, so
# that cell is claimable and is claimed by a carrier
# (`CalendarSyncSystemScenarioTest.the_system_panel_says_why_it_cannot_work`).
#
# The Android state that *is* reachable and currently has no owner is the
# permission gate: with READ/WRITE_CALENDAR not granted the panel shows the
# permission prompt instead of the controls. It is a different guarantee from
# this one (missing permission, not a missing platform), it has no test tag, and
# it is not claimed by any carrier.