# Scenario specification for AGENDA-01.
#
# Claimed on `android`, carried by the Maestro flow
# `Maestro/flows/agenda/01-smart-lists.yaml` — the flow is the carrier in fact;
# it carries no `scenario:AGENDA-01` tag yet, which is the wider gap the audit
# lists for the agenda flows (Appendix B of
# `docs/testing/maestro-guarantees-inventory.md`).
#
# THE RULE, in one line: the Inbox tab holds the tasks that are not scheduled
# yet — the undated ones, and nothing else. The three bottom-bar tabs are a
# partition of the tasks (ADR `2026-10-31-the-agenda-tabs-are-disjoint`), so
# dating a task takes it out of the Inbox: a task due today is in the Today
# tab, one due later in the Upcoming tab.
#
# This spec used to say the opposite — that a dated task stays in the Inbox
# and only changes section. The implementation (`AgendaPresets.Inbox`),
# `AgendaTabDisjointnessTest`, `AgendaInboxTabMeaningTest` and the flow itself
# all said the Inbox is undated-only; the spec was the only thing that said
# otherwise, so it is what was wrong. Reconciled in #3114.

id: AGENDA-01
title: "A dated task leaves the Inbox"
area: feature.agenda
priority: P2
status: confirmed
targets: [android]
preconditions: >-
  One task exists in Inbox with no date, so the No Date section has content to
  move.
steps:
  - Open Inbox and note the task under the "No Date" section.
  - Give the task a date.
  - Open Inbox again and look at the sections.
expected: >-
  The task leaves the Inbox: the "No Date" section no longer holds it, and the
  task is not on the Inbox screen at all. It is not lost — a task dated today
  is in the Today tab, and one dated further out is in the Upcoming tab. The
  assertion is on the task's absence from Inbox, because that is the claim the
  Inbox makes; the section headers carry counts of their own, so a section that
  still holds other tasks stays on screen.
