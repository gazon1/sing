# Scenario MENU-03 — the menu's project list is live.
#
# The menu is opened and closed many times a day, so a list that shows what the
# projects looked like when the app started would be wrong more often than
# right. The rename is the sharper half: a stale list shows the old name under
# the new project.
#
# The platforms differ in what can be *seen* while the menu is open: the
# Desktop drawer and the app share one window, so the list can be watched while
# the change happens. The Android menu is a modal sheet — a surface the user
# cannot reach past — so a change made elsewhere closes it, and the list is
# read through the next opening. The list itself is live on both: it is drawn
# from the profile as it is now, not from a snapshot taken when the menu was
# first opened.

id: MENU-03
title: "The menu's project list reflects creations and renames made elsewhere"
area: feature.menu
priority: P1
status: confirmed
targets: [android, desktop]
preconditions: >-
  A project exists and the menu has been opened at least once.
steps:
  - "Open the menu and note the project's name."
  - "Rename the project elsewhere and create a second project elsewhere."
  - "Open the menu again."
expected: >-
  The menu's Projects section shows the new name and shows the newly created
  project, and neither change needed the app to be restarted. On Desktop the
  section is watched while the change happens, because the drawer and the app
  share one window; on Android the menu is a modal sheet, so the change made
  elsewhere closes it and the section is read through the next opening.
