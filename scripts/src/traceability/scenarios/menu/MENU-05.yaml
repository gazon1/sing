# Scenario MENU-05 — the menu shows what is being worked on.
#
# Two rules about what the menu's Projects section contains. A childless project
# must not offer an expander it has nothing to put behind, and a closed project
# has left the work — it belongs to the full list, not to the section the user
# reads every day.
#
# The Android menu lists the root projects and offers no expander at all, so the
# first rule holds there by construction; the Desktop menu draws the tree, and
# there the rule is a rule of its own.

id: MENU-05
title: "A project without children shows no expander, and a closed project is absent from the menu's Projects section"
area: feature.menu
priority: P2
status: confirmed
targets: [android, desktop]
preconditions: >-
  One project has no children, and one project has been closed.
steps:
  - "Open the app menu and look at the Projects section."
expected: >-
  The childless project shows no expander control, so nothing in the menu
  invites an expansion that cannot happen. The closed project is not in the
  Projects section at all.
