---
# Scenario MENU-08 — the Android menu lists the root projects.
#
# The menu is the way into the projects, and on Android it is a *list*: the
# root projects, one row each. A child is not in the list — it is behind its
# parent, and the parent's own screen says how many children it has and opens
# them. A menu that drew the whole hierarchy would be a tree of hundreds of
# rows in a sheet the user opens to get somewhere else (ADR
# `2026-11-12-android-menu-roots-only.md`).
#
# The chain goes three deep, because that is where the menu's shortcut ends:
# every level below a root costs one more step down, and the way back is the
# way down.
#
# The Desktop menu keeps the tree, and MENU-01 is its scenario: the two menus
# draw the same model, and each draws as much of the hierarchy as its own
# surface can carry.

id: MENU-08
title: "The Android menu lists the root projects, and a nested project is reached through its parent's screen"
area: feature.menu
priority: P1
status: confirmed
targets: [android]
preconditions: >-
  A root project A has a child project B, and B has a child project D.
steps:
  - "Open the app menu and look at the Projects section."
  - "Tap project A."
  - "On A's screen, open the entry that lists A's sub-projects."
  - "Tap project B there."
  - "On B's screen, open the entry that lists B's sub-projects."
  - "Tap project D there."
  - "Go back three times."
expected: >-
  The Projects section lists the root project A and no child: neither B nor D is
  in the menu. A's own screen offers an entry into its sub-projects, and that
  entry opens a list holding B; B's screen offers the same about D. Tapping B
  opens B's screen and tapping D opens D's, and each back returns to the screen
  before it, so the way down into the hierarchy is also the way back out of it.
