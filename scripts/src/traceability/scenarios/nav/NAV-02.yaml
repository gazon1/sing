# Scenario NAV-02 — both platforms offer the same menu.
#
# The two menus are drawn by different code — a bottom sheet on Android, a
# drawer on Desktop — and they are the same menu to the user. A feature added
# to one of them and not the other is a feature half the users do not have.
#
# The parity itself is owned by the shared model, not by a screen: `AppMenu`
# and `DestinationKind.menuEntries` are one list, and
# `desktopApp/src/jvmTest/.../flows/menu/MenuParityFlowTest.kt` asserts that
# the two agree and that the drawer renders every entry of the list. That
# check fails if an entry is added to one menu and not the other, which is the
# whole claim of this scenario — so the Maestro flow that used to walk the
# Android sheet for the same three ids was redundant and was retired on
# 2026-11-23 (#3119). The Android residue lives elsewhere: the sheet's
# per-row reachability is `MenuSheetBoundsTest` (device tier), the "all
# projects" entry is MENU-06 and the project roots are MENU-08.
#
# The projects are the other half of the menu, and they are owned the same
# way: both surfaces draw the same section from the same state, and the one
# switch between the two drawings is the expander — the sheet passes `null`
# and draws the roots, the drawer passes a toggle and draws the tree. The
# roots the two surfaces offer are therefore the roots of one state, and the
# same test class asserts it: the two drawings offer the same root projects
# in the same order.
#
# The entries are the same on both. The *projects* are the same too, but the
# two surfaces draw as much of the hierarchy as they can carry: the Desktop
# drawer unfolds a project's children in place, the Android sheet lists the
# root projects and reaches a child through its parent's own screen (ADR
# `2026-11-12-android-menu-roots-only.md`).

id: NAV-02
title: "Android and Desktop expose the same menu entries and the same root projects"
area: feature.nav
priority: P2
status: confirmed
targets: [android, desktop]
preconditions: >-
  The same profile is open on an Android device and on the desktop build, and
  it holds several projects.
steps:
  - "Open the menu on Android and open the drawer on Desktop."
  - "Compare the entries of the two."
  - "Compare the root projects of the two."
expected: >-
  Both surfaces offer the same entries — the Projects section among them, and
  not the Calendar, which is a tab and not a menu entry — and the same root
  projects in the same order. The Desktop drawer unfolds a project's children
  in place; the Android sheet lists the roots only, and a child is reached
  from its parent's own screen.
