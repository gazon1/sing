# The named test profiles and the tasks each one runs.
#
# A POPULATION says which tests run (it is a set of JUnit tags);
# a PROFILE says which TASKS run. They are different questions, and before
# this file existed only the first one had a name in it — which is why
# "the tests" meant "the fast population" on a pull request and "the whole
# JVM tier" on a laptop, with no word anywhere for the difference.
#
# The format is `profile=task,task`, the same shape as the populations file
# and for the same reason: a name, not a spelled-out selection. The task is
# `module:task` — the Gradle task path without the leading colon, which is
# also the identity the evidence reporter reads off a report's path
# (`shared/build/test-results/jvmTest` → `shared:jvmTest`).
#
# Beside the tasks, a profile has PROPERTIES — the questions about it that
# are not "which tasks does it run". They are written with the properties-file
# COLON separator, exactly as in `config/test-populations.properties`:
#
#     profile.property: value
#
# The two separators are the contract, and the reason is the same one it is
# in the populations file: the Python readers split on `=` and must not read a
# property as a profile of its own. A property written with `=` would become a
# profile named after the property, and the file would claim two profiles
# where there is one.
#
# The properties that exist today:
#
#   tier       — which tier the profile belongs to: `jvm`, `android`, `maestro`
#                or `all`. The tier is what tells a reader whether the profile
#                needs a device, and it is what the gate uses to answer "is
#                there one profile per tier".
#   population — the NAMED selection the profile runs with, for the profiles
#                that are tag-selected at all. `fast` and `full` have one;
#                `device` and `e2e` have none, and that is not an omission —
#                the instrumented tests carry no `@Tag` at all, and a Maestro
#                flow's tag (`smoke`, `regression`, a feature name) lives in
#                a namespace of its own that JUnit knows nothing about. A
#                population for those tiers would be a name for a selection
#                nothing implements.
#
# The profiles:
#
#   fast   — the JVM tier without the slow half. What a pull request runs and
#            what the fast coverage floors are measured against.
#   full   — the same tasks, with the slow half added. The difference between
#            `fast` and `full` is the POPULATION and nothing else, and the
#            gate enforces that: a profile whose task list differs from its
#            sibling's is a profile that measures something the population
#            does not describe.
#   device — the instrumented tier: one Gradle task, one device.
#   e2e    — the Maestro flows. Not a Gradle task at all, which is why the
#            module part of `maestro:flows` is a declared pseudo-module rather
#            than a project in `settings.gradle.kts`.
#   all    — the union of the four. It is a DECLARED set, deliberately, and
#            not "every XML file under build/": a wildcard sweep counts the
#            reports of a task nobody ran in this run, and a report of an
#            unrelated task is evidence about a different execution. The
#            evidence reporter reads this file when it is asked for the `all`
#            profile, and it expects exactly these tasks and no others.
#
# The gate that keeps this file honest is `scripts/check-test-profiles.py`.
fast=shared:jvmTest,core-domain:jvmTest,shared:archTest,shared:testAndroidHostTest,desktopApp:test,adr-cli:test,adr-core:jvmTest,mcp-server:test,detekt-rules:test,tools:unwritten-properties:test
full=shared:jvmTest,core-domain:jvmTest,shared:archTest,shared:testAndroidHostTest,desktopApp:test,adr-cli:test,adr-core:jvmTest,mcp-server:test,detekt-rules:test,tools:unwritten-properties:test
device=androidApp:connectedDebugAndroidTest
e2e=maestro:flows
all=shared:jvmTest,core-domain:jvmTest,shared:archTest,shared:testAndroidHostTest,desktopApp:test,adr-cli:test,adr-core:jvmTest,mcp-server:test,detekt-rules:test,tools:unwritten-properties:test,androidApp:connectedDebugAndroidTest,maestro:flows

# The tier of each profile. One profile per tier, and `all` is the tier that
# is every tier.
fast.tier: jvm
full.tier: jvm
device.tier: android
e2e.tier: maestro
all.tier: all

# The named selection each profile runs with. Only the tag-selected profiles
# have one — see the note about `device` and `e2e` above.
fast.population: fast
full.population: full
