# Maestro flow qualification baseline: fingerprints of the frozen set.
# This map only shrinks; a changed flow must be qualified or excepted instead.
# A retired flow leaves this map as well: its fingerprint is dropped, so a flow
# that comes back is qualified instead of admitted by an old fingerprint.
#
# The frozen set itself lives in maestro-flow-qualification-initial.yaml and is
# pinned by a digest in scripts/check-maestro-flow-qualification.py. The frozen
# set is the record of the flows that were in a blocking scope when the rule
# was introduced, so it keeps a retired flow's name. Every entry below points
# at a flow that is still in the catalogue; a flow introduced after the rule
# has no entry here and enters through qualification or an exception.
schema: 1
policy: flows in automated blocking scopes at rule introduction; a matching fingerprint
  admits the flow, a change requires qualification
