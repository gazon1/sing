# The measured cost of the INSTRUMENTED coverage run.
#
# This is NOT the same run as the uninstrumented `:shared:jvmTest` in the
# table of `docs/testing/gate-costs.md`: the Kover agent multiplies the cost
# of every test, and the instrumented run is the one that decides whether a
# timeout is adequate. On 2026-10-22 it took 37 min 25 s for the fast
# population, 33 min 23 s for the full population — against 6 min 44 s for the
# uninstrumented `:shared:jvmTest`.
#
# Two numbers that look backwards are not: the full population is CHEAPER than
# the fast one, because the fast population is a subset of the classes and the
# instrumented overhead is per-class-per-run. The number to plan against is
# the larger of the two.
#
# The build reads this file: `:koverVerify` prints the estimate before it
# starts, so that nobody sets a 15-minute timeout on a 37-minute task.
#
# Measured on 2026-10-22 with a warm Gradle cache, on the development host (16
# vCPU). A CI runner has 4 vCPU: the same run there is slower, so the CI job's
# timeout is this measurement times the runner margin — twice it, the margin
# the gate uses. `scripts/check-coverage-timeout.py` is what says so: a
# timeout that no longer covers the measurement fails that gate instead of the
# run.
#
# To re-measure: `sgate gate-costs --record --coverage` (about an hour: it
# runs the instrumented coverage once per population).

fast.ms=2245000
full.ms=2003000
measuredAt=2026-10-22
machine=16 vCPU, warm Gradle cache
