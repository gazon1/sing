# The architecture suite — one declaration of four facts.
#
# The gates of this suite live in one package, run in one task, and report into
# one directory. Those four facts were written down in four places: the build's
# test filter, the run-floor gate's path fragments, the slow-population gate's
# report directories, and the impact map's package name. A rename that reached
# one of them left the others naming a package that no longer existed — and
# every one of those gates kept reporting green, because a gate that looks for
# a suite that is not there does not fail, it counts nothing.
#
# This file is the declaration. The build reads it (`shared/build.gradle.kts`),
# and so do `scripts/check-test-runs.py`, `scripts/check-slow-tests-ran.py` and
# `scripts/test-impact-map.py` — through `scripts/arch_suite.py`, which is the
# one reader.
#
# Format: `key=value`, one per line. `#` starts a comment.

# The Kotlin package the gates live in. The build filters its test tasks by it,
# and the impact map names the task that runs a class of it.
arch.package=com.singularity.todo.arch

# The path fragment of that package, relative to a test source root. It is what
# the run-floor gate matches file paths against.
arch.path=com/singularity/todo/arch/

# The directory that holds the package, as a path segment. The impact map
# matches a test's path against it.
arch.directory=arch

# Where the suite's JUnit reports land.
arch.report.dir=shared/build/test-results/archTest
