# The measured memory budget of one Gradle worktree.
#
# WHY THIS FILE EXISTS
#
# The heap of a test fork and the heap of the Gradle daemon were literal
# strings in five build scripts and in gradle.properties. The record of the
# measurement that produced them lived in an ADR — and no build read that ADR
# and no gate checked it. A number nobody can check is a number nobody
# enforces, which is the same defect the coverage floor had until its
# declaration was moved to the place Kover reads it.
#
# This file is that record, and the build reads it. `scripts/check-memory-budget.py`
# checks that every test task in the tree runs with the heap recorded here, and
# that the daemon heap in gradle.properties is the recorded one.
#
# WHAT IS IN HERE
#
#   test.heap.default            the heap a test task runs with
#   test.heap.module.<project>   the heap of ONE module's test tasks, keyed by
#                                the Gradle project path with ':' written as '.'
#                                (:tools:unwritten-properties becomes
#                                test.heap.module.tools.unwritten-properties)
#   gradle.daemon.heap           the heap of the Gradle daemon — the JVM the
#                                Gradle client starts, configured by
#                                org.gradle.jvmargs in gradle.properties
#
# Every module that declares a test task is listed. A module that is not
# listed has no budget, and that is a finding rather than a silence.
#
# A module that declares NO test task of its own — `:androidApp` and
# `:core-base`, whose test tasks the plugins create — takes the default as
# well: the root build script applies it to every test task in the build, and
# a module that names a budget of its own overrides it.
#
# THE MEASUREMENT
#
# Measured on 2026-10-22 on the development host (16 vCPU, 62 GiB RAM, 8 GiB
# of swap), with the Kotlin compilation running in-process inside the Gradle
# daemon. The ADR holds the tables, the failed measurements and the reasoning:
# docs/decisions/2026-10-22-gradle-memory-budget.md
#
# The test forks — 1536 MB. The FULL :shared:jvmTest population (tags=fast,slow,
# 440 classes) completed with no OutOfMemoryError; 1024 MB died with the Kover
# agent attached. The measurement is therefore "the whole suite passes at
# 1536 MB", not "1536 MB was enough for the tests that ran".
#
# The daemon — 6144 MB. The first measurement (2048 MB) was about ONE
# compilation and CI died on it; the live set of the task set CI compiles is
# ~4.3 GB, so 6144 MB is the smallest round number above the measured live set
# with room for the rest of the daemon (Kover's agent, the detekt analysis).
# 4096 MB was tried and survived locally, but the daemon sat AT the cap through
# the whole compile.
#
# The ceiling this produces is 12 GB per active worktree (6144 MB of daemon,
# 4 x 1536 MB of test forks), against the 18 GB the configuration had before.
#
# HOW TO RE-MEASURE
#
# The forks: run the full population with a reduced `maxHeapSize` and watch for
# `OutOfMemoryError` in the forked test JVM (with the Kover agent attached).
# The daemon: bisect on `-Xmx` over the task set CI actually compiles, with
# `--no-parallel`, and read the daemon's own RSS and GC log. Write the result
# here, in this file, and let the gate tell the build scripts to follow.
#
# The two module budgets that are NOT 1536 MB were not measured by the
# 2026-10-22 measurement, which covered :shared:jvmTest. They are the values
# those modules declared before this file existed, recorded here so that the
# gate has one place to compare them with — see the notes on the lines.

# ── The test forks ──────────────────────────────────────────────────────────
#
# The default is the measurement: 1536 MB, the heap at which the full
# :shared:jvmTest population completes. A module that declares no heap of its
# own takes the default — the root build script applies it to every test task
# in the build, and the modules below that name a budget of their own override
# it.
test.heap.default=1536m

# The application modules. The same 1536 MB as the measurement: the shared
# module's suite is the biggest one, and the desktop and MCP suites are
# smaller.
test.heap.module.shared=1536m
test.heap.module.desktopApp=1536m
test.heap.module.mcp-server=1536m

# These two modules declare no heap of their own — they take the default.
# Listed here so that "this module has no budget" is a question with an
# answer, and so that a module that grows a heap of its own has to say which
# number it grew to.
test.heap.module.adr-core=1536m
test.heap.module.tools.unwritten-properties=1536m

# 3 GB: the detekt-rules module loads compiled rule classes and the detekt
# test fixtures. NOT measured by the 2026-10-22 measurement — this is the
# value the module declared before this file existed.
test.heap.module.detekt-rules=3g

# 1 GB: the ADR command line. NOT measured by the 2026-10-22 measurement —
# this is the value the module declared before this file existed.
test.heap.module.adr-cli=1g

# ── The Gradle daemon ───────────────────────────────────────────────────────
#
# `org.gradle.jvmargs` in gradle.properties. Gradle reads that file before it
# reads anything else, and there is no way to interpolate a value from another
# file into it — so the number is written there as well, and this gate is what
# keeps the two in step.
gradle.daemon.heap=6144M

# ── The measurement ─────────────────────────────────────────────────────────
measuredAt=2026-10-22
machine=16 vCPU, 62 GiB RAM, 8 GiB swap
adr=docs/decisions/2026-10-22-gradle-memory-budget.md
