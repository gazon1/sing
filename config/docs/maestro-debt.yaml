  owner: test
  status: fixed
  flows: 1
  note: "Fixed by gazon1/sing#3191: the note the flow opens sits under the logbook section, below the fold — a row that is not on the screen is not visible to Maestro, and the flow looked for it without scrolling. The flow scrolls to the note before it waits for it. The cause is a regression guard from now on."

