  issue: 3191
  owner: test
  status: fixed
  flows: 1
  note: "Fixed by gazon1/sing#3191: the fixture had no due date, and a reminder needs one to count back from ('A reminder needs a due date to count back from'), so the editor refused the reminder and the row was never shown. The flow seeds the task with `due=today` now. The cause is a regression guard from now on."
