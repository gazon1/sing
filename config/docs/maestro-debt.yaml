# The causes the requalification of 2026-11-25 found (gazon1/sing#3191) on the
# thirteen flows whose seed-helper fingerprint had moved. Each is registered on
# its own: a cause the registry does not know fails the results gate even when
# the number of failing flows is within the floor.
#
# Two of them did not reproduce on the current build and are kept as debt
# rather than written off — a cause that may still come back has to be
# registered, so that its return reads as this cause and not as a new one. The
# other four were fixed in the flows themselves and are regression guards.
- key: "No visible element found: id: menu_pomodoro"
  issue: 3191
  owner: test
  status: accepted
  flows: 1
  note: "The app-menu sheet's scroll did not reach the Pomodoro row within its five-second timeout on the 2026-11-25 build, so the flow never reached the destination it seeds a task for. It did not reproduce on the current build (three consecutive passes, API 36 emulator, 2026-11-25): the row is in the menu and the sheet's scroll finds it. Kept registered as debt — a recurrence is this cause and not a new one."
- key: "No visible element found: id: task_editor_pin_row"
  issue: 3191
  owner: test
  status: accepted
  flows: 1
  note: "The task editor's scroll did not reach the pin row on the 2026-11-25 build, so the flow never reached the pin it asserts on. It did not reproduce on the current build (three consecutive passes, API 36 emulator, 2026-11-25): the row is in the editor and the scroll finds it. Kept registered as debt — a recurrence is this cause and not a new one."
- key: "Assertion is false: id: search_clear_query_button is visible"
  issue: 3191
  owner: test
  status: fixed
  flows: 1
  note: "Fixed by gazon1/sing#3191: the keyboard stayed up over the empty state, and the 'Clear query' button sits at the bottom of the screen — under the keyboard it is not in the tree at all, so 'visible' was false for a button that was on the screen. The flow hides the keyboard before it looks for the way out. The cause is a regression guard from now on."
- key: "No visible element found: id: task_editor_due_row"
  issue: 3191
  owner: test
  status: fixed
  flows: 1
  note: "Fixed by gazon1/sing#3191: the create path focuses the title field, and the keyboard took half of the editor's viewport, so the due row was below the fold and never composed. The flow closes the keyboard after the title field is focused, and the editor's rows are on the screen again. The cause is a regression guard from now on."
