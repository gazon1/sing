# The debt the measurement has accepted, one cause at a time.
#
# A floor says how much the repository owes. It does not say what it owes, so the
# number of failing flows can stay the same while the debt changes shape entirely:
# one cause fixed, another introduced, and the floor still passes. This file is the
# other half of the measurement — the *causes* the floor covers, each with the GitHub
# issue that owns it.
#
# The gate (`scripts/ci/check-maestro-results.py`) reads this file and holds the run
# to three things, each of which the floor alone cannot do:
#
#   * **A cause that is not listed here fails the gate**, even when the number of
#     failing flows is within the floor. A new cause is the debt changing kind, and
#     that is the thing a count cannot see.
#   * **A cause marked `fixed` that comes back fails the gate.** That is a
#     regression, and it is the one case where a floor that only ratchets down would
#     have hidden it.
#   * **A cause that is listed here and did not happen is reported**, because that
#     is the debt shrinking, and a shrinking debt is somebody's argument to make.
#
# The `environment` block records where the floor was calibrated. The gate compares
# the run's environment with it and refuses to judge a run it cannot compare: a
# number measured on an emulator and a number measured on a phone are two different
# quantities, and calling them the same one is how a gate starts lying.
#
# Format: `key` is the cause as the gate reads it — the failure message with the
# run-specific numbers replaced by `<n>`, so the key is the same in every run. `issue`
# is the GitHub issue that owns the cause. `owner` is `product`, `test` or
# `unclassified`. `status` is `accepted` (the debt is known) or `fixed` (it was
# fixed, and coming back is a regression). `flows` is how many flows the cause took
# down when the floor was calibrated.
#
# Calibrated 2026-10-22 by a full run of all 94 flows on a phone (RMX3938,
# 720x1600, API 35): 64 passed, 30 failed, and the 30 failures were 27
# causes.
#
# The causes the phone did not show keep the count the emulator's calibration
# gave them: that is the debt that shrank, and the gate prints it as such.

environment:
  kind: device
  api: 35
  device: RMX3938
  measured_on: '2026-10-22'
  apk: 742deef01cd1
  note: >-
    The floor belongs to this environment. The Maestro shards are skipped in
    CI — there is no emulator there — so the emulator's calibration guarded
    nothing, while every local run happens on a phone. A run on another
    device is a different measurement, and the gate says so rather than
    comparing them.

