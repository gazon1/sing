# The measured coverage of the application, per population.
#
# These are the numbers the repository PUBLISHES, read out of the Kover
# reports of the two populations, so that a published number can be compared
# with the measurement it was read from. Before this file existed the numbers
# lived only in prose — in the ADRs and in the change's tasks file — and
# nothing compared them with the report they came from: the number this
# repository published at first ("2.82M instructions") was the SUM of every
# `INSTRUCTION` counter in the Kover XML — the method, class, source-file,
# package and root levels together — and so five times the report's own
# denominator. The percentages were unaffected, because a ratio is the same at
# every level, and that is how a wrong denominator survived a real measurement
# and looked plausible. A reviewer found it by hand.
#
# The denominator is the report's ROOT counters: the `<counter>` elements that
# are DIRECT children of the report root. A counter nested inside a class or a
# package counts the same instructions again.
# `scripts/kover-markdown-table.py --summary` reads the same counters.
#
# The class count is here as well, because the percentages alone cannot tell a
# full report from a partial one. The fast population holds MORE classes than
# the full one: the fast report is not a fraction of the universe, it is the
# same universe on a tree that grew in between.
#
# The `*.Coverage` values are percentages covered; the counts are whole
# numbers; `measuredAt` is the day the report was measured.
#
# Measured on the development host (16 vCPU) with a warm Gradle cache. The full
# population was measured on 2026-10-22 and the fast one on 2026-10-23, on the
# branch that names the population.
#
# `scripts/check-published-measurements.py` compares the class counts, the
# instruction totals and the measured percentages this repository publishes
# with this file, so a published number that was never measured — or that was
# measured differently — is a finding rather than a sentence nobody checks.
# The numbers are read out of the documents that publish them, and a number
# those documents publish without saying which population it belongs to is
# reported as a warning: the gate says what it could not check.
#
# To re-measure: `./gw :koverReport -Ptest.population=<population>` and read
# the root counters of `build/reports/kover/report.xml`.

