# The named test populations and the JUnit tags each one selects.
#
# ONE file, read by three languages:
#
#   * the build — settings.gradle.kts and build.gradle.kts turn the NAME into
#     the tag list, so the floors and the test filter cannot disagree;
#   * the shell — the CI workflow asks for a population by name and never
#     spells a tag list;
#   * the Python gates — they compare the populations a job's invocations
#     declare, and they need the same name-to-tags mapping to do it.
#
# The format is `population=tag,tag`. A population is a NAME, not a string of
# tags: before this file existed the selection was written as the literal
# "fast,slow" in four places on three languages, and the day one of them
# spelled it differently the difference was invisible until a run measured
# something else.
#
# Beside the selection, a population has PROPERTIES — the questions about it
# that are not "which tags does it select". They are written with the
# properties-file COLON separator:
#
#     population.property: value
#
# The two separators are not an accident, they are the contract:
#
#   * `=` is the population. The Python gates split on `=` and must not read a
#     property as a population of its own — a property written with `=` would
#     become a population named after the property, and the file would claim
#     two populations where there is one.
#   * `:` is the property. Java's Properties parser reads both separators, so
#     the build sees the properties as well, while the Python reader, which
#     splits on `=` only, sees the populations and only the populations.
#
# The property that exists today:
#
#   includes-slow — does this population select the slow half?
#
# The CI workflow used to answer that question by NAME, in two places, so a
# third population would have needed a workflow edit to be described at all.
# Now the workflow asks the file, and the file answers for every population it
# declares. The answer has to agree with the tag list: the build asks the same
# question of the tags (settings.gradle.kts), so a population that says
# `includes-slow: true` and selects no `slow` class — or the other way round —
# is a finding (scripts/check-gradle-test-population.py).
#
# `fast` is what a pull request runs — the population whose measurement the
# fast coverage floors are recorded against.
# `full` is what the nightly and an opt-in label run: it adds the slow classes.
fast=fast
full=fast,slow

# The properties of each population. `includes-slow` is a boolean.
fast.includes-slow: false
full.includes-slow: true
