# detekt configuration for Singularity Todo KMP project
# Version: detekt 2.0.0-alpha.6
# Scope: shared (commonMain + androidMain + jvmMain + tests) + desktopApp
#
# Design: ktlint owns formatting (via detekt-rules-ktlint-wrapper plugin).
# detekt owns logic, complexity, naming, performance, exceptions, style.
# ktlint rules (MaxLineLength, WildcardImport, etc.) live in the `style` section.
#
# Run with:         just detekt
# Auto-fix:        just detekt-fix
# Generate baseline: just detekt-baseline
#
# Rules disabled here are either (a) covered by ktlint or (b) too noisy for a
# codebase at scale. Revisit after baselines are clean.

config:
  validation: true
  warningsAsErrors: true
  checkExhaustiveness: false
  excludes: []

processors:
  active: true
  exclude:
    - 'KtFileCountProcessor'
    - 'ClassCountProcessor'
    - 'FunctionCountProcessor'
    - 'PropertyCountProcessor'

console-reports:
  active: true
  exclude:
    - 'LiteIssuesReport'

# ---------------------------------------------------------------------------
# comments
# ---------------------------------------------------------------------------
comments:
  active: true
  UndocumentedPublicClass:
    active: false          # documented via AGENTS.md + ARCHITECTURE.md
    excludes:
      - '**/test/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidHostTest/**'
      - '**/androidTest/**'
  UndocumentedPublicFunction:
    active: false
    excludes:
      - '**/test/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidHostTest/**'
      - '**/androidTest/**'
  EndOfSentenceFormat:
    active: true
  AbsentOrWrongFileLicense:
    active: false

# ---------------------------------------------------------------------------
# complexity
# ---------------------------------------------------------------------------
complexity:
  active: true
  LongMethod:
    active: true
    allowedLines: 80           # bumped from default 60
  LongParameterList:
    active: true
    allowedFunctionParameters: 8   # bumped from default 5
    allowedConstructorParameters: 8
    ignoreDefaultParameters: false
    ignoreDataClasses: true
    ignoreAnnotatedParameter: []
  CyclomaticComplexMethod:
    active: true
    allowedComplexity: 20      # bumped from default 14
  TooManyFunctions:
    active: true
    allowedFunctionsPerFile: 25  # bumped from default 10
    # Bumped from the default 11 because of `CalendarSyncViewModel`, which reached 13 by
    # covering two genuinely different providers: the system calendar and Google. Its
    # handlers are one `private fun` per intent, which is the house shape — the rule that
    # actually catches accidental bloat (a public API nobody can summarise) is served by
    # `allowedFunctionsPerFile`, and the default 11 was tripping on a class whose extra
    # functions were each a single `when` arm. Raising the bar for the class rather than
    # baselining the finding keeps the finding visible if a *second* class crosses 15.
    allowedFunctionsPerClass: 16
    # Raised from 15 for `AgendaViewModel`, whose handlers are one `private fun`
    # per intent — the house shape the comment below describes. Its 14 intents
    # need their own handlers, and the close path needed one more when the
    # refusal moved into the write. The bar that catches accidental bloat is
    # `allowedFunctionsPerFile`; this one catches a class that has become a
    # grab-bag of unrelated helpers.
    # Bumped from the default 11 because `ProjectsRepository` reached 12 when the
    # project gained its mirror of `close`: `reopen` opens a closed project again.
    # The interface is the project's whole contract — identity, hierarchy, counts,
    # soft-delete and the closed/open pair — and every one of those functions has a
    # caller. Splitting it would spread the contract across two interfaces that
    # have to be used together, which is a worse API than a wide one.
    #
    # Raised to 13 for `FtsDao`, which reaches 12 by carrying two surfaces of the
    # same lookup: the raw one, which takes a `MATCH` expression, and the semantic
    # one, which takes the query a caller means and builds the expression for it.
    # The semantic surface is what a caller uses; the raw one is what Room runs.
    # Dropping the raw surface from the interface is not an option — a test double
    # that answered a `MATCH` expression would be a second implementation of the
    # rule, which is the thing the split exists to remove.
    allowedFunctionsPerInterface: 13
    excludes:
      - '**/test/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidHostTest/**'
      - '**/androidTest/**'
  NestedBlockDepth:
    active: true
    allowedDepth: 5           # bumped from default 4
  LargeClass:
    active: true
    allowedLines: 600

# ---------------------------------------------------------------------------
# coroutines (detekt bundled rules)
# ---------------------------------------------------------------------------
coroutines:
  active: true

# ---------------------------------------------------------------------------
# empty-blocks
# ---------------------------------------------------------------------------
empty-blocks:
  active: true

# ---------------------------------------------------------------------------
# exceptions
# ---------------------------------------------------------------------------
exceptions:
  active: true
  # A caught exception that is neither logged nor rethrown is the silent-failure
  # shape: the code recovers, continues, and leaves no trace of the error. The
  # repo has already been bitten by one of these — DraftMviViewModel.save()
  # re-enabled the button after a thrown persist() and the user saw a save that
  # did nothing, with no error state and no log.
  #
  # CancellationException must NOT be in ignoredExceptionTypes — it must propagate
  # to abort the calling coroutine; the no-swallowed-cancellation custom rule
  # enforces this specifically inside suspend functions.
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - 'InterruptedException'
      - 'MalformedURLException'
      - 'NumberFormatException'
      - 'ParseException'
      # Koin's two answers about a definition: "there is none" and "there is
      # one, but it cannot be created". `getOptionalOrNull` (core/di) answers
      # the first with `null` and reports the second to the caller — swallowing
      # them there is the function's purpose, and the second one is not
      # swallowed: it is logged and the feature degrades instead of the screen
      # crashing.
      - 'NoDefinitionFoundException'
      - 'InstanceCreationException'
  TooGenericExceptionCaught:
    active: true
    excludes:
      - '**/test/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidHostTest/**'
      - '**/androidTest/**'
    exceptionNames:
      - 'Exception'
      - 'Throwable'
  TooGenericExceptionThrown:
    active: true
    exceptionNames:
      - 'Exception'
      - 'Throwable'
      - 'Error'
  RethrowCaughtException:
    # Declared 2026-10-10: catching and rethrowing a caught exception without
    # adding context is a no-op for callers trying to understand the error
    # chain. Findings fixed in baseline.
    active: true

# ---------------------------------------------------------------------------
# cancellation-integrity rules (Phase 2)

no-swallowed-cancellation:
  NoSwallowedCancellation:
    active: true

# Activated 2026-10-05 as a ratchet.
#
# `kotlin.runCatching` catches Throwable, CancellationException included. Inside a suspend
# function that converts a cancellation into an ordinary failure, so the coroutine keeps
# running past the boundary that was supposed to stop it. That is a correctness bug, not a
# style preference, and `runCatchingCancellable` exists precisely to fix it.
#
# The rule sat at `active: false` while `db132beb` migrated 199 call sites to
# `runCatchingCancellable`. That migration was real work, and it left no gate: a new plain
# `runCatching` inside a suspend function would silently undo it, one reviewer's memory away.
#
# The baseline needs no entry for this. With the rule active the tree reports zero violations,
# verified by planting one and reading the report — which is also why regenerating the baseline
# is the wrong way to check this: `:shared:detektBaseline` does not load the custom rule set,
# so it would drop every custom-rule entry and report a clean tree because nothing ran.
#
no-run-catching-in-suspend:
  NoRunCatchingInSuspend:
    active: true

# ---------------------------------------------------------------------------
# naming
# ---------------------------------------------------------------------------
naming:
  active: true
  MatchingDeclarationName:
    active: false          # KMP files intentionally named Xxx.android.kt / Xxx.jvm.kt
  InvalidPackageDeclaration:
    active: true
  EnumNaming:
    active: true
  FunctionNaming:
    active: true
    # Composable functions are PascalCase by Compose convention.
    ignoreAnnotated: ['Composable']
    excludes:
      - '**/test/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidHostTest/**'
      - '**/androidTest/**'
  TopLevelPropertyNaming:
    active: true            # covers top-level constants and properties
  # ── Declared 2026-10-04. These were reporting findings while absent from this
  # file, i.e. running on detekt's built-in default — a rule nobody chose.
  # Verified against detekt's own allowed-property list; an unknown key here is a
  # hard build failure, which is how the ktlint-wrapper rules were identified as
  # belonging to the `ktlint:` section instead.
  ConstructorParameterNaming:
    # 1 finding: `value class QueryInterval internal constructor(private val _days: Int)`
    # exposes `val days: Int get() = _days`. The underscore resolves a real collision
    # with the public getter — same intent as the ktlint `backing-property-naming`
    # exemption below. Inline that getter and this can be re-enabled.
    active: false
  PackageNaming:
    # 70 findings, all `feature.calendar_sync` (and `calendar_sync`'s sub-packages),
    # counting both the `PackageNaming` and the `PackageName` rules.
    #
    # It was 43 when this was first recorded, deferred pending the domain/port split
    # (plan C2). That split has since happened and is written up in
    # `docs/decisions/2026-10-05-google-calendar-two-ports-and-local-wins.md`, so the
    # original blocker is gone — but the rename itself is now a 114-file mechanical
    # change that deserves to be its own reviewed commit rather than riding along on a
    # feature branch, where it would bury the sync work in 114 files of package churn.
    #
    # When it is done, it is `calendar_sync` -> `calendarSync` across declarations and
    # imports, and this whole section should be deleted rather than re-deferred.
    active: true
  VariableNaming:
    active: true

# ---------------------------------------------------------------------------
# performance
# ---------------------------------------------------------------------------
performance:
  active: true
  SpreadOperator:
    active: true
  ArrayPrimitive:
    active: true
  ForEachOnRange:
    active: true
    excludes:
      - '**/test/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidHostTest/**'
      - '**/androidTest/**'

# ---------------------------------------------------------------------------
# potential-bugs
# ---------------------------------------------------------------------------
potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true
    excludes:
      - '**/test/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidHostTest/**'
      - '**/androidTest/**'
  UnsafeCast:
    active: true
  ElseCaseInsteadOfExhaustiveWhen:
    active: true          # was DuplicateCaseInWhenExpression in 1.x
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  CastNullableToNonNullableType:
    active: true
  Deprecation:
    active: true

# ---------------------------------------------------------------------------
# style
# Note: ktlint rules (MaxLineLength, WildcardImport, etc.) live here too.
# The detekt-rules-ktlint-wrapper plugin registers them.
# ---------------------------------------------------------------------------
style:
  active: true
  MaxLineLength:
    active: false          # ktlint owns line length via .editorconfig (max_line_length = 120)
  WildcardImport:
    active: true
    excludeImports: []
  UnusedImport:
    active: true
  ReturnCount:
    active: true
    max: 4
  EqualsOnSignatureLine:
    active: true
  TrailingWhitespace:
    active: true
  DestructuringDeclarationWithTooManyEntries:
    active: false
  MagicNumber:
    active: false          # too noisy with Compose color/size/alpha defaults; revisit per-module
  MandatoryBracesLoops:
    active: false
  ForbiddenAnnotation:
    active: false
  ForbiddenComment:
    active: true
    comments:
      - { value: 'FIXME:', reason: 'Forbidden FIXME todo marker in comment, please fix the problem.' }
      - { value: 'STOPSHIP:', reason: 'Forbidden STOPSHIP todo marker in comment, please address the problem before shipping the code.' }
      - { value: 'TODO:', reason: 'Forbidden TODO todo marker in comment, please do the changes.' }
    allowedPatterns: ''
  UseAnyOrNoneInsteadOfFind:
    active: true
  UseIsNullOrEmpty:
    active: true
  # ── Declared 2026-10-04 (see above and check-rule-intent.py) ───────────────
  UnusedParameter:
    active: true            # 30 findings — per-site triage, not a blanket decision
  MayBeConstant:
    active: true            # 2 findings, both fixed 2026-10-04
  ThrowsCount:
    active: true            # QueryParser / RecurrenceParser throwing on malformed
                            # input is intended behaviour
  LoopWithTooManyJumpStatements:
    active: true            # 3 findings, all in parsers (A2uiParser, ConditionExprParser)
  # Reporting findings while absent from this file, i.e. on detekt's defaults.

# ---------------------------------------------------------------------------
# ktlint rules (via detekt-rules-ktlint-wrapper plugin)
# ktlint rule IDs are in kebab-case (e.g. no-wildcard-imports, max-line-length)
# See: detekt-rules-ktlint-wrapper/src/main/kotlin/dev/detekt/rules/ktlintwrapper/wrappers/
# ---------------------------------------------------------------------------
ktlint:
  ImportOrdering:
    active: false          # IDE owns import order; ktlint auto-fix may still sort
  NoConsecutiveBlankLines:
    # Declared 2026-10-04, and the reason it is written down at all: this rule was
    # producing a finding while being absent from this file, i.e. running on
    # detekt's built-in default. check-rule-intent.py exists to make exactly that
    # class of invisible choice visible, and this was its first real hit.
    #
    # `active: true` is also detekt's default, so declaring it changes no
    # behaviour — the point is that the behaviour is now a decision on the record
    # rather than an accident. If a future detekt release changes the default, a
    # rule nobody declared would silently change what the baseline means.
    #
    # NOTE: this section does not validate keys, so a misspelling here is silently
    # ignored rather than reported — unlike `style:`, which hard-fails on an unknown
    # key. That is why the spelling below was confirmed by watching this rule's
    # baseline entry disappear, not by reading documentation.
    #
    # The single finding it had (a trailing blank line in
    # `TimeTrackingSection.kt`) is fixed, so no baseline entry remains.
    # Related: #56, #57.
    active: true
  BlankLineBetweenWhenConditions:
    # Declared 2026-10-05 after the rebase onto 45896461: main added a `when` in
    # SavedAgendaListScreen.kt whose baseline entry made this rule the first one
    # in this section that was reporting without ever appearing in this file.
    # The rule is a real formatting choice — ktlint's `blank-line-between-when-
    # conditions` under ktlint_official — so it is declared `active: true` rather
    # than switched off, and the existing baseline entry keeps the code as written.
    #
    # What the rule asks for, stated exactly, because getting it wrong costs two
    # detekt runs and the guess is not recoverable from the finding text:
    #
    #   * if ANY branch of a `when` is multiline — a body on its own line, or a
    #     comment attached to a branch — then EVERY pair of branches is separated
    #     by a blank line;
    #   * if NO branch is multiline, then a blank line between two branches is
    #     the finding.
    #
    # It is not "a blank line between branches that are not both single-line":
    # that reads as if only the mixed pair is separated, and a `when` written that
    # way is reported on every branch but the first.
    #
    # Same caveat as NoConsecutiveBlankLines above: a misspelling in this section
    # is silently ignored, so the spelling was confirmed by watching the
    # baseline entry survive rather than by reading documentation.
    active: true
  active: true
  code_style: ktlint_official
  auto_correct: true
  # Note: Indentation auto_correct=true causes NPE in IntelliJ AsyncExecutionService
  # on some JDK versions. Disable indent auto-fix; fix manually via editor settings.
  indent:
    active: true
    auto_correct: false
  no-wildcard-imports:
    active: true
    auto_correct: true
  max-line-length:
    active: false          # ktlint owns this; .editorconfig sets max_line_length = 120
  # ── Declared 2026-10-10. Running on defaults without being named here — a rule
  # nobody chose. All findings are in baseline. ─────────────────────────────────
  parameter-list-spacing:
    # Declared 2026-10-10: ktlint rule id in camelCase (confirmed by baseline entries
    # disappearing when active: true). Findings in baseline.
    active: true
  chain-wrapping:
    # Declared 2026-10-10: ktlint rule. Findings in baseline.
    active: true
  statement-wrapping:
    # Declared 2026-10-10: ktlint rule. Findings in baseline.
    active: true
  function-expression-body:
    # Declared 2026-10-10: ktlint rule. Findings in baseline.
    active: true
  annotation-on-separate-line:
    # Declared 2026-10-10: ktlint rule. Findings in baseline.
    active: true
  function-literal:
    # Declared 2026-10-10: ktlint rule. Findings in baseline.
    active: true
    auto_correct: true
  parameter-list-wrapping:
    active: true
    auto_correct: true
  FunctionSignature:
    # ktlint_official code style conflicts with the project's deliberate multi-line
    # override style; enabling it fights `just detekt-fix` and produces churn on every
    # Compose function with more than two parameters.
    active: false
  # ── Declared 2026-10-04. Verified by measurement, not by assumption. ───────
  # These nine rule names appear in the baseline but detekt REJECTS them under
  # `naming:`/`style:` ("is misspelled or does not exist") — they belong to the
  # ktlint wrapper. This section does not validate keys, so a wrong spelling is
  # silently ignored rather than reported: my first attempt used the kebab-case
  # ids (`backing-property-naming`) and removed nothing at all, because the two
  # spellings already in this file — `ImportOrdering`, `FunctionSignature` — are
  # camelCase. Each declaration below was confirmed by watching its baseline
  # entries disappear, not by reading documentation.
  BackingPropertyNaming:
    # 53 findings, all AGENTS.md's canonical VM pattern:
    #   private val _state = MutableStateFlow<UiState>(…)
    #   val state: StateFlow<UiState> = _state.asStateFlow()
    # The underscore keeps the mutable backing property visibly distinct from the
    # public read-only face. Enforcing it would rename 53 sites and rewrite the
    # documented pattern — a style default beating the architecture. See
    # deferred-backlog.md#two-largest-baseline-rules-contradict-documented-conventions.
    active: false
  PropertyName:
    active: true             # 8 findings: PascalCase `const`/`val` in companion objects
  Filename:
    # 26 findings, nearly all files holding more than one declaration:
    # CalendarSyncExceptions.kt, BackupFormatters.kt, AttachmentUploadService.kt.
    # detekt wants one top-level declaration matching the file name; this project
    # groups by concern.
    active: false
  # ── Declared 2026-10-04, second pass. `main` added findings for these five
  # between the first declaration sweep and the rebase, and a rule that reports
  # without being named is a rule nobody chose. All five are ktlint formatting
  # rules whose detekt default agrees with `.editorconfig`, so each is active
  # rather than switched off — none of them contradicts a documented convention
  # the way BackingPropertyNaming and Filename do.
  ArgumentListWrapping:
    active: true             # 8 findings: multi-line call argument lists
  PropertyWrapping:
    active: true             # 2 findings: property initialisers split across lines
  TrailingCommaOnCallSite:
    active: true             # 2 findings: missing trailing comma in a call site
  NoMultipleSpaces:
    active: true             # 1 finding: padding inside an expression
  SpacingBetweenDeclarationsWithComments:
    active: true             # 1 finding: a KDoc block not followed by a blank line
  NoUnusedImports:
    active: true             # 3 findings fixed 2026-10-04; a 4th appeared in
                             # TaskRowFlowTest after the rebase onto 5a175fdb and
                             # is fixed there too — the count is only ever true
                             # for the tree it was measured in
  EmptyFunctionBlock:
    active: true             # NoopCalendarSyncRepositoryImpl, FakeHlcFactory — the
                             # no-op behaviour IS the point of those types
  ComplexCondition:
    active: true             # token-type chains in parsers, slug validator
  Kdoc:
    active: true             # 9 findings on KDoc block formatting
  ClassSignature:
    active: true             # 1 finding: FakeBackupCodec in a test
  PackageName:
    # The same 70 `feature.calendar_sync` sites `naming>PackageNaming` reports; the
    # ktlint wrapper duplicates the check. See the note there for why the rename is
    # still outstanding — the two sections move together.
    active: true
  Indentation:
    # Note the kebab-case `indent:` key above is a no-op: the ktlint section does
    # not validate keys, so it was silently doing nothing while this rule ran on
    # its default. `active: false` for auto-correct per the JDK-NPE note above;
    # the 1 finding is hand-fixable.
    active: true
    auto_correct: false
  Wrapping:
    active: true
    auto_correct: true
  # The line-length limit, and the two places it is written down.
  #
  # It used to be a conflict: `.editorconfig` declared 140 while this rule ran
  # on detekt's default of 120, and the 17 findings at 121-131 characters came
  # from that accident. The two numbers have since been made to agree —
  # `.editorconfig` says 120 and this rule says 120 — so the effective limit is
  # 120 whichever rule asks.
  #
  # The paragraph that used to stand here described a decision that was still
  # open ("the 120-vs-140 decision is still open"). It is not open any more:
  # the editorconfig was changed to 120, and the number below is the one every
  # rule now uses. A note that says a decision is open when it has been made is
  # worse than no note: it sends a reader looking for a decision to make.
  MaximumLineLength:
    active: true
    maxLineLength: 120

