# detekt configuration for Singularity Todo KMP project
# Version: detekt 2.0.0-alpha.6
# Scope: shared (commonMain + androidMain + jvmMain + tests) + desktopApp
#
# Design: ktlint CLI owns formatting and layout; detekt owns semantics —
# logic, complexity, naming, performance, exceptions, style.
# The ktlint layer runs as a separate step (see just ktlint / the CI `detekt` job);
# it is not a detekt plugin, so no ktlint rules live in this file.
#
# Run with:         just detekt
# Auto-fix:        just detekt-fix
# Generate baseline: just detekt-baseline
#
# Rules disabled here are either (a) covered by ktlint or (b) too noisy for a
# codebase at scale. Revisit after baselines are clean.

config:
  validation: true
  warningsAsErrors: true
  checkExhaustiveness: false
  excludes: []

processors:
  active: true
  exclude:
    - 'KtFileCountProcessor'
    - 'ClassCountProcessor'
    - 'FunctionCountProcessor'
    - 'PropertyCountProcessor'

console-reports:
  active: true
  exclude:
    - 'LiteIssuesReport'

# ---------------------------------------------------------------------------
# comments
# ---------------------------------------------------------------------------
comments:
  active: true
  UndocumentedPublicClass:
    active: false          # documented via AGENTS.md + ARCHITECTURE.md
    excludes:
      - '**/test/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidHostTest/**'
      - '**/androidTest/**'
  UndocumentedPublicFunction:
    active: false
    excludes:
      - '**/test/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidHostTest/**'
      - '**/androidTest/**'
  EndOfSentenceFormat:
    active: true
  AbsentOrWrongFileLicense:
    active: false

# ---------------------------------------------------------------------------
# complexity
# ---------------------------------------------------------------------------
complexity:
  active: true
  ComplexCondition:
    active: true            # token-type chains in parsers, slug validator
  LongMethod:
    active: true
    allowedLines: 80           # bumped from default 60
  LongParameterList:
    active: true
    allowedFunctionParameters: 8   # bumped from default 5
    allowedConstructorParameters: 8
    ignoreDefaultParameters: false
    ignoreDataClasses: true
    ignoreAnnotatedParameter: []
  CyclomaticComplexMethod:
    active: true
    allowedComplexity: 20      # bumped from default 14
  TooManyFunctions:
    active: true
    allowedFunctionsPerFile: 25  # bumped from default 10
    # Bumped from the default 11 because of `CalendarSyncViewModel`, which reached 13 by
    # covering two genuinely different providers: the system calendar and Google. Its
    # handlers are one `private fun` per intent, which is the house shape — the rule that
    # actually catches accidental bloat (a public API nobody can summarise) is served by
    # `allowedFunctionsPerFile`, and the default 11 was tripping on a class whose extra
    # functions were each a single `when` arm. Raising the bar for the class rather than
    # baselining the finding keeps the finding visible if a *second* class crosses 15.
    allowedFunctionsPerClass: 16
    # Raised from 15 for `AgendaViewModel`, whose handlers are one `private fun`
    # per intent — the house shape the comment below describes. Its 14 intents
    # need their own handlers, and the close path needed one more when the
    # refusal moved into the write. The bar that catches accidental bloat is
    # `allowedFunctionsPerFile`; this one catches a class that has become a
    # grab-bag of unrelated helpers.
    # Bumped from the default 11 because `ProjectsRepository` reached 12 when the
    # project gained its mirror of `close`: `reopen` opens a closed project again.
    # The interface is the project's whole contract — identity, hierarchy, counts,
    # soft-delete and the closed/open pair — and every one of those functions has a
    # caller. Splitting it would spread the contract across two interfaces that
    # have to be used together, which is a worse API than a wide one.
    #
    # Raised to 13 for `FtsDao`, which reaches 12 by carrying two surfaces of the
    # same lookup: the raw one, which takes a `MATCH` expression, and the semantic
    # one, which takes the query a caller means and builds the expression for it.
    # The semantic surface is what a caller uses; the raw one is what Room runs.
    # Dropping the raw surface from the interface is not an option — a test double
    # that answered a `MATCH` expression would be a second implementation of the
    # rule, which is the thing the split exists to remove.
    allowedFunctionsPerInterface: 13
    excludes:
      - '**/test/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidHostTest/**'
      - '**/androidTest/**'
  NestedBlockDepth:
    active: true
    allowedDepth: 5           # bumped from default 4
  LargeClass:
    active: true
    allowedLines: 600

# ---------------------------------------------------------------------------
# coroutines (detekt bundled rules)
# ---------------------------------------------------------------------------
coroutines:
  active: true

# ---------------------------------------------------------------------------
# empty-blocks
# ---------------------------------------------------------------------------
empty-blocks:
  active: true
  EmptyFunctionBlock:
    active: true            # NoopCalendarSyncRepositoryImpl, FakeHlcFactory — the
                            # no-op behaviour IS the point of those types

# ---------------------------------------------------------------------------
# exceptions
# ---------------------------------------------------------------------------
exceptions:
  active: true
  # A caught exception that is neither logged nor rethrown is the silent-failure
  # shape: the code recovers, continues, and leaves no trace of the error. The
  # repo has already been bitten by one of these — DraftMviViewModel.save()
  # re-enabled the button after a thrown persist() and the user saw a save that
  # did nothing, with no error state and no log.
  #
  # CancellationException must NOT be in ignoredExceptionTypes — it must propagate
  # to abort the calling coroutine; the no-swallowed-cancellation custom rule
  # enforces this specifically inside suspend functions.
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - 'InterruptedException'
      - 'MalformedURLException'
      - 'NumberFormatException'
      - 'ParseException'
      # Koin's two answers about a definition: "there is none" and "there is
      # one, but it cannot be created". `getOptionalOrNull` (core/di) answers
      # the first with `null` and reports the second to the caller — swallowing
      # them there is the function's purpose, and the second one is not
      # swallowed: it is logged and the feature degrades instead of the screen
      # crashing.
      - 'NoDefinitionFoundException'
      - 'InstanceCreationException'
  TooGenericExceptionCaught:
    active: true
    excludes:
      - '**/test/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidHostTest/**'
      - '**/androidTest/**'
    exceptionNames:
      - 'Exception'
      - 'Throwable'
  TooGenericExceptionThrown:
    active: true
    exceptionNames:
      - 'Exception'
      - 'Throwable'
      - 'Error'
  RethrowCaughtException:
    # Declared 2026-10-10: catching and rethrowing a caught exception without
    # adding context is a no-op for callers trying to understand the error
    # chain. Findings fixed in baseline.
    active: true

# ---------------------------------------------------------------------------
# cancellation-integrity rules (Phase 2)

no-swallowed-cancellation:
  NoSwallowedCancellation:
    active: true

# Activated 2026-10-05 as a ratchet.
#
# `kotlin.runCatching` catches Throwable, CancellationException included. Inside a suspend
# function that converts a cancellation into an ordinary failure, so the coroutine keeps
# running past the boundary that was supposed to stop it. That is a correctness bug, not a
# style preference, and `runCatchingCancellable` exists precisely to fix it.
#
# The rule sat at `active: false` while `db132beb` migrated 199 call sites to
# `runCatchingCancellable`. That migration was real work, and it left no gate: a new plain
# `runCatching` inside a suspend function would silently undo it, one reviewer's memory away.
#
# The baseline needs no entry for this. With the rule active the tree reports zero violations,
# verified by planting one and reading the report — which is also why regenerating the baseline
# is the wrong way to check this: `:shared:detektBaseline` does not load the custom rule set,
# so it would drop every custom-rule entry and report a clean tree because nothing ran.
#
no-run-catching-in-suspend:
  NoRunCatchingInSuspend:
    active: true

# ---------------------------------------------------------------------------
# naming
# ---------------------------------------------------------------------------
naming:
  active: true
  MatchingDeclarationName:
    active: false          # KMP files intentionally named Xxx.android.kt / Xxx.jvm.kt
  InvalidPackageDeclaration:
    active: true
  EnumNaming:
    active: true
  FunctionNaming:
    active: true
    # Composable functions are PascalCase by Compose convention.
    ignoreAnnotated: ['Composable']
    excludes:
      - '**/test/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidHostTest/**'
      - '**/androidTest/**'
  TopLevelPropertyNaming:
    active: true            # covers top-level constants and properties
  # ── Declared 2026-10-04. These were reporting findings while absent from this
  # file, i.e. running on detekt's built-in default — a rule nobody chose.
  # Verified against detekt's own allowed-property list; an unknown key here is a
  # hard build failure, which is how the ktlint-wrapper rules were identified as
  # belonging to a separate `ktlint:` section (since removed — ktlint is a CLI now).
  ConstructorParameterNaming:
    # 1 finding: `value class QueryInterval internal constructor(private val _days: Int)`
    # exposes `val days: Int get() = _days`. The underscore resolves a real collision
    # with the public getter — same intent as the ktlint `backing-property-naming`
    # exemption (now in .editorconfig). Inline that getter and this can be re-enabled.
    active: false
  PackageNaming:
    # The package names are camelCase since the 2026-10-24 rename, and the rule
    # agrees with the code: it is the guard that keeps the next package from
    # arriving snake_case. The 202 baseline entries it carried are gone, and the
    # rule is declared here because a rule that runs on detekt's defaults without
    # a decision behind it is not a decision.
    active: true
  VariableNaming:
    active: true

# ---------------------------------------------------------------------------
# performance
# ---------------------------------------------------------------------------
performance:
  active: true
  SpreadOperator:
    active: true
  ArrayPrimitive:
    active: true
  ForEachOnRange:
    active: true
    excludes:
      - '**/test/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidHostTest/**'
      - '**/androidTest/**'

# ---------------------------------------------------------------------------
# potential-bugs
# ---------------------------------------------------------------------------
potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true
    excludes:
      - '**/test/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidHostTest/**'
      - '**/androidTest/**'
  UnsafeCast:
    active: true
  ElseCaseInsteadOfExhaustiveWhen:
    active: true          # was DuplicateCaseInWhenExpression in 1.x
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  CastNullableToNonNullableType:
    active: true
  Deprecation:
    active: true

# ---------------------------------------------------------------------------
# style
# ---------------------------------------------------------------------------
style:
  active: true
  MaxLineLength:
    active: false          # ktlint owns line length via .editorconfig (max_line_length = 120)
  WildcardImport:
    active: true
    excludeImports: []
  UnusedImport:
    active: true
  ReturnCount:
    active: true
    max: 4
  EqualsOnSignatureLine:
    active: true
  TrailingWhitespace:
    active: true
  DestructuringDeclarationWithTooManyEntries:
    active: false
  MagicNumber:
    active: false          # too noisy with Compose color/size/alpha defaults; revisit per-module
  MandatoryBracesLoops:
    active: false
  ForbiddenAnnotation:
    active: false
  ForbiddenComment:
    active: true
    comments:
      - { value: 'FIXME:', reason: 'Forbidden FIXME todo marker in comment, please fix the problem.' }
      - { value: 'STOPSHIP:', reason: 'Forbidden STOPSHIP todo marker in comment, please address the problem before shipping the code.' }
      - { value: 'TODO:', reason: 'Forbidden TODO todo marker in comment, please do the changes.' }
    allowedPatterns: ''
  UseAnyOrNoneInsteadOfFind:
    active: true
  UseIsNullOrEmpty:
    active: true
  # ── Declared 2026-10-04 (see above and check-rule-intent.py) ───────────────
  UnusedParameter:
    active: true            # 30 findings — per-site triage, not a blanket decision
  MayBeConstant:
    active: true            # 2 findings, both fixed 2026-10-04
  ThrowsCount:
    active: true            # QueryParser / RecurrenceParser throwing on malformed
                            # input is intended behaviour
  LoopWithTooManyJumpStatements:
    active: true            # 3 findings, all in parsers (A2uiParser, ConditionExprParser)
  # Reporting findings while absent from this file, i.e. on detekt's defaults.

# ---------------------------------------------------------------------------
# custom rule sets (via :detekt-rules plugin / ServiceLoader)
# Custom rules run as errors (promoted from warn-only in MR-4 / PR #31).
# Rule-specific config (severity, active) added in MR-4 after baseline.
# ---------------------------------------------------------------------------
mvi-viewmodel:
  MviViewModelExt:
    active: true
  IntentMethodName:
    active: true
  VmScopePosition:
    active: true
  VmCloseable:
    active: true
  ShadowedState:
    active: true

no-real-delay-in-test:
  NoRealDelayInTest:
    active: true

# ---------------------------------------------------------------------------
# PR3 custom rules promoted to error (all at 0 violations after PR 2.x):
# no-runblocking, no-direct-clock-system, no-viewmodel-scope,
# mvi-viewmodel (4 rules), no-real-delay-in-test.
# Promotion verified with daemon-free detekt run (see 2026-09-26-epic2-retro-findings R1).

no-runblocking:
  NoRunBlocking:
    active: true

no-viewmodel-scope:
  NoViewModelScopeInProduction:
    active: true

# Added to close #482. The rule was registered in META-INF/services but had no
# config block, so DetektConfigWiringTest failed.
#
# active: false — #477: the rule misses System.currentTimeMillis() (14 live uses
# unbanned) and needs fixes before it can be activated without violating the build.
# When #477 is fixed, flip to active: true.
no-direct-clock-system:
  NoDirectClockSystem:
    active: false

no-state-in:
  NoStateIn:
    active: true

no-op-update-state:
  NoOpUpdateState:
    active: true

# Wired 2026-09-27. The rule file existed but the provider was not listed in the
# RuleSetProvider service file, so the rule had never actually run.
no-factory-viewmodel:
  NoFactoryViewModel:
    active: true

no-static-profile-aware-current-user:
  NoStaticProfileAwareCurrentUser:
    active: true

pass-through-use-case:
  PassThroughUseCase:
    active: true

kdoc-enforcement:
  ViewModelMustHaveKDoc:
    active: true
  RepositoryInterfaceMustHaveKDoc:
    active: true

no-combine-side-effect:
  NoCombineSideEffect:
    active: true

# MR-3: empty onClick = {} in composable previews
no-empty-onclick-lambda:
  NoEmptyOnClickLambda:
    active: true

# Added 2026-10-19 with the state-based text field migration: the value-based
# text field API (value: + onValueChange:) is gone from the app. The GenUI
# renderer was the one documented exception and has been migrated since, so
# nothing is exempt but the test sources (ADR
# 2026-10-19-text-field-state-migration).
no-value-based-text-field:
  NoValueBasedTextField:
    active: true

# Added 2026-10-19 with the state-based text field migration: the other half
# of the same decision. A TextFieldState is a mutable buffer and must live in
# the composable that owns the field; the ViewModel keeps a plain String, and
# a TextFieldState in a ViewModel or in a UI state is a second source of truth
# (ADR 2026-10-19-text-field-state-migration).
no-text-field-state-in-viewmodel:
  NoTextFieldStateInViewModel:
    active: true

# Added 2026-10-19 with the state continuity work: a variant of a sealed
# *UiState has to carry the properties the interface declares. A variant that
# replaces one with a constant resets it, and the screen binds those
# properties to its controls — the projects list's search field was cleared by
# an unrelated failure because the failure state carried an empty query.
no-dropped-ui-state-property:
  NoDroppedUiStateProperty:
    active: true

# Added 2026-10-05: these two rules were implemented and registered in
# META-INF/services, but had no detekt.yml block, so detekt never loaded them and
# they had never run. check-detekt-registrations.sh now enforces the invariant that
# every ruleSetId in source has a block here.
#
# Registered 2026-10-04, and only discoverable then because the block was added:
# the rule set was listed in the RuleSetProvider service file, so it looked wired
# while detekt had never loaded it — the provider existed, the rule never ran, and
# the KDoc's promise went unkept. Activating it surfaces the pre-existing
# violations, which are baselined rather than fixed, so "declared" here means
# "reported", not "clean". See 2026-10-04-ci-test-tag-filter-and-vacuous-gates.
no-direct-dispatchers:
  NoDirectDispatchers:
    active: true

# Same story: ProhibitUserIdInObserve is the regression guard for the
# scopedUserId bug and had never been configured.
user-scoped-repository:
  ProhibitUserIdInObserve:
    active: true

# Added 2026-10-05. Replaces the three source-text predicates in
# shared/src/jvmTest/.../arch/CrashReportingWiringTest.kt, which matched only
# `emitError(`/`catchTo(` call sites and so could not see a ViewModel that handles
# failures by hand — eight of them, each reporting nothing. The rule matches PSI, so
# "can this class fail" is a statement about the code rather than about its spelling.
#
# The viewmodel-must-report invariant that this rule owns, and that this repo has
# violated three separate times (once per default no-op CrashReportingPort in
# MviViewModel, once for the six ViewModels the first regex missed, once for the eight
# it then missed), is a shape invariant. Shape gates belong here, where a positive test
# can prove the rule fires, not in an arch test where a widened regex looks identical
# to a fixed one.
no-unreported-failure-path:
  NoUnreportedFailurePath:
    active: true
  # The second half of the same invariant, added after two production bindings shipped a
  # no-op reporter: the class declared `crashReporter = NoOpCrashReportingPort()` and a
  # default `scope = reportingScope(crashReporter)`, and the binding passed neither. The
  # class-level rule reads a different file and kept passing.
  NoUnwiredReporterInBinding:
    active: true
  # The third half: the class and the binding can both be correct and the two failure paths
  # still diverge, because a `scope` supplied alongside `crashReporter` is chosen
  # independently. Found by reading code, not by a gate. Two sites on `main` had the shape —
  # both resolving the same singleton, so no failure was misplaced, and nothing checking.
  NoDivergentScopeAndReporter:
    active: true

# Added 2026-10-05. All 29 AppError construction sites in commonMain shipped with the
# subtype-wide default code, so the crash dashboard held one `error.validation` group with
# fourteen unrelated failures in it. The default is a placeholder for a value the author has
# to supply, and nothing was checking.
app-error-code:
  AppErrorCode:
    active: true
    # Tests are excluded: an `AppError` built in a test never reaches a crash dashboard, so a
    # grouping code there is a value with no consumer. Requiring one would mean inventing 18
    # stable identifiers to satisfy a rule, which is the "manufacturing a call to justify a
    # parameter" mistake in another form — and it would train the eye to type a code without
    # reading it, which is exactly when a wrong one gets shipped.
    excludes:
      - '**/test/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidHostTest/**'
      - '**/androidTest/**'

# Added during sync-engine refactor (Stage 9). Bans scope.launch { } and scope.async { }
# inside init blocks. The three grandfathered classes (SyncEngine, SyncBootstrapper,
# SyncCoordinator) are listed in the rule's EXEMPTED_CLASSES companion object.
no-init-coroutine-launch:
  NoCoroutineLaunchInInit:
    active: true

# Added 2026-10-13 (PR #592). A testTag inside a Popup-owning container
# (ModalBottomSheet, Popup, AlertDialog, DropdownMenu) is unreachable by
# Android resource-id unless the container root calls
# mapTestTagsAsResourceIds(). The rule was implemented in #592 but never
# registered in META-INF/services and had no config block here, so it had
# never run — the same wiring gap that produced the 2026-10-05 comment
# above no-direct-dispatchers.
popup-test-tag:
  NoPopupWithoutResourceIdMapping:
    active: true

# Added 2026-10-13. Bans two patterns that silently break Maestro UI test coverage:
#   1. testTag = "" (empty string) — element permanently invisible to Maestro.
#   2. Interactive composable with no testTag in feature/ source directories.
# Wired 2026-10-13: implemented and registered in META-INF/services but had no
# detekt.yml block, so check-detekt-registrations.sh would have caught it.
#
# ACTIVE: false since 2026-10-14. The provider was never registered in
# META-INF/services until then, so the rule had never actually run — the moment it
# loaded it reported 578 untagged interactive composables across feature/. The rule
# itself was repaired in the same pass (tag-call detection, feature-package and
# private scoping, canonical handler policy, plus narrowing pattern 2 to files that
# already reference TestTags — see NonTaggedMaestroElements.kt), which brought the
# count from 578 to 26 across 12 real feature screens. Clearing those 26 is tagging
# work for the Maestro tranche (it adds constants to TestTags.kt, which parallel
# tranches own); the detekt baseline ratchet (scripts/check-baseline-ratchet.py)
# forbids absorbing them into baseline-shared.xml. Turning the rule on is a
# deliberate ratchet: tag the 26, then flip this.
non-tagged-maestro-elements:
  NonTaggedMaestroElements:
    active: false

# Added 2026-10-22. A @Composable function must not take a raw collection
# parameter: the Compose compiler cannot treat an interface as stable, so the
# composable is not skippable. Persistent collections (ImmutableList /
# PersistentList) are known-stable and compare structurally, so they give both
# halves — stability and a cheap comparison.
#
# The rule only looks at @Composable functions; a repository or ViewModel method
# taking a List is ordinary Kotlin and is not flagged.
no-unstable-collection-param:
  NoUnstableCollectionParam:
    active: true

# Added 2026-10-22. Bans casting to MutableList / MutableSet / MutableMap.
# The stability contract declares domain types stable, and the compiler
# compares them by equals — a collection mutated after such a cast keeps
# comparing equal to its old contents, so the UI goes stale without an error.
no-mutable-collection-cast:
  NoMutableCollectionCast:
    active: true

# Added 2026-10-24. Bans a false @Immutable: the annotation is a promise the
# compiler cannot check, and a class with a `var` or a raw collection breaks
# it silently — the screen shows a value that is one recomposition out of date.
no-false-immutable:
  NoFalseImmutable:
    active: true

# Added 2026-10-25. The type-level rule above asks what a composable's
# parameter is *declared* as; this one asks where the value came from. A
# collection materialised in the composable's own body is rebuilt on every
# recomposition of that composable, so the promise of stability never starts.
#
# The collection belongs to the state that owns it — or to a remember { } block
# — and the composable hands that instance over unchanged.
no-collection-materialization-in-composable:
  NoCollectionMaterializationInComposable:
    active: true

# Added 2026-11-04 with the Android shell's inset fix (#1699, #2192). The shell's
# `NavigationSuiteScaffold` hands its content the padding the navigation suite took —
# a bottom bar on a phone, a rail on a wide window — and a lambda that declares no
# parameter, or declares it and never spends it, drops that padding: the last row is
# drawn behind the bar, or the content starts under the rail. The seeded regression was
# invisible to the helper's own tests: `shellContentWindowInsets` can be correct while
# the shell never calls it, so the rule reads the call site, which is where the defect
# lives.
no-dropped-navigation-padding:
  NoDroppedNavigationPadding:
    active: true
