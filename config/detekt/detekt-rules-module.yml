# detekt config for the :detekt-rules module itself.
#
# GENERATED — do not edit by hand. Regenerate with:
#   python3 scripts/gen-detekt-rules-config.py
#   python3 scripts/gen-detekt-rules-config.py --check   # CI: fail if stale
#
# This is config/detekt/detekt.yml with the custom rule-set blocks removed. A module
# cannot apply the rules it defines to itself: the custom rules live in :detekt-rules and
# are not on its classpath until it is built, so the full config would fail on every one
# of them as unresolvable.
#
# Everything else is copied verbatim, so ktlint formatting and the built-in rule tuning
# stay single-sourced in detekt.yml. The custom rules are covered by :detekt-rules:test —
# including DetektConfigWiringTest, which asserts that every configured rule name is
# supplied by a registered provider and that every provided rule has a config block.
#
# ── Module-specific overrides ───────────────────────────────────────────────────
# Appended below, and regenerated with the rest, so they cannot silently disappear.

# detekt configuration for Singularity Todo KMP project
# Version: detekt 2.0.0-alpha.3
# Scope: shared (commonMain + androidMain + jvmMain + tests) + desktopApp
#
# Design: ktlint owns formatting (via detekt-rules-ktlint-wrapper plugin).
# detekt owns logic, complexity, naming, performance, exceptions, style.
# ktlint rules (MaxLineLength, WildcardImport, etc.) live in the `style` section.
#
# Run with:         just detekt
# Auto-fix:        just detekt-fix
# Generate baseline: just detekt-baseline
#
# Rules disabled here are either (a) covered by ktlint or (b) too noisy for a
# 560-file codebase on day 1. Revisit after baselines are clean.

config:
  validation: true
  warningsAsErrors: true
  checkExhaustiveness: false
  excludes: []

processors:
  active: true
  exclude:
    - 'KtFileCountProcessor'
    - 'ClassCountProcessor'
    - 'FunctionCountProcessor'
    - 'PropertyCountProcessor'

console-reports:
  active: true
  exclude:
    - 'LiteIssuesReport'

# ---------------------------------------------------------------------------
# comments
# ---------------------------------------------------------------------------
comments:
  active: true
  UndocumentedPublicClass:
    active: false          # documented via AGENTS.md + ARCHITECTURE.md
    excludes:
      - '**/test/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidHostTest/**'
      - '**/androidTest/**'
  UndocumentedPublicFunction:
    active: false
    excludes:
      - '**/test/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidHostTest/**'
      - '**/androidTest/**'
  EndOfSentenceFormat:
    active: true
  AbsentOrWrongFileLicense:
    active: false

# ---------------------------------------------------------------------------
# complexity
# ---------------------------------------------------------------------------
complexity:
  active: true
  LongMethod:
    active: true
    allowedLines: 80           # bumped from default 60
  LongParameterList:
    active: true
    allowedFunctionParameters: 8   # bumped from default 5
    allowedConstructorParameters: 8
    ignoreDefaultParameters: false
    ignoreDataClasses: true
    ignoreAnnotatedParameter: []
  CyclomaticComplexMethod:
    active: true
    allowedComplexity: 20      # bumped from default 14
  TooManyFunctions:
    active: true
    allowedFunctionsPerFile: 25  # bumped from default 10
    excludes:
      - '**/test/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidHostTest/**'
      - '**/androidTest/**'
  NestedBlockDepth:
    active: true
    allowedDepth: 5           # bumped from default 4
  LargeClass:
    active: true
    allowedLines: 600

# ---------------------------------------------------------------------------
# coroutines (detekt bundled rules)
# ---------------------------------------------------------------------------
coroutines:
  active: true

# ---------------------------------------------------------------------------
# empty-blocks
# ---------------------------------------------------------------------------
empty-blocks:
  active: true

# ---------------------------------------------------------------------------
# exceptions
# ---------------------------------------------------------------------------
exceptions:
  active: true
  # A caught exception that is neither logged nor rethrown is the silent-failure
  # shape: the code recovers, continues, and leaves no trace of the error. The
  # repo has already been bitten by one of these — DraftMviViewModel.save()
  # re-enabled the button after a thrown persist() and the user saw a save that
  # did nothing, with no error state and no log.
  #
  # CancellationException must NOT be in ignoredExceptionTypes — it must propagate
  # to abort the calling coroutine; the no-swallowed-cancellation custom rule
  # enforces this specifically inside suspend functions.
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - 'InterruptedException'
      - 'MalformedURLException'
      - 'NumberFormatException'
      - 'ParseException'
  TooGenericExceptionCaught:
    active: true
    excludes:
      - '**/test/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidHostTest/**'
      - '**/androidTest/**'
    exceptionNames:
      - 'Exception'
      - 'Throwable'
  TooGenericExceptionThrown:
    active: true
    exceptionNames:
      - 'Exception'
      - 'Throwable'
      - 'Error'

# ---------------------------------------------------------------------------
# cancellation-integrity rules (Phase 2)

naming:
  active: true
  MatchingDeclarationName:
    active: false          # KMP files intentionally named Xxx.android.kt / Xxx.jvm.kt
  InvalidPackageDeclaration:
    active: true
  EnumNaming:
    active: true
  FunctionNaming:
    active: true
    # Composable functions are PascalCase by Compose convention.
    ignoreAnnotated: ['Composable']
    excludes:
      - '**/test/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidHostTest/**'
      - '**/androidTest/**'
  TopLevelPropertyNaming:
    active: true            # covers top-level constants and properties
  VariableNaming:
    active: true

# ---------------------------------------------------------------------------
# performance
# ---------------------------------------------------------------------------
performance:
  active: true
  SpreadOperator:
    active: true
  ArrayPrimitive:
    active: true
  ForEachOnRange:
    active: true
    excludes:
      - '**/test/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidHostTest/**'
      - '**/androidTest/**'

# ---------------------------------------------------------------------------
# potential-bugs
# ---------------------------------------------------------------------------
potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true
    excludes:
      - '**/test/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidHostTest/**'
      - '**/androidTest/**'
  UnsafeCast:
    active: true
  ElseCaseInsteadOfExhaustiveWhen:
    active: false          # was DuplicateCaseInWhenExpression in 1.x
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  CastNullableToNonNullableType:
    active: false
  Deprecation:
    active: false

# ---------------------------------------------------------------------------
# style
# Note: ktlint rules (MaxLineLength, WildcardImport, etc.) live here too.
# The detekt-rules-ktlint-wrapper plugin registers them.
# ---------------------------------------------------------------------------
style:
  active: true
  MaxLineLength:
    active: false          # ktlint owns line length via .editorconfig (max_line_length = 140)
  WildcardImport:
    active: true
    excludeImports: []
  UnusedImport:
    active: true
  ReturnCount:
    # See the module header: guard clauses are how an unsatisfiable guard stays visible.
    active: true
    max: 16
# ---------------------------------------------------------------------------
# ktlint rules (via detekt-rules-ktlint-wrapper plugin)
# ktlint rule IDs are in kebab-case (e.g. no-wildcard-imports, max-line-length)
# See: detekt-rules-ktlint-wrapper/src/main/kotlin/dev/detekt/rules/ktlintwrapper/wrappers/
# ---------------------------------------------------------------------------
ktlint:
  ImportOrdering:
    active: false          # IDE owns import order; ktlint auto-fix may still sort
  active: true
  code_style: ktlint_official
  auto_correct: true
  # Note: Indentation auto_correct=true causes NPE in IntelliJ AsyncExecutionService
  # on some JDK versions. Disable indent auto-fix; fix manually via editor settings.
  indent:
    active: true
    auto_correct: false
  no-wildcard-imports:
    active: true
    auto_correct: true
  max-line-length:
    active: false          # ktlint owns this; .editorconfig sets max_line_length = 140
  parameter-list-wrapping:
    active: true
    auto_correct: true
  FunctionSignature:
    # ktlint_official code style conflicts with the project's deliberate multi-line
    # override style; enabling it fights `just detekt-fix` and produces churn on every
    # Compose function with more than two parameters.
    active: false

  # The ktlint `filename` rule (reported as "contains a single class") fires on
  # KDocEnforcementRules.kt, which groups a cohesive pair of private top-level rule
  # classes in one file. One file per private class would fragment it for no benefit.
  Filename:
    active: false
# ---------------------------------------------------------------------------
# custom rule sets (via :detekt-rules plugin / ServiceLoader)
# All new rules start in warn-only mode; promoted to error in MR-4.
# NOTE: Rule-specific config (severity, active) added in MR-4 after baseline.
# ---------------------------------------------------------------------------
# PR3 custom rules promoted to error (all at 0 violations after PR 2.x):
# no-runblocking, no-direct-clock-system, no-viewmodel-scope,
# mvi-viewmodel (4 rules), no-real-delay-in-test.
# Promotion verified with daemon-free detekt run (see 2026-09-26-epic2-retro-findings R1).

