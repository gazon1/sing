# The size of the register of debt — the ratchet.
#
# `ComposeCollectionExemptions.kt` names the composables that still take a raw
# collection, and under each of them the parameters that still carry one. The
# number of those parameters is the debt: it is what every conversation about
# this work quotes, and a number nobody records is a number nobody reads.
#
# The gate `scripts/check-compose-stability-config.py` compares this file with
# the register, and it fails when the two disagree — in either direction:
#
#   * the register grew  → the debt grew. Convert a parameter instead, or
#     raise the number here and say why in the commit. Raising it is allowed,
#     but it is a decision somebody has to make on purpose.
#   * the register shrank → the debt was paid. Lower the number here.
#
# Every change to the register therefore comes with a change to this file, and
# the diff shows the movement of the debt in the same commit that moved it.
#
# Measured on 2026-10-24, after the register was keyed by parameter and the
# false `@Immutable` annotations were removed; and again after the menu, the
# proposals and the logbook took their collections from the persistent kind;
# and again after the project screens did the same; and again after the
# matched ranges took their collection from the persistent kind; and again
# after the task editor and the task filters did the same; and again after the
# shared sheets and dialogs did the same; and again after the notes and the
# tags did the same; and again after the calendar and the agenda did the same;
# and again after the chat and the attachments did the same.

sites = 15
parameters = 15
