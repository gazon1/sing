# The register of debt — the screen states that still hold a raw collection.
#
# A screen state is what a screen reads: a member of a `*UiState` hierarchy, or
# a state of a slot on a screen (`*State`). When it holds a raw `List` / `Set`
# / `Map`, the state cannot promise that the instance it holds will not change,
# and the value is built on the wrong side of the boundary. The state that owns
# the value must hold the persistent kind — `ImmutableList` / `ImmutableSet` /
# `ImmutableMap` — and the screen receives that instance unchanged.
#
# One entry per property:
#
#     <the state's qualified name>.<the property> : <the declared type>
#
# The states of the core (`SyncState`, `EphemeralState`) are not in this
# register: they are the state of a repository and of a settings bundle, not of
# a screen that renders them.
#
# The size of the register is the ratchet. The debt may not grow without
# somebody deciding to raise the bar, and a shrink has to be recorded: every
# change to the register comes with a change to the number below, in the same
# commit, so the diff shows the movement of the debt in the commit that moved
# it.
#
# Measured on 2026-10-27, when the gate was written.

