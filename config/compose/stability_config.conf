// Compose stability contract.
//
// Every class listed here is treated by the Compose compiler as **stable**: a
// parameter of that type is compared by `equals` instead of by identity, so a
// composable that takes it can be skipped when the value did not change.
//
// The compiler reads this file through `composeCompiler.stabilityConfigurationFiles`
// in `shared/build.gradle.kts` and `desktopApp/build.gradle.kts`. The gate
// `scripts/check-compose-stability-config.py` checks that every name below is a
// type that exists, that the type keeps the promise this file makes for it (no
// `var`, no collection that can change), that the file is actually wired into
// both modules, and that the register of debt has not grown past the size
// recorded in `config/compose/stability_debt_baseline.conf`.
//
// The comment marker is `//` and only `//` — the compiler's parser knows no
// other one, and a line starting with anything else is read as a class name.
//
// WHAT BELONGS HERE
//
// A type belongs here when all three hold:
//
//   1. every property is `val` — there is no second version of the value;
//   2. the collections it holds are rebuilt on every read and never mutated
//      afterwards, so `equals` is an honest description of "same content";
//   3. it is passed to composables, so the comparison actually buys something.
//
// Violating (2) is not a crash — it is a screen that keeps showing the old
// contents. `NoMutableCollectionCast` (detekt) exists to catch the obvious way
// to violate it.
//
// WHAT DOES NOT BELONG HERE
//
// A screen-sized state. Making one stable means the compiler compares it by
// `equals`, and `equals` over a whole screen's worth of collections is a deep
// comparison on every recomposition of the parent. The cheap form is an
// unstable screen state (identity comparison, O(1)) with stable leaves inside
// it. See docs/architecture/compose-stability.md.

// ── Domain models ────────────────────────────────────────────────────────────
//
// The Room mapper builds a new instance of each of these on every read, so an
// identity comparison would recompose every row of every list on every load.
// They are val-only data classes, and their collections are read-only views.

com.singularity.todo.feature.tasks.domain.model.Task
com.singularity.todo.feature.projects.domain.model.Project
com.singularity.todo.feature.notes.Note
com.singularity.todo.feature.tags.Tag
com.singularity.todo.feature.reminders.Reminder
com.singularity.todo.feature.checklist.ChecklistItem
com.singularity.todo.core.attachments.Attachment

// The calendar's task projection — val-only, like Task, but a separate type.
com.singularity.todo.feature.calendar.domain.model.CalendarTaskUi

// A projection that wraps a contract type. A type argument is stable when the
// type it names has a *recorded* verdict of stable — and the verdict the
// compiler infers for a type is recorded in that type's class file, so an
// inferred verdict counts. What does not count is a verdict of unstable: the
// compiler will not second-guess it for a type argument, and only an entry
// here can say otherwise.
//
// Without this line `ImmutableList<ProjectWithCounts>` is runtime-unstable
// while `ImmutableList<Project>` is stable, even though
// `ProjectWithCounts` is a two-field data class: it holds a `Project` and two
// counts, and the compiler judged it unstable, and that judgement stuck.
//
// What is *not* here is a type the compiler already judges stable. The
// identifiers — `TaskId`, `NoteId`, `TagId` — are value classes over a
// `String`, and the compiler sees through them to it, so their verdict is
// stable and needs no entry. Measured on 2026-10-24: listing them changed
// nothing in the report — 1535 stable, 372 runtime-unstable and 4 unstable
// across 728 composables, with the lines and without them.
com.singularity.todo.feature.projects.domain.model.ProjectWithCounts

// The agenda's row leaf and its section prefill. `RenderedSection` is the
// comparison boundary of the agenda: with the prefill stable, the section is
// compared as a section, and the screen that holds the sections stays
// identity-compared.
com.singularity.todo.feature.agenda.domain.model.SectionPrefill

// ── The serializable draft ───────────────────────────────────────────────────
//
// `kotlinx.serialization` cannot serialize a persistent collection, so the
// draft cannot be given one the way the models above are. The contract is the
// only way to make it stable.
com.singularity.todo.feature.tasks.presentation.state.TaskDraft

// ── Date and time classes from the standard libraries ───────────────────────
//
// `LocalDate`, `LocalTime` and `Instant` are *not* value classes: they are
// ordinary final classes. `kotlinx.datetime.LocalDate` and `LocalTime` wrap
// `java.time.LocalDate` and `java.time.LocalTime`; `kotlin.time.Instant`
// wraps a `Long` of seconds and an `Int` of nanoseconds. (Checked with
// `javap` against the jars, not assumed.)
//
// They are immutable by construction and their `equals` is a couple of field
// comparisons — but the compiler infers stability from what it can see, and a
// class from another module that carries no stability marker of its own is
// runtime-unstable to it. So a parameter of such a type is compared by
// identity.
//
// These are the single largest group of unstable parameters in the report
// measured on 2026-10-22: 40 `LocalDate`, 10 `Instant` and 6 `LocalTime`
// parameters, against 7 `Task` and 7 `Note` ones. Listing them here is the
// cheapest change in the whole contract: three lines, no source touched, and
// every date comparison becomes a value comparison instead of an identity one.
//
// The identifiers of this project *are* value classes, and they did *not*
// need an entry: the compiler sees through a value class and finds the
// `String` underneath, which is stable. Measured on 2026-10-24, the report
// was the same with the identifiers listed and without them — so they are not
// listed.

kotlinx.datetime.LocalDate
kotlinx.datetime.LocalTime
kotlin.time.Instant

// ── The leaves the compiler cannot judge ────────────────────────────────────
//
// A type belongs here when the compiler has no way to tell that it is stable:
// an interface is always runtime-unstable, and a class that holds a plain
// `List` is unstable whatever its other properties say.
//
// `ProposalItemStatus` is a sealed interface, so every `ProposalItem` that
// holds one is unstable with it. The entry reaches the implementations, and
// `ProposalItem` becomes stable by itself — its fields are `val`s of stable
// types.
//
// `AiProposal` holds its changes in a plain `List`. The mapper rebuilds that
// list on every read and nothing mutates it afterwards — the promise the
// contract makes, the same shape as `Task`, which holds a `List<TagId>`.
//
// `LogbookEntry` is a sealed interface too: a note or a time tracking row.
// `Note` is in the contract above; `TimeEntry` is stable by itself.
//
// `MenuNode` is the sealed class of the desktop menu. Its `SubMenu` holds its
// children in a plain `List`, and the builder hands out a fresh copy of it —
// the same promise, once more.
//
// `ProposalItemKind` is the other root of `ProposalItem`: a sealed interface
// too, so the entry is needed for the same reason.
//
// `SpotlightShape` is the root of `SpotlightStep`: a sealed interface, and the
// step holds one.
//
// `AiTestResult`, `SelectorTemplate`, `ThemeMode` and `LocalDataDisposition`
// are the parameter types themselves: a sealed interface, a sealed interface,
// a sealed class and a sealed class. The compiler judges none of them.

com.singularity.todo.feature.proposals.domain.model.ProposalItemStatus
com.singularity.todo.feature.proposals.domain.model.ProposalItemKind
com.singularity.todo.feature.proposals.domain.model.AiProposal
com.singularity.todo.feature.tasks.presentation.viewmodel.slot.LogbookEntry
com.singularity.todo.core.ui.menu.MenuNode
com.singularity.todo.core.ui.onboarding.SpotlightShape
com.singularity.todo.core.llm.AiTestResult
com.singularity.todo.feature.agenda.domain.selector.SelectorTemplate
com.singularity.todo.core.settings.ThemeMode
com.singularity.todo.feature.auth.LocalDataDisposition
