# yaml-language-server: $schema=https://raw.githubusercontent.com/mokevnin/easement/main/easement.schema.json
version: 1

tests: auto

layers:
  - [androidApp, desktopApp, adr-cli]
  - pro
  - shared
  - adr-core
  - core-base

no_cycles: true

uncovered_ok:
  - { name: "Maestro/helpers/scripts/**", because: "Maestro test helpers with no tsconfig" }
  - { name: "infra/supabase/functions/**", because: "Deno edge functions live in their own project" }
  - { name: "infra/gen_sync_allowlist_sql.py", because: "one-off infra script with no project file" }

components:
  Maestro: { in: Maestro }
  adr-cli: { in: adr-cli }
  adr-core: { in: adr-core }
  androidApp: { in: androidApp }
  build-logic: { in: build-logic }
  core-base: { in: core-base }
  desktopApp: { in: desktopApp }
  detekt-rules: { in: detekt-rules }
  infra: { in: infra }
  mcp-server: { in: mcp-server }
  pro: { in: pro }
  shared: { in: shared }

rules:
  adr-cli: { may_depend_on: [adr-core, core-base], because: "CLI sits on top of adr-core and core-base" }
  adr-core: { may_depend_on: [core-base], because: "adr-core builds on core-base primitives" }
  androidApp: { may_depend_on: [pro, shared], because: "Android app composes pro and shared" }
  desktopApp: { may_depend_on: [shared], because: "desktop app composes shared" }
  pro: { may_depend_on: [shared], because: "pro builds on shared" }
  shared: { may_depend_on: [adr-core, core-base], because: "shared builds on adr-core and core-base" }
  tests: { may_depend_on: [adr-cli, adr-core, androidApp, core-base, desktopApp, pro, shared], because: "tests may reach any component" }