name: Setup Android SDK platform
description: >
  Installs the Android platform the build declares — but only when the runner
  does not already have it. The runner image ships `platforms;android-37.1`,
  and asking sdkmanager for it anyway spent 626 s of a 1435 s job fetching
  remote manifests and reinstalling a package the runner already had.

runs:
  using: composite
  steps:
    - name: Install platforms;android-37.1
      shell: bash
      run: |
        sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
        if [ -z "$sdk_root" ]; then
          echo "::error::no Android SDK found (ANDROID_SDK_ROOT and ANDROID_HOME are unset)"
          exit 1
        fi
        # `android.jar` is the thing the build compiles against, so its presence
        # is the question worth asking — a directory that is there but empty
        # would fail the compile later and name the wrong cause.
        if [ -f "$sdk_root/platforms/android-37.1/android.jar" ]; then
          echo "platforms;android-37.1 is already on the runner — nothing to install"
          exit 0
        fi
        sdkmanager="$(find "$sdk_root/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1 || true)"
        if [ -z "$sdkmanager" ]; then
          echo "::error::no sdkmanager under $sdk_root/cmdline-tools"
          exit 1
        fi
        yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
        "$sdkmanager" "platforms;android-37.1"
