name: Setup JVM + Gradle
description: >
  JDK 21 and Gradle with one cache policy for every workflow.
  Only runs on main write the Gradle cache; PRs and tags restore it read-only,
  so a PR cannot evict or poison the cache that main depends on.

inputs:
  cache-encryption-key:
    description: >
      Secret GRADLE_ENCRYPTION_KEY. Without it setup-gradle does not persist the
      configuration cache, and the report the coverage gate depends on cannot
      be proven to come from this run. Required in practice — a repository
      without it works, and is quietly slower and less provable.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        java-version: 21
        distribution: zulu

    # The configuration-cache store lives in the PROJECT .gradle/ directory.
    # setup-gradle picks it up itself via cache-encryption-key, which is why
    # three hand-written actions/cache blocks do not appear here: they were a
    # workaround for setup-gradle@v4 and they keyed on run_id, so every run
    # stored a fresh cache and evicted the previous one.
    # NOTE on v6: gradle/actions@v6 moves caching into a proprietary library
    # (Gradle Terms of Use; ADR 2026-10-05-ci-action-versions-and-runner-image-pin §v6).
    # `cache-provider: enhanced` is Gradle's own backend — higher hit rates, free for
    # public repos, but requires GitHub Enterprise for private ones (gazon1/sing is private).
    # v5 with `cache-cleanup: on-success` (default) is the current target. Revisit when
    # the repository is public or GitHub Enterprise is in use (#313).
    - uses: gradle/actions/setup-gradle@v5
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
        cache-encryption-key: ${{ inputs.cache-encryption-key }}
        # Exclude transforms and instrumented jars — they are content-addressed and
        # accumulate as new entries when dependencies change, reaching ~1.5 GB each.
        # Excluding them saves ~7 GB. Dependencies (modules-2) and wrapper are kept.
        #
        # NOTE: glob patterns (transforms-*, jars-*) were tried and found ineffective —
        # transforms entries kept appearing in the cache despite the exclude. The
        # explicit versioned paths below are the working fallback (#312).
        gradle-home-cache-excludes: |
          caches/transforms-2
          caches/transforms-3
          caches/transforms-4
          caches/jars-3
          caches/jars-9
          caches/instrumented-jars-2

    # Robolectric does not come through Gradle: it resolves its
    # `android-all-instrumented` jars from Maven Central into ~/.m2 on the
    # first test run. setup-gradle caches the Gradle home and nothing else, so
    # every CI run downloaded the jar again — a network round trip in the
    # androidHostTest job, on the critical path of every PR.
    #
    # The jar is content-addressed by version, so the key is the version
    # catalog rather than the commit: a new Robolectric release invalidates
    # the cache, and nothing else does.
    #
    # Same policy as the Gradle cache above: main saves, PRs and tags restore
    # read-only, so a PR cannot evict the copy main depends on.
    - name: Restore the Robolectric android-all jars
      uses: actions/cache/restore@v4
      with:
        path: ~/.m2/repository/org/robolectric
        key: robolectric-android-all-${{ hashFiles('gradle/libs.versions.toml') }}
        restore-keys: |
          robolectric-android-all-

    - name: Save the Robolectric android-all jars
      if: github.ref == 'refs/heads/main'
      uses: actions/cache/save@v4
      with:
        path: ~/.m2/repository/org/robolectric
        key: robolectric-android-all-${{ hashFiles('gradle/libs.versions.toml') }}