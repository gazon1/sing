name: 'Setup gate tooling'
description: >-
  Install the gate suite's Python package (editable from scripts/src/) plus
  junitparser into a venv, and make the external binaries (actionlint,
  shellcheck, yamllint, lychee, ktlint, rumdl, ...) available through mise
  (see mise.toml). The versions are pinned in mise.toml and
  config/toolchain-versions.env so local and CI runs agree.

inputs:
  python-version:
    description: Python version for the venv
    required: false
    default: '3.12'
  extra-packages:
    description: Space-separated pip requirements to install alongside scripts/src.
    required: false
    default: ''
  with-yaml-lint:
    description: Kept for compatibility; yamllint is provided by mise.
    required: false
    default: 'true'
  with-action-lint:
    description: Kept for compatibility; actionlint and shellcheck are provided by mise.
    required: false
    default: 'true'
  with-link-lint:
    description: Kept for compatibility; lychee is provided by mise.
    required: false
    default: 'true'
  with-kt-lint:
    description: Kept for compatibility; ktlint is provided by mise.
    required: false
    default: 'false'
  with-md-lint:
    description: Kept for compatibility; rumdl is provided by mise.
    required: false
    default: 'false'

outputs:
  venv-bin:
    description: The venv's bin directory
    value: ${{ steps.venv.outputs.bin }}

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v2
      with:
        version: latest
        install: true
        cache: true

    - uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true

    - name: Create the venv and install the gate suite
      id: venv
      shell: bash
      run: |
        set -euo pipefail
        VENV="$HOME/ci-venv"
        uv venv "$VENV"
        # shellcheck disable=SC2086
        VIRTUAL_ENV="$VENV" uv pip install --editable scripts/src/ junitparser ${{ inputs.extra-packages }}
        echo "bin=$VENV/bin" >> "$GITHUB_OUTPUT"
        echo "$VENV/bin" >> "$GITHUB_PATH"
        # mise shims must be on PATH for later steps too.
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Verify both gate registries load
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/check-gate-registries.py || {
          echo "::error ::a gate registry is empty or unloadable"
          exit 1
        }
        python3 -c "import traceability" || {
          echo "::error ::traceability is not importable after this action"
          exit 1
        }
        echo "sgate + traceability: importable"
