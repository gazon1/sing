name: E2E (Maestro)

# Replaces maestro-smoke.yml, maestro-nightly.yml and the maestro-smoke job of
# ci.yml. One workflow, one APK build, arithmetic sharding.
#
#   PR labelled `run-maestro` -> smoke  (re-runs on every new push while labelled)
#   push to main               -> smoke
#   nightly cron               -> full, 4 shards
#   manual                     -> either
#
# The APK is built ONCE here and shared by every shard. Before this, the debug APK
# was assembled about six times across ci.yml and the four nightly shards.

on:
  schedule:
    # Nightly full suite at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: "smoke = tagged subset, full = every flow in 4 shards"
        type: choice
        options: [smoke, full]
        default: smoke
  pull_request:
    branches: [main]
    types: [labeled, synchronize]
  push:
    branches: [main]
    tags: ["v*"]
    # Smoke on every push to main, full suite only on schedule or tags

concurrency:
  group: emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Repository variable (set by Renovate / manually), e.g. the version you run locally
  # (`maestro --version`). Falls back to .maestro-version if the variable is unset —
  # needed because a Renovate PR that removes the variable would otherwise break
  # every CI run until the next PR adds it back.
  MAESTRO_VERSION: ${{ vars.MAESTRO_VERSION || '2.10.0' }}
  # Unified GPU mode for both e2e.yml and android-device-tests.yml.
  # Set via repo variable EMULATOR_GPU_MODE (swiftshader_indirect or off).
  # Defaults to off (current stable config for Maestro flows).
  EMULATOR_GPU_MODE: ${{ vars.EMULATOR_GPU_MODE || 'off' }}

jobs:
  # Validates every id: selector in every Maestro flow against TestTags.kt.
  # All flows now use stable id: selectors; this check is fully blocking.
  validate-selectors:
    needs: [plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - name: Validate Maestro selectors
        run: |
          # A venv, not the system environment: the runner's /usr is
          # EXTERNALLY-MANAGED and its user cannot write /usr/local, so a plain
          # `pip install` exits 1 here. Same shape as the installs in ci.yml.
          uv venv "$HOME/ci-venv"
          VIRTUAL_ENV="$HOME/ci-venv" uv pip install pyyaml
          PATH="$HOME/ci-venv/bin:$PATH" python scripts/ci/validate-maestro-selectors.py

  # Decides suite and shard count in one place, so the matrix is arithmetic rather
  # than four hand-maintained job entries.
  plan:
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'run-maestro') &&
       (github.event.action != 'labeled' || github.event.label.name == 'run-maestro'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      suite: ${{ steps.p.outputs.suite }}
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SUITE: ${{ inputs.suite }}
        run: |
          suite=smoke
          [ "$EVENT" = schedule ] && suite=full
          [ "$EVENT" = workflow_dispatch ] && suite=$INPUT_SUITE
          shards='[1]'
          [ "$suite" = full ] && shards='[1,2,3,4]'
          echo "suite=$suite" >> "$GITHUB_OUTPUT"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  build-apk:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-jvm-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Provide dummy Supabase credentials so `buildTimeSupabaseConfig()` (which reads
      # BuildConfig.SUPABASE_URL / SUPABASE_ANON_KEY via reflection) finds non-null
      # values.  Without this, the app shows "SUPABASE_URL" error on the auth screen
      # and "Continue Offline" cannot initialise the anonymous session.
      # The values are not real — anonymous sign-in works offline without a server.
      - name: Create local.properties with Supabase credentials
        run: |
          cat > local.properties << 'EOF'
          supabase.url=https://placeholder.supabase.co
          supabase.anonKey=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiIOiJwbGFjZWhvbGRlciIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNjQwMTAxMDAwLCJleHAiOjE5NTU2NzUwMDB9.placeholder
          EOF

      # -PTEST_AUTH_BYPASS=true: the test stubs module overrides AuthRepository and
      # SupabaseClientProvider so the app starts directly into the agenda screen with a
      # fake signed-in session. No Supabase server or network call is needed, which is
      # exactly what a smoke test that clears the app state requires.
      - run: ./gradlew :androidApp:assembleDebug -PTEST_AUTH_BYPASS=true

      - uses: actions/upload-artifact@v7
        with:
          name: e2e-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1

  # Sets up the AVD once and shares it across all matrix shards.
  # AVD image caching via actions/cache speeds up warm runs.
  #
  # This is a job-level `uses:`, not a step. A reusable workflow is invoked from
  # `jobs.<id>.uses`; putting it in a step's `uses:` asks GitHub to resolve
  # `.github/workflows/_setup-avd.yml` as a *local action*, which is not one —
  # the run dies with "Can't find 'action.yml' ... Did you forget to run
  # actions/checkout", before a single line of setup executes. The job cannot
  # declare `runs-on`, `steps` or `outputs` alongside `uses:`; results arrive
  # through `needs.setup-avd.outputs.*`, declared by the called workflow.
  setup-avd:
    needs: [plan]
    uses: ./.github/workflows/_setup-avd.yml
    with:
      avd_name: singularity-api36
      system_image: system-images;android-36;google_apis;x86_64
      device: pixel_6

  e2e:
    name: e2e (${{ needs.plan.outputs.suite }}, shard ${{ matrix.shard }})
    needs: [plan, build-apk, setup-avd]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      SUITE: ${{ needs.plan.outputs.suite }}
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@v7

      # Maestro needs a JDK; the runner image has none the CLI can rely on.
      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: zulu

      # TODO(verify): the major must match the `actions/upload-artifact` used above.
      - uses: actions/download-artifact@v7
        with:
          name: e2e-apk
          path: apk

      # The version is passed to the installer as MAESTRO_VERSION. Checking the
      # variable and then running an unpinned `curl | bash` would assert a pin and
      # install whatever is newest — the same shape as a gate that is configured and
      # never applied.
      - name: Install Maestro (pinned)
        run: |
          : "${MAESTRO_VERSION:?set the repository variable MAESTRO_VERSION}"
          MAESTRO_VERSION="$MAESTRO_VERSION" bash -c "$(curl -fsSL https://get.maestro.mobile.dev)"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # loguru, pydantic and click — the emulator module's own dependencies.
      # Needed by run_maestro_e2e.py which calls `python3 -m emulator`.
      - uses: ./.github/actions/setup-python-tools
        with:
          with-yaml-lint: 'false'
          with-action-lint: 'false'

      # api-level 36 matches targetSdk in gradle/libs.versions.toml (sdk-target).
      # EMULATOR_GPU_MODE defaults to off (sidesteps gfxstream crash); Maestro
      # drives through the accessibility layer and never composites. SwiftShader
      # performance impact tracked in ADR 2026-10-18; unify via #723.
      - name: Set AVD environment
        run: |
          # One grouped redirect per file (SC2129): several separate appends to the
          # same file re-open it once per line, which is what shellcheck rejects.
          # ANDROID_AVD_HOME is an environment variable, not an executable path, so
          # it goes to GITHUB_ENV; the three tool directories go to GITHUB_PATH.
          sdk_root="${{ needs.setup-avd.outputs.sdk_root }}"
          echo "ANDROID_AVD_HOME=${{ needs.setup-avd.outputs.android_avd_home }}" >> "$GITHUB_ENV"
          {
            echo "$sdk_root/emulator"
            echo "$sdk_root/platform-tools"
            echo "$sdk_root/build-tools/37.0.0"
          } >> "$GITHUB_PATH"

      # Temporary diagnostic. Run 39234183957 failed here with
      #   ERROR | 'emulator' binary not found in PATH.
      # while every input said it should be found: setup-avd had just executed
      # /usr/local/lib/android/sdk/emulator/emulator itself, sdk_root arrived
      # intact, ANDROID_AVD_HOME from this same step was in the environment, and
      # the step order puts this before the Maestro run. `_emulator_binary_available()`
      # is `Path("/usr/bin/emulator").exists() or shutil.which("emulator")`, so the
      # disagreement is somewhere between what $GITHUB_PATH asked for and what
      # shutil.which sees.
      #
      # Every input to that decision is printed rather than the one value guessed
      # at, because a wrong guess costs a full ~10 minute emulator run and this is
      # the third defect behind this one in a row. Remove once the cause is known.
      - name: Diagnose emulator launcher resolution
        run: |
          sdk_root="${{ needs.setup-avd.outputs.sdk_root }}"
          echo "sdk_root=[$sdk_root]"
          echo "ANDROID_SDK_ROOT=[${ANDROID_SDK_ROOT:-<unset>}]"
          echo "ANDROID_HOME=[${ANDROID_HOME:-<unset>}]"
          echo "PATH=$PATH"
          echo "--- command -v emulator ---"
          command -v emulator || echo "(not on PATH)"
          echo "--- contents of \$sdk_root/emulator ---"
          find "$sdk_root/emulator" -maxdepth 1 -printf '%M %3s %p\n' 2>&1 | head -20 || true
          echo "--- test -x \$sdk_root/emulator/emulator ---"
          if [ -x "$sdk_root/emulator/emulator" ]; then echo "executable"; else echo "NOT executable or missing"; fi
          echo "--- /usr/bin/emulator ---"
          find /usr/bin/emulator -maxdepth 0 -printf '%M %3s %p\n' 2>&1 || echo "(absent)"
          echo "--- python: shutil.which ---"
          python3 -c "import shutil, os; print('which:', shutil.which('emulator')); print('PATH:', os.environ.get('PATH'))"

      # The whole lifecycle (boot + APK install + Maestro run) lives in
      # run_maestro_e2e.py so the emulator stays up for the full duration.
      - name: Run Maestro E2E
        env:
          EMULATOR_EXTRA_FLAGS: -no-window -gpu ${{ env.EMULATOR_GPU_MODE }} -no-audio -prop persist.sys.locale=ru-RU
          EMULATOR_TIMEOUT: 600
        run: |
          python3 scripts/run-maestro-e2e.py \
            --apk apk \
            --suite "$SUITE" \
            --shard "$SHARD" \
            --shards "$SHARDS"

      # Uploaded unconditionally, and from build/maestro-results/ rather than only
      # ~/.maestro/tests/. A result set that exists solely when something broke
      # cannot answer "which flow passed on abc1234".
      - name: Process Maestro results
        run: |
          # Run traceability to normalise JUnit XML and produce the result matrix.
          # --maestro: include Maestro XML from build/maestro-results/
          # --targets android: Maestro flows are Android-only
          # --partial: smoke/regression tags mean this is a filtered run, not a full suite
          # --commit: annotate the matrix with this SHA for traceability
          python3 -m traceability results \
            --maestro \
            --targets android \
            --partial \
            --commit "${{ github.sha }}" \
            --out-dir build/traceability

      - name: Upload JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: maestro-junit-${{ needs.plan.outputs.suite }}-${{ matrix.shard }}-${{ github.run_id }}
          path: build/maestro-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload traceability result matrix
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: traceability-matrix-${{ needs.plan.outputs.suite }}-${{ matrix.shard }}-${{ github.run_id }}
          path: build/traceability/
          if-no-files-found: warn
          retention-days: 14

      # No year in the glob: the old path `~/.maestro/tests/**/2026-*/` stops
      # matching on 1 January 2027 and the failure evidence stops being collected.
      - name: Upload Maestro screenshots / logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-failures-${{ matrix.shard }}-${{ github.run_id }}
          path: ~/.maestro/tests/**
          if-no-files-found: ignore
          retention-days: 7

      # E2E smoke instability tracked in #721.
      # Owner: gazon1. Migration to scripts/src/emulator unblocks full recovery loop.
      - name: Post advisory warning on failure
        if: failure()
        run: |
          echo "::warning::E2E smoke failed. This is an advisory gate — it does not block release." && echo "::warning::See https://github.com/gazon1/sing/issues/721 (owner: gazon1)"

  # Nobody reads a red cron run. Open an issue instead, so the nightly failure has
  # somewhere to land other than a scrollback buffer.
  nightly-alert:
    if: ${{ failure() && github.event_name == 'schedule' }}
    needs: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue create \
            --title "Nightly Maestro failed ($(date -u +%F))" \
            --body "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"