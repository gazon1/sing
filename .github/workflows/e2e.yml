name: E2E (Maestro)

# Replaces maestro-smoke.yml, maestro-nightly.yml and the maestro-smoke job of
# ci.yml. One workflow, one APK build, arithmetic sharding.
#
#   PR labelled `run-maestro` -> smoke  (re-runs on every new push while labelled)
#   push to main               -> smoke
#   nightly cron               -> full
#   manual                     -> either
#
# Both suites run on the shard count config/docs/e2e-shards.txt gives them: the
# smoke suite is the tag-selected subset, and one shard of it used to cost more
# than one shard of the full suite — the pull-request path was the slowest
# thing in the workflow, and it was called the minimal one.
#
# The APK is built ONCE here and shared by every shard. Before this, the debug APK
# was assembled about six times across ci.yml and the four nightly shards.

on:
  schedule:
    # Nightly full suite at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: "smoke = the tagged subset, full = every flow; shards per config/docs/e2e-shards.txt"
        type: choice
        options: [smoke, full]
        default: smoke
  pull_request:
    branches: [main]
    types: [labeled, synchronize]
  push:
    branches: [main]
    tags: ["v*"]
    # Smoke on every push to main, full suite only on schedule or tags

concurrency:
  # `github.workflow` is load-bearing, not decoration. Maestro flows and
  # instrumented tests are two separate emulator fleets, but both used to land in
  # one group: `emulator-<pr number>` on a pull_request and `emulator-<ref>` on
  # everything else. With `cancel-in-progress: true` for pull_request they did not
  # merely queue — they cancelled each other. On PR 740 (labelled `run-maestro`
  # only) the `Android device tests` run started, skipped its `plan` job for
  # lacking the `run-device-tests` label, and cancelled the in-progress Maestro run
  # on its way out: both emulator workflows ended up doing nothing, silently.
  # On main the same collision just serialises them, delaying instrumented tests
  # behind a Maestro run by up to an hour.
  group: emulator-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Repository variable (set by Renovate / manually), e.g. the version you run locally
  # (`maestro --version`). Falls back to .maestro-version if the variable is unset —
  # needed because a Renovate PR that removes the variable would otherwise break
  # every CI run until the next PR adds it back.
  MAESTRO_VERSION: ${{ vars.MAESTRO_VERSION || '2.10.0' }}
  # Unified GPU mode for both e2e.yml and android-device-tests.yml.
  # Set via repo variable EMULATOR_GPU_MODE (swiftshader_indirect or off).
  # Defaults to off (current stable config for Maestro flows).
  EMULATOR_GPU_MODE: ${{ vars.EMULATOR_GPU_MODE || 'off' }}

jobs:
  # Validates every id: selector in every Maestro flow against TestTags.kt.
  # All flows now use stable id: selectors; this check is fully blocking.
  validate-selectors:
    needs: [plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - name: Validate Maestro selectors
        run: |
          # A venv, not the system environment: the runner's /usr is
          # EXTERNALLY-MANAGED and its user cannot write /usr/local, so a plain
          # `pip install` exits 1 here. Same shape as the installs in ci.yml.
          uv venv "$HOME/ci-venv"
          VIRTUAL_ENV="$HOME/ci-venv" uv pip install pyyaml
          PATH="$HOME/ci-venv/bin:$PATH" python scripts/ci/validate-maestro-selectors.py

  # Decides suite and shard count in one place, so the matrix is arithmetic rather
  # than four hand-maintained job entries.
  #
  # The shard count comes from config/docs/e2e-shards.txt, not from a literal
  # here. It used to be written in this job, and a local reproduction of a red
  # shard had to guess it — a guess of 3 against a nightly that used 4 runs
  # different flows, because the shard is `index % shards`. The same file tells
  # `scripts/e2e-shard-plan.py` which flows a shard holds, so the nightly and
  # the reproduction cannot drift apart.
  plan:
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'run-maestro') &&
       (github.event.action != 'labeled' || github.event.label.name == 'run-maestro'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      suite: ${{ steps.p.outputs.suite }}
      shards: ${{ steps.p.outputs.shards }}
    steps:
      # The shard count comes from config/docs/e2e-shards.txt, so the job that
      # builds the matrix has to be able to read that file — and a job that
      # reads a file needs the checkout. It ran without one until the plan
      # moved out of the workflow: the old plan was a literal in a shell line,
      # and the new one is a file the repository owns.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            config/docs/e2e-shards.txt
            scripts/e2e-shard-plan.py
          sparse-checkout-cone-mode: false
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SUITE: ${{ inputs.suite }}
        run: |
          suite=smoke
          [ "$EVENT" = schedule ] && suite=full
          [ "$EVENT" = workflow_dispatch ] && suite=$INPUT_SUITE
          shards=$(python3 scripts/e2e-shard-plan.py --suite "$suite" --matrix)
          echo "suite=$suite" >> "$GITHUB_OUTPUT"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
  # The one place the debug APK the shards install is assembled. ci.yml's
  # `android` free leg used to assemble the same APK for the same commit — one
  # APK, built twice, in two workflows, on two runners, each with its own
  # Gradle build cache — and it now compiles only
  # (docs/decisions/2026-10-06-ci-single-gate-registry-and-leaf-split.md).
  #
  # The artifact this job uploads is what every shard below installs, so the
  # build happens once per commit and the shards share it.
  build-apk:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-jvm-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Provide dummy Supabase credentials so `buildTimeSupabaseConfig()` (which reads
      # BuildConfig.SUPABASE_URL / SUPABASE_ANON_KEY via reflection) finds non-null
      # values.  Without this, the app shows "SUPABASE_URL" error on the auth screen
      # and "Continue Offline" cannot initialise the anonymous session.
      # The values are not real — anonymous sign-in works offline without a server.
      - name: Create local.properties with Supabase credentials
        run: |
          cat > local.properties << 'EOF'
          supabase.url=https://placeholder.supabase.co
          supabase.anonKey=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiIOiJwbGFjZWhvbGRlciIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNjQwMTAxMDAwLCJleHAiOjE5NTU2NzUwMDB9.placeholder
          EOF

      # -PTEST_AUTH_BYPASS=true: the test stubs module overrides AuthRepository and
      # SupabaseClientProvider so the app starts directly into the agenda screen with a
      # fake signed-in session. No Supabase server or network call is needed, which is
      # exactly what a smoke test that clears the app state requires.
      - run: ./gradlew :androidApp:assembleDebug -PTEST_AUTH_BYPASS=true

      - uses: actions/upload-artifact@v7
        with:
          name: e2e-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1

  # Sets up the AVD once and shares it across all matrix shards.
  # AVD image caching via actions/cache speeds up warm runs.
  #
  # This is a job-level `uses:`, not a step. A reusable workflow is invoked from
  # `jobs.<id>.uses`; putting it in a step's `uses:` asks GitHub to resolve
  # `.github/workflows/_setup-avd.yml` as a *local action*, which is not one —
  # the run dies with "Can't find 'action.yml' ... Did you forget to run
  # actions/checkout", before a single line of setup executes. The job cannot
  # declare `runs-on`, `steps` or `outputs` alongside `uses:`; results arrive
  # through `needs.setup-avd.outputs.*`, declared by the called workflow.
  setup-avd:
    needs: [plan]
    uses: ./.github/workflows/_setup-avd.yml
    with:
      avd_name: singularity-api36
      system_image: system-images;android-36;google_apis;x86_64
      device: pixel_6

  e2e:
    name: e2e (${{ needs.plan.outputs.suite }}, shard ${{ matrix.shard }})
    needs: [plan, build-apk, setup-avd]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      SUITE: ${{ needs.plan.outputs.suite }}
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@v7

      # KVM has to be enabled on *this* runner, not on the runner that produced
      # the AVD. The setup job enables it for itself; that enabling does not
      # travel with a cache, and the two jobs run on different machines.
      #
      # Without this the emulator binary is found, the AVD is created, and the
      # emulator then dies with "x86_64 emulation currently requires hardware
      # acceleration! … This user doesn't have permissions to use KVM
      # (/dev/kvm)" — a failure that reads like a missing emulator and is
      # neither.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Runners do not share a filesystem, so everything `setup-avd` installed and
      # created died with that job: the Maestro shard started on a runner where
      # /usr/local/lib/android/sdk/emulator did not exist, and the AVD the setup job
      # had just created was not there either. These four paths and this key are the
      # transport.
      #
      # The key and the SDK root are the producer's own outputs, read verbatim.
      # They used to be re-assembled here out of `${{ env.ANDROID_HOME }}` and a
      # hand-written key — and the `env` context does not carry the runner's own
      # environment variables, so the paths expanded to `/system-images`,
      # `/emulator` and `/platform-tools` at the filesystem root. The cache
      # therefore restored nothing, the shard had no emulator binary, and all
      # four shards of run 39253664636 died with "'emulator' binary not found in
      # PATH" within a second of each other.
      #
      # `actions/cache/restore`, not `actions/cache`, because a shard must never
      # write an entry: keys are immutable, and four shards racing to save the
      # same key each log a misleading "another job is creating it".
      - name: Restore AVD and SDK cache
        id: cache-avd
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ needs.setup-avd.outputs.sdk_root }}/system-images
            ${{ needs.setup-avd.outputs.sdk_root }}/emulator
          key: ${{ needs.setup-avd.outputs.cache_key }}
          restore-keys: |
            ${{ needs.setup-avd.outputs.cache_key_prefix }}

      # What the cache carried, and whether it carried anything at all. The
      # payload sizes are printed by scripts/ci/provision-avd.sh further down,
      # which reports the same two paths the producer caches; this line ties
      # those sizes to the restore, so a diff between two runs shows a cache
      # that grew. The producer's own log carries the same report, because the
      # producer runs the same script.
      - name: Report the cache transport
        env:
          CACHE_KEY: ${{ needs.setup-avd.outputs.cache_key }}
          CACHE_HIT: ${{ steps.cache-avd.outputs.cache-hit }}
        run: |
          echo "cache-transport: key=$CACHE_KEY hit=${CACHE_HIT:-false}"

      # Maestro needs a JDK; the runner image has none the CLI can rely on.
      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: zulu

      # TODO(verify): the major must match the `actions/upload-artifact` used above.
      - uses: actions/download-artifact@v7
        with:
          name: e2e-apk
          path: apk

      # The version is passed to the installer as MAESTRO_VERSION. Checking the
      # variable and then running an unpinned `curl | bash` would assert a pin and
      # install whatever is newest — the same shape as a gate that is configured and
      # never applied.
      - name: Install Maestro (pinned)
        run: |
          : "${MAESTRO_VERSION:?set the repository variable MAESTRO_VERSION}"
          MAESTRO_VERSION="$MAESTRO_VERSION" bash -c "$(curl -fsSL https://get.maestro.mobile.dev)"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # loguru, pydantic and click — the emulator module's own dependencies.
      # Needed by run_maestro_e2e.py which calls `python3 -m emulator`.
      - uses: ./.github/actions/setup-python-tools
        with:
          with-yaml-lint: 'false'
          with-action-lint: 'false'

      # api-level 36 matches targetSdk in gradle/libs.versions.toml (sdk-target).
      # EMULATOR_GPU_MODE defaults to off (sidesteps gfxstream crash); Maestro
      # drives through the accessibility layer and never composites. SwiftShader
      # performance impact tracked in ADR 2026-10-18; unify via #723.
      - name: Set AVD environment
        run: |
          # One grouped redirect per file (SC2129): several separate appends to the
          # same file re-open it once per line, which is what shellcheck rejects.
          # ANDROID_AVD_HOME is an environment variable, not an executable path, so
          # it goes to GITHUB_ENV; the three tool directories go to GITHUB_PATH.
          sdk_root="${{ needs.setup-avd.outputs.sdk_root }}"
          echo "ANDROID_AVD_HOME=${{ needs.setup-avd.outputs.android_avd_home }}" >> "$GITHUB_ENV"
          {
            echo "$sdk_root/emulator"
            echo "$sdk_root/platform-tools"
            echo "$sdk_root/build-tools/37.0.0"
          } >> "$GITHUB_PATH"

      # The cache above is an optimisation, not a guarantee: an entry can be
      # evicted, and the entry written before the paths were fixed holds nothing.
      # This step is the guarantee. It is a no-op when the cache did its job
      # (the emulator, the system image and the AVD are all there) and provisions
      # them when it did not, so "the cache was evicted" costs a few minutes
      # instead of four red shards. The producer runs the same script, so both
      # sides agree on what "provisioned" means.
      - name: Ensure the emulator and the AVD are present
        env:
          AVD_NAME: ${{ needs.setup-avd.outputs.avd_name }}
          SYSTEM_IMAGE: ${{ needs.setup-avd.outputs.system_image }}
          DEVICE: ${{ needs.setup-avd.outputs.device }}
          SDK_ROOT: ${{ needs.setup-avd.outputs.sdk_root }}
          ANDROID_AVD_HOME: ${{ needs.setup-avd.outputs.android_avd_home }}
        run: bash scripts/ci/provision-avd.sh

      # The whole lifecycle (boot + APK install + Maestro run) lives in
      # run_maestro_e2e.py so the emulator stays up for the full duration.
      - name: Run Maestro E2E
        env:
          EMULATOR_EXTRA_FLAGS: -no-window -gpu ${{ env.EMULATOR_GPU_MODE }} -no-audio -prop persist.sys.locale=ru-RU
          EMULATOR_TIMEOUT: 600
          # The AVD the emulator module boots. It defaults to "Medium_Phone",
          # an AVD this workflow never creates — so without this the module
          # would have booted the right binary against the wrong AVD, and the
          # failure would have looked like a boot problem rather than a
          # misnamed one.
          AVD: ${{ needs.setup-avd.outputs.avd_name }}
        run: |
          python3 scripts/run-maestro-e2e.py \
            --apk apk \
            --suite "$SUITE" \
            --shard "$SHARD" \
            --shards "$SHARDS"

      # Uploaded unconditionally, and from build/maestro-results/ rather than only
      # ~/.maestro/tests/. A result set that exists solely when something broke
      # cannot answer "which flow passed on abc1234".
      - name: Process Maestro results
        run: |
          # Run traceability to normalise JUnit XML and produce the result matrix.
          # --maestro: include Maestro XML from build/maestro-results/
          # --targets android: Maestro flows are Android-only
          # --partial: smoke/regression tags mean this is a filtered run, not a full suite
          # --commit: annotate the matrix with this SHA for traceability
          python3 -m traceability results \
            --maestro \
            --targets android \
            --partial \
            --commit "${{ github.sha }}" \
            --out-dir build/traceability

      - name: Upload JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: maestro-junit-${{ needs.plan.outputs.suite }}-${{ matrix.shard }}-${{ github.run_id }}
          path: build/maestro-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload traceability result matrix
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: traceability-matrix-${{ needs.plan.outputs.suite }}-${{ matrix.shard }}-${{ github.run_id }}
          path: build/traceability/
          if-no-files-found: warn
          retention-days: 14

      # No year in the glob: the old path `~/.maestro/tests/**/2026-*/` stops
      # matching on 1 January 2027 and the failure evidence stops being collected.
      - name: Upload Maestro screenshots / logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-failures-${{ matrix.shard }}-${{ github.run_id }}
          path: ~/.maestro/tests/**
          if-no-files-found: ignore
          retention-days: 7

      # E2E smoke instability tracked in #721.
      # Owner: gazon1. Migration to scripts/src/emulator unblocks full recovery loop.
      - name: Post advisory warning on failure
        if: failure()
        run: |
          echo "::warning::E2E smoke failed. This is an advisory gate — it does not block release." && echo "::warning::See https://github.com/gazon1/sing/issues/721 (owner: gazon1)"

  # The run's own verdict, measured. The e2e job above already fails when a
  # flow fails; this job says how much debt there is, groups it by cause, and
  # fails when the debt grew past the floor the repository owns
  # (config/docs/maestro-failure-floor.txt).
  #
  # It runs after the shards, on their combined reports. The floor is a number
  # for the whole suite, so the measurement has to be the whole suite: a gate
  # that ran inside one of the four nightly shards would measure a quarter of
  # the suite against the whole suite's floor and pass on debt it could not
  # see.
  maestro-results:
    needs: [plan, e2e]
    # always() so that a red shard still gets measured — the measurement
    # matters most when the run failed. needs.plan.result so that a skipped
    # plan (a pull request without the run-maestro label) skips this job
    # instead of downloading nothing and failing on it, and
    # needs.e2e.result so that a skipped shard job (the APK build failed, so
    # there was no run to measure) skips it too.
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-python-tools
        with:
          with-yaml-lint: 'false'
          with-action-lint: 'false'

      - name: Collect the shards' reports
        uses: actions/download-artifact@v7
        with:
          pattern: maestro-junit-${{ needs.plan.outputs.suite }}-*
          path: build/maestro-results
          merge-multiple: true

      - name: Maestro results gate
        run: python3 scripts/ci/check-maestro-results.py --scope "${{ needs.plan.outputs.suite }}"

  # Nobody reads a red cron run. Open an issue instead, so the nightly failure has
  # somewhere to land other than a scrollback buffer.
  nightly-alert:
    if: ${{ failure() && github.event_name == 'schedule' }}
    needs: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue create \
            --title "Nightly Maestro failed ($(date -u +%F))" \
            --body "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"