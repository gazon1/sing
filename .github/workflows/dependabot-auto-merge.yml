name: Dependabot auto-merge

# WHY THE CHECK-RUN INSTEAD OF `.mergeable_state`
#
# This repository has no branch protection (see
# docs/decisions/2026-10-07-branch-protection-is-unavailable.md), so
# `.mergeable_state` is not a statement about the checks: it is `clean` when
# nothing is required and `unstable` when a check fails, and the old version of
# this workflow accepted both. A dependabot pull request whose CI gate was red
# was therefore merged, and main went red with it — the Kotlin bump that
# red-lined main is the recorded instance.
#
# The `CI gate` check-run on the pull request's head commit is the one thing
# that is actually green or not, and it is checked here by name.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event_name != 'pull_request_target' ||
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref || 'main' }}

      - name: The pull requests to consider
        id: candidates
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -n "${EVENT_PR:-}" ]; then
            echo "$EVENT_PR" > "$RUNNER_TEMP/candidates.txt"
          else
            gh api "repos/${{ github.repository }}/pulls?state=open&per_page=100" \
              --jq '.[] | select(.user.login == "dependabot[bot]") | .number' \
              > "$RUNNER_TEMP/candidates.txt"
          fi
          echo "candidates: $(tr '\n' ' ' < "$RUNNER_TEMP/candidates.txt")"
          echo "count=$(wc -l < "$RUNNER_TEMP/candidates.txt")" >> "$GITHUB_OUTPUT"

      - name: The pull request's own description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while read -r number; do
            [ -n "$number" ] || continue
            gh api "repos/${{ github.repository }}/pulls/${number}" --jq .body > "$RUNNER_TEMP/description-${number}.md"
          done < "$RUNNER_TEMP/candidates.txt"

      - name: The decisions table is readable
        run: python3 scripts/dependency_decision.py --check

      - name: The bumps that may merge themselves
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/mergeable.txt"
          while read -r number; do
            [ -n "$number" ] || continue
            bump="$(python3 scripts/dependabot_bump.py "$RUNNER_TEMP/description-${number}.md")" || {
              decision="$(python3 scripts/dependency_decision.py --pull-request "$RUNNER_TEMP/description-${number}.md")"
              case "$decision" in
                none)
                  echo "::notice::#${number} is not a patch and not a minor, and no decision is recorded"
                  ;;
                unknown)
                  echo "::notice::#${number} is not a patch and not a minor, and its dependency could not be read"
                  ;;
                *)
                  echo "::notice::#${number}: a decision is recorded - $decision"
                  ;;
              esac
              continue
            }
            echo "#${number} is a $bump"
            echo "$number" >> "$RUNNER_TEMP/mergeable.txt"
          done < "$RUNNER_TEMP/candidates.txt"
          echo "mergeable: $(tr '\n' ' ' < "$RUNNER_TEMP/mergeable.txt")"
          echo "count=$(wc -l < "$RUNNER_TEMP/mergeable.txt")" >> "$GITHUB_OUTPUT"

      - name: The pull request's own CI gate is green
        id: checks
        if: steps.bump.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 1800 ))
          while true; do
            waiting=0
            while read -r number; do
              [ -n "$number" ] || continue
              state="$(gh api "repos/${{ github.repository }}/pulls/${number}" --jq '.mergeable_state // "unknown"')"
              case "$state" in
                dirty)
                  echo "::error::#${number} has conflicts - cannot be merged"
                  continue
                  ;;
                blocked|unknown|behind)
                  echo "#${number}: mergeable_state is '$state' - waiting"
                  waiting=1
                  continue
                  ;;
              esac
              # `mergeable_state` says nothing about the checks on a repository
              # without branch protection — it is `unstable` while a check is
              # failing, and `clean` when nobody configured the check as
              # required. The CI gate check-run on the head commit is the thing
              # that actually has to be green.
              head="$(gh api "repos/${{ github.repository }}/pulls/${number}" --jq '.head.sha')"
              conclusion="$(gh api "repos/${{ github.repository }}/commits/${head}/check-runs?per_page=100" \
                --jq '[.check_runs[] | select(.name == "CI gate")]
                      | if length == 0 then "missing"
                        else (.[0].conclusion // "pending") end')"
              case "$conclusion" in
                success)
                  echo "#${number}: the CI gate check-run is green"
                  ;;
                *)
                  echo "#${number}: the CI gate check-run is '$conclusion' - waiting"
                  waiting=1
                  ;;
              esac
            done < "$RUNNER_TEMP/mergeable.txt"
            if [ "$waiting" -eq 0 ]; then
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::the CI gate check-run did not become green in time"
              exit 1
            fi
            sleep 20
          done

      - name: Merge it
        if: steps.bump.outputs.count != '0' && steps.checks.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while read -r number; do
            [ -n "$number" ] || continue
            gh pr merge "$number" --squash --delete-branch
            echo "#${number} is merged"
          done < "$RUNNER_TEMP/mergeable.txt"
