name: Documentation Audit

# Runner image is pinned to ubuntu-24.04 on purpose (2026-10-05). GitHub is migrating
# the `ubuntu-latest` label to Ubuntu 26.04 between 2026-10-19 and 2026-11-19; the
# warning is silenced by pinning, which is the mitigation the runner-images notice
# recommends. 26.04 moves the kernel 6.17 -> 7.0 and systemd 255 -> 259, and the
# Android assemble plus both emulator workflows are exactly the surface that would
# notice. Reviving `ubuntu-latest` is a deliberate migration, not a cleanup — it will
# not come back on its own. See docs/decisions/2026-10-05-ci-action-versions-and-runner-image-pin.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'docs/decisions/**'
      - 'AGENTS.md'
      - 'ARCHITECTURE.md'
      - 'docs/doc-maintenance.md'
      - '.github/workflows/docs-audit.yml'
      - 'scripts/refresh-decisions-digest.*'
      - 'scripts/normalize-adr-frontmatter.*'
      - 'scripts/print-source-tree.*'
      - 'openspec/**'
      - 'README.md'
      - 'PROGRESS.md'
      - 'docs/**'
      - '.agents/skills/**'
      - 'config/detekt/**'
      - 'config/docs/**'
      - 'scripts/**'
      - '.just/**'

jobs:
  docs-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check ADR frontmatter
        run: ./scripts/normalize-adr-frontmatter.sh --dry-run || true

      - name: Refresh DIGEST
        run: python3 scripts/refresh-decisions-digest.py

      - name: Check for stale open/deferred ADRs
        run: |
          STALE=$(find docs/decisions -name "*.md" -newer docs/doc-maintenance.md -exec grep -l "status: open\|status: deferred" {} \; 2>/dev/null || true)
          if [ -n "$STALE" ]; then
            echo "Warning: open/deferred ADRs found (older than doc-maintenance.md):"
            echo "$STALE"
          fi

      - name: Verify DIGEST has no double-suffix bugs
        run: |
          DOUBLE_SUFFIX_COUNT=$(grep -c "_(from " docs/decisions/DIGEST.md || echo "0")
          if [ "$DOUBLE_SUFFIX_COUNT" -gt 100 ]; then
            echo "Warning: DIGEST.md has $DOUBLE_SUFFIX_COUNT '_(from ' occurrences — possible double-suffix bug"
          else
            echo "DIGEST.md looks clean ($DOUBLE_SUFFIX_COUNT citations)"
          fi

      - name: Report DIGEST size
        run: |
          LINES=$(wc -l < docs/decisions/DIGEST.md)
          echo "DIGEST.md: $LINES lines"
          if [ "$LINES" -gt 1500 ]; then
            echo "Warning: DIGEST.md exceeds 1500 lines — investigate deduplication"
          fi

      - name: Validate OpenSpec changes
        run: |
          if command -v openspec &> /dev/null; then
            openspec validate || true
          else
            echo "OpenSpec CLI not installed — skipping validation"
          fi
