name: Release

# Tag `v1.2.3` (or `v1.2.3-rc.1`) on a commit that already passed CI on main
#   -> signed Android APK + Linux .deb + Linux .rpm -> DRAFT GitHub Release.
# workflow_dispatch = dry run: everything is built, only workflow artifacts are kept.
#
# WHAT THIS DOES NOT DO, deliberately. The build cannot yet do these, so the release
# does not pretend to:
#
#   * MINIFY. `isMinifyEnabled = false` (androidApp/build.gradle.kts). R8 breaks
#     Koin, Room and kotlinx.serialization on their reflection, and nothing in CI
#     exercises a minified build. That is the highest-risk gap here and it is tracked,
#     not hidden: turning minification on and fixing the rules belongs BEFORE
#     signing, because the question "does the shipped binary work" outranks the
#     question "who gets the file".
#   * PACKAGE msi/dmg. `nativeDistributions.targetFormats` declares only Deb and Rpm,
#     so `packageMsi`/`packageDmg` do not exist. jpackage does not cross-compile,
#     so each format needs its own runner.
#
# Follow-ups are in docs/decisions/deferred-backlog.md.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Dry-run version, e.g. 1.2.3 (nothing is published)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_NAME: singularity

jobs:
  meta:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      version_code: ${{ steps.v.outputs.version_code }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      package_version: ${{ steps.v.outputs.package_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: v
        env:
          RAW: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          # All of this arithmetic lives in scripts/release_version.py, with tests.
          # It used to be bash here, where nothing could check it: six defects had to
          # be found by running the pipeline before it completed once. The shell now
          # runs the decision; it does not make it.
          #
          # `out=$(cmd)` and then `eval`, never `eval "$(cmd)"`: in the latter form the
          # exit status of `cmd` is the status of `eval`, which succeeds on empty input.
          # A rejected version would then leave `version` empty and the release would
          # proceed. Assigning first is what preserves the failure.
          out=$(python3 scripts/release_version.py parse "$RAW") || exit 1
          eval "$out"
          {
            echo "version=$version"
            echo "version_code=$version_code"
            echo "prerelease=$prerelease"
            echo "package_version=$package_version"
          } >> "$GITHUB_OUTPUT"

      - name: Tag must be on main and have a green CI run
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor origin/main "$GITHUB_SHA" \
            || { echo "::error::$GITHUB_SHA is not on main"; exit 1; }
          n=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --limit 1 \
                --json databaseId --jq 'length')
          [ "$n" = 1 ] || { echo "::error::no successful ci.yml run for $GITHUB_SHA"; exit 1; }

          # A tag that already has a release must not be rebuilt.
          #
          # The tag is force-movable, so a tag that has been through three runs can
          # sit on a commit whose artifacts are attached to a release built from an
          # earlier one — the tag says 0.2.1-rc.1 while the release holds binaries
          # from whatever the tag pointed at before. Nothing detected that: `gh release
          # create` fails on an existing release, but only after the whole pipeline has
          # spent ten minutes building everything it is about to throw away.
          #
          # A draft is a release. If this needs to happen again, delete the release
          # first, so the tag and the artifacts it names never disagree even briefly.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::a release already exists for $GITHUB_REF_NAME; delete it (and the tag) rather than force-moving the tag"
            exit 1
          fi

  android:
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      VERSION_CODE: ${{ needs.meta.outputs.version_code }}
    steps:
      - uses: actions/checkout@v7

      # Provision a signing key. Fail-closed: if secrets are missing the build fails,
      # never silently falls back to a debug key. Split env/vs GITHUB_ENV to keep
      # passwords out of step logs.
      - name: Provision signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          required=(KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD)
          for var in "${required[@]}"; do
            [ -n "${!var}" ] || { echo "::error::secret $var is not set"; exit 1; }
          done

          # Decode the keystore to a temporary path. The path goes to GITHUB_ENV so
          # the path is visible to subsequent steps (gradle reads it); passwords never
          # appear in env: or log output.
          keystore_path=/tmp/singularity.keystore
          echo "$KEYSTORE_BASE64" | base64 -d > "$keystore_path"

          {
            echo "SIGNING_KEYSTORE_PATH=$keystore_path"
            echo "SIGNING_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
            echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-jvm-gradle

      - name: Build release APK
        run: |
          ./gradlew :androidApp:assembleRelease \
            -PVERSION_NAME="$VERSION" \
            -PVERSION_CODE="$VERSION_CODE"

      - name: Stage and verify the embedded version
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          # Shopt nullglob + an explicit preference order, rather than `ls … | head -n1`:
          # parsing `ls` breaks on any filename with a space or a dash, and `head`
          # picks by directory order, so which APK got released was not a decision
          # anyone wrote down. An unsigned build wins; otherwise the first match in
          # a sorted, expanded list does.
          shopt -s nullglob
          unsigned=(androidApp/build/outputs/apk/release/*unsigned*.apk)
          signed=(androidApp/build/outputs/apk/release/*.apk)
          if (( ${#unsigned[@]} )); then
            apk="${unsigned[0]}"
          elif (( ${#signed[@]} )); then
            apk="${signed[0]}"
          else
            echo "::error::No APK found under androidApp/build/outputs/apk/release"
            exit 1
          fi
          # Exact match: a release tagged 1.2.3 must ship 1.2.3, not 1.2.30 or 1.2.3-rc.1.
          # The build-tools version is a glob, so it is expanded into an array and
          # the highest one chosen explicitly: passing the glob straight to the
          # command name is exactly what SC2211 flags, and "whatever the shell
          # picked" is not a version decision anyone reviewed.
          shopt -s nullglob
          aapt2_candidates=("$ANDROID_HOME"/build-tools/*/aapt2)
          if (( ! ${#aapt2_candidates[@]} )); then
            echo "::error::No aapt2 under $ANDROID_HOME/build-tools — is ANDROID_HOME set?"
            exit 1
          fi
          aapt2="${aapt2_candidates[${#aapt2_candidates[@]} - 1]}"
          embedded=$("$aapt2" dump badging "$apk" \
            | sed -n "s/^package: name='[^']*' versionCode='[^']*' versionName='\([^']*\)'.*/\1/p")
          echo "embedded versionName: $embedded"
          [[ "$embedded" == "$VERSION" ]] \
            || { echo "::error::APK declares version '$embedded' but the tag says '$VERSION'"; exit 1; }

          # Verify signing: the certificate SHA-256 fingerprint must match the repo
          # variable (never trust an APK you did not build to have the right key).
          #
          # apksigner, not `keytool -printcert -jarfile`: that reads the certificate from
          # META-INF/*.RSA, which only a v1 (JAR) signature writes. minSdk is 26, so AGP
          # does not produce a v1 signature at all and keytool finds nothing to print —
          # it exits quietly, the fingerprint comes back empty, and the check fails with
          # "got , want …" while the APK is in fact correctly signed. apksigner reads the
          # v2/v3 block and is the tool that matches how this APK is actually signed.
          # It is taken from the same build-tools directory as aapt2 above, so the two
          # never disagree about versions.
          apksigner="$(dirname "$aapt2")/apksigner"
          if [[ ! -x "$apksigner" ]]; then
            echo "::error::No apksigner at $apksigner — is the build-tools install complete?"
            exit 1
          fi
          cert_sha256=$("$apksigner" verify --print-certs "$apk" \
            | sed -n 's/.*certificate SHA-256 digest: *//p' \
            | head -n1 \
            | tr -d ': \n' \
            | tr '[:upper:]' '[:lower:]')
          expected_sha256=${{ vars.ANDROID_CERT_FINGERPRINT }}
          [[ -n "$cert_sha256" ]] \
            || { echo "::error::Could not read a signing certificate from $apk"; exit 1; }
          [[ "$cert_sha256" == "$expected_sha256" ]] \
            || { echo "::error::APK signing cert mismatch (got $cert_sha256, want $expected_sha256)"; exit 1; }

          mkdir -p dist
          cp "$apk" "dist/$APP_NAME-$VERSION-android.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: dist/*.apk
          if-no-files-found: error

  desktop:
    name: desktop (${{ matrix.label }})
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, label: linux-x64, fmt: deb }
          - { os: ubuntu-24.04, label: linux-x64, fmt: rpm }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-jvm-gradle

      - name: Package
        run: |
          # The version was derived once, in `meta`, by scripts/release_version.py, and
          # is passed through unchanged. It has to be acceptable to BOTH formats:
          # `packageVersion` is a single property on `nativeDistributions`, which
          # declares Deb and Rpm together, and Compose validates it against every
          # declared format while *configuring* the project — so a string one format
          # refuses fails the whole build, including in the job that packages only the
          # other. Two tag runs were lost to getting this wrong; the reasoning and the
          # measurement are in
          # docs/decisions/2026-10-16-desktop-package-version-must-satisfy-rpm-and-deb.md
          # and in scripts/tests/test_release_version.py.
          echo "package version: $PKG_VERSION (tag version: $VERSION)"
          case "$FMT" in
            deb) ./gradlew :desktopApp:packageDeb -PpackageVersion="$PKG_VERSION" -PdesktopAppVersion="$VERSION" -PdesktopAppVersionCode="$VERSION_CODE" ;;
            rpm) ./gradlew :desktopApp:packageRpm -PpackageVersion="$PKG_VERSION" -PdesktopAppVersion="$VERSION" -PdesktopAppVersionCode="$VERSION_CODE" ;;
          esac
        env:
          FMT: ${{ matrix.fmt }}
          VERSION: ${{ needs.meta.outputs.version }}
          VERSION_CODE: ${{ needs.meta.outputs.version_code }}
          PKG_VERSION: ${{ needs.meta.outputs.package_version }}

      - name: Stage and verify the packaged version
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          LABEL: ${{ matrix.label }}
          FMT: ${{ matrix.fmt }}
        run: |
          case "$FMT" in
            deb)
              # Array + explicit empty check instead of `ls … | head -n1`: parsing
              # `ls` breaks on names with dashes or spaces, and a silent empty
              # `$f` turns into a confusing dpkg error instead of "not built".
              shopt -s nullglob
              matches=(desktopApp/build/compose/binaries/main/deb/*."$FMT")
              if (( ! ${#matches[@]} )); then
                echo "::error::No $FMT package was built; run the desktop package step first"
                exit 1
              fi
              f="${matches[0]}"
              embedded=$(dpkg-deb -f "$f" Version | python3 -c \
                'import sys; sys.path.insert(0, "scripts"); import release_version as rv; print(rv.deb_embedded(sys.stdin.read().strip()))')
              ;;
            rpm)
              shopt -s nullglob
              matches=(desktopApp/build/compose/binaries/main/rpm/*."$FMT")
              if (( ! ${#matches[@]} )); then
                echo "::error::No $FMT package was built; run the desktop package step first"
                exit 1
              fi
              f="${matches[0]}"
              ver=$(rpm -qp --queryformat '%{VERSION}' "$f")
              rel=$(rpm -qp --queryformat '%{RELEASE}' "$f")
              embedded=$(python3 -c \
                'import sys; sys.path.insert(0, "scripts"); import release_version as rv; print(rv.rpm_embedded(sys.argv[1], sys.argv[2]))' \
                "$ver" "$rel")
              ;;
          esac
          # The expected string is derived from the tag by the same module that derived
          # it for packaging, so the two cannot drift apart by construction — they
          # already disagreed once, when one side was computed in bash and the other in
          # a different shell step.
          python3 scripts/release_version.py verify \
            --format "$FMT" --embedded "$embedded" --tag "$VERSION"

          mkdir -p dist
          cp "$f" "dist/$APP_NAME-$VERSION-$LABEL.$FMT"

      # The step above reads headers. This one installs the file and runs it.
      #
      # Both release verifications that shipped this repository's first ever release
      # were wrong about correct artifacts — one read a v1 signature an APK with
      # minSdk 26 does not have, the other compared a version against jpackage's own
      # `RELEASE=1` — and both were metadata checks, which is the cheapest place for
      # that class of defect to live. A package can declare the right version, carry
      # the right files, and still not install or start (#664).
      #
      # Kept as a separate step rather than folded into the one above, for the same
      # reason: the header checks catch a mis-staged or mis-tagged artifact early and
      # cheaply, and they are still worth running once an install check exists.
      - name: Install and smoke the packaged launcher
        env:
          FMT: ${{ matrix.fmt }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          shopt -s nullglob
          case "$FMT" in
            deb)
              src=(desktopApp/build/compose/binaries/main/deb/*.deb)
              image=ubuntu:24.04
              install='apt-get update -qq; apt-get install -y --no-install-recommends ./app.deb'
              ;;
            rpm)
              src=(desktopApp/build/compose/binaries/main/rpm/*.rpm)
              image=fedora:41
              install='dnf install -y ./app.rpm'
              ;;
          esac
          if (( ! ${#src[@]} )); then
            echo "::error::No $FMT package to install; the Package step should have built one"
            exit 1
          fi
          mkdir -p /tmp/smoke
          cp "${src[0]}" "/tmp/smoke/app.$FMT"
          # The checkout is not mounted into the container — only the package and the
          # one script that reads it. Mounting the workspace would let the install see
          # a Gradle tree and measure the runner instead of the package.
          docker run --rm -v /tmp/smoke:/w -v "$GITHUB_WORKSPACE/scripts/release:/s:ro" -w /w \
            -e INSTALL_CMD="$install" -e PKG_FORMAT="$FMT" -e EXPECT_VERSION="$VERSION" \
            -e PACKAGE="/w/app.$FMT" \
            "$image" bash /s/install-and-smoke.sh

      - uses: actions/upload-artifact@v7
        with:
          name: release-desktop-${{ matrix.label }}-${{ matrix.fmt }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [meta, android, desktop]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Artifact manifest
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          VERSION_CODE: ${{ needs.meta.outputs.version_code }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          shopt -s nullglob
          artifacts=(dist/*.apk dist/*.deb dist/*.rpm)
          if (( ! ${#artifacts[@]} )); then
            echo "::error::no artifacts to describe — the release would ship a manifest naming nothing"
            exit 1
          fi
          args=()
          for a in "${artifacts[@]}"; do args+=(--file "${a##*/}"); done
          python3 scripts/release_version.py manifest --tag "$VERSION" "${args[@]}" > dist/MANIFEST.txt
          cat dist/MANIFEST.txt

      - name: Checksums
        run: |
          cd dist
          # `./*`, not `*`: a filename starting with `-` would be read as an option.
          # Runs after the manifest so every file that ships is covered — the manifest
          # is part of the release too, and an unhashed file in a release is a file
          # nobody can verify. SHA256SUMS.txt itself is the one exception, and it is
          # correct that way round: the shell expands `./*` before the redirect creates
          # the file, so it never hashes itself.
          sha256sum ./* > SHA256SUMS.txt
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS.txt

      # --draft so a human reads the notes first.
      # TODO: actions/attest-build-provenance (once OCI attestations support KMP).
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          flags=(--draft --generate-notes --verify-tag)
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/*
