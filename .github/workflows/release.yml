name: Release

# Tag `v1.2.3` (or `v1.2.3-rc.1`) on a commit that already passed CI on main
#   -> unsigned debug-signed-less APK + Linux .deb -> DRAFT GitHub Release.
# workflow_dispatch = dry run: everything is built, only workflow artifacts are kept.
#
# WHAT THIS DOES NOT DO, deliberately. The build cannot yet do these, so the release
# does not pretend to:
#
#   * SIGN the APK. There is no `signingConfigs` block anywhere in the tree, so
#     `assembleRelease` produces an unsigned APK. Running `apksigner verify` on it
#     would fail every single time — which is how a pipeline teaches you to ignore a
#     verification step. The artifact is named `-unsigned.apk` so it cannot be
#     mistaken for a shippable build.
#   * MINIFY. `isMinifyEnabled = false` (androidApp/build.gradle.kts:139). R8 breaks
#     Koin, Room and kotlinx.serialization on their reflection, and nothing in CI
#     exercises a minified build. That is the highest-risk gap here and it is tracked,
#     not hidden: turning minification on and fixing the rules belongs BEFORE
#     signing, because the question "does the shipped binary work" outranks the
#     question "who gets the file".
#   * PACKAGE msi/dmg. `nativeDistributions.targetFormats` declares only Deb
#     (desktopApp/build.gradle.kts:103-110), so `packageMsi`/`packageDmg` do not
#     exist. jpackage does not cross-compile, so each format needs its own runner.
#   * INJECT a version. There are no `appVersionName`/`appVersionCode` Gradle
#     properties; versionName is hardcoded to 0.1.0 and versionCode to 1. The version
#     guard below is what keeps that honest.
#
# Follow-ups are in docs/decisions/deferred-backlog.md.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Dry-run version, e.g. 1.2.3 (nothing is published)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_NAME: singularity

jobs:
  meta:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: v
        env:
          RAW: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          v="${RAW#v}"
          re='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          [[ $v =~ $re ]] || { echo "::error::'$RAW' is not X.Y.Z[-suffix]"; exit 1; }
          {
            echo "version=$v"
            if [[ $v == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Tag must be on main and have a green CI run
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_SHA is not on main"; exit 1; }
          n=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --limit 1 \
                --json databaseId --jq 'length')
          [ "$n" = 1 ] || { echo "::error::no successful ci.yml run for $GITHUB_SHA"; exit 1; }

  android:
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-jvm-gradle # tag builds restore the cache read-only

      # No version properties exist to pass; the build uses its hardcoded 0.1.0.
      - name: Build release APK
        run: ./gradlew :androidApp:assembleRelease

      - name: Stage and check the embedded version
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          apk=$(ls androidApp/build/outputs/apk/release/*unsigned*.apk | head -n1)
          # The embedded versionName is what the build actually contains. It is
          # compared against the tag here rather than trusted, because a release
          # tagged 1.2.3 that ships a 0.1.0 binary is the most silent failure this
          # workflow could have.
          embedded=$("$ANDROID_HOME"/build-tools/*/aapt2 dump badging "$apk" \
            | sed -n "s/^package: name='[^']*' versionCode='[^']*' versionName='\([^']*\)'.*/\1/p")
          echo "embedded versionName: $embedded"
          case "$embedded" in
            "$VERSION"*) ;;
            *) echo "::error::APK declares version '$embedded' but the tag says '$VERSION'"; exit 1 ;;
          esac
          mkdir -p dist
          cp "$apk" "dist/$APP_NAME-$VERSION-android-unsigned.apk"

      # mapping.txt is deliberately NOT uploaded: with isMinifyEnabled = false the
      # file does not exist, and an `if-no-files-found: warn` on a file that can
      # never appear is a check that reports nothing forever.
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: dist/*.apk
          if-no-files-found: error

  # jpackage cannot cross-compile, and only Deb is configured, so this is one leg.
  desktop:
    name: desktop (${{ matrix.label }})
    needs: meta
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, label: linux-x64, fmt: deb }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-jvm-gradle

      # Output is desktopApp/build/compose/binaries/main/deb/... — Compose Desktop
      # has no build variants, so there is no `main-release` directory to look in.
      - name: Package deb
        run: ./gradlew :desktopApp:packageDeb

      - name: Stage and check the packaged version
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          LABEL: ${{ matrix.label }}
          FMT: ${{ matrix.fmt }}
        run: |
          f=$(ls desktopApp/build/compose/binaries/main/"$FMT"/*."$FMT" | head -n1)
          echo "packaging $f"
          # dpkg-deb's Version field is built from the hardcoded packageVersion
          # (0.1.0), so it is checked against the tag for the same reason as the APK.
          embedded=$(dpkg-deb -f "$f" Version | sed 's/-[0-9].*$//')
          echo "embedded deb version: $embedded"
          case "$embedded" in
            "$VERSION"*) ;;
            *) echo "::error::deb declares version '$embedded' but the tag says '$VERSION'"; exit 1 ;;
          esac
          mkdir -p dist
          cp "$f" "dist/$APP_NAME-$VERSION-$LABEL.$FMT"

      - uses: actions/upload-artifact@v7
        with:
          name: release-desktop-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [meta, android, desktop]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the only job that can write to the repository
      packages: write # for GitHub Packages publishing
    steps:
      # TODO(verify): major must match the upload-artifact used by the jobs above.
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt

      # Publish to GitHub Packages
      - name: Publish Android APK to GitHub Packages
        run: ./gradlew :androidApp:publishReleasePublicationToGitHubPackagesRepository
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Linux packages to GitHub Packages
        run: |
          ./gradlew :desktopApp:publishLinuxDebPublicationToGitHubPackagesRepository
          ./gradlew :desktopApp:publishLinuxRpmPublicationToGitHubPackagesRepository
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --draft so a human reads the notes first. TODO: actions/attest-build-provenance.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          flags=(--draft --generate-notes --verify-tag)
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/*