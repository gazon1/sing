name: autofix.ci

on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    name: autofix
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-jvm-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # ktlint is bundled into detekt via the detekt-formatting plugin, so a
      # single `--auto-correct` pass fixes both detekt findings and ktlint
      # formatting. One invocation per module: `--auto-correct` only reaches
      # the LAST detekt task of an invocation, so a task list would silently
      # correct one module and skip the rest.
      - name: Run detekt --auto-correct
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/lint-autofix.sh

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a