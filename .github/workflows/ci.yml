name: CI

# Branch protection requires ONE check: "CI gate". There are no path filters on
# purpose — a required check that is skipped by a filter stays "pending" forever,
# and a widened filter list is a list that goes stale (pro/**, infra/** and the
# root build files were already missing from the one that was there).
#
# ubuntu-24.04 is pinned deliberately; history and the exit plan live in
# docs/decisions/2026-10-05-ci-action-versions-and-runner-image-pin.md.
# Incident history for individual gates lives in their ADRs and `git log`, not here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Passed as -D on the Gradle command line, NOT via GRADLE_OPTS: GRADLE_OPTS
  # reaches the Gradle client JVM only, and worked before solely because
  # --no-daemon ran the build inside it. desktopApp's harness reads these as
  # system properties of the forked test JVM (DesktopAppHarness.kt:138-140),
  # forwarded via providers.systemProperty (desktopApp/build.gradle.kts:166-177),
  # so command-line -D is what actually reaches the tests now.
  #
  # maxAttempts is absent on main on purpose: repeat(0) skips every test body.
  RETRY_ARGS: >-
    ${{ github.event_name == 'pull_request'
    && '-Dretry.maxAttempts=2 -Dretry.failOnPassedAfterRetry=false'
    || '-Dretry.failOnPassedAfterRetry=true' }}

jobs:
  # ~1 min, no JVM, no Gradle. Runs every script gate and reports ALL of their
  # failures, not the first one.
