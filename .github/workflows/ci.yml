name: CI

on:
  push:
    branches: [main, "refactor/**"]
    paths:
      - "openspec/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "openspec/**"
      - ".github/workflows/ci.yml"
      - "scripts/check-openspec-stale.py"

jobs:
  test-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "zulu"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compute retry policy and pass to test JVMs via GRADLE_OPTS.
      # The desktopApp harness reads System.getProperty("retry.maxAttempts") directly.
      # PRs: lenient (max=2, failOnPassedAfterRetry=false).
      # main: strict (max=0, failOnPassedAfterRetry=true).
      - name: Set retry environment
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "GRADLE_OPTS=-Dretry.maxAttempts=2 -Dretry.failOnPassedAfterRetry=false" >> "$GITHUB_ENV"
          else
            echo "GRADLE_OPTS=-Dretry.maxAttempts=0 -Dretry.failOnPassedAfterRetry=true" >> "$GITHUB_ENV"
          fi

      - name: Build version catalog gate
        run: python3 scripts/build-version-catalog-gate.py --quiet .
        continue-on-error: true

      - name: Run jvmTest (fast + slow)
        run: ./gradlew :shared:jvmTest -Ptest.tags=fast,slow --no-daemon

      - name: Run desktopApp:test
        run: ./gradlew :desktopApp:test -Ptest.tags=fast,slow --no-daemon

      - name: Upload desktop failure bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-failure-bundle-${{ github.run_id }}
          path: desktopApp/build/diagnostics/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload shared failure bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-failure-bundle-${{ github.run_id }}
          path: shared/build/diagnostics/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Assemble Android debug
        run: ./gradlew :androidApp:assembleDebug --no-daemon
        continue-on-error: true

      - name: Run detekt
        run: ./gradlew :shared:detekt :desktopApp:detekt --no-daemon
        continue-on-error: true

      - name: Find unwired surfaces
        run: python3 scripts/find-unwired-surfaces.py --quiet
        # blocking: any new unwired surface is a regression

      - name: Check doc sizes
        run: python3 scripts/check-doc-sizes.py
        # blocking: AGENTS.md budget (250 lines) or DIGEST.md budget exceeded

      - name: Check dead doc references
        run: python3 scripts/check-doc-dead-refs.py
        # blocking: new dead file/symbol references in docs, skills and KDoc

      # Replaced by com.singularity.todo.arch.MaestroFlowTagsTest in :shared:jvmTest
      # (blocking — any unknown id fails the build). Retained here as a non-blocking
      # lint for ad-hoc local use; continues-on-error so it never blocks a PR.
      - name: Check Maestro test tags
        run: bash Maestro/scripts/check-tags.sh
        continue-on-error: true

  # The first job that ever *executes* a Maestro flow in CI.
  #
  # Until now nothing ran a flow: the only Maestro-related step was
  # check-tags.sh, non-blocking. That is not a theoretical gap — five flows
  # reached main with a `runFlow:` path that resolved to nothing, and
  # `dialog_confirm` was unusable from UIAutomator for the same reason nobody
  # could see. Both are only observable by running the flow on a device.
  #
  # Scope is deliberately the curated `smoke` set (~15 flows, not the ~60 in
  # the tree). Smoke is fast enough to gate a PR, and the flows that matter
  # most for "did the app still start and navigate" are in it. The heavier tags
  # (`agenda`, `regression`) stay a local gate — `just gm <tag>` — until the
  # runner cost is known.
  maestro-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "zulu"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Everything that needs the device runs inside `script:`. That input is the
      # command the action executes *while the emulator is up*, and the action
      # kills the emulator as soon as it returns — it is not a boot gate. The
      # first version of this job passed `script: Maestro/scripts/wait-for-boot.sh`,
      # so the emulator was booted, reported ready, and was then torn down before
      # the next step ran: `installDebug` failed with "No connected devices!".
      # The job had never executed, so nothing caught it.
      #
      # `wait-for-boot.sh` is kept as the first command, because the action's own
      # readiness check does not wait for the package manager.
      - name: Install the APK and run the smoke flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          # The host emulator in this project loses its device mid-run with a
          # gfxstream crash; run-maestro.sh already relaunches and retries, and
          # the job timeout above bounds the worst case.
          disable-animations: true
          # SKIP_INSTALL is deliberately NOT set: the flows must run against the
          # binary built in this job. run-maestro.sh reinstalls after a device
          # recovery for the same reason — a relaunched emulator can come back
          # holding a different build, and a green run would then prove nothing.
          script: |
            bash Maestro/scripts/wait-for-boot.sh
            ./gradlew :androidApp:installDebug --no-daemon
            TAGS=smoke MAESTRO_MAX_RETRIES=1 bash scripts/run-maestro.sh

      - name: Upload Maestro failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-failures-${{ github.run_id }}
          path: ~/.maestro/tests/**
          if-no-files-found: ignore
          retention-days: 7

  kover-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "zulu"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate kover report
        run: ./gradlew :shared:koverXmlReport --no-daemon

      - name: Upload kover XML report
        uses: actions/upload-artifact@v4
        with:
          name: kover-report
          # Kover 0.9 names this report.xml. The previous `xml-report.xml` never
          # matched anything, so the artifact was silently empty on every run.
          path: shared/build/reports/kover/report.xml

  openspec-validate:
    runs-on: ubuntu-latest
    if: "contains(github.event.head_commit.message, 'openspec') || contains(github.event.pull_request.title, 'openspec') || github.event_name == 'push' || github.event_name == 'pull_request'"
    steps:
      - uses: actions/checkout@v4
      - name: Check Node.js
        run: node --version
      - name: OpenSpec stale check (advisory)
        run: python3 scripts/check-openspec-stale.py || true
      - name: OpenSpec validate
        run: npx @fission-ai/openspec validate --all --json --strict

  mcp-server-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "zulu"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check mcp-server
        run: |
          ./gradlew :mcp-server:compileKotlin --no-daemon
          ./gradlew :mcp-server:detekt --no-daemon
          ./gradlew :mcp-server:test --no-daemon
        continue-on-error: true
