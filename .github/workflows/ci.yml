  # free and pro are two different Gradle graphs (-PwithPro), so two matrix legs.
  android:
    name: Android (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: free
            flags: ""
            tasks: ":androidApp:assembleDebug"
          # No Tracer token: proves FSL code compiles and the DI rebinding holds,
          # not that the vendor SDK works.
          - variant: pro
            flags: "-PwithPro=true"
            tasks: ":pro:detekt :androidApp:assembleDebug :pro:testDebugUnitTest"
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-jvm-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Assemble / lint / test
        run: ./gradlew --continue ${{ matrix.flags }} ${{ matrix.tasks }}

      - name: Upload debug APK (sideloadable PR build)
        if: matrix.variant == 'free'
        uses: actions/upload-artifact@v7
        with:
          name: apk-debug-${{ github.run_id }}
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3

  # The only job branch protection should require. `if: always()` is load-bearing:
  # without it this job is skipped when a leaf fails, and a skipped job reads as
  # neutral. The assertion is load-bearing too: a failed leaf leaves its siblings
  # `skipped`, so checking only for "no failures" would pass on a skipped job.
  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs: [static, tests, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done