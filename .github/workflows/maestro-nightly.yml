name: Maestro Nightly

# Runner image is pinned to ubuntu-24.04 on purpose (2026-10-05). GitHub is migrating
# the `ubuntu-latest` label to Ubuntu 26.04 between 2026-10-19 and 2026-11-19; the
# warning is silenced by pinning, which is the mitigation the runner-images notice
# recommends. 26.04 moves the kernel 6.17 -> 7.0 and systemd 255 -> 259, and the
# Android assemble plus both emulator workflows are exactly the surface that would
# notice. Reviving `ubuntu-latest` is a deliberate migration, not a cleanup — it will
# not come back on its own. See docs/decisions/2026-10-05-ci-action-versions-and-runner-image-pin.md.

# Full suite (all flows) runs nightly, sharded into 4 parallel jobs.
#
# Each shard runs 25% of the flow files; all four shards must pass.
# A failure uploads Maestro's per-flow reports for triage.
#
# maestro-cloud is not used because:
#   - Cloud polling adds ~3 min overhead per shard; Reactive Circus runner with
#     `-gpu off` avoids the gfxstream crash path entirely, so the device-recovery
#     logic that motivates cloud retry in local run-maestro.sh is not needed.
#   - At ~30 min for the full suite vs cloud-polling cycles, self-hosted runner
#     is faster and cheaper at this scale.
#
# Schedule: 02:00 UTC daily. Adjust the cron expression as needed.

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC every day

  # Manual trigger for on-demand runs. All 4 shards always run.
  workflow_dispatch:

jobs:
  # Pre-job: compute the shard split so it is done once, not repeated per shard.
  # This uses a separate lightweight job to enumerate and partition the flow files.
  compute-shards:
    runs-on: ubuntu-24.04
    outputs:
      shard1: ${{ steps.split.outputs.shard1 }}
      shard2: ${{ steps.split.outputs.shard2 }}
      shard3: ${{ steps.split.outputs.shard3 }}
      shard4: ${{ steps.split.outputs.shard4 }}
      total: ${{ steps.split.outputs.total }}
    steps:
      - uses: actions/checkout@v7
      - name: Compute 4-way shard split
        id: split
        run: |
          FLOWS=$(find Maestro/flows -name '*.yaml' -type f | sort | tr '\n' ' ')
          FLOW_COUNT=$(echo "$FLOWS" | wc -w)
          SHARD_SIZE=$(( (FLOW_COUNT + 3) / 4 ))   # ceiling division

          # Helper to extract a range of space-separated items (1-indexed)
          nth_shard() {
            local shard=$1 start=$2 end=$3
            echo "$FLOWS" | cut -d' ' -f"$start-$end" | tr ' ' '\n' | grep . || true
          }

          for i in 1 2 3 4; do
            start=$(( (i - 1) * SHARD_SIZE + 1 ))
            end=$(( i * SHARD_SIZE ))
            lines=$(nth_shard $i $start $end | tr '\n' ' ' | sed 's/ $//')
            echo "shard${i}=$lines" >> $GITHUB_OUTPUT
          done

          echo "total=$FLOW_COUNT" >> $GITHUB_OUTPUT
          echo "Flows: $FLOW_COUNT, shard size: ~$SHARD_SIZE"

  maestro-nightly:
    needs: compute-shards
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: "zulu"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon -q --configuration-cache

      - name: Start Android emulator (API 34, en-US, x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          locale: en-US
          # No on-device GPU — avoids the gfxstream ColorBuffer crash that requires
          # device-recovery loops in local run-maestro.sh.
          emulator-options: -no-snapshot -no-window -gpu off -no-audio

      - name: Wait for emulator boot
        run: adb wait-for-device shell 'while [[ -z "$(getprop sys.boot_completed)" ]]; do sleep 2; done'

      - name: Unlock emulator screen
        run: |
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell input keyevent 82

      # Each shard runs its assigned flows as a Maestro test-per-flow loop.
      # Running one flow per Maestro invocation (not one batched invocation) limits
      # the blast radius of an emulator gfxstream crash to one flow, not the whole shard.
      - name: Run shard flows
        env:
          SERIAL: ""
          SKIP_INSTALL: "1"
          SHARD_NUM: ${{ matrix.shard }}
        run: |
          # Retrieve this shard's flow list from the compute-shards job output.
          # GITHUB_OUTPUT lines are written as NAME=VALUE and become env vars.
          FLOWS_REF="shard${SHARD_NUM}"
          FLOWS="${!FLOWS_REF}"

          echo "Shard $SHARD_NUM flows:"
          echo "$FLOWS"

          PASSED=0 FAILED=0
          for flow in $FLOWS; do
            flow_name=$(basename "$flow" .yaml)
            echo "=== shard-$SHARD_NUM: $flow_name ==="
            if maestro test "$flow"; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
              echo "FAILED: $flow_name"
            fi
          done
          echo ""
          echo "=== Shard $SHARD_NUM summary: passed=$PASSED failed=$FAILED ==="
          if [[ $FAILED -gt 0 ]]; then
            echo "Some flows failed — check Maestro report artifacts."
            exit 1
          fi

      - name: Upload Maestro reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-nightly-shard-${{ matrix.shard }}-reports
          path: ~/.maestro/tests/**/2026-*/
          retention-days: 7
