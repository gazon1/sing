name: OSV-Scanner

on:
  schedule:
    - cron: "0 2 * * *"
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  osv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        continue-on-error: true