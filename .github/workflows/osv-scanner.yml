name: OSV-Scanner

on:
  schedule:
    - cron: "0 2 * * *"
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  osv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Advisory: the scanner reports vulnerabilities, it does not gate the build.
      # A finding opens an issue instead; the step name says so for the next reader.
      - name: "Advisory: OSV vulnerability scan (non-blocking)"
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        continue-on-error: true