name: Android device tests

# The instrumentation tier — `:androidApp:connectedDebugAndroidTest` — is the one
# verification surface that no CI job ran at all before this file. `docs/testing/android-tier-runbook.md`
# recorded the consequence: 16 of 32 scenario-matrix cells are holes, and the android column
# is `not-run` by normalisation rather than by measurement.
#
# Not on every pull request, and that is a decision rather than an omission. An emulator adds
# roughly ten minutes and is the flakiest part of any Android CI, so it runs on a schedule,
# on every push to main, on tags, and on demand. The cheap surfaces (static, JVM tests,
# both android compile legs) gate every PR and run in minutes.
#
#   push to main   -> instrumented tests
#   nightly cron   -> instrumented tests
#   push v*        -> instrumented tests
#   manual         -> instrumented tests
#   PR labelled `run-device-tests` -> instrumented tests
#
# Maestro flows live in e2e.yml and are deliberately not merged in here: they need a
# separate APK and a CLI install, and #150 settled that a failed nightly opens an issue
# rather than blocking a merge. This file answers the narrower question — does the app
# start, and do the Espresso assertions hold on a real device.

on:
  schedule:
    # 03:00 UTC. Different hour from e2e.yml's 02:00 so the two emulator fleets do not
    # compete for GitHub's concurrent-job budget on the same runner pool.
    - cron: "0 3 * * *"
  push:
    branches: [main]
    tags: ["v*"]
    # Run on every push to main (smoke), full on tags
  pull_request:
    types: [labeled]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Emits the build matrix in one place. Currently a single "free" APK, but when
  # Free/Pro product flavors exist this is where the matrix is expanded — a PR
  # gets Free only (fast), main/nightly gets both.
  plan:
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'run-device-tests') &&
       github.event.label.name == 'run-device-tests' &&
       github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      flavors: ${{ steps.p.outputs.flavors }}
    steps:
      - id: p
        run: |
          # PRs get free only (fast).  main/nightly/tags get both flavors when the
          # pro variant is available — this job matrix is the single control point.
          case "$GITHUB_REF" in
            refs/heads/main|refs/tags/v*)
              flavors='["free","pro"]' ;;
            *)
              flavors='["free"]' ;;
          esac
          echo "flavors=$flavors" >> "$GITHUB_OUTPUT"

  instrumented:
    needs: [plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      # Without this the emulator falls back to software emulation and takes long enough
      # to time out the job before the first test runs.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Matches every other workflow in this repository, so the JDK the DI graph is
      # validated against is the same one here. `cache-read-only` outside main: a PR must
      # not evict or poison the Gradle cache main depends on.
      - uses: ./.github/actions/setup-jvm-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Cold-booting an AVD is most of this job's runtime. The AVD is created here
      # rather than by reactivecircus/android-emulator-runner, because that action
      # owns the device's whole lifecycle: it boots the emulator inside its own
      # `script:` step and kills it the moment the step returns, which is why this
      # file could only ever ask it to *run* a command. scripts/src/emulator is the
      # repository's single device primitive — `ensure-emulator` is what every
      # local run goes through, and it carries the AVD lock, the stale-process
      # cleanup and the boot-readiness probe that the workflow had no access to.
      # The workflow's own failures were the visible symptom of that split:
      # `Test idle failed … PERSISTENT`, `adb … exit code 1`, a `default_boot`
      # snapshot that never appeared — a workflow waiting on a device whose
      # lifecycle it could not observe.
      #
      # api-level 36 matches targetSdk in gradle/libs.versions.toml (sdk-target).
      # An emulator below the app's targetSdk is a test of something nobody ships.
      - name: Install the emulator AVD
        env:
          AVD_NAME: singularity-api36
          SYSTEM_IMAGE: system-images;android-36;google_apis;x86_64
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          cmdline="$(dirname "$(find "$sdk_root/cmdline-tools" -name sdkmanager -type f | sort | tail -1)")"
          echo "cmdline-tools: $cmdline"
          yes | "$cmdline/sdkmanager" --licenses >/dev/null || true
          "$cmdline/sdkmanager" "$SYSTEM_IMAGE"
          # `device pixel_6` rather than the runner's default: a hardware profile
          # with a real screen size, so an Espresso assertion about a view being
          # on screen is not decided by a 240x320 profile.
          echo no | "$cmdline/avdmanager" create avd \
            --force --name "$AVD_NAME" --package "$SYSTEM_IMAGE" --device pixel_6
          # `ensure-emulator` launches the `emulator` binary and talks to `adb`,
          # both of which live in the SDK and neither of which is on PATH here.
          # One grouped redirect, not three: shellcheck SC2129 reads three
          # separate appends as three chances to lose a line silently.
          {
            echo "$sdk_root/emulator"
            echo "$sdk_root/platform-tools"
            echo "$sdk_root/build-tools/37.0.0"
          } >> "$GITHUB_PATH"

          # Assert the two things the next step silently depends on. A missing
          # `emulator` binary is reported by `ensure-emulator` as exit 1 with
          # "'emulator' binary not found in PATH" and an AVD that was never
          # created is reported as a crash during start-up — both about a minute
          # into a 15-minute job, and neither naming this step. Checked here
          # instead, where the answer is immediate and specific.
          test -x "$sdk_root/emulator/emulator" \
            || { echo "::error::no emulator binary at $sdk_root/emulator/emulator"; exit 1; }
          "$cmdline/avdmanager" list avd | grep -q "Name: $AVD_NAME" \
            || { echo "::error::AVD $AVD_NAME was not created"; exit 1; }
          echo "emulator: $sdk_root/emulator/emulator, AVD: $AVD_NAME"

      # loguru, pydantic and click — the emulator module's own dependencies. The
      # same action the static job uses, with the two linters it installs turned
      # off: they are this repository's gates, not the emulator's, and this job
      # runs none of them.
      - name: Set up the Python tooling
        uses: ./.github/actions/setup-python-tools
        with:
          with-yaml-lint: 'false'
          with-action-lint: 'false'

      # `buildTimeSupabaseConfig()` reads BuildConfig.SUPABASE_URL / ANON_KEY via
      # reflection and returns non-null only when both are set; without them the app
      # opens on an auth screen that cannot initialise an anonymous session, and no
      # UI assertion below can reach the shell it is about. Same placeholder block
      # e2e.yml writes — these values are not credentials, and anonymous sign-in
      # works offline without a server.
      - name: Create local.properties with Supabase credentials
        run: |
          cat > local.properties << 'EOF'
          supabase.url=https://placeholder.supabase.co
          supabase.anonKey=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsYWNlaG9sZGVyIiwicm9sZSI6ImFub255bW91cyIsImlhdCI6MTY0MDEwMTAwMDAsImV4cCI6MTk1NTY3NTAwMDB9.placeholder
          EOF

      # The whole device lifecycle is inside one command: acquire (booting the AVD
      # if nothing is ready), build, verify the APK is this checkout's, run
      # `:androidApp:connectedDebugAndroidTest`, and refuse to call it a pass if
      # zero tests executed.
      #
      # `GRADLE_ARGS=-PTEST_AUTH_BYPASS=true` is not an optimisation. Without it
      # `SingularityApp` installs the real auth repository, MainActivity lands on
      # the sign-in screen, and `NavigationSmokeTest.app_launches_and_all_tabs_are_reachable`
      # fails with "Today tab should be visible after cold start" — a message about
      # the shell, caused by a screen in front of it. Measured locally on
      # 2026-10-16: 3 of the 3 UI classes fail that way.
      #
      # `-gpu swiftshader_indirect`, not `-gpu off`: e2e.yml uses `-gpu off` and
      # gets away with it because Maestro drives the UI through the accessibility
      # layer and never composites. These assertions look for a real ComposeView in
      # the view hierarchy, and software rendering is the configuration GitHub's
      # runner images support. ADR 2026-09-28-emulator-gfxstream-colorbuffer-segv
      # records the crash that pinning `-gpu` invites; software rendering is the
      # supported answer, not a flag to tune.
      - name: Instrumented tests
        env:
          AVD: singularity-api36
          GRADLE_ARGS: -PTEST_AUTH_BYPASS=true
          EMULATOR_EXTRA_FLAGS: >-
            -no-window -gpu swiftshader_indirect -no-audio
            -prop persist.sys.locale=ru-RU
          # The AVD was cold-created in the step above, so its boot budget is the
          # image download's absence, not a warm snapshot's presence. 600s is the
          # ceiling; `start_avd` returns EXIT_TIMEOUT the moment it is reached,
          # rather than letting the job's own timeout kill the runner mid-boot and
          # lose the emulator log.
          EMULATOR_TIMEOUT: 600
        run: python3 scripts/run-android-ui-tests.py

      # Uploaded unconditionally, not `if: failure()`. A report that exists only when
      # something broke cannot answer "did NavigationFlowInstrumentedTest pass on abc1234",
      # which is the question a nightly run gets asked the next morning.
      - name: Upload instrumentation reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-instrumentation-reports-${{ github.run_id }}
          path: |
            androidApp/build/reports/androidTests/
            androidApp/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14

      # Logcat from the instrumentation run, written by run-android-ui-tests.py when
      # the tests fail or report zero executions. Contains the ANR and crash traces
      # that a test process which hangs cannot write to its own report.
      - name: Upload failure logcat
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-failure-logcat-${{ github.run_id }}
          path: build/android-ui-results/logcat.txt
          if-no-files-found: warn
          retention-days: 14

      # A nightly that nobody reads is not a gate, it is a scrollback buffer. The nightly
      # Maestro failure opens an issue (e2e.yml); this one does the same.
      #
      # The "zero tests executed" case needs no step here: connectedDebugAndroidTest
      # exits 0 when the app under test died before the first assertion, so the check
      # lived in run-android-ui-tests.py, where the report is parsed, rather than in a
      # second shell implementation of the same rule that could drift from it.
      - name: Open an issue when a nightly fails
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue create \
            --title "Nightly Android instrumentation failed ($(date -u +%F))" \
            --body "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"