name: Reusable AVD Setup

# Shared workflow for AVD installation used by e2e.yml and android-device-tests.yml.
# Sets up KVM, installs system image, creates AVD, and configures PATH.

on:
  workflow_call:
    inputs:
      avd_name:
        required: true
        type: string
        description: "AVD name (e.g. singularity-api36)"
      system_image:
        required: true
        type: string
        description: "System image package (e.g. system-images;android-36;google_apis;x86_64)"
      device:
        required: false
        type: string
        default: pixel_6
        description: "Hardware profile for AVD (default: pixel_6)"
    # A caller that invokes this as a reusable workflow reads its results through
    # `needs.<job>.outputs.*`, which is populated only from what this block declares.
    # Without it the caller's `needs.setup-avd.outputs.sdk_root` resolves to an empty
    # string and the emulator job runs with no SDK on PATH — a silent failure that
    # looks like a flaky boot rather than a missing declaration.
    outputs:
      avd_name:
        description: "Name of the AVD that was created or restored"
        value: ${{ jobs.setup-avd.outputs.avd_name }}
      android_avd_home:
        description: "Directory holding the AVD ini, for ANDROID_AVD_HOME"
        value: ${{ jobs.setup-avd.outputs.android_avd_home }}
      sdk_root:
        description: "Android SDK root containing emulator/ and platform-tools/"
        value: ${{ jobs.setup-avd.outputs.sdk_root }}
      system_image:
        description: "System image actually set up, echoed so callers can key the cache"
        value: ${{ jobs.setup-avd.outputs.system_image }}
      device:
        description: "Hardware profile the AVD was created with, so a consumer can recreate it"
        value: ${{ jobs.setup-avd.outputs.device }}
      cache_key:
        description: "The full cache key this workflow writes — consumers restore this key verbatim"
        value: ${{ jobs.setup-avd.outputs.cache_key }}
      cache_key_prefix:
        description: "Prefix of the cache key, for consumers' restore-keys fallback"
        value: ${{ jobs.setup-avd.outputs.cache_key_prefix }}

jobs:
  setup-avd:
    runs-on: ubuntu-24.04
    outputs:
      avd_name: ${{ steps.setup.outputs.AVD_NAME }}
      android_avd_home: ${{ steps.setup.outputs.ANDROID_AVD_HOME }}
      sdk_root: ${{ steps.ctx.outputs.sdk_root }}
      system_image: ${{ inputs.system_image }}
      device: ${{ inputs.device }}
      cache_key: ${{ steps.ctx.outputs.cache_key }}
      cache_key_prefix: ${{ steps.ctx.outputs.cache_key_prefix }}
    steps:
      # The provisioning logic lives in scripts/ci/provision-avd.sh so that the
      # producer and the consumers run the same code. It used to be inline here,
      # and the consumers had their own idea of what "provisioned" meant — which
      # is how the emulator binary went missing in one job while another job was
      # installing it.
      - uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # One place resolves the SDK root and builds the cache key. The callers
      # restore `needs.setup-avd.outputs.cache_key` verbatim instead of
      # re-assembling the key, and the cache paths are absolute paths under that
      # same root.
      #
      # The paths used to be `${{ env.ANDROID_HOME }}/…`, and the `env` context
      # does not contain the runner's own environment variables — so the list
      # expanded to `/system-images`, `/emulator` and `/platform-tools` at the
      # filesystem root. The cache was therefore saving and restoring nothing,
      # and the entry it left behind (1659 bytes) is what the next run found and
      # accepted as a hit. A cache hit means "do not save", so the empty entry
      # was permanent: every consumer restored an empty directory and every
      # shard died with "'emulator' binary not found in PATH".
      #
      # The version suffix in the key retires entries written under an older
      # layout. Bump it whenever the set of cached paths changes; an entry
      # written under an older layout cannot be repaired in place, because
      # cache keys are immutable. `v3` drops the AVD from the cached paths —
      # `v2` carried it and it did not survive the cache (see the cache step).
      - name: Resolve the SDK root and the cache key
        id: ctx
        env:
          AVD_NAME: ${{ inputs.avd_name }}
          SYSTEM_IMAGE: ${{ inputs.system_image }}
          DEVICE: ${{ inputs.device }}
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ ! -d "$sdk_root" ]; then
            echo "::error::no Android SDK at $sdk_root (ANDROID_SDK_ROOT and ANDROID_HOME are unset or wrong)"
            exit 1
          fi
          echo "sdk_root=$sdk_root" >> "$GITHUB_OUTPUT"
          # One grouped redirect (SC2129): separate appends to the same file
          # re-open it once per line, which is what shellcheck rejects.
          #
          # The prefix carries the version too, and that is deliberate. A
          # restore-key is a *prefix* match, so a prefix of `…-v2` also matches
          # `…-v20`, and — worse — a prefix without the version matches the
          # entries written under the old layout, which is exactly the trap
          # this key version exists to close. A consumer that finds nothing
          # restores nothing and provisions for itself.
          {
            echo "cache_key=avd-${AVD_NAME}-${DEVICE}-${SYSTEM_IMAGE}-v4"
            echo "cache_key_prefix=avd-${AVD_NAME}-${DEVICE}-${SYSTEM_IMAGE}-v4-"
          } >> "$GITHUB_OUTPUT"

      - name: Restore AVD and SDK cache
        id: cache-avd
        uses: actions/cache@v6
        with:
          # The cache is the transport that carries this work to the caller jobs:
          # GitHub runners do not share a filesystem, so everything created here
          # evaporates when the job ends. `needs.setup-avd.outputs.*` carries path
          # *strings*, not state.
          #
          # It is an optimisation and not a guarantee. A cache entry can be
          # evicted, and the consumers re-provision with
          # scripts/ci/provision-avd.sh when the entry is not there — so a
          # missing cache costs time, not a red build.
          # Only the immutable SDK content travels. The AVD does not: its
          # `userdata.img` is a sparse, mutable image, and it did not survive
          # the cache anyway — the first consumer of the v2 entry found the
          # emulator and the system image installed (sdkmanager had nothing to
          # download) and still had to create the AVD itself, in half a second.
          # Carrying a mutable image between runners was never working; what it
          # did do was make the entry look like it carried the AVD.
          #
          # The AVD is created where it is used, by scripts/ci/provision-avd.sh.
          #
          # `platform-tools` is not among them: the runner image ships it, and
          # the image's copy is root-owned, so restoring over it made tar fail
          # with "Cannot utime: Operation not permitted" on a directory the
          # runner user cannot chmod. The files extracted and adb worked, but a
          # cache that cannot be restored cleanly is a cache that reports a
          # failure nobody can act on. The image provides it; the cache does not
          # need to.
          path: |
            ${{ steps.ctx.outputs.sdk_root }}/system-images
            ${{ steps.ctx.outputs.sdk_root }}/emulator
          key: ${{ steps.ctx.outputs.cache_key }}
          restore-keys: |
            ${{ steps.ctx.outputs.cache_key_prefix }}

      - name: Install the emulator and create the AVD
        id: setup
        env:
          AVD_NAME: ${{ inputs.avd_name }}
          SYSTEM_IMAGE: ${{ inputs.system_image }}
          DEVICE: ${{ inputs.device }}
          SDK_ROOT: ${{ steps.ctx.outputs.sdk_root }}
        run: |
          set -euo pipefail
          # Pin ANDROID_AVD_HOME *before* anything creates an AVD, so the location
          # is a fact of this workflow rather than something discovered afterwards.
          # The runner image puts the AVD under ~/.config/.android/avd, and
          # avdmanager honours ANDROID_AVD_HOME — so setting it first is what
          # makes the producer and the consumers agree on where the AVD lives.
          # The AVD is created where it is used: the cache carries the SDK, and
          # scripts/ci/provision-avd.sh creates the AVD on each runner.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_OUTPUT"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"

          bash scripts/ci/provision-avd.sh

          # Put emulator and platform-tools on PATH for subsequent steps.
          {
            echo "$SDK_ROOT/emulator"
            echo "$SDK_ROOT/platform-tools"
            echo "$SDK_ROOT/build-tools/37.0.0"
          } >> "$GITHUB_PATH"

          echo "AVD_NAME=$AVD_NAME" >> "$GITHUB_OUTPUT"
          echo "emulator: $SDK_ROOT/emulator/emulator, AVD $AVD_NAME in $ANDROID_AVD_HOME"
