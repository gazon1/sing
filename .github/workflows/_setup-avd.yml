name: Reusable AVD Setup

# Shared workflow for AVD installation used by e2e.yml and android-device-tests.yml.
# Sets up KVM, installs system image, creates AVD, and configures PATH.

on:
  workflow_call:
    inputs:
      avd_name:
        required: true
        type: string
        description: "AVD name (e.g. singularity-api36)"
      system_image:
        required: true
        type: string
        description: "System image package (e.g. system-images;android-36;google_apis;x86_64)"
      device:
        required: false
        type: string
        default: pixel_6
        description: "Hardware profile for AVD (default: pixel_6)"
      cache_key:
        required: false
        type: string
        default: ""
        description: "Custom cache key suffix; defaults to avd_name for cache invalidation"
    # A caller that invokes this as a reusable workflow reads its results through
    # `needs.<job>.outputs.*`, which is populated only from what this block declares.
    # Without it the caller's `needs.setup-avd.outputs.sdk_root` resolves to an empty
    # string and the emulator job runs with no SDK on PATH — a silent failure that
    # looks like a flaky boot rather than a missing declaration.
    outputs:
      avd_name:
        description: "Name of the AVD that was created or restored"
        value: ${{ jobs.setup-avd.outputs.avd_name }}
      android_avd_home:
        description: "Directory holding the AVD ini, for ANDROID_AVD_HOME"
        value: ${{ jobs.setup-avd.outputs.android_avd_home }}
      sdk_root:
        description: "Android SDK root containing emulator/ and platform-tools/"
        value: ${{ jobs.setup-avd.outputs.sdk_root }}
      system_image:
        description: "System image actually set up, echoed so callers can key the cache"
        value: ${{ jobs.setup-avd.outputs.system_image }}
      cache_key:
        description: "Cache key actually used, so callers restore exactly what was written"
        value: ${{ jobs.setup-avd.outputs.cache_key }}

jobs:
  setup-avd:
    runs-on: ubuntu-24.04
    outputs:
      avd_name: ${{ steps.setup.outputs.AVD_NAME }}
      android_avd_home: ${{ steps.setup.outputs.ANDROID_AVD_HOME }}
      sdk_root: ${{ steps.setup.outputs.SDK_ROOT }}
      system_image: ${{ inputs.system_image }}
      cache_key: ${{ inputs.cache_key }}
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore AVD and SDK cache
        id: cache-avd
        uses: actions/cache@v4
        with:
          # The cache is the ONLY thing that carries this work to the caller jobs:
          # GitHub runners do not share a filesystem, so everything created here
          # evaporates when the job ends. `needs.setup-avd.outputs.*` carries path
          # *strings*, not state — before this job cached the emulator, the Maestro
          # shard ran on a runner where `/usr/local/lib/android/sdk/emulator` simply
          # did not exist and `_emulator_binary_available()` reported "emulator
          # binary not found in PATH" while this job had executed that exact binary
          # moments earlier. Caller jobs restore these same four paths under the
          # same key; the path list and the key must stay identical in
          # e2e.yml and android-device-tests.yml.
          path: |
            ~/.android/avd
            ${{ env.ANDROID_HOME }}/system-images
            ${{ env.ANDROID_HOME }}/emulator
            ${{ env.ANDROID_HOME }}/platform-tools
          key: avd-${{ inputs.avd_name }}-${{ inputs.system_image }}-${{ inputs.cache_key }}
          restore-keys: |
            avd-${{ inputs.avd_name }}-${{ inputs.system_image }}-
            avd-${{ inputs.avd_name }}-

      - name: Install AVD
        id: setup
        env:
          AVD_NAME: ${{ inputs.avd_name }}
          SYSTEM_IMAGE: ${{ inputs.system_image }}
          DEVICE: ${{ inputs.device }}
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK_ROOT=$sdk_root" >> "$GITHUB_OUTPUT"

          # Pin ANDROID_AVD_HOME *before* anything creates an AVD, so the location
          # is a fact of this workflow rather than something discovered afterwards.
          # The runner image put the AVD under ~/.config/.android/avd while the
          # cache and the cache-hit check both assumed ~/.android/avd, so the cache
          # was saving an empty directory and the "already exists" branch could never
          # be taken — the AVD was recreated every run and handed to the caller as a
          # path pointing at nothing. avdmanager honours ANDROID_AVD_HOME, so
          # setting it first makes both sides agree by construction.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_OUTPUT"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"

          cmdline="$(dirname "$(find "$sdk_root/cmdline-tools" -name sdkmanager -type f | sort | tail -1)")"
          echo "cmdline-tools: $cmdline"

          yes | "$cmdline/sdkmanager" --licenses >/dev/null 2>&1 || true

          # Every package this workflow's contract depends on, named. This used to
          # install only "$SYSTEM_IMAGE" and rely on sdkmanager pulling the emulator
          # in as a transitive dependency — which it does, so the bug was invisible
          # here and only appeared as a missing binary in the caller job. A
          # requirement that depends on someone else's side effect is not a
          # requirement; it is a coincidence waiting for a sdkmanager version bump.
          "$cmdline/sdkmanager" "emulator" "platform-tools" "$SYSTEM_IMAGE"

          # Create AVD only if cache miss (restore-existing=true skips recreation)
          avd_dir="$ANDROID_AVD_HOME/${AVD_NAME}.avd"
          if [ ! -d "$avd_dir" ] || [ ! -f "$avd_dir/userdata.img" ]; then
            echo "Creating AVD $AVD_NAME (cache miss)"
            echo no | "$cmdline/avdmanager" create avd \
              --force --name "$AVD_NAME" --package "$SYSTEM_IMAGE" --device "$DEVICE"
          else
            echo "AVD $AVD_NAME already exists (cache hit)"
          fi

          # Put emulator and platform-tools on PATH for subsequent steps.
          {
            echo "$sdk_root/emulator"
            echo "$sdk_root/platform-tools"
            echo "$sdk_root/build-tools/37.0.0"
          } >> "$GITHUB_PATH"

          # Verify emulator binary exists.
          test -x "$sdk_root/emulator/emulator" \
            || { echo "::error::no emulator binary at $sdk_root/emulator/emulator"; exit 1; }

          # Verify the AVD is visible to the emulator binary. ANDROID_AVD_HOME is
          # exported above, so this sees the directory the AVD was actually written
          # to — no searching for the .ini and hoping the result is the one the
          # emulator would consult.
          "$sdk_root/emulator/emulator" -list-avds | grep -qx "$AVD_NAME" \
            || { echo "::error::emulator -list-avds does not list $AVD_NAME"; exit 1; }
          echo "AVD_NAME=$AVD_NAME" >> "$GITHUB_OUTPUT"
          echo "emulator: $sdk_root/emulator/emulator, AVD $AVD_NAME in $ANDROID_AVD_HOME"
