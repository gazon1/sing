# CodeQL analysis for the Kotlin/Java sources.
#
# Adapted from the official template:
#   https://github.com/actions/starter-workflows/blob/main/code-scanning/codeql.yml
# The template is the maintained one; this file is that file with the
# placeholders (`$default-branch`, `$protected-branches`, `$cron-weekly`,
# `$codeql-languages-matrix`) resolved and the decisions below written down.
#
# What is ready-made here: the analysis itself, the SARIF upload, and the
# permission set. What is this repository's: the language, the build command,
# the schedule slot, and the trigger set.
name: "CodeQL"

on:
  push:
    branches: [ main ]
  schedule:
    # Daily crons 01:00–04:00 UTC are taken by ci.yml, e2e.yml,
    # android-device-tests.yml and flake.yml. This one runs after them, on
    # Mondays, so a security scan never competes with the nightly chain.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  # read-only at the workflow level: the one job below asks for what it needs.
  contents: read

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      # required for the SARIF upload
      security-events: write
      # required to fetch internal or private CodeQL packs
      packages: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [ java-kotlin ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The same setup every other job uses: JDK 21 (the toolchain
      # `shared/build.gradle.kts` pins with `jvmToolchain(21)`) and the
      # Gradle cache. Reusing the repository's own action keeps the JDK and
      # the cache policy in one place.
      - name: Set up JVM + Gradle
        uses: ./.github/actions/setup-jvm-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # `manual`, not `none` and not `autobuild`.
          #
          # `none` was tried first and failed on this repository: the Java/Kotlin
          # extractor found the code and processed none of it — "CodeQL detected
          # code written in Java/Kotlin but could not process any of it using the
          # 'none' build mode". The sources live in `src/commonMain/kotlin` and
          # `src/jvmMain/kotlin`, not in the `src/main/java` layout the no-build
          # mode looks for, so it had nothing to extract.
          #
          # `autobuild` would run `./gradlew build` — the whole project, tests
          # and detekt included, which is a second copy of the test pipeline in
          # a job that exists to read the code.
          #
          # `manual` builds exactly the two modules that hold the app's Kotlin
          # code, with the task name the repository already proves in CI. The
          # extractor sees the compiled classes and maps them back to sources.
          build-mode: manual

      - name: Build the Kotlin sources
        # `--no-build-cache` is load-bearing. Gradle restored the compile tasks
        # from its build cache ("FROM-CACHE") and never ran the compiler, so the
        # extractor traced a build in which nothing was compiled and reported
        # "this run didn't build any of it". The scanner needs to watch the
        # compilation happen, not the class files appear.
        run: ./gradlew --no-build-cache :shared:compileKotlinJvm :core-base:compileKotlinJvm

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
