name: agnix (advisory)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  agnix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install agnix
        run: cargo install agnix --locked --version 0.9.0
      - name: Lint agent config
        run: agnix . || true
        continue-on-error: true