name: Maestro Smoke

# Smoke suite on every PR that opts in with the `run-maestro` label.
# Also available as workflow_dispatch for manual runs.
#
# Runs the `smoke` tag subset (6 flows) against a freshly-booted Android 34
# emulator on GCP's Reactive Circus runner. The emulator image has no Play Store
# and is headless (no on-device GPU), which avoids the host Mesa/gfxstream crash
# that the local development scripts work around with device recovery loops.
#
# maestro (1.x) upload is not used here because the smoke suite is fast enough
# (~5 min) to run synchronously in a CI job and the upload+cloud-polling round-
# trip costs more time than it saves at this scale.

on:
  workflow_dispatch:
    inputs:
      serial:
        description: "Device serial (optional, auto-detected if omitted)"
        required: false
        type: string
      skip_install:
        description: "Skip APK install (1 = reuse already-installed APK)"
        required: false
        type: string
        default: "0"

  pull_request:
    types: [labeled]

jobs:
  maestro-smoke:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-maestro')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "zulu"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon -q

      - name: Start Android emulator (API 34, en-US, x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          locale: en-US
          # No on-device GPU — avoids the gfxstream ColorBuffer crash that requires
          # device-recovery loops in local run-maestro.sh.
          # headless mode keeps CI VM load predictable.
          emulator-options: -no-snapshot -no-window -gpu off -no-audio

      - name: Wait for emulator boot
        run: adb wait-for-device shell 'while [[ -z "$(getprop sys.boot_completed)" ]]; do sleep 2; done'

      - name: Unlock emulator screen
        # KEYCODE_WAKEUP + KEYCODE_MENU (82) unlocks the default non-PIN lock screen.
        run: |
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell input keyevent 82

      - name: Run smoke flows
        env:
          TAGS: smoke
          SERIAL: ${{ github.event.inputs.serial || '' }}
          SKIP_INSTALL: ${{ github.event.inputs.skip_install || '0' }}
        run: bash scripts/run-maestro.sh

      - name: Upload Maestro reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-smoke-reports
          path: ~/.maestro/tests/**/2026-*/
          retention-days: 7
          # Glob pattern: per-run Maestro stores reports under
          # ~/.maestro/tests/<timestamp>/ — each flow gets its own subdirectory.
          # The **/2026-*/ prefix picks up the most recent run folder.
          # If no failure occurred the directory may be empty or absent — that's fine.
