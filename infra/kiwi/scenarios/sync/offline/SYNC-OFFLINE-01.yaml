# Scenario specification for SYNC-OFFLINE-01.
#
# A user scenario from the auth/sync test plan (the project's auth & sync
# test plan, §7, flow UX-F). Linkage to automation is *not*
# here — it lives in code (@DisplayName for Kotlin, a `scenario:SYNC-OFFLINE-01` Maestro tag).
#
# The plan states that screen names are provisional: the steps and the checks stand
# even if the screen is arranged differently, and only the locators change. This spec
# records the behaviour, not the layout, so that a redesign does not invalidate it.

id: SYNC-OFFLINE-01
title: Work with no network and watch the queue drain
priority: P1
status: confirmed
targets: [android, desktop]

# Claimed on both tiers and reachable on neither. The hole is real and
# counted; what this records is *what kind* of supply it needs, so the
# next agent does not read `○` as "write a Compose test" and burn a
# probe on a scenario no single-device harness can express.
# Needs the network switched off and restored repeatedly, and the check
# is about a *second* device not duplicating tasks. Neither a JVM Compose
# test nor a single-device Maestro run can observe a second device, so the
# supply here is a device farm or a manual run — not a test to write.
unreachable: [android, desktop]
preconditions: A signed-in device with a non-empty account.
steps:
  - Turn the network off and create three tasks, change two, and delete one.
  - Restart the app while still offline.
  - Restore the network and repeat with a connection that comes and goes every few seconds.
expected: >-
  The indicator shows how many changes are waiting, and the count survives a restart. Restoring the network drains it to zero. A flapping connection produces no flicker and no duplicated task on the second device.
