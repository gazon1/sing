# Scenario specification for TASK-TIME-01.
#
# Claims both targets, and the earlier `targets: [android]` was wrong.
#
# History, because the wrong version reads as careful work. On 2026-10-05 a
# reachability probe found no time-tracking node on the desktop task detail and
# the spec was narrowed to Android, with a comment explaining that the UI was
# Android-only. The probe was right and the conclusion drawn from it was not.
#
# What the probe actually showed was that the two platform graphs routed
# `TasksRoute.Detail` to two different screens: Android to `TaskDetailViewScreen`,
# the pre-refactor monolith, and the JVM graph to `TaskDetailScreen`, the
# post-refactor content shell that renders `extraSections = null`. The whole
# time-tracking feature is in `commonMain` — ten files including the repository
# and its fake — so nothing about it is platform-specific, and "the UI only
# exists on Android" was a statement about a merge rather than about a platform.
#
# The divergence came from `f2a87c7c` (merge of `refactor/time-hub-ai-proposals`),
# which took the branch's older Android graph over the phase-4 refactor
# (`adc95585`) on Android only. The result was two-way: Android lost the pinned,
# project and start-date fields that the refactor had added, and desktop lost
# time tracking, subtasks, first-run and AI proposals. Fixed by merging the two
# compositions into `TaskDetailContent` and pointing both graphs at
# `TaskDetailScreen`; `TaskDetailViewScreen` is deleted.
#
# The lesson is recorded in the kiwi skill: a failed probe measures the code in
# front of it, not the platform. Before narrowing a spec to one target, ask
# whether the feature lives in `commonMain` — if it does, a missing node is a
# hole in the code, and narrowing the spec makes it correct against code that is
# wrong.

id: TASK-TIME-01
title: Start a timer on a task from its detail view
area: feature.tasks
priority: P1
status: confirmed
targets: [android, desktop]
preconditions: >-
  A task exists, the app is signed in, and the task's detail view is open.
steps:
  - Open a task and scroll to the time-tracking section.
  - Start the timer.
  - Stop it again.
expected: >-
  The chip swaps between "Start" and "Stop" in place, and the elapsed total for
  that task grows while the timer runs.

# The desktop cell is now a hole with a supply, like the Android one. What does
# not exist any more is the reason it was unclaimed: there is no platform left
# to narrow to, so this row is an ordinary carrier backlog item and nothing more
# interesting than that.
#
# The start/stop chips carry no `testTag` yet. They had been added for a desktop
# carrier that the probe ruled out and were removed again; the ruling-out was
# wrong, so the tags are the price of the wrong conclusion and go back with the
# carrier. `just trace-carrier TASK-TIME-01` writes the probe that finds them.
