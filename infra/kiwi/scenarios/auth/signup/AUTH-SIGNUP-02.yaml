# Scenario specification for AUTH-SIGNUP-02.
#
# A user scenario from the auth/sync test plan (`/home/max/Downloads/Тест-план_
# авторизация и синхронизация.md`, §7, flow UX-B.6). Linkage to automation is *not*
# here — it lives in code (@DisplayName for Kotlin, a `scenario:AUTH-SIGNUP-02` Maestro tag).
#
# The plan states that screen names are provisional: the steps and the checks stand
# even if the screen is arranged differently, and only the locators change. This spec
# records the behaviour, not the layout, so that a redesign does not invalidate it.

id: AUTH-SIGNUP-02
title: A sign-up whose address still needs confirmation is not a completed sign-up
priority: P1
status: confirmed
targets: [android, desktop]
preconditions: The provider creates the account but requires the address to be confirmed before it can be used.
steps:
  - Create an account with a valid address.
  - Wait for the outcome.
expected: >-
  The user is told the account was created and to check their mail. They are NOT taken into the application as a signed-in user, and the outcome is not presented as a failure — a retry would be refused as an address already in use.
