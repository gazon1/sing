# Scenario specification for AUTH-SESSION-01.
#
# A user scenario from the auth/sync test plan (`/home/max/Downloads/Тест-план_
# авторизация и синхронизация.md`, §7, flow UX-J). Linkage to automation is *not*
# here — it lives in code (@DisplayName for Kotlin, a `scenario:AUTH-SESSION-01` Maestro tag).
#
# The plan states that screen names are provisional: the steps and the checks stand
# even if the screen is arranged differently, and only the locators change. This spec
# records the behaviour, not the layout, so that a redesign does not invalidate it.

id: AUTH-SESSION-01
title: Carry on working after the session stops being valid
priority: P1
status: confirmed
targets: [android, desktop]
preconditions: A signed-in device whose session is no longer accepted by the server.
steps:
  - Work in the app.
  - Wait for a sync attempt.
  - Sign in again, or choose to stay signed out.
expected: >-
  The app keeps working locally. An unobtrusive message says signing in again is needed, without blocking an editor. Signing in again sends the queued changes, and the edits made in between are not lost.
