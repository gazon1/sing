# Scenario specification for AUTH-SIGNIN-01.
#
# A user scenario from the auth/sync test plan (`/home/max/Downloads/Тест-план_
# авторизация и синхронизация.md`, §7, flow UX-C). Linkage to automation is *not*
# here — it lives in code (@DisplayName for Kotlin, a `scenario:AUTH-SIGNIN-01` Maestro tag).
#
# The plan states that screen names are provisional: the steps and the checks stand
# even if the screen is arranged differently, and only the locators change. This spec
# records the behaviour, not the layout, so that a redesign does not invalidate it.

id: AUTH-SIGNIN-01
title: Sign in to an existing account
priority: P1
status: confirmed
targets: [android, desktop]
preconditions: An account exists and the user is on the sign-in screen.
steps:
  - Enter a wrong password.
  - Enter the correct password.
expected: >-
  A wrong password gives one message that does not reveal whether the address exists, and the address stays in the form. A correct password shows a pending state and then enters the application, with the account's data arriving shortly afterwards.
