[versions]
# Kotlin / Build
agp = "9.4.1"
kotlin = "2.4.10"
ksp = "2.3.12"
kotlin-serialization = "1.11.0"

# Android SDK — "android" prefix avoided: library keys like androidx-android-* would shadow
# the version accessor. Using "sdk" prefix so accessor is libs.versions.sdk.compile.
sdk-compile = "37"
sdk-min = "26"
sdk-target = "36"

androidx-activity = "1.13.0"
androidx-appcompat = "1.8.0"
androidx-core = "1.19.0"
androidx-espresso = "3.7.0"
androidx-uiautomator = "2.3.0"
androidx-lifecycle = "2.8.0"
androidx-testExt = "1.3.0"

# Compose
composeMultiplatform = "1.12.0"
# Material3 — alpha; stable channel should be used when available
material3 = "1.12.0-alpha03"

# Coroutines / DateTime
coroutines = "1.11.0"
datetime = "0.8.0"

# Database / SQLDelight
postgrestKt = "3.8.0"
room = "3.0.0"
sqlite = "2.7.0"
sqliteJdbc = "3.47.0.0"

# Networking / Ktor
ktor = "3.5.2"

# DI / Koin
koin = "4.2.2"
koin-annotations = "4.2.2"
koin-compiler-plugin = "1.2.1"

# Persistence / DataStore
datastore = "1.2.1"

# WorkManager (Android background jobs)
androidx-work = "2.10.0"

# Logging / Kermit
kermit = "2.1.0"

# AppTracer (ru.ok.tracer) — crash / ANR / non-fatal reporting, Android only.
# BOM-aligned: modules below carry no version of their own.
tracer = "1.4.0"

# Markdown
markdown-renderer = "0.43.0"

# AI / OpenAI
openai-client = "4.1.0"

# Theme / MaterialKolor
# 5.0.1 is built against Compose Multiplatform 1.12.0 + material3 1.12.0-alpha03,
# which matches this project exactly.
materialkolor = "5.0.1"

# Navigation 3 (KMP multiplatform)
nav3 = "1.1.1"
nav3-lifecycle-vm = "2.11.0"

# Supabase
supabase = "3.8.0"

# Okio — for FileLogWriter rolling file logs (Square, KMP-native)
okio = "3.10.0"

# Utils
turbine = "1.2.0"
# atomicfu — aligned via resolutionStrategy when transitive conflict occurs
atomicfu = "0.23.1"
# kotlinx-collections-immutable — transitive from markdown-renderer:0.43.0
kotlinxCollectionsImmutable = "0.5.0"

# FileKit
filekit = "0.15.0"

# Rich Text Editor
rich-editor = "1.2.0"

# Security
security-crypto = "1.1.0-alpha06"

# Play In-App Updates
play-app-update = "2.1.0"

# AI Agent Framework (JetBrains Koog)
koog = "1.1.1"

# Coil
coil = "3.6.1"

# Testing
junit = "4.13.2"
junit-jupiter = "5.11.4"
junit-jupiter-params = "5.11.4"
junit-vintage-engine = "5.11.4"
robolectric = "4.17-beta-4"
kotest-assertions = "5.9.1"
konsist = "0.17.3"

# Lint / Quality tools
detekt = "2.0.0-alpha.6"
kover = "0.9.9"

# MCP server
kotlinSdk = "0.15.0"
kotlinxIo = "0.9.1"

[libraries]
# Kotlin / Build
jvm-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
jvm-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-debug = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-debug", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlin-serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }

# Android
	junit4 = { module = "junit:junit", version.ref = "junit" }
	junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junit-vintage-engine" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit-jupiter-params" }
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidx-uiautomator" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }

# Lifecycle
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }

# Compose
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-material = { module = "org.jetbrains.compose.material:material", version.ref = "composeMultiplatform" }
compose-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version = "1.7.3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
# Desktop-only: provides LocalAwtWindow for AwtMenuBarInstaller.
compose-ui-desktop = { module = "org.jetbrains.compose.ui:ui-desktop", version.ref = "composeMultiplatform" }
# AndroidX Compose testing — used in Robolectric tests (androidHostTest) instead of
# JetBrains version which depends on Espresso incompatible with Robolectric.
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version = "1.7.3" }
# Compose Multiplatform desktop test — provides runDesktopComposeUiTest
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }

# Room 3 (androidx.room3 group)
androidx-room3-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room" }
androidx-room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room" }
androidx-room3-testing = { module = "androidx.room3:room3-testing", version.ref = "room" }
androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "sqlite" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

# SQLite JDBC for JVM tests
postgrest-kt = { module = "io.github.jan-tennert.supabase:postgrest-kt", version.ref = "postgrestKt" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }

# Ktor
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-json = { module = "io.ktor:ktor-client-json", version.ref = "ktor" }

# Koin
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-annotations-runtime = { module = "io.insert-koin:koin-annotations-jvm", version.ref = "koin-annotations" }

# DataStore
androidx-datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# Kermit
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
kermit-koin = { module = "co.touchlab:kermit-koin", version.ref = "kermit" }

# AppTracer — Android-only crash / ANR / non-fatal reporting.
# Only the crash-report module is consumed, so there is nothing for a BOM to
# align; both coordinates take the version from the single `tracer` ref, which
# is also what the Gradle plugin resolves against.
tracer-crash-report = { module = "ru.ok.tracer:tracer-crash-report", version.ref = "tracer" }

# Markdown
markdown-renderer = { module = "com.mikepenz:multiplatform-markdown-renderer", version.ref = "markdown-renderer" }
markdown-renderer-m3 = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version.ref = "markdown-renderer" }

# OpenAI
openai-client = { module = "com.aallam.openai:openai-client", version.ref = "openai-client" }

# MaterialKolor
materialkolor = { module = "com.materialkolor:material-kolor", version.ref = "materialkolor" }

# Navigation 3
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "nav3" }
androidx-navigation3-ui-android = { module = "androidx.navigation3:navigation3-ui-android", version.ref = "nav3" }
androidx-navigation3-runtime-android = { module = "androidx.navigation3:navigation3-runtime-android", version.ref = "nav3" }
androidx-navigation3-runtime-desktop = { module = "androidx.navigation3:navigation3-runtime-desktop", version.ref = "nav3" }
androidx-navigation3-ui-desktop = { module = "org.jetbrains.androidx.navigation3:navigation3-ui-desktop", version.ref = "nav3" }
androidx-lifecycle-viewmodel-navigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "nav3-lifecycle-vm" }

# Koin Navigation 3 DSL (multiplatform metadata — koinEntryProvider is in this artifact)
koin-compose-navigation3 = { module = "io.insert-koin:koin-compose-navigation3", version.ref = "koin" }
# Koin Navigation 3 DSL (Android AAR — contains the actual navigation{} function for androidJvm)
koin-compose-navigation3-android = { module = "io.insert-koin:koin-compose-navigation3-android", version.ref = "koin" }

# Supabase
auth-kt = { module = "io.github.jan-tennert.supabase:auth-kt", version.ref = "supabase" }
functions-kt = { module = "io.github.jan-tennert.supabase:functions-kt", version.ref = "supabase" }

# Utils
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

# Architecture tests (Konsist — source-level structural assertions, runs in :shared:jvmTest)
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-testExt" }
# Kotest assertions — multiplatform, works alongside kotlin.test.
# Use only matchers (shouldBe, shouldNotThrowAny, shouldContain) — NOT full Kotest spec styles.
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest-assertions" }

# Okio — file I/O for FileLogWriter
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }

# FileKit
filekit-core = { module = "io.github.vinceglb:filekit-core", version.ref = "filekit" }
filekit-dialogs-compose = { module = "io.github.vinceglb:filekit-dialogs-compose", version.ref = "filekit" }

# WorkManager (Android background jobs — replaces SyncEngine polling loop)
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "androidx-work" }

# Coil
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
coil-core = { module = "io.coil-kt.coil3:coil-core", version.ref = "coil" }

# Rich Text Editor
rich-editor-compose = { module = "com.mohamedrejeb.richeditor:richeditor-compose", version.ref = "rich-editor" }

# Security
android-security-crypto = { module = "androidx.security:security-crypto", version.ref = "security-crypto" }

# Play In-App Updates
play-app-update = { module = "com.google.android.play:app-update", version.ref = "play-app-update" }
play-app-update-ktx = { module = "com.google.android.play:app-update-ktx", version.ref = "play-app-update" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }

# Koog AI Agent
koog-agents = { module = "ai.koog:koog-agents", version.ref = "koog" }
koog-prompt-executor-openai-client = { module = "ai.koog:prompt-executor-openai-client", version.ref = "koog" }
koog-prompt-executor-openai-client-jvm = { module = "ai.koog:prompt-executor-openai-client-jvm", version.ref = "koog" }
koog-prompt-llm = { module = "ai.koog:prompt-llm", version.ref = "koog" }
koog-prompt-executor-model = { module = "ai.koog:prompt-executor-model", version.ref = "koog" }
koog-http-client-okhttp = { module = "ai.koog:http-client-okhttp", version.ref = "koog" }

# MCP server
kotlin-sdk = { module = "io.modelcontextprotocol:kotlin-sdk", version.ref = "kotlinSdk" }
kotlinx-io-core-jvm = { module = "org.jetbrains.kotlinx:kotlinx-io-core-jvm", version.ref = "kotlinxIo" }
ktor-io-jvm = { module = "io.ktor:ktor-io-jvm", version.ref = "ktor" }

# Lint / Quality tools
detekt-formatting = { module = "dev.detekt:detekt-rules-ktlint-wrapper", version.ref = "detekt" }
detekt-api = { module = "dev.detekt:detekt-api", version.ref = "detekt" }
detekt-test = { module = "dev.detekt:detekt-test", version.ref = "detekt" }
detekt-test-utils = { module = "dev.detekt:detekt-test-utils", version.ref = "detekt" }

[bundles]
# Compose — all Compose libraries used together in every UI source set
compose = [
    "compose-runtime",
    "compose-foundation",
    "compose-material3",
    "compose-material",
    "compose-material-icons-extended",
    "compose-ui",
    "compose-ui-tooling-preview",
]
# Koin — core DI + Compose integration + annotations, always together
koin = [
    "koin-core",
    "koin-compose",
    "koin-compose-viewmodel",
    "koin-annotations-runtime",
]
# Ktor client — all network stack libs used together
ktor = [
    "ktor-client-core",
    "ktor-client-content-negotiation",
    "ktor-client-logging",
    "ktor-serialization-kotlinx-json",
    "ktor-client-json",
]
# DataStore preferences — core + compose integration
datastore = [
    "androidx-datastore-preferences-core",
    "androidx-datastore-preferences",
]

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
# NOTE: there is deliberately no `androidLibrary` / `kotlinAndroid` alias here.
# `:pro` applies `id("com.android.library")` unversioned — AGP is already on the buildscript
# classpath from `:androidApp`, so an alias carrying `version.ref = "agp"` fails with
# "the plugin is already on the classpath with an unknown version" — and it applies no
# Kotlin plugin at all, because AGP 9 has built-in Kotlin support and errors if one is
# added. The `agp` version is still pinned in exactly one place, by `androidApplication`.
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinxSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room3 = { id = "androidx.room3", version.ref = "room" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
koin = { id = "koin", version.ref = "koin" }
koin-compiler = { id = "io.insert-koin.compiler.plugin", version.ref = "koin-compiler-plugin" }
tracer = { id = "ru.ok.tracer", version.ref = "tracer" }
