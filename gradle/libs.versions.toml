[versions]
# Kotlin / Build
agp = "9.4.0"
kotlin = "2.3.21"
ksp = "2.3.11"
kotlin-serialization = "1.11.0"

# Android
android-compileSdk = "37"
android-minSdk = "26"
android-targetSdk = "36"
androidx-activity = "1.13.0"
androidx-appcompat = "1.8.0"
androidx-core = "1.19.0"
androidx-espresso = "3.7.0"
androidx-uiautomator = "2.3.0"
androidx-lifecycle = "2.8.0"
androidx-testExt = "1.3.0"

# Compose
composeMultiplatform = "1.12.0"
material3 = "1.12.0-alpha03"

# Coroutines / DateTime
coroutines = "1.11.0"
datetime = "0.8.0"

# Database / SQLDelight
postgrestKt = "3.8.0"
room = "3.0.0"
sqlite = "2.7.0"
sqlDelightVersion = "1.5.5"
sqliteJdbc = "3.47.0.0"

# Networking / Ktor
ktor = "3.5.2"

# DI / Koin
koin = "4.2.2"
koin-annotations = "4.2.2"
# koin-ksp-compiler is versioned separately from koin-annotations (4.2.x)
# 2.3.2-Beta1 is the latest; it requires koin-core:4.1.1 (compatible with koin:4.2.2)
koin-ksp-compiler = "2.3.2-Beta1"

# Persistence / DataStore
datastore = "1.2.1"

# Logging / Kermit
kermit = "2.1.0"

# Markdown
markdown-renderer = "0.43.0"

# AI / OpenAI
openai-client = "4.1.0"

# Theme / MaterialKolor
materialkolor = "4.1.1"

# Navigation
androidx-navigation = "2.9.2"

# Supabase
supabaseVersion = "3.8.0"

# Utils
ulid = "5.2.4"
turbine = "1.2.0"

# FileKit
filekit = "0.15.0"

# Rich Text Editor
rich-editor = "1.2.0"

# Security
security-crypto = "1.1.0-alpha06"

# AI Agent Framework (JetBrains Koog)
koog = "1.1.1"

# Coil
coil = "3.6.1"

# Testing
junit = "4.13.2"
robolectric = "4.17-beta-4"

# Lint

[libraries]
# Kotlin / Build
auth-kt = { module = "io.github.jan-tennert.supabase:auth-kt", version.ref = "postgrestKt" }
functions-kt = { module = "io.github.jan-tennert.supabase:functions-kt", version.ref = "postgrestKt" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlin-serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }

# Android
junit = { module = "junit:junit", version.ref = "junit" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidx-uiautomator" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }

# Lifecycle
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }

# Compose
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version = "1.7.3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
# AndroidX Compose testing — used in Robolectric tests (androidHostTest) instead of
# JetBrains version which depends on Espresso incompatible with Robolectric.
composeUiTestJunit4 = { module = "androidx.compose.ui:ui-test-junit4", version = "1.7.3" }
# Compose Multiplatform desktop test — provides runDesktopComposeUiTest
composeUiTest = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-runtime-liveedit = { module = "org.jetbrains.compose.runtime:runtime-liveedit", version.ref = "composeMultiplatform" }
kotlinx-coroutinesSwing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }


# Room 3 (androidx.room3 group)
androidx-room3-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room" }
androidx-room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room" }
androidx-room3-ktx = { module = "androidx.room3:room3-ktx", version.ref = "room" }
androidx-room3-testing = { module = "androidx.room3:room3-testing", version.ref = "room" }
androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "sqlite" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

# SQLite JDBC for JVM tests
postgrest-kt = { module = "io.github.jan-tennert.supabase:postgrest-kt", version.ref = "postgrestKt" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }

# Ktor
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-json = { module = "io.ktor:ktor-client-json", version.ref = "ktor" }

# Koin
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-ksp-compiler = { module = "io.insert-koin:koin-ksp-compiler", version.ref = "koin-ksp-compiler" }
koin-annotations-runtime = { module = "io.insert-koin:koin-annotations-jvm", version.ref = "koin-annotations" }

# DataStore
androidx-datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# Kermit
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }

# Markdown
markdown-renderer = { module = "com.mikepenz:multiplatform-markdown-renderer", version.ref = "markdown-renderer" }
markdown-renderer-m3 = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version.ref = "markdown-renderer" }

# OpenAI
openai-client = { module = "com.aallam.openai:openai-client", version.ref = "openai-client" }

# MaterialKolor
materialkolor = { module = "com.materialkolor:material-kolor", version.ref = "materialkolor" }

# Navigation Compose (type-safe routes, multiplatform)
# TestNavHostController is included in the main artifact — no separate testing dep needed.
androidx-navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "androidx-navigation" }

# Utils
ulid = { module = "com.github.f4b6a3:ulid-creator", version.ref = "ulid" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-testExt" }

# FileKit
filekit-core = { module = "io.github.vinceglb:filekit-core", version.ref = "filekit" }
filekit-dialogs-compose = { module = "io.github.vinceglb:filekit-dialogs-compose", version.ref = "filekit" }

# Coil
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
coil-core = { module = "io.coil-kt.coil3:coil-core", version.ref = "coil" }

# Rich Text Editor
rich-editor-compose = { module = "com.mohamedrejeb.richeditor:richeditor-compose", version.ref = "rich-editor" }

# Security
android-security-crypto = { module = "androidx.security:security-crypto", version.ref = "security-crypto" }

# Koog AI Agent
koog-agents = { module = "ai.koog:koog-agents", version.ref = "koog" }
koog-prompt-executor-openai-client = { module = "ai.koog:prompt-executor-openai-client", version.ref = "koog" }
koog-prompt-executor-openai-client-jvm = { module = "ai.koog:prompt-executor-openai-client-jvm", version.ref = "koog" }
koog-prompt-llm = { module = "ai.koog:prompt-llm", version.ref = "koog" }
koog-prompt-executor-model = { module = "ai.koog:prompt-executor-model", version.ref = "koog" }
koog-http-client-okhttp = { module = "ai.koog:http-client-okhttp", version.ref = "koog" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

# Room 3 KSP plugin
room3 = { id = "androidx.room3", version.ref = "room" }
