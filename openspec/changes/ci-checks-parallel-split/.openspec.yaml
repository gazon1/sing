schema: spec-driven
# CI workflow topology is process, not product behaviour: this change moves steps
# between jobs and changes no capability a user or a client can observe. The
# constraints it must not violate are executable rather than descriptive — the
# executed-count floors, the coverage floors and the cross-run flake comparison
# all fail if the split crosses them — so a spec delta would restate gates that
# already refuse to pass incorrectly.
#
# The reasoning is in the proposal and in
# docs/decisions/2026-10-05-ci-checks-run-in-parallel.md (status: deferred).
#
# Invariant: this marker and a specs/ directory are mutually exclusive. If this
# change ever starts describing a verification requirement rather than CI
# topology, delete skip_specs and write the delta.
skip_specs: true
