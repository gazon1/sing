# change still carries a proposal and tasks here, and a verdict in `.specify/reviews/`.
#
# Invariant: if this change ever needs an openspec-level requirement of its own — a capability
# that exists in `openspec/specs/` — delete `skip_specs` and write the delta instead of
# amending the feature spec alone.
