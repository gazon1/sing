#Kotlin
kotlin.code.style=official
# kotlin.daemon.jvmargs omitted on purpose: the Kotlin compilation runs INSIDE the
# Gradle daemon (see kotlin.compiler.execution.strategy below), so there is no
# second JVM to size. ADR 2026-10-22-gradle-memory-budget.

#Gradle
# Heap of the Gradle daemon. Measured, not chosen — and the first measurement
# was wrong, in a way that only CI could show.
#
# The first measurement (2026-10-22) was ONE compilation of the shared module:
# 1807 MB peak, and 2048 MB "the smallest value that leaves room". That
# number was about a single task, and a build is not a single task.
#
# CI compiles the shared module TWICE (the Android target and the JVM target)
# plus the desktop and android modules, and it died on 2026-10-22 with
# `java.lang.OutOfMemoryError: Java heap space` at 2048 MB — the value the
# first measurement had called sufficient. The second measurement (the same
# task set, `--no-parallel`, as CI runs it) put the live set at ~4.3 GB: the
# daemon's peak RSS was 5.67 GB under a 4 GB cap — heap-bound, not
# comfortable — and 5.9 GB under a 6 GB cap.
#
# So: 6144 MB, which is the smallest round number above the measured live set
# with room for the rest of the daemon (Kover's agent, the detekt analysis).
# 4096 MB was tried and survived locally, but the daemon sat AT the cap
# through the whole compile — that is a build waiting for a different day.
#
# The price: one worktree's daemon holds up to 6 GB instead of 3. It is still
# ONE JVM per worktree (the Kotlin compiler runs in-process — see below), and
# upstream's alternative was a Gradle daemon of 3 GB PLUS a Kotlin daemon whose
# heap was never bounded at all: the Kotlin plugin's default is a quarter of
# the machine's RAM, which is 15 GB on this host and 4 GB on a CI runner.
# ADR 2026-10-22-gradle-memory-budget.
#
# The number is RECORDED, and the record is `config/docs/gradle-memory-budget.properties`
# (`gradle.daemon.heap=6144M`). Gradle reads this file before it reads
# anything else and there is no way to interpolate a value from another file
# into it, so the heap is written here as well — and
# `scripts/check-memory-budget.py` is what keeps this line and the record in
# step.
org.gradle.jvmargs=-Xmx6144M -Dfile.encoding=UTF-8 --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/jdk.internal.access=ALL-UNNAMED
# The daemon dies after 10 minutes of idleness instead of Gradle's default of
# 3 hours (10800000 ms). This is the main lever: 33 worktrees, each with its
# own daemon, and the idle ones were holding 3 GB apiece for three hours after
# the last build. The cost is a cold daemon after a pause — cheap next to the
# memory. ADR 2026-10-22-gradle-memory-budget.
org.gradle.daemon.idletimeout=600000
org.gradle.configuration-cache=true
# Fail the build on ANY configuration-cache problem (was: warn). New CC breakage
# must surface on the PR that introduces it — ADR 2026-10-04-configuration-cache-hardening.
org.gradle.configuration-cache.problems=fail
org.gradle.caching=true
org.gradle.warning.mode=summary
org.gradle.parallel=true
# Was 8, then 4, now 2 — and the reason is memory, not CPUs.
#
# 8 oversubscribed the 16 vCPUs: /proc/pressure/cpu measured
# `some avg10=48.79` on 2026-10-22, i.e. about half of the time tasks were
# waiting for a CPU. Four matched the core count.
#
# But the Kotlin compilation runs INSIDE the daemon (see below), so four workers
# mean four concurrent compilations sharing one heap — and the measured live
# set of ONE compilation is ~4.3 GB. Two is what fits under the 6 GB ceiling
# above; four would OOM the daemon the way CI did. Two workers also leave
# room for the slot pool to run three builds at once (6 compilations, 6 cores
# busy of 16) instead of fighting over them.
# ADR 2026-10-22-gradle-memory-budget.
org.gradle.workers.max=2
# The Kotlin compilation runs inside the Gradle daemon, so no separate Kotlin-JVM
# is started per worktree. Incremental compilation is NOT lost by this: the
# Kotlin plugin reads the incremental flag from the project properties
# regardless of the execution strategy, and only the strategy switch differs.
# The price is that parallel compile tasks now share the daemon's heap, which
# is why the daemon heap above is measured rather than assumed.
# ADR 2026-10-22-gradle-memory-budget.
kotlin.compiler.execution.strategy=in-process

#Android
android.nonTransitiveRClass=true

# Version alignment constants — used in resolutionStrategy
# Defined here to avoid catalog accessor shadowing (Gradle generates nested accessors
# from library keys that collide with version key names, e.g. jvm-test shadows kotlin).
version.kotlin=2.4.10
version.kotlinSerialization=1.12.0
version.kotlinxCollectionsImmutable=0.5.2
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
