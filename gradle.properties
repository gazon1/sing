#Kotlin
kotlin.code.style=official
# kotlin.daemon.jvmargs omitted: the Kotlin daemon inherits -Xmx from org.gradle.jvmargs

#Gradle
# Heap of the Gradle daemon. Measured, not chosen: the Kotlin compilation peaks at
# 1807 MB, and at 1536 MB the collector hits an Evacuation Failure at the ceiling —
# so 1536 is below what the compilation needs and 2048 is the smallest value that
# leaves room. ADR 2026-10-22-gradle-memory-budget.
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/jdk.internal.access=ALL-UNNAMED
# The daemon dies after 10 minutes of idleness instead of Gradle's default of
# 3 hours (10800000 ms). This is the main lever: 33 worktrees, each with its
# own daemon, and the idle ones were holding 3 GB apiece for three hours after
# the last build. The cost is a cold daemon after a pause — cheap next to the
# memory. ADR 2026-10-22-gradle-memory-budget.
org.gradle.daemon.idletimeout=600000
org.gradle.configuration-cache=true
# Fail the build on ANY configuration-cache problem (was: warn). New CC breakage
# must surface on the PR that introduces it — ADR 2026-10-04-configuration-cache-hardening.
org.gradle.configuration-cache.problems=fail
org.gradle.caching=true
org.gradle.warning.mode=summary
org.gradle.parallel=true
# Was 8. With several worktrees building at once, 8 workers per daemon
# oversubscribe 16 vCPUs — /proc/pressure/cpu measured `some avg10=48.79` on
# 2026-10-22, i.e. about half of the time tasks were waiting for a CPU. Four
# matches the core count. ADR 2026-10-22-gradle-memory-budget.
org.gradle.workers.max=4

#Android
android.nonTransitiveRClass=true

# Version alignment constants — used in resolutionStrategy
# Defined here to avoid catalog accessor shadowing (Gradle generates nested accessors
# from library keys that collide with version key names, e.g. jvm-test shadows kotlin).
version.kotlin=2.4.10
version.kotlinSerialization=1.11.0
version.kotlinxCollectionsImmutable=0.5.0
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
