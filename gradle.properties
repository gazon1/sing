#Kotlin
kotlin.code.style=official
# kotlin.daemon.jvmargs omitted: Kotlin daemon inherits -Xmx from org.gradle.jvmargs

#Gradle
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8 --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/jdk.internal.access=ALL-UNNAMED
org.gradle.configuration-cache=true
# Fail the build on ANY configuration-cache problem (was: warn). New CC breakage
# must surface on the PR that introduces it — ADR 2026-10-04-configuration-cache-hardening.
org.gradle.configuration-cache.problems=fail
org.gradle.caching=true
org.gradle.warning.mode=summary
org.gradle.parallel=true
org.gradle.workers.max=8

#Android
android.nonTransitiveRClass=true

# Version alignment constants — used in resolutionStrategy
# Defined here to avoid catalog accessor shadowing (Gradle generates nested accessors
# from library keys that collide with version key names, e.g. jvm-test shadows kotlin).
version.kotlin=2.3.21
version.kotlinSerialization=1.11.0
version.kotlinxCollectionsImmutable=0.5.0
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
