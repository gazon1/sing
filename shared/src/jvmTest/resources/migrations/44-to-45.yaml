# The semantics of the v44 → v45 upgrade, as data.
#
# Two things were wrong with the stored links before this step:
#
# 1. the note-to-task relation was never filled — `notes.task_id` had a
#    foreign key and no data behind it, because no migration ever read the
#    note's own links to find the task;
# 2. links nothing can open stayed in the column — an identifier outside
#    `[A-Za-z0-9_-]` is not an identifier, so such a link is a claim of a
#    relation that does not exist.
#
# The rows below are the four shapes that matter: a note that links to a task,
# a note that already points at one, a note with a link nobody can open, and a
# note that links to nothing at all.
from: 44
to: 45
scenarios:
  - name: a note that links to a task points at it
    seed:
      - task: t1
      - table: notes
        row:
          id: n1
          user_id: u1
          title: Note n1
          is_folder: 0
          outgoing_links: '["task://t1"]'
          created_at: 1000
          updated_at: 1000
          server_version: 0
          sync_status: LOCAL_ONLY
    expect:
      - sql: "SELECT task_id FROM notes WHERE id = 'n1'"
        equals: t1

  - name: a note that already pointed at a task keeps that task
    seed:
      - task: t1
      - task: t2
      - table: notes
        row:
          id: n2
          user_id: u1
          title: Note n2
          is_folder: 0
          outgoing_links: '["task://t2"]'
          task_id: t1
          created_at: 1000
          updated_at: 1000
          server_version: 0
          sync_status: LOCAL_ONLY
    expect:
      - sql: "SELECT task_id FROM notes WHERE id = 'n2'"
        equals: t1

  - name: a link the grammar rejects is gone and a link it accepts stays
    seed:
      - task: t3
        columns:
          outgoing_links: '["note://n1","task://bad id"]'
      - table: notes
        row:
          id: n3
          user_id: u1
          title: Note n3
          is_folder: 0
          outgoing_links: '["task://not a valid id","note://n1"]'
          created_at: 1000
          updated_at: 1000
          server_version: 0
          sync_status: LOCAL_ONLY
    expect:
      - sql: "SELECT outgoing_links FROM notes WHERE id = 'n3'"
        equals: '["note://n1"]'
      - sql: "SELECT outgoing_links FROM tasks WHERE id = 't3'"
        equals: '["note://n1"]'

  - name: a note without links has no task
    seed:
      - table: notes
        row:
          id: n4
          user_id: u1
          title: Note n4
          is_folder: 0
          outgoing_links: "[]"
          created_at: 1000
          updated_at: 1000
          server_version: 0
          sync_status: LOCAL_ONLY
    expect:
      - sql: "SELECT task_id FROM notes WHERE id = 'n4'"
        equals: null
