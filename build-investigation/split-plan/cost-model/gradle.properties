# Parity with the repository's build (gradle.properties), or the numbers are from another machine
# configuration. Copied deliberately; see cost-model.md for why each one is here.
org.gradle.jvmargs=-Xmx6144M -Dfile.encoding=UTF-8 --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/jdk.internal.access=ALL-UNNAMED
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2
org.gradle.parallel=true
org.gradle.caching=false
org.gradle.configuration-cache=true
org.gradle.daemon.idletimeout=600000
