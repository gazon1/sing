# One toolchain file for the external binaries the gate suite shells out to.
# mise installs and pins these; CI and local runs read the same file.
# Gradle/JVM tooling is managed by ./gw and gradle.properties, not here.

[tools]
deno = "2.9.5"
actionlint = "1.7.7"
shellcheck = "0.10.0"
yamllint = "1.38.0"
lychee = "0.24.2"
ktlint = "1.8.0"
typos = "1.29.0"
betterleaks = "1.9.0"
osv-scanner = "2.0.0"
hk = "1.23.0"
# The pkl CLI, which hk shells out to: `hk` reads hk.pkl through it and
# refuses to start without it ("install pkl cli to use pkl config files").
pkl = "0.28.2"
rumdl = "0.3.2"
# fish runs scripts/agent-account.fish, which provisions the dedicated agent
# account (docs/architecture/agent-uid.md). Pinned here for two reasons: its
# tests run it directly, and they must not go quiet on a runner that has no
# fish — the repository does not count a skipped test as a passing one.
"aqua:fish-shell/fish-shell" = "4.9.3"
# Upstream, not a fork: the fix for a duplicated declaration across components
# (mokevnin/easement#114) shipped upstream in 0.6.4, so the fork this pin used to
# name is no longer needed. Upstream releases a binary, so this is a download,
# not a build. The version is fixed, not "latest": this file is the one place
# the repository writes a tool version down, and scripts/toolchain-version.py
# reads it from here for the CI job that installs the tool.
"github:mokevnin/easement" = "0.9.0"
"github:mokevnin/heavy" = "latest"
# The second Maestro executor is *not* installed through mise: the runner needs
# its driver binaries (drivers/android) next to the binary, and every mise
# backend that can pick the platform for us installs the binary alone. The
# release tarball — binary plus drivers — is unpacked by hand; see
# Maestro/README.md and `maestro._engine.MAESTRO_RUNNER_VERSION`. The CLI stays
# the default engine, and the runner is chosen with `--engine maestro-runner`.
"npm:@sourcegraph/scip-python" = "latest"
# The toolchain that builds easement from source, pinned to the version the
# easement repository pins itself. A released binary needs no toolchain, so
# this is the fallback for a checkout that has to build it.
rust = "1.99.1"
