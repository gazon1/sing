name: skill-update
description: Update an existing skill — add missing section, fix formatting, trim oversized content.

task: |
  The `singularity-todo-testable-vm` skill at `.agents/skills/singularity-todo-testable-vm/SKILL.md` is missing a "Common pitfalls" section.

  Add a "Common pitfalls" section at the end of the skill (before "See also") covering:
  1. Forgetting `addCloseable(scope)` — leads to scope leak
  2. Using `stateIn` in production — causes test flakiness
  3. Using `runBlocking` in production — causes deadlock risk
  4. Not passing scope in tests — tests hang or fail with UncompletedCoroutinesError

  Each pitfall should be 2-3 sentences explaining what happens and how to fix it.

constraints:
  - Do not change the existing content
  - Do not change the frontmatter
  - Pitfalls must be accurate to the codebase (not generic)
  - Keep the same heading level as other sections

expected:
  - New "Common pitfalls" section added
  - 4 pitfalls documented
  - No other changes to the file
