# rumdl — Markdown formatting/linting for this repository.
# Usage:
#   rumdl check .          # lint
#   rumdl fmt .            # format (fix in place)
#   rumdl fmt --diff .     # preview fixes

[global]
respect-gitignore = true
exclude = [
  ".git",
  ".gradle",
  ".gradle-user-home",
  ".kotlin",
  "build",
  "node_modules",
  "out",
  "target",
  "dist",
  ".venv",
  "__pycache__",
  # Generated digests (regenerated by scripts/refresh-decisions-digest.sh).
  "docs/decisions/DIGEST.md",
  "docs/decisions/DIGEST-full.md",
  # Historical / machine-managed records — format churn is noise.
  "openspec/changes/archive/**",
  "docs/decisions/archive/**",
]
# Keep formatting safe on a large, mixed-style doc tree: disable rules that are
# noisy or conflict with this repo's conventions (inline HTML badges, long
# prose/tables/code, ATX/frontmatter heading shapes in specs/ADRs, etc.).
# Tighten per-directory or re-enable rules as the docs are cleaned up.
disable = [
  "MD013", # line length — prose/specs/tables; reflow is disruptive
  "MD033", # inline HTML — badges and intentional markup (README, docs)
  "MD041", # first line heading — frontmatter/spec files
  "MD025", # multiple H1 — common in ADR/spec templates
  "MD024", # duplicate headings — changelogs/spec sections
  "MD036", # emphasis-as-heading — common in existing docs
  "MD040", # fenced code language — many legacy blocks
  "MD060", # table column alignment — large churn
  "MD034", # bare URLs — fix in waves (step 5)
]

# Step 5 (incremental): MD059 clean repo-wide (enabled by default, not in
# disable list). MD034/MD040 addressed in waves (docs/architecture MD040
# checked clean for fenced languages after targeted fixes).
