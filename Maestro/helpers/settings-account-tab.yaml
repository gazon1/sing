# Opens the Account tab in Settings.
#
# Usage: the flow is already in Settings (it has tapped the menu's Settings
# item); this helper scrolls the settings navigation and opens the tab.
#
# The settings navigation is a scrollable column of thirteen rows and the
# Account tab is the last of them, so on a phone viewport the trailing tabs
# are below the fold. Waiting for the tab without scrolling waits for
# something that is not on the screen.
#
# The scroll itself lives in `settings-rail-scroll.yaml`, because the gesture
# that moves the rail is not the obvious one — see that file for the two
# recipes that failed on a device.
appId: com.singularity.todo
name: settings-account-tab
---
- runFlow: settings-rail-scroll.yaml
- extendedWaitUntil:
    visible:
      id: settings_tab_account
    timeout: 10000
- tapOn:
    id: settings_tab_account
