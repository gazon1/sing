# Opens the Account tab in Settings.
#
# Usage: the flow is already in Settings (it has tapped the menu's Settings
# item); this helper opens the tab via the narrow-screen dropdown.
#
# The dropdown lists the tabs under the same group headings as the wide nav
# rail, so the Account row — the last tab of the last group — can sit below the
# fold of the menu on a phone. Scroll the menu to it rather than assuming it
# is on screen.
appId: com.singularity.todo
name: settings-account-tab
---
- tapOn:
    id: settings_tab_dropdown
- scrollUntilVisible:
    element:
      id: settings_tab_account
    direction: DOWN
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: settings_tab_account
    timeout: 5000
- tapOn:
    id: settings_tab_account
