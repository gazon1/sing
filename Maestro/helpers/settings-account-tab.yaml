# Opens the Account tab in Settings.
#
# Usage: the flow is already in Settings (it has tapped the menu's Settings
# item); this helper scrolls the settings navigation and opens the tab.
#
# The settings navigation is a scrollable column of twelve rows and the
# Account tab is the last of them, so on a phone viewport the trailing tabs
# are below the fold. Waiting for the tab without scrolling waits for
# something that is not on the screen. A swipe past the end of the rail is a
# no-op, so over-swiping is harmless.
appId: com.singularity.todo
name: settings-account-tab
---
- swipe:
    start: 105, 2000
    end: 105, 1600
    duration: 1000
- swipe:
    start: 105, 2000
    end: 105, 1600
    duration: 1000
- swipe:
    start: 105, 2000
    end: 105, 1600
    duration: 1000
- swipe:
    start: 105, 2000
    end: 105, 1600
    duration: 1000
- swipe:
    start: 105, 2000
    end: 105, 1600
    duration: 1000
- extendedWaitUntil:
    visible:
      id: settings_tab_account
    timeout: 10000
- tapOn:
    id: settings_tab_account
