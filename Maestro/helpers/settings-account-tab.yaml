# Opens the Account tab in Settings.
#
# Usage: the flow is already in Settings (it has tapped the menu's Settings
# item); this helper opens the tab via the narrow-screen dropdown.
appId: com.singularity.todo
name: settings-account-tab
---
- tapOn:
    id: settings_tab_dropdown
- extendedWaitUntil:
    visible:
      id: settings_tab_account
    timeout: 10000
- tapOn:
    id: settings_tab_account
