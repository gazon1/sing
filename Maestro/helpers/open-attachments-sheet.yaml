# Opens the attachments sheet from the task detail.
#
# ## Why the task's own state decides the way in
#
# The `+ Ещё` sheet offers exactly the sections that are *not* on the screen, and
# the attachments section is on the screen as soon as the task has one. So the
# way in depends on the task:
#
#   * a task with no attachment reaches the section through `+ Ещё` — the
#     section itself is not drawn;
#   * a task that already has one draws the section, and the `+ Ещё` sheet does
#     not offer `attachments` at all, because it offers only what is missing.
#
# That second case is every run after the first against the same fixture, so a
# flow that always went through the sheet passed only on a device whose task had
# nothing attached yet.
#
# ## Why the checks scroll
#
# The section sits at the bottom of the detail, below the fold. "Not visible" is
# true both for a section that is not there and for one that is merely scrolled
# past, so a plain `notVisible` test would send a task that has an attachment
# down the `+ Ещё` branch and find no entry there. Scrolling to it first is what
# makes the answer be about the section rather than about the viewport.
#
# ## Why the section may need opening
#
# A section with content is drawn collapsed, and its header is the toggle. The
# `+ Ещё` pick opens the section it adds; a section the task already carried
# arrives closed. Its rows are not composed until it is opened, so the add-row
# is looked for first and the header tapped only when it is not there.
appId: com.singularity.todo
name: open-attachments-sheet
---
- scrollUntilVisible:
    element:
      id: attachments_section
    direction: DOWN
    timeout: 8000
    optional: true

# No section on the screen: this task has no attachment, and `+ Ещё` is the
# only place its attachments section is offered.
- runFlow:
    when:
      notVisible:
        id: attachments_section
    commands:
      - runFlow:
          file: open-more-parameter.yaml
          env:
            PROPERTY: attachments

# A section the task already carried is closed; the header opens it. Sent only
# when the add-row is absent, because a section the pick opened is already open
# and a second press would close it again.
- scrollUntilVisible:
    element:
      id: attachments_add_file_row
    direction: DOWN
    timeout: 8000
    optional: true
- runFlow:
    when:
      notVisible:
        id: attachments_add_file_row
    commands:
      - tapOn:
          id: attachments_section
      - scrollUntilVisible:
          element:
            id: attachments_add_file_row
          direction: DOWN
          timeout: 8000

# The row lands on the gesture-navigation strip on a phone; centering puts it
# where the tap lands on the row and not on the system bar.
#
# It is not centered any more, and the reason is that Maestro's centering never
# settles: it keeps scrolling until the row sits in the middle of the screen,
# and this row is the last thing in the sheet, so the content below it cannot
# scroll any further — the loop ran to its timeout and the step failed on a row
# that was on the screen all along (measured 2026-11-25, API 36 emulator). The
# plain scroll stops as soon as the row is visible.
#
# Centering was also what kept the tap off the system bar, and that part of it
# is kept: the row is the last thing in the sheet, so the scroll leaves it at
# the bottom of the window, and on a phone with gesture navigation the bottom of
# the window is under the gesture strip. The tap therefore lands in the upper
# quarter of the row — a place that is on the row and never on the bar — and it
# does not depend on how far the sheet could scroll.
- scrollUntilVisible:
    element:
      id: attachments_add_file_row
    direction: DOWN
    timeout: 8000
- tapOn:
    id: attachments_add_file_row
    point: "50%,25%"
- extendedWaitUntil:
    visible:
      id: attachments_url_input
    timeout: 5000
