# Creates one task with no due date and leaves the app on the Inbox agenda, where
# that task actually appears.
#
# The task is seeded through the DebugSeedActivity deep-link rather than typed into
# the editor. Seeding is the project's sanctioned fixture mechanism (see
# helpers/seed.yaml): it produces a deterministic row, stamped with the run id
# where the caller needs a unique one, without the flow depending on keyboard/IME
# behaviour or on the editor's Save button enabling.
#
# The title is fixed rather than parameterized on purpose: callers address the row by
# its generated testTag (`TestTags.taskItem("Buy milk")` -> `task_item_buy_milk`), and
# 17 flows depend on that stable id. Do not add a per-run stamp here — a moving id
# would break every one of them. Flows needing a differently named task seed their
# own.
#
# This helper runs launch-clean internally.
appId: com.singularity.todo
name: seed-task
---
- runFlow: launch-clean.yaml
# No due= parameter: an undated fixture must land in Inbox's "No Date" bucket.
- runFlow:
    file: seed.yaml
    env:
      QUERY: "task=Buy%20milk"
- tapOn:
    id: nav_tab_inbox
- scrollUntilVisible:
    element:
      id: task_item_buy_milk
    direction: DOWN
    timeout: 8000
