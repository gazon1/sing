# Creates one task with no due date and leaves the app on the Inbox agenda, where
# that task actually appears.
#
# The title is fixed rather than parameterized on purpose: the assertion below
# addresses the row by its generated testTag (`TestTags.taskItem("Buy milk")` ->
# `task_item_buy_milk`), and a caller that needs a different title would have to
# duplicate that slug arithmetic anyway. Flows needing a second, differently
# named task create it inline.
#
# ASCII title: Maestro's `inputText` cannot type non-ASCII on Android.
# This helper runs launch-clean internally.
appId: com.singularity.todo
name: seed-task
---
- runFlow: launch-clean.yaml
# The FAB is tab-sensitive: on the Today tab it pre-fills dueDate = today
# (FabActionResolver), on Inbox it pre-fills no date. An undated fixture must
# therefore be created FROM Inbox, before any tab switch.
- tapOn:
    id: nav_tab_inbox
- tapOn:
    id: tasks_fab
- tapOn:
    id: task_editor_title_input
- inputText: "Buy milk"
- assertVisible: "Buy milk"
- hideKeyboard
- tapOn:
    id: task_editor_save
# The task was saved without a due date and Inbox buckets by date, so it sits
# under "No Date". Return to source tab (16-return-to-source-tab) and assert.
- tapOn:
    id: nav_tab_inbox
- extendedWaitUntil:
    visible:
      id: task_item_buy_milk
    timeout: 5000
