# Opens Pomodoro the way a person does: bottom-bar Menu button, then the entry.
#
# Pomodoro is a destination of the app menu, not a tab. A flow that taps
# `nav_tab_pomodoro` is tapping an id the bar does not render, so it fails on an
# element that cannot exist and the failure says nothing about Pomodoro.
#
# The sheet is a scrollable column: the entry can be in the hierarchy and still
# be below the fold, and a row that is drawn but off-screen is not a row the
# user can reach. So the scroll is part of opening Pomodoro, not a stylistic
# step.
#
# `direction: DOWN` is a fact about the menu, not a bet on what the last flow
# did. This helper opens the sheet itself, so the scroll starts at the top; and
# Pomodoro is drawn after Plans in `AppMenu.sheetDestinations`, an order
# `MaestroFlowNavigationTest` pins so a reorder fails that test rather than this
# flow. Nothing here inherits a scroll position from a previous helper.
#
# On a timeout Maestro names the element it could not find (`menu_pomodoro`),
# which is the entry a reader has to go and check — not an invisible bottom-bar
# id.
appId: com.singularity.todo
---
- runFlow: open-app-menu.yaml
- scrollUntilVisible:
    element:
      id: menu_pomodoro
    direction: DOWN
    timeout: 10000
- tapOn:
    id: menu_pomodoro
