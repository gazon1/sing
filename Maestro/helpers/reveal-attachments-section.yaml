# Puts the task detail's attachments rows on the screen for a caller to assert on.
#
# Usage: none — the flow is already on the task detail, with the section open.
#
# ## Why this does not toggle anything
#
# A section with content is drawn collapsed, but the one place a flow opens it
# from — the `+ Ещё` sheet — adds the property *and* opens it. So after
# `open-attachments-sheet` the section is already open, and a tap on its header
# closes it. A helper that tapped whenever the tiles were not on screen would
# be wrong exactly when they were composed but scrolled past: off-screen is
# "not visible" to Maestro, and the tap it would then send shuts the section.
#
# A flow that arrives at a *collapsed* section — one whose expansion the pick
# did not cause, such as a reopened task after a restart — taps the header
# itself before calling this helper.
#
# ## Why it scrolls
#
# An open section grows past the bottom of the screen: its header can sit on the
# last row of the viewport while the tiles it revealed are below it. Scrolling
# the section's last row into view is what puts them on the screen.
appId: com.singularity.todo
name: reveal-attachments-section
---
# The sheet that added the attachment is still dismissing when the caller gets
# here, and its scrim swallows a scroll underneath it.
- extendedWaitUntil:
    notVisible:
      id: attachments_url_input
    timeout: 5000
- scrollUntilVisible:
    element:
      id: attachments_add_file_row
    direction: DOWN
    # No `centerElement` here: Maestro's centering keeps scrolling until the row
    # sits in the middle of the screen, and the "+ Add file" row is the last
    # thing in the sheet — the content below it cannot scroll further, so the
    # loop never settles and the step times out on a row that is already on the
    # screen (measured 2026-11-25, API 36 emulator). The plain scroll stops as
    # soon as the row is visible, which is all this helper promises.
    timeout: 8000
