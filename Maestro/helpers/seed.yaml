# Seeds a task via the DebugSeedActivity deep-link.
#
# Usage:
#   env:
#     QUERY: "task=Buy%20milk&due=today"
#
# QUERY is a URL-encoded deep-link query string. Every key the seed link
# understands is listed here — one key per line — and the handler knows no
# others: a key that is not on this list is reported as an unknown key rather
# than dropped in silence.
#
#   task=<title>            — create a task
#   desc=<text>             — set the description of the seeded task
#   due=today|tomorrow|-1d|+1d|<YYYY-MM-DD> — set the due date of the seeded task
#   updatedAt=now|-22d|<ISO instant> — stamp the task's created/updated timestamps
#   id=<id>                 — the id the seeded row carries
#   note=<title>            — create a note
#   linkTo=<task title>     — make the seeded note's body link to that task
#   project=<name>          — create a project
#   profile=<name>          — create and switch to a profile
#   blockedBy=<task title>  — make the seeded task depend on that task
#   cleanup=<prefix>[,<prefix>…] — delete the rows whose title starts with a prefix
#   reset=content           — delete every row of the active profile's content
#   session=anonymous|signedout|signedin — change the session, not the content
#
# `due=` takes `today`, `tomorrow`, `-1d`, `+1d` or an exact `YYYY-MM-DD`;
# `updatedAt=` takes `now`, `-22d` or an ISO instant.
#
# This helper does NOT run launch-clean — the caller decides.
#
# Leaves the app on the Today tab with the seeded entity visible.
#
# There is deliberately no inbox→today tab round-trip here. One was added on
# 2026-10-12 on the belief that a deep-link seed into an already-composed
# MainActivity left the agenda reading pre-seed state (ADR 2026-10-12 §9). That
# did not reproduce once the runner swept each run's fixtures on success: the
# original observation was made while leftovers from earlier runs were still in
# the list, so what looked like "the new row never arrived" was the new row
# arriving below rows the previous runs had left behind.
#
# Verified without the taps on `auth/01-first-run-anonymous`, `tasks/04-delete`
# and `agenda/01-smart-lists`. Callers still `scrollUntilVisible` their own row,
# which is what actually absorbs a slow arrival.
appId: com.singularity.todo
name: seed
---
- openLink: "todo-debug://seed?${QUERY}"
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000
