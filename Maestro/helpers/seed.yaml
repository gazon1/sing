# Seeds a task via the DebugSeedActivity deep-link.
#
# Usage:
#   env:
#     QUERY: "task=Buy%20milk&due=today"
#
# QUERY is a URL-encoded deep-link query string:
#   task=<title>              — create a task
#   task=<title>&due=today    — task with due date
#   task=<title>&due=tomorrow — task due tomorrow
#   task=<title>&due=-1d      — task due yesterday
#   task=<title>&due=2026-10-01 — exact date
#   note=<title>              — create a note
#   project=<name>           — create a project
#   profile=<name>           — create and switch to a profile
#   session=anonymous        — put the app into a local (offline) session
#
# This helper does NOT run launch-clean — the caller decides.
#
# Leaves the app on the Today tab with the seeded entity visible.
#
# The contract: a flow waits for what it seeded before it asserts on it.
#
# There are two ways to wait, and a flow follows one of them:
#
#   * The row rule — wait for the entity's own row. For a task that is
#     `task_item_<slug>`, the id the seed's title produces. Scrolling the row
#     into view is what absorbs a slow arrival.
#   * The container rule — wait for a container that renders only when the
#     seeded entity is in it: a Plans timeline section, an agenda bucket's
#     section.
#
# A container wait counts as waiting for the entity. A section header renders
# because the section holds a task, so the wait is the seeded task arriving
# and not a proxy that might arrive without it. The container has to be the one
# the entity belongs to — a wait on another day's section says nothing about
# this task.
#
# The container rule is also the cheap one: it does not scroll, so a step that
# waits for the same container afterwards still finds it on screen. A row wait
# inside a scrolling timeline can scroll the section out from under the step
# that waits for it, which is why a flow that waits for a row inside a
# scrolling timeline is choosing the row rule on purpose.
#
# A flow that follows the container rule says so in a comment next to the
# wait. A flow that waits for the row needs no comment: the row wait is the
# rule itself.
#
# There is deliberately no inbox→today tab round-trip here. One was added on
# 2026-10-12 on the belief that a deep-link seed into an already-composed
# MainActivity left the agenda reading pre-seed state (ADR 2026-10-12 §9). That
# did not reproduce once the runner swept each run's fixtures on success: the
# original observation was made while leftovers from earlier runs were still in
# the list, so what looked like "the new row never arrived" was the new row
# arriving below rows the previous runs had left behind.
#
# Verified without the taps on `auth/01-first-run-anonymous`, `tasks/04-delete`
# and `agenda/01-smart-lists`. A caller on the row rule still
# `scrollUntilVisible` their own row, which is what actually absorbs a slow
# arrival.
appId: com.singularity.todo
name: seed
---
- openLink: "todo-debug://seed?${QUERY}"
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000
