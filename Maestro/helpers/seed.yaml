# Seeds a task via the DebugSeedActivity deep-link.
#
# Usage:
#   env:
#     QUERY: "task=Buy%20milk&due=today"
#
# QUERY is a URL-encoded deep-link query string:
#   task=<title>              — create a task
#   task=<title>&due=today    — task with due date
#   task=<title>&due=tomorrow — task due tomorrow
#   task=<title>&due=-1d      — task due yesterday
#   task=<title>&due=2026-10-01 — exact date
#   note=<title>              — create a note
#   project=<name>           — create a project
#   profile=<name>           — create and switch to a profile
#
# This helper does NOT run launch-clean — the caller decides.
#
# Leaves the app on the Today tab with the seeded entity visible. The tab
# round-trip at the end is not cosmetic: the deep link brings MainActivity up with
# CLEAR_TOP|SINGLE_TOP, and on a cold start the seed commits while MainActivity is
# still being created, so the agenda's first composition reads a pre-seed query.
# The seeded row then does not appear until something forces a re-query — a tab
# switch does exactly that.
appId: com.singularity.todo
name: seed
---
- openLink: "todo-debug://seed?${QUERY}"
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 8000
- tapOn:
    id: nav_tab_inbox
- tapOn:
    id: nav_tab_today
- waitForAnimationToEnd
