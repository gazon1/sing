# Launches the app from a clean state and waits for the shell to be interactive.
#
# After clearState the DataStore is empty, so the Auth screen is shown first.
# "Continue Offline" creates an in-memory anonymous session and lands on the
# agenda. Without this step the nav tabs are never visible (the auth screen
# renders instead). The 8s budget was calibrated to catch a blocking migration
# on a slow emulator — see docs/decisions/2026-09-28-androidApp-smoke-tests-enabled.md.
appId: com.singularity.todo
name: launch-clean
onFlowComplete:
  - setAirplaneMode: disabled
---
- launchApp:
    appId: com.singularity.todo
    clearState: true
    permissions:
      notifications: allow
# Auth screen appears immediately after clearState. Tap "Continue Offline" to
# create an anonymous session and reach the agenda.
- extendedWaitUntil:
    visible:
      id: auth_continue_offline_button
    timeout: 5000
- tapOn:
    id: auth_continue_offline_button
# Now wait for the agenda shell to be interactive.
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 8000
