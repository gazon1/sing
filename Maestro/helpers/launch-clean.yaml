# Launches the app and waits for the agenda shell to be interactive.
#
# "Clean" here means AMS state only. The database is deliberately NOT wiped:
# `clearState: true` (or `pm clear`) would destroy the pre-authenticated session
# the emulator snapshot carries, and every flow would then land on the auth
# screen instead of the agenda — which is not what a flow that merely wants a
# fresh process is asking for.
#
# The fixture-accumulation problem that `clearState` would have solved is solved
# instead by the runner: `run-maestro` resets the app's content before every
# flow via `todo-debug://seed?reset=content`, which reaches the active
# profile's tasks (archived ones included), notes, projects and saved agenda
# views. The session, the profile and the auth state are left alone, so one
# run's reset cannot take another run's data with it under concurrency.
#
# The narrow sweep that used to run on success (the rows whose title starts with
# the run id) is gone: its list of titles had to be maintained by hand and was
# already behind the suite. See
# `docs/decisions/2026-10-21-each-flow-gets-a-clean-device.md` and its
# amendment of 2026-10-28.
#
# To exercise the auth screen (auth guard after a fresh install), use a flow
# that clears state explicitly and drives the sign-in step with real credentials.
#
# The first-run spotlight tour is dismissed here as well: it covers the agenda
# and swallows the taps under its scrim, so a flow that drives the agenda would
# otherwise drive an empty screen. See `skip-spotlight.yaml`.
appId: com.singularity.todo
name: launch-clean
onFlowComplete:
  - setAirplaneMode: disabled
---
- launchApp:
    appId: com.singularity.todo
    clearState: false
    permissions:
      notifications: allow
# The first-run spotlight tour dims the agenda and swallows the taps under its
# scrim, so a flow that drives the agenda never reaches its rows. Dismiss it
# before the shell-readiness wait: if the tour appears on first render, its
# scrim can block Maestro's visibility check for nav_tab_today and fail every
# flow at launch-clean. skip-spotlight is a no-op when the card is absent.
- runFlow: skip-spotlight.yaml
# Wait for the agenda shell to be interactive before the next step.
# After `adb install -r -t` the app is force-stopped and must cold-start on a
# loaded CI runner, so the wait is bounded by the shell becoming visible rather
# than by a fixed animation delay.
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000
# Dismiss again after shell readiness: the tour can also appear once the agenda
# has rendered. skip-spotlight is a no-op when the card is already gone.
- runFlow: skip-spotlight.yaml
