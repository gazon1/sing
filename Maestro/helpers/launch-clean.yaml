# Launches the app and waits for the agenda shell to be interactive.
#
# "Clean" here means AMS state only. The database is deliberately NOT wiped:
# `clearState: true` (or `pm clear`) would destroy the pre-authenticated session
# the emulator snapshot carries, and every flow would then land on the auth
# screen instead of the agenda — which is not what a flow that merely wants a
# fresh process is asking for.
#
# The fixture-accumulation problem that `clearState` would have solved is solved
# instead by the runner: `run-maestro` resets the app's content before every
# flow via `todo-debug://reset?scope=content`, which reaches the active
# profile's tasks (archived ones included), notes, projects and saved agenda
# views. The session, the profile and the auth state are left alone, so one
# run's reset cannot take another run's data with it under concurrency.
#
# The narrow sweep that used to run on success (the rows whose title starts with
# the run id) is gone: its list of titles had to be maintained by hand and was
# already behind the suite. See
# `docs/decisions/2026-10-21-each-flow-gets-a-clean-device.md` and its
# amendment of 2026-10-28.
#
# To exercise the auth screen (auth guard after a fresh install), use a flow
# that clears state explicitly and drives the sign-in step with real credentials.
appId: com.singularity.todo
name: launch-clean
onFlowComplete:
  - setAirplaneMode: disabled
---
- launchApp:
    appId: com.singularity.todo
    clearState: false
    permissions:
      notifications: allow
# Wait for the agenda shell to be interactive AND for the initial composition
# to settle before the next flow step tries to interact with UI elements.
# Without this, the first tapAfterAnimation or scrollUntilVisible can fire
# while the shell is still animating into place, which is a race the CI
# emulator loses more often than a local dev machine.
- waitForAnimationToEnd
# Wait for the agenda shell to be interactive.
# After `adb install -r -t` in e2e-shard.sh the app is force-stopped and must cold-
# start. 8 s is not always enough on a loaded CI runner; 20 s covers cold-start
# variance including migration deferred-startup on first launch.
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000
