# Launches the app and waits for the agenda shell to be interactive.
#
# Does NOT use clearState: the emulator retains a pre-authenticated session
# from the snapshot, so the app lands directly on the agenda without any
# sign-in step. This is the right behaviour for a smoke test: it verifies
# the app boots, composes the shell, and the nav bar is visible.
#
# A test that needs to exercise the auth screen (e.g. to verify the auth
# guard is shown after a fresh install) should use a separate flow that
# explicitly clears state and handles the sign-in step with real credentials.
appId: com.singularity.todo
name: launch-clean
onFlowComplete:
  - setAirplaneMode: disabled
---
- launchApp:
    appId: com.singularity.todo
    clearState: false
    permissions:
      notifications: allow
# Wait for the agenda shell to be interactive.
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 8000
