# Smoke: archive a task, then restore it.
#
# Covers: archive via the detail overflow menu -> Menu -> Archive screen -> open
# the archived task -> Восстановить -> task back in Inbox.
#
# The fixture is created in this flow rather than inherited from
# 10-archive-task-smoke, so the flow is runnable on its own. See
# docs/decisions/2026-09-29-maestro-archive-seed-strategy.md.
appId: com.singularity.todo
name: smoke-archive-restore
tags:
  - smoke
  - archive
---
- runFlow: ../../helpers/seed-task.yaml
# Archive it through the detail overflow menu.
- tapOn:
    id: task_item_buy_milk
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 5000
- tapOn:
    id: task_editor_more_menu
- extendedWaitUntil:
    visible:
      id: task_action_archive
    timeout: 5000
- tapOn:
    id: task_action_archive
- back
- extendedWaitUntil:
    notVisible:
      id: task_item_buy_milk
    timeout: 8000
# Open the Archive screen from the menu sheet.
- tapOn:
    id: nav_menu_button
- extendedWaitUntil:
    visible:
      id: menu_profile_sync
    timeout: 5000
- scrollUntilVisible:
    element:
      id: menu_archive
    direction: DOWN
    timeout: 8000
- tapOn:
    id: menu_archive
- extendedWaitUntil:
    visible:
      id: task_item_buy_milk
    timeout: 8000
# Restore: the archived row opens the same detail screen, whose overflow menu now
# offers Восстановить (the menu is gated on the task's trashed state).
- tapOn:
    id: task_item_buy_milk
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 5000
- tapOn:
    id: task_editor_more_menu
- extendedWaitUntil:
    visible:
      id: task_action_restore
    timeout: 5000
- tapOn:
    id: task_action_restore
# The screen pops back to the Archive list, where the restored task is gone.
- extendedWaitUntil:
    notVisible:
      id: task_item_buy_milk
    timeout: 8000
# And the task is back in the active list.
- tapOn:
    id: nav_tab_inbox
- extendedWaitUntil:
    visible:
      id: task_item_buy_milk
    timeout: 8000
