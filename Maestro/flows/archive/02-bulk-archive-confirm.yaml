# Device-only residue of the bulk archive flow.
#
# Business behavior (Cancel writes nothing, Confirm archives, count/eligibility
# rules) is owned by
# desktopApp/src/jvmTest/.../feature/flows/archive/ArchiveBulkActionFlowTest.kt
# and shared/src/commonTest/.../feature/archive/ArchiveViewModelTest.kt.
#
# This flow keeps only Android interaction/presentation guarantees that have no
# headless owner: the long-press task context sheet, the archive overflow popup
# resource IDs, and the result dialog's modal window covering the list.
#
# See docs/decisions/2026-11-11-the-bulk-archive-lives-in-the-overflow.md.
appId: com.singularity.todo
name: archive-bulk-confirm
tags:
  - smoke
  - archive
---
- runFlow: ../../helpers/seed-task.yaml
# Complete it first: the sweep only takes completed tasks. Long-press opens the
# context sheet on Android; the sheet presentation is a device observation.
- longPressOn:
    id: task_item_buy_milk
- extendedWaitUntil:
    visible:
      id: task_context_menu_sheet
    timeout: 8000
- tapOn:
    id: task_action_mark_as_completed
- extendedWaitUntil:
    visible:
      id: task_checkbox_buy_milk
      checked: true
    timeout: 8000
# Open the Archive screen from the menu sheet.
- runFlow: ../../helpers/open-archive.yaml
- extendedWaitUntil:
    visible:
      id: archive_empty
    timeout: 8000
# The bulk action is exposed through the overflow popup; its resource IDs are
# device-owned because the menu renders in its own popup window.
- tapOn:
    id: archive_overflow
- extendedWaitUntil:
    visible:
      id: archive_bulk_action
    timeout: 5000
- tapOn:
    id: archive_bulk_action
- extendedWaitUntil:
    visible:
      id: dialog_confirm
    timeout: 8000
- tapOn:
    id: dialog_confirm
# The success report is a modal result dialog; the archived row must be
# inaccessible while it is shown, because its window covers the list.
- extendedWaitUntil:
    visible:
      id: result_dialog_confirm
    timeout: 8000
- assertNotVisible:
    id: task_item_buy_milk
- tapOn:
    id: result_dialog_confirm
- extendedWaitUntil:
    visible:
      id: task_item_buy_milk
    timeout: 8000
