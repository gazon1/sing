# Attachments: deleting an attachment removes it from the list.
# прогнан на устройстве: да (2026-11-06) — realme RMX3938, 0O65321F32204DD5
appId: com.singularity.todo
name: attachments-delete
tags:
  - attachments
  - scenario:ATTACH-02
---
# Seed a task.
# No `due=`: the task is undated, so it lands in the Inbox tab's "No Date"
# section — the inbox is the tab of the tasks that are not dated yet, and the
# flow looks the task up there.
- runFlow:
    file: ../../helpers/seed-and-open-task.yaml
    env:
      QUERY: "task=DeleteAttachTask2026"
      TASK_ID: task_item_deleteattachtask2026
- runFlow: ../../helpers/open-attachments-sheet.yaml
- tapOn:
    id: attachments_url_input
- inputText: "https://example.com/to-delete"
- tapOn:
    id: attachments_add_url_button

# Verify attachment is present.
- extendedWaitUntil:
    visible:
      text: "https://example.com/to-delete"
    timeout: 5000

- runFlow: ../../helpers/open-attachments-sheet.yaml

# Delete the attachment by its accessibility label (no stable testTag — UUID-based).
# Maestro matches a content description through `text`, which is what it exposes.
- tapOn:
    text: "Delete"
- extendedWaitUntil:
    notVisible:
      text: "https://example.com/to-delete"
    timeout: 5000
