# Attachments: deleting an attachment removes it from the list.
# прогнан на устройстве: да (2026-11-06) — realme RMX3938, 0O65321F32204DD5
appId: com.singularity.todo
name: attachments-delete
tags:
  - attachments
  - scenario:ATTACH-02
---
# Seed a task.
# No `due=`: the task is undated, so it lands in the Inbox tab's "No Date"
# section — the inbox is the tab of the tasks that are not dated yet, and the
# flow looks the task up there.
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=DeleteAttachTask2026"

# Open task detail and add an attachment.
- tapOn:
    id: nav_tab_inbox
- extendedWaitUntil:
    visible:
      id: task_item_deleteattachtask2026
    timeout: 8000
- tapOn:
    id: task_item_deleteattachtask2026
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 5000
# The row is at the bottom of the task, below the fold. DOWN scrolls the content
# up so what is below comes into view; UP moves it the other way.
- scrollUntilVisible:
    element:
      id: attachments_add_file_row
    direction: DOWN
    timeout: 8000
- tapOn:
    id: attachments_add_file_row
- extendedWaitUntil:
    visible:
      id: attachments_url_input
    timeout: 5000
- tapOn:
    id: attachments_url_input
- inputText: "https://example.com/to-delete"
- tapOn:
    id: attachments_add_url_button

# Verify attachment is present.
- extendedWaitUntil:
    visible:
      text: "https://example.com/to-delete"
    timeout: 5000

# Open the attachments sheet again.
# The row is at the bottom of the task, below the fold. DOWN scrolls the content
# up so what is below comes into view; UP moves it the other way.
- scrollUntilVisible:
    element:
      id: attachments_add_file_row
    direction: DOWN
    timeout: 8000
- tapOn:
    id: attachments_add_file_row
- extendedWaitUntil:
    visible:
      id: attachments_url_input
    timeout: 5000

# Delete the attachment by its accessibility label (no stable testTag — UUID-based).
# Maestro matches a content description through `text`, which is what it exposes.
- tapOn:
    text: "Delete"
- extendedWaitUntil:
    notVisible:
      text: "https://example.com/to-delete"
    timeout: 5000
