# Attachments: deleting an attachment removes it from the list.
appId: com.singularity.todo
name: attachments-delete
tags:
  - attachments
  - scenario:ATTACH-02
---
# Seed a task.
# `due=today`: a task without a due date lands in the "No Date" bucket,
# which the Today tab does not show — the flow would assert against a task
# it had seeded and could not see.
- openLink: "todo-debug://seed?task=${RUN_ID}_DeleteAttachTask2026&due=today"
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000

# Open task detail and add an attachment.
- tapOn:
    id: nav_tab_inbox
- extendedWaitUntil:
    visible:
      id: task_item_${RUN_ID}_deleteattachtask2026
    timeout: 8000
- tapOn:
    id: task_item_${RUN_ID}_deleteattachtask2026
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 5000
- scrollUntilVisible:
    element:
      id: attachments_add_file_row
    direction: DOWN
    timeout: 8000
- tapOn:
    id: attachments_add_file_row
- extendedWaitUntil:
    visible:
      id: attachments_url_input
    timeout: 5000
- tapOn:
    id: attachments_url_input
- inputText: "https://example.com/to-delete"
- tapOn:
    id: attachments_add_url_button

# Verify attachment is present.
- extendedWaitUntil:
    visible:
      text: "https://example.com/to-delete"
    timeout: 5000

# Open the attachments sheet again.
- scrollUntilVisible:
    element:
      id: attachments_add_file_row
    direction: DOWN
    timeout: 8000
- tapOn:
    id: attachments_add_file_row
- extendedWaitUntil:
    visible:
      id: attachments_url_input
    timeout: 5000

# Delete the attachment by its accessibility label (no stable testTag — UUID-based).
# Maestro matches a content description through `text`, which is what it exposes.
- tapOn:
    text: "Delete"
- extendedWaitUntil:
    notVisible:
      text: "https://example.com/to-delete"
    timeout: 5000
