# Attachments: deleting an attachment removes it from the list.
# прогнан на устройстве: да (2026-11-06) — realme RMX3938, 0O65321F32204DD5
appId: com.singularity.todo
name: attachments-delete
tags:
  - attachments
  - scenario:ATTACH-02
---
# Seed a task.
# No `due=`: the task is undated, so it lands in the Inbox tab's "No Date"
# section — the inbox is the tab of the tasks that are not dated yet, and the
# flow looks the task up there.
- runFlow:
    file: ../../helpers/seed-and-open-task.yaml
    env:
      QUERY: "task=DeleteAttachTask2026"
      TASK_ID: task_item_deleteattachtask2026
- runFlow: ../../helpers/open-attachments-sheet.yaml
- tapOn:
    id: attachments_url_input
- inputText: "https://example.com/to-delete"
- tapOn:
    id: attachments_add_url_button

# The pick that opened the sheet also opened the section; reveal its rows.
- runFlow: ../../helpers/reveal-attachments-section.yaml
- extendedWaitUntil:
    visible:
      text: "https://example.com/to-delete"
    timeout: 5000

# The attachment is deleted from the tile it is drawn as, not from the sheet:
# the sheet is the way in for a task that has none, and this one now has one, so
# its "Add file" row is on the screen already (a section with content is not in
# the `+ Ещё` sheet).
#
# The tile's delete button carries a content description and no stable testTag —
# the attachment id is a UUID — and Maestro exposes a content description as
# `text`.
- tapOn:
    text: "Delete attachment"
- extendedWaitUntil:
    notVisible:
      text: "https://example.com/to-delete"
    timeout: 5000
