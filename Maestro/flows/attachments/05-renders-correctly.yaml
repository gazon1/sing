# Attachments: a URL attachment renders title, URL text, and link icon.
# прогнан на устройстве: да (2026-11-06) — realme RMX3938, 0O65321F32204DD5
appId: com.singularity.todo
name: attachments-renders-correctly
tags:
  - attachments
  - scenario:ATTACH-05
---
# Seed a task and add an attachment.
# No `due=`: the task is undated, so it lands in the Inbox tab's "No Date"
# section — the inbox is the tab of the tasks that are not dated yet, and the
# flow looks the task up there.
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=RenderTestTask2026"

- tapOn:
    id: nav_tab_inbox
- extendedWaitUntil:
    visible:
      id: task_item_rendertesttask2026
    timeout: 8000
- tapOn:
    id: task_item_rendertesttask2026
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 5000
# The row is at the bottom of the task, below the fold. DOWN scrolls the content
# up so what is below comes into view; UP moves it the other way.
- scrollUntilVisible:
    element:
      id: attachments_add_file_row
    direction: DOWN
    timeout: 8000
- tapOn:
    id: attachments_add_file_row
- extendedWaitUntil:
    visible:
      id: attachments_url_input
    timeout: 5000
- tapOn:
    id: attachments_url_input
- inputText: "https://example.com/render-test"
- tapOn:
    id: attachments_title_input
- inputText: "Render Test Article"
- tapOn:
    id: attachments_add_url_button

# Verify the attachment row renders correctly: title, URL text, and delete affordance.
- extendedWaitUntil:
    visible:
      text: "Render Test Article"
    timeout: 5000
- assertVisible: "https://example.com/render-test"

# The delete button is present via its accessibility label.
- assertVisible:
    text: "Delete attachment"

# No "open" affordance should be present for URL attachments (URL has no file behind it).
# The attachment card in the section has link icon (not image/file icon).
- assertVisible:
    id: attachments_add_file_row
