# Attachments: submitting an empty URL does not add an attachment.
appId: com.singularity.todo
name: attachments-empty-url-rejected
tags:
  - attachments
  - negative
  - scenario:ATTACH-03
---
# Seed a task.
# `due=today`: a task without a due date lands in the "No Date" bucket,
# which the Today tab does not show — the flow would assert against a task
# it had seeded and could not see.
- openLink: "todo-debug://seed?task=${RUN_ID}_EmptyUrlTask2026&due=today"
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000

# Open task detail.
- tapOn:
    id: nav_tab_inbox
- extendedWaitUntil:
    visible:
      id: task_item_${RUN_ID}_emptyurltask2026
    timeout: 8000
- tapOn:
    id: task_item_${RUN_ID}_emptyurltask2026
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 5000

# Open attachments sheet.
- scrollUntilVisible:
    element:
      id: attachments_add_file_row
    direction: DOWN
    timeout: 8000
- tapOn:
    id: attachments_add_file_row
- extendedWaitUntil:
    visible:
      id: attachments_url_input
    timeout: 5000

# The Add URL button should be disabled when the URL field is empty.
# A disabled button may or may not be tappable — verify nothing was added
# by trying to add with blank URL and checking the list stays empty.
# Since the URL field is empty, tapping Add URL does nothing.
- assertNotVisible:
    id: attachments_add_url_button

# Verify the sheet is still open with the empty URL field.
- assertVisible:
    id: attachments_url_input
