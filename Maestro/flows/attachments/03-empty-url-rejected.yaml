# Attachments: submitting an empty URL does not add an attachment.
appId: com.singularity.todo
name: attachments-empty-url-rejected
tags:
  - attachments
  - negative
  - scenario:ATTACH-03
---
# Seed a task.
# `due=today`: a task without a due date lands in the "No Date" bucket,
# which the Today tab does not show — the flow would assert against a task
# it had seeded and could not see.
- openLink: "todo-debug://seed?task=${RUN_ID}_EmptyUrlTask2026&due=today"
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000

# Open task detail.
- tapOn:
    id: nav_tab_inbox
- extendedWaitUntil:
    visible:
      id: task_item_${RUN_ID}_emptyurltask2026
    timeout: 8000
- tapOn:
    id: task_item_${RUN_ID}_emptyurltask2026
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 5000

# Open attachments sheet.
# The row is at the bottom of the task, below the fold. UP is the direction that
# brings what is below into view; DOWN moves the content down and away from it.
- scrollUntilVisible:
    element:
      id: attachments_add_file_row
    direction: UP
    timeout: 8000
- tapOn:
    id: attachments_add_file_row
- extendedWaitUntil:
    visible:
      id: attachments_url_input
    timeout: 5000

# The Add URL button is disabled while the URL field is empty, so nothing can be
# added. A disabled control is still on screen — asserting that the button is
# *not visible* fails on a correct app — so the claim to check is the one this
# flow means: the sheet's list is still empty.
- assertVisible:
    text: "No attachments yet"

# Verify the sheet is still open with the empty URL field.
- assertVisible:
    id: attachments_url_input
