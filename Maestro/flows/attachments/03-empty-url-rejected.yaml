# Attachments: submitting an empty URL does not add an attachment.
# прогнан на устройстве: да (2026-11-06) — realme RMX3938, 0O65321F32204DD5
appId: com.singularity.todo
name: attachments-empty-url-rejected
tags:
  - attachments
  - negative
  - scenario:ATTACH-03
---
# Seed a task.
# No `due=`: the task is undated, so it lands in the Inbox tab's "No Date"
# section — the inbox is the tab of the tasks that are not dated yet, and the
# flow looks the task up there.
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=EmptyUrlTask2026"

# Open task detail.
- tapOn:
    id: nav_tab_inbox
- extendedWaitUntil:
    visible:
      id: task_item_emptyurltask2026
    timeout: 8000
- tapOn:
    id: task_item_emptyurltask2026
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 5000

# Open attachments sheet.
# The row is at the bottom of the task, below the fold. DOWN scrolls the content
# up so what is below comes into view; UP moves it the other way.
- scrollUntilVisible:
    element:
      id: attachments_add_file_row
    direction: DOWN
    timeout: 8000
- tapOn:
    id: attachments_add_file_row
- extendedWaitUntil:
    visible:
      id: attachments_url_input
    timeout: 5000

# The Add URL button is disabled while the URL field is empty, so nothing can be
# added. A disabled control is still on screen — asserting that the button is
# *not visible* fails on a correct app — so the claim to check is the one this
# flow means: the sheet's list is still empty.
- assertVisible:
    text: "No attachments yet"

# Verify the sheet is still open with the empty URL field.
- assertVisible:
    id: attachments_url_input
