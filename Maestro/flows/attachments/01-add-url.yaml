# Attachments: adding a URL attachment makes it appear on the task.
# прогнан на устройстве: нет (2026-11-04) — прогон на устройстве не выполнялся
appId: com.singularity.todo
name: attachments-add-url
tags:
  - attachments
  - scenario:ATTACH-01
---
# Seed a task to attach to.
# No `due=`: the task is undated, so it lands in the Inbox tab's "No Date"
# section — the inbox is the tab of the tasks that are not dated yet, and the
# flow looks the task up there.
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=AttachTestTask2026"

# Open the task detail.
- tapOn:
    id: nav_tab_inbox
- extendedWaitUntil:
    visible:
      id: task_item_attachtesttask2026
    timeout: 8000
- tapOn:
    id: task_item_attachtesttask2026
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 5000

# Open the attachments sheet via the "+ Add file" row.
# The row is at the bottom of the task, below the fold. UP is the direction that
# brings what is below into view; DOWN moves the content down and away from it.
- scrollUntilVisible:
    element:
      id: attachments_add_file_row
    direction: UP
    timeout: 8000
- tapOn:
    id: attachments_add_file_row
- extendedWaitUntil:
    visible:
      id: attachments_url_input
    timeout: 5000

# Add a URL attachment.
- tapOn:
    id: attachments_url_input
- inputText: "https://example.com/article"
- tapOn:
    id: attachments_title_input
- inputText: "Example Article"
- tapOn:
    id: attachments_add_url_button

# Sheet closes automatically after adding. Verify the attachment appears
# in the task detail section (shows link icon, title, delete button).
- extendedWaitUntil:
    visible:
      text: "Example Article"
    timeout: 5000
- assertVisible:
    text: "https://example.com/article"
