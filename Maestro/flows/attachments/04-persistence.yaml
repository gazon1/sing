# Attachments: an attachment persists after app restart.
appId: com.singularity.todo
name: attachments-persistence
tags:
  - attachments
  - scenario:ATTACH-04
---
# Seed a task and add an attachment.
- openLink: "todo-debug://seed?task=${RUN_ID}_PersistenceTask2026"
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000

- tapOn:
    id: nav_tab_inbox
- extendedWaitUntil:
    visible:
      id: task_item_${RUN_ID}_persistencetask2026
    timeout: 5000
- tapOn:
    id: task_item_persistencetask2026
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 5000
- scrollUntilVisible:
    element:
      id: attachments_add_file_row
    direction: DOWN
    timeout: 5000
- tapOn:
    id: attachments_add_file_row
- extendedWaitUntil:
    visible:
      id: attachments_url_input
    timeout: 5000
- tapOn:
    id: attachments_url_input
- inputText: "https://example.com/persist"
- tapOn:
    id: attachments_add_url_button
- extendedWaitUntil:
    visible:
      text: "https://example.com/persist"
    timeout: 5000

# Force restart the app.
- launchApp:
    appId: com.singularity.todo
    clearState: false
    stopApp: true
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000

# Navigate to the task again.
- tapOn:
    id: nav_tab_inbox
- extendedWaitUntil:
    visible:
      id: task_item_${RUN_ID}_persistencetask2026
    timeout: 5000
- tapOn:
    id: task_item_persistencetask2026
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 5000
- scrollUntilVisible:
    element:
      id: attachments_add_file_row
    direction: DOWN
    timeout: 5000

# Verify the attachment is still present.
- extendedWaitUntil:
    visible:
      text: "https://example.com/persist"
    timeout: 5000
