# Attachments: an attachment persists after app restart.
# прогнан на устройстве: да (2026-11-06) — realme RMX3938, 0O65321F32204DD5
appId: com.singularity.todo
name: attachments-persistence
tags:
  - attachments
  - scenario:ATTACH-04
---
# Seed a task and add an attachment.
- runFlow:
    file: ../../helpers/seed-and-open-task.yaml
    env:
      QUERY: "task=PersistenceTask2026"
      TASK_ID: task_item_persistencetask2026
- runFlow: ../../helpers/open-attachments-sheet.yaml
- tapOn:
    id: attachments_url_input
- inputText: "https://example.com/persist"
- tapOn:
    id: attachments_add_url_button
- extendedWaitUntil:
    visible:
      text: "https://example.com/persist"
    timeout: 5000

# Force restart the app — the sanctioned restart, which keeps the database.
- runFlow: ../../helpers/relaunch.yaml
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000

# Navigate to the task again.
- runFlow:
    file: ../../helpers/open-task.yaml
    env:
      TASK_ID: task_item_persistencetask2026

# The row is at the bottom of the task, below the fold. DOWN scrolls the content
# up so what is below comes into view; UP moves it the other way.
- scrollUntilVisible:
    element:
      id: attachments_add_file_row
    direction: DOWN
    timeout: 8000

# Verify the attachment is still present.
- extendedWaitUntil:
    visible:
      text: "https://example.com/persist"
    timeout: 5000
