# Notes: edit a note's body and see it survive a round trip.
#
# The note is created through the quick-add row. The quick-add's event is
# `NavigateToEditor`, so the editor opens right after the note is created —
# there is no preview in between.
#
# The editor autosaves, so what this asserts is that the body is still there
# after the app is restarted and the note is opened again.
#
# Opening a note from the list opens its *preview*, not its editor: the editor
# is reached from the preview's Edit action. The body is therefore asserted in
# the preview, where it is rendered read-only.
#
# The title carries ${RUN_ID} so the runner's per-attempt sweep can find
# exactly this run's row and remove it.
appId: com.singularity.todo
name: notes-edit-body
tags:
  - smoke
  - regression
  - notes
---
- runFlow: ../../helpers/launch-clean.yaml
- tapOn:
    id: nav_menu_button
- scrollUntilVisible:
    element:
      id: menu_notes
    direction: DOWN
    timeout: 5000
- tapOn:
    id: menu_notes
- extendedWaitUntil:
    visible:
      id: notes_quick_add_input
    timeout: 5000
- tapOn:
    id: notes_quick_add_input
- inputText: "${RUN_ID} Meeting notes"
- pressKey: Enter
# The quick-add creates the note and opens its editor.
- extendedWaitUntil:
    visible:
      id: note_editor_title_input
    timeout: 5000
- tapOn:
    id: note_editor_body
- inputText: "Discuss roadmap"
- hideKeyboard
# The editor autosaves; saving does not leave the editor.
- tapOn:
    id: note_editor_save
- back
# Reload to verify the body survives a full process restart.
- runFlow: ../../helpers/relaunch.yaml
- tapOn:
    id: nav_menu_button
- scrollUntilVisible:
    element:
      id: menu_notes
    direction: DOWN
    timeout: 5000
- tapOn:
    id: menu_notes
- extendedWaitUntil:
    visible:
      id: notes_quick_add_input
    timeout: 5000
# The row is addressed by the title the flow typed: the id is a generated
# ULID, which the flow never learns. The title-based tag sits on the item's
# outer node — a Material3 Card merges its descendants, so a tag inside the
# card would be invisible to the accessibility tree this flow drives.
- scrollUntilVisible:
    element:
      id: note_item_by_title_${RUN_ID}_meeting_notes
    direction: DOWN
    timeout: 8000
- tapOn:
    id: note_item_by_title_${RUN_ID}_meeting_notes
# The preview is where the body is rendered. Its actions sit at the bottom of
# a read-only page, which is below the fold on a phone viewport — so the action
# is scrolled into view before it is asserted.
- scrollUntilVisible:
    element:
      id: note_action_edit
    direction: DOWN
    timeout: 8000
- assertVisible:
    id: note_action_edit
- assertVisible:
    text: "Discuss roadmap"
- back
