# Notes: the All / Pinned / Archived filter chips switch the visible set.
#
# Two notes, neither pinned or archived, so Pinned and Archived must come up
# empty while All shows both.
#
# Both titles carry ${RUN_ID} so the runner's per-attempt sweep can find
# exactly this run's rows and remove them — and so the title-based tags the
# flow addresses carry the same prefix.
appId: com.singularity.todo
name: notes-filter-chips
tags:
  - smoke
  - regression
  - notes
---
- runFlow: ../../helpers/launch-clean.yaml
- tapOn:
    id: nav_menu_button
- scrollUntilVisible:
    element:
      id: menu_notes
    direction: DOWN
    timeout: 5000
- tapOn:
    id: menu_notes
- extendedWaitUntil:
    visible:
      id: notes_quick_add_input
    timeout: 5000
- tapOn:
    id: notes_quick_add_input
- inputText: "${RUN_ID} Alpha"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: note_editor_title_input
    timeout: 5000
- tapOn:
    id: note_editor_save
- back
- extendedWaitUntil:
    visible:
      id: notes_quick_add_input
    timeout: 5000
- tapOn:
    id: notes_quick_add_input
- inputText: "${RUN_ID} Beta"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: note_editor_title_input
    timeout: 5000
- tapOn:
    id: note_editor_save
- back
# All: both notes.
- extendedWaitUntil:
    visible:
      id: note_item_by_title_${RUN_ID}_alpha
    timeout: 8000
- assertVisible:
    id: note_item_by_title_${RUN_ID}_beta
# Pinned: neither is pinned.
- tapOn:
    id: note_filter_chip_pinned
- extendedWaitUntil:
    notVisible:
      id: note_item_by_title_${RUN_ID}_alpha
    timeout: 8000
# Archived: neither is archived.
- tapOn:
    id: note_filter_chip_archived
- extendedWaitUntil:
    notVisible:
      id: note_item_by_title_${RUN_ID}_alpha
    timeout: 8000
# Back to All restores them.
- tapOn:
    id: note_filter_chip_all
- extendedWaitUntil:
    visible:
      id: note_item_by_title_${RUN_ID}_alpha
    timeout: 8000
