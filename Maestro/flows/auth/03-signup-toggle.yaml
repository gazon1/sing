# AUTH-SIGNUP-01: toggle to sign-up mode, submit, and reach the agenda.
#
# preconditions: server configured, StubAuthRepository signed-in session.
# steps:
#   1. Switch to creating an account (toggle mode).
#   2. Enter valid-looking details and submit.
#   3. Verify the user lands on the agenda (session is SignedIn).
#
appId: com.singularity.todo
name: auth-signup-toggle
tags:
  - regression
  - auth
  - AUTH-SIGNUP-01
---
# Start from server-config (clear state → configure → continue offline).
- launchApp:
    appId: com.singularity.todo
    clearState: true
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible:
      id: auth_save_server_button
    timeout: 15000
- scrollUntilVisible:
    element:
      id: auth_save_server_button
    direction: DOWN
    timeout: 5000
- tapOn:
    id: auth_save_server_button
- extendedWaitUntil:
    visible:
      id: auth_email_input
    timeout: 15000

# Toggle from "Sign In" to "Sign Up". The button text changes and the
# form fields stay filled.
- tapOn:
    id: auth_toggle_mode_button

# After toggling, the button should say "Sign Up" (not "Sign In").
# The email and password fields are cleared on toggle.
- inputText:
    id: auth_email_input
    text: "newuser@example.com"
- inputText:
    id: auth_password_input
    text: "ValidPassword123!"

# Submit. If credentials are real, Supabase creates the account.
# If not, the server returns an error — either way the form interaction
# is covered.
- tapOn:
    id: auth_sign_in_button

# The app either enters a loading state or shows a message/error.
# Wait for the loading spinner — if it never appears the message/error tag shows instead.
- extendedWaitUntil:
    visible:
      id: auth_loading
    timeout: 8000

# AUTH-SIGNUP-01 happy path: after sign-up the session is SignedIn and the
# auth guard lets the user into the agenda (StubAuthRepository is always SignedIn).
# Verify the agenda tabs are visible — the user is NOT still on the auth screen.
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000
- assertVisible:
    id: nav_tab_today
- assertVisible:
    id: nav_tab_inbox
