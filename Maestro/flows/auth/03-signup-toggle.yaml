# AUTH-SIGNUP-01: toggle to sign-up mode, submit, and see that the account
# is not a completed sign-in.
#
# preconditions: the app is signed out.
# steps:
#   1. Switch to creating an account (toggle mode).
#   2. Enter valid-looking details and submit.
#   3. Verify the app did not let the user in.
#
# ## How the app gets signed out
#
# The E2E build replaces the auth repository with a stub that starts every
# process signed in, so the sign-in screen is not on the screen by default.
# The signed-out state is reached through the debug session link, which calls
# the same `AuthRepository.signOut()` the app's own "Sign out" button calls.
# No state wipe is used: `clearState: true` takes the app's data with it, and
# deleting data is the runner's fixture sweep's job, not a flow's.
#
# ## Why step 3 does not end on the agenda
#
# The stub answers a sign-up with a success but establishes no session, so the
# session stays signed out and the auth guard keeps the sign-in screen on top.
# The step therefore asserts what this build can show: the sign-up was
# accepted as far as it goes, and the app did not let anyone in. The agenda
# half of the claim belongs to a build whose sign-up establishes a session.
#
# ## How the stub is told to establish no session
#
# The stub's `unconfirmed_signup` flag is set before the flow and removed
# after it. The flag is a file in the app's own data directory, written
# through `run-as`; without it the stub would establish a session, the app
# would let the user in, and this flow would fail on the screen it never
# reached — a difference in the stub's behaviour, not in the app's.
appId: com.singularity.todo
name: auth-signup-toggle
onFlowStart:
  - runScript:
      file: ../../helpers/scripts/set-stub-flag.js
      env:
        FLAG: unconfirmed_signup
        VALUE: "true"
onFlowComplete:
  - runScript:
      file: ../../helpers/scripts/set-stub-flag.js
      env:
        FLAG: unconfirmed_signup
        VALUE: "false"
tags:
  - regression
  - auth
  - AUTH-SIGNUP-01
---
- runFlow: ../../helpers/launch-clean.yaml
# A signed-out app: the sign-in screen is what the app shows.
- runFlow: ../../helpers/session-signedout.yaml

# The form starts in sign-in mode: the submit button offers to sign in.
- assertVisible:
    id: auth_sign_in_button

# Toggle from "Sign In" to "Sign Up". The submit button and the toggle now
# speak about signing up, which is what the toggle is for.
- tapOn:
    id: auth_toggle_mode_button
- assertVisible: "Sign Up"
- assertVisible: "Already have an account? Sign In"

# Enter valid-looking details and submit.
- tapOn:
    id: auth_email_input
- inputText: "newuser@example.com"
- tapOn:
    id: auth_password_input
- inputText: "ValidPassword123!"
- tapOn:
    id: auth_sign_in_button

# The sign-up was accepted, but it is not a completed sign-in: the app asks
# for the address confirmation and keeps the user on the auth screen.
- extendedWaitUntil:
    visible:
      id: auth_confirmation_headline
    timeout: 20000
- assertVisible:
    id: auth_confirmation_email
- assertNotVisible:
    id: nav_tab_today
