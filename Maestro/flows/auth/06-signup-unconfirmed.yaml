# AUTH-SIGNUP-02: a sign-up whose address still needs confirmation is not a completed sign-up.
#
# Verifies that after a successful sign-up with email confirmation required:
#   1. The user is told the account was created and to check their mail.
#   2. The user is NOT taken into the application as a signed-in user.
#   3. The outcome is NOT presented as a failure.
#
# The stubbed auth repository in the test APK is configured to return
# Session.SignedOut after sign-up when the system property
# `debug.stub_auth.unconfirmed_signup` is set. The property is set before the
# flow and cleared after it, so the flow does not depend on somebody having
# set it by hand and no other flow inherits it.
#
# preconditions: the app is signed out.
# steps:
#   1. Toggle to sign-up mode.
#   2. Enter valid credentials and submit.
#   3. Verify the "check your mail" message is shown.
#   4. Verify the user stays on the auth screen (auth guard active).
#
# The signed-out state is reached through the debug session link, which calls
# the same `AuthRepository.signOut()` the app's own "Sign out" button calls.
# No state wipe is used: `clearState: true` takes the app's data with it, and
# deleting data is the runner's fixture sweep's job, not a flow's.
#
appId: com.singularity.todo
name: auth-signup-unconfirmed
onFlowStart:
  - runScript:
      file: ../../helpers/scripts/setprop.js
      env:
        PROP: debug.stub_auth.unconfirmed_signup
        VALUE: "true"
onFlowComplete:
  - runScript:
      file: ../../helpers/scripts/setprop.js
      env:
        PROP: debug.stub_auth.unconfirmed_signup
        VALUE: "false"
tags:
  - regression
  - auth
  - scenario:AUTH-SIGNUP-02
---
- runFlow: ../../helpers/launch-clean.yaml

# A signed-out app: the sign-in screen is what the app shows.
- runFlow: ../../helpers/session-signedout.yaml

# Toggle from "Sign In" to "Sign Up" mode.
- tapOn:
    id: auth_toggle_mode_button

# Enter valid credentials and submit.
# The stub, with debug.stub_auth.unconfirmed_signup=true, leaves the session
# signed out after this call — simulating a Supabase sign-up with email
# confirmation required.
- inputText:
    id: auth_email_input
    text: "newuser@example.com"
- inputText:
    id: auth_password_input
    text: "ValidPassword123!"
- tapOn:
    id: auth_sign_in_button

# Wait for the "Check your email" screen — AUTH-SIGNUP-02 expects this
# neutral message, NOT an error. The headline is the tagged part of the
# confirmation screen: the message under it is untagged, and the form's own
# message slot is not on the screen once the form is replaced.
- extendedWaitUntil:
    visible:
      id: auth_confirmation_headline
    timeout: 20000

# Verify the auth guard keeps the user on the auth screen in the
# AwaitingEmailConfirmation state — the user should NOT be navigated
# to the agenda/home. The form fields are replaced by ConfirmationPendingContent.
- assertVisible:
    id: auth_confirmation_email
- assertNotVisible:
    id: auth_error_text

# AUTH-SIGNUP-02 verified: account created, check mail shown, user stayed
# on the auth screen and was not let in as signed-in.
