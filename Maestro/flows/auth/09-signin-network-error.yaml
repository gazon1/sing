# AUTH-FAIL-02: sign-in with no network shows a user-facing error.
#
# preconditions: emulator running, real Supabase auth (not StubAuthRepository).
# steps:
#   1. Enable airplane mode (no network).
#   2. Attempt to sign in.
#   3. Verify the error message is shown.
#
# Airplane mode is set with Maestro's own `setAirplaneMode` command; see
# 08-signup-network-error.yaml for why the earlier `exec` form was wrong.
#
# ## Why this flow is not in the `auth` suite
#
# The E2E build replaces the auth repository with a stub, and a stub has no
# network to lose: the failure this flow is about cannot happen there. The
# flow therefore carries the `auth-live` tag instead of `auth` — the tag says
# which suite a flow belongs to, and the `auth` suite is the one the E2E build
# can run. `auth-live` is run by hand, against a build with the real provider
# (`manual` says the same thing).
appId: com.singularity.todo
name: auth-signin-network-error
tags:
  - auth-live
  - scenario:AUTH-FAIL-02
  - manual
---
- setAirplaneMode:
    value: enabled

- waitForAnimationToEnd:
    timeout: 1500

- launchApp:
    appId: com.singularity.todo
    clearState: true
    permissions:
      notifications: allow

- extendedWaitUntil:
    visible:
      id: auth_save_server_button
    timeout: 30000
- scrollUntilVisible:
    element:
      id: auth_save_server_button
    direction: DOWN
    timeout: 30000
- tapOn:
    id: auth_save_server_button

- extendedWaitUntil:
    visible:
      id: auth_email_input
    timeout: 5000

# Enter credentials and submit while in airplane mode.
- tapOn:
    id: auth_email_input
- inputText: "networkfail@example.com"
- tapOn:
    id: auth_password_input
- inputText: "ValidPassword123!"

- tapOn:
    id: auth_sign_in_button

# The app should show a network error.
- extendedWaitUntil:
    visible:
      id: auth_error_text
    timeout: 20000
- assertVisible:
    id: auth_error_text

# Cleanup: restore network.
- setAirplaneMode:
    value: disabled
