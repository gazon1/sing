# AUTH-FAIL-01: sign-up with no network shows a user-facing error.
#
# preconditions: emulator running, StubAuthRepository bypassed (real auth).
# steps:
#   1. Enable airplane mode (no network).
#   2. Attempt to sign up.
#   3. Verify the error message is shown.
#
# Airplane mode is set with Maestro's own `setAirplaneMode` command, which
# needs no shell and no workstation access — the earlier `exec` form of this
# flow could not even be parsed, because `exec` is not a Maestro command.
#
# For StubAuthRepository (test builds): network errors are not reachable;
# use this flow with the real `SupabaseAuthRepository` to test failure axes.
appId: com.singularity.todo
name: auth-signup-network-error
tags:
  - regression
  - auth
  - AUTH-FAIL-01
  - manual
---
# Enable airplane mode — blocks all network, forcing a timeout on sign-up.
- setAirplaneMode:
    value: enabled

# Give the OS a moment to apply airplane mode.
- waitForAnimationToEnd:
    timeout: 1500

# Launch and clear any cached session state.
- launchApp:
    appId: com.singularity.todo
    clearState: true
    permissions:
      notifications: allow

# Configure server so the sign-up screen is reachable.
- extendedWaitUntil:
    visible:
      id: auth_save_server_button
    timeout: 30000
- scrollUntilVisible:
    element:
      id: auth_save_server_button
    direction: DOWN
    timeout: 30000
- tapOn:
    id: auth_save_server_button

# Toggle to sign-up mode.
- extendedWaitUntil:
    visible:
      id: auth_email_input
    timeout: 5000
- tapOn:
    id: auth_toggle_mode_button

# Enter credentials and submit while in airplane mode.
- inputText:
    id: auth_email_input
    text: "networkfail@example.com"
- inputText:
    id: auth_password_input
    text: "ValidPassword123!"

- tapOn:
    id: auth_sign_in_button

# The app should show an error (network timeout or connection refused).
# StubAuthRepository always succeeds — this flow tests the real auth path.
- extendedWaitUntil:
    visible:
      id: auth_error_text
    timeout: 20000
- assertVisible:
    id: auth_error_text

# Cleanup: restore network for subsequent flows.
- setAirplaneMode:
    value: disabled
