# AUTH-ATTACH-01: attach an email/password account to an anonymous session.
#
# preconditions: the app is in a local (anonymous) session, entered through
# the `session=anonymous` deep link below.
#
# The precondition used to read "StubAuthRepository starts in Anonymous session
# by default", and it does not: the stub reports `Session.SignedIn` from the
# first frame, so the flow spent its first ten seconds waiting for the
# "Attach account" button — which is rendered only for `Session.Anonymous` —
# and then failed. The wait was not slow; the element could not be there.
# The session link fixes the precondition instead of weakening the assertion.
#
# steps:
#   1. Navigate to Settings → Account tab.
#   2. Tap "Attach account" button (visible only for Session.Anonymous).
#   3. Enter email/password and submit.
#   4. Verify navigation to agenda home.
#
appId: com.singularity.todo
name: auth-attach-account
tags:
  - regression
  - auth
  - scenario:AUTH-ATTACH-01
---
# Launch. The auth guard lets a session through to the agenda (no auth screen
# shown). The launch does not wipe the app's data: clearing the state would
# take the app's rows with it, and deleting data is the runner's fixture
# sweep's job, not a flow's.
- runFlow: ../../helpers/launch-clean.yaml

# Enter a local session. The attach affordance exists only for
# `Session.Anonymous`, and the E2E build starts `SignedIn`.
- openLink: "todo-debug://seed?session=anonymous"

# Verify the agenda is visible (Anonymous session is not blocked).
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000
- assertVisible:
    id: nav_tab_inbox

# Open the menu and navigate to Settings.
- tapOn:
    id: nav_menu_button
- extendedWaitUntil:
    visible:
      id: menu_settings
    timeout: 5000
- tapOn:
    id: menu_settings

# Switch to the Account tab. The settings navigation is a scrollable column
# and the Account tab is the last of its rows, so it is scrolled into view
# before it is tapped.
- runFlow: ../../helpers/settings-account-tab.yaml

# The "Attach account" button is only shown for Session.Anonymous.
- extendedWaitUntil:
    visible:
      id: auth_attach_account_button
    timeout: 8000

# Navigate to the attach screen.
- tapOn:
    id: auth_attach_account_button

# Verify the attach account screen is shown.
- extendedWaitUntil:
    visible:
      id: auth_attach_email_input
    timeout: 5000
- assertVisible:
    id: auth_attach_password_input
- assertVisible:
    id: auth_attach_submit_button

# The offline data has to be answered before the form can be submitted: the
# submit button stays disabled until a disposition is picked (REQ-UA-005 —
# neither outcome is a default). "Keep" is the choice that leaves the local
# rows where they are.
- tapOn:
    id: auth_attach_keep_button

# Enter credentials — the stubbed repository succeeds immediately.
- tapOn:
    id: auth_attach_email_input
- inputText: "alice@example.com"
# The keyboard covers the submit button on this screen, so it is hidden after
# each input — a tap that lands on the keyboard is a tap that does nothing.
- hideKeyboard
- tapOn:
    id: auth_attach_password_input
- inputText: "ValidPassword123!"
- hideKeyboard

# Submit.
- tapOn:
    id: auth_attach_submit_button

# After successful attach, the screen navigates to the agenda home.
# Wait for the loading state to clear.
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000

# Verify the user is on the agenda (not on the attach or settings screen).
- assertVisible:
    id: nav_tab_today
- assertVisible:
    id: nav_tab_inbox
