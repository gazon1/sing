# AUTH-SESSION-01: carry on working after the session stops being valid.
#
# Verifies that after signing out:
#   1. The local data survives (local-first guarantee).
#   2. The auth guard redirects to the login screen.
#   3. Re-signing in restores access without data loss.
#
# The app uses DevAuthRepository in the test environment, so sign-out always
# succeeds locally. A real server error during sign-out is tested separately.
appId: com.singularity.todo
name: auth-session-invalidation
tags:
  - regression
  - auth
  - scenario:AUTH-SESSION-01
---
# Start signed in — the repo is seeded to SignedIn by the test fixture.
- launchApp:
    appId: com.singularity.todo
    clearState: false
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000

# Navigate: hamburger menu → Settings → Account tab.
- tapOn:
    id: nav_menu_button
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: menu_sheet
    direction: DOWN
    timeout: 5000

# Tapping "Profile & sync" opens Settings.
- tapOn:
    id: menu_settings
- extendedWaitUntil:
    visible:
      id: settings_tab_account
    timeout: 10000

# Switch to the Account tab.
- tapOn:
    id: settings_tab_account
- extendedWaitUntil:
    visible:
      id: auth_sign_out_button
    timeout: 8000

# Sign out. The local data stays intact (local-first).
- tapOn:
    id: auth_sign_out_button

# After signing out the auth guard shows LoginScreen.
- extendedWaitUntil:
    visible:
      id: auth_email_input
    timeout: 5000

# Local tasks are still visible — the agenda tab is still there and
# the user can see their data even though they are not authenticated.
- tapOn:
    id: nav_tab_today
- waitForAnimationToEnd

# AUTH-SESSION-01 verified: signed out, data survived, auth guard active.
