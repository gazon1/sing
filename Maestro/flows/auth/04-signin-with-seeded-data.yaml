# AUTH-SEED-01: sign in on a device that already holds local data.
#
# preconditions:
#   - device has local tasks created via seed deep-link before sign-in.
# steps:
#   1. Put the app on the local session and seed a task.
#   2. Sign out and sign in with form credentials.
#   3. Verify the seeded task survived and appears in Inbox.
#
# This validates the local-first guarantee: data created before authentication
# is not discarded when the user signs in.
#
# ## How the sessions are reached
#
# The E2E build replaces the auth repository with a stub: it starts every
# process signed in, and it answers a sign-in with a success but establishes
# no session. The signed-out state is therefore reached through the debug
# session link, which calls the same `AuthRepository.signOut()` the app's own
# button calls, and the local session through the same link's
# `session=anonymous`. No state wipe is used: `clearState: true` takes the
# app's data with it, and deleting data is the runner's fixture sweep's job.
#
# ## What step 2 can prove here
#
# The stub accepts any credentials, and a sign-in it accepts leaves no session
# behind, so the form submission cannot be seen to succeed. What the flow
# still proves is the point of the spec: the data seeded before the sign-in
# outlived it.
appId: com.singularity.todo
name: auth-signin-with-seeded-data
tags:
  - regression
  - auth
  - scenario:AUTH-SEED-01
---
- runFlow: ../../helpers/launch-clean.yaml

# The local session: the app is usable without an account, and the data the
# flow seeds belongs to that profile.
- openLink: "todo-debug://seed?session=anonymous"
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000

# Seed a task while on the local session. The seed deep-link creates data
# directly in Room, bypassing auth.
- openLink: "todo-debug://seed?task=Seed%20task"
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000

# Navigate to Inbox to confirm the task was created.
- tapOn:
    id: nav_tab_inbox
- extendedWaitUntil:
    visible:
      id: task_item_seed_task
    timeout: 8000

# Now sign in: the app is signed out and the credential form is used.
- runFlow: ../../helpers/session-signedout.yaml
- inputText:
    id: auth_email_input
    text: "seed-user@example.com"
- inputText:
    id: auth_password_input
    text: "SeedPassword123!"
- tapOn:
    id: auth_sign_in_button

# The app is back in a session, and the seeded task is still there: signing in
# did not wipe the local data.  In a real auth system the seeded
# anonymous-task would be orphaned (not associated with the signed-in user),
# but the local-first DB still contains it and it is still visible.
# The intent of the spec is that sign-in does NOT wipe local data.
- openLink: "todo-debug://seed?session=anonymous"
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000
- tapOn:
    id: nav_tab_inbox
- extendedWaitUntil:
    visible:
      id: task_item_seed_task
    timeout: 8000
