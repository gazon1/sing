# AUTH-FIRSTRUN-01: use the app without an account, create data, go offline.
#
# preconditions: clean install, no account configured.
# steps:
#   1. Start the app and do not sign in.
#   2. Create a task.
#   3. Turn the network off and restart the app.
# expected: data survives offline restart without error.
#
# The app is local-first. Room is the source of truth; sync is a background
# concern. Without an account the app should still be fully functional.
appId: com.singularity.todo
name: auth-first-run-anonymous
onFlowComplete:
  - setAirplaneMode: disabled
tags:
  - regression
  - auth
  - AUTH-FIRSTRUN-01
---
- runFlow: ../../helpers/launch-clean.yaml

# Create a task. Seeded through the seed helper's DebugSeedActivity deep-link:
# seeding yields a deterministic fixture, independent of keyboard/IME behaviour.
#
# The title is fixed, and the seed replaces: seeding "Anonymous task" again
# updates the row this flow seeded instead of adding a second one. Room survives
# between runs on one emulator, and the offline restart below has to find this
# run's task, not a leftover from an earlier one — a replacing seed makes the
# leftover the same row.
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=Anonymous%20task"
- waitForAnimationToEnd

# The task appears in Inbox. Scroll to it: tasks from other runs may sit above it.
- tapOn:
    id: nav_tab_inbox
- scrollUntilVisible:
    element:
      id: "task_item_anonymous_task"
    direction: DOWN
    timeout: 8000

# Go offline and restart the app. The task must still be visible — local-first.
- setAirplaneMode: enabled
- launchApp:
    appId: com.singularity.todo
    clearState: false
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000
# The restart lands on Today. This task is undated, so Inbox is the only tab that
# lists it — assert on nav_tab_today, not on the nav rail, which renders every tab
# regardless of which one is selected.
- tapOn:
    id: nav_tab_inbox
- scrollUntilVisible:
    element:
      id: "task_item_anonymous_task"
    direction: DOWN
    timeout: 8000

# No error was shown (the anonymous path has no sync guard to trip).
# The task survived the offline restart.
- assertVisible: "Anonymous task"