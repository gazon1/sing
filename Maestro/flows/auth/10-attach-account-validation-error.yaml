# AUTH-FAIL-03: attach-account form validation shows errors before submission.
#
# preconditions: the app is in a local (anonymous) session.
# steps:
#   1. Navigate to Settings → Account tab.
#   2. See the "Attach account" button (only visible for Anonymous sessions).
#   3. Tap it, enter empty credentials, submit.
#   4. Verify validation prevents submission.
#
# Note: the stubbed auth repository always succeeds for all auth operations,
# so network errors cannot be triggered through it. This flow tests the
# form validation guard (empty fields are rejected client-side).
appId: com.singularity.todo
name: auth-attach-account-validation-error
tags:
  - regression
  - auth
  - scenario:AUTH-FAIL-03
---
# Launch. The launch does not wipe the app's data: clearing the state would
# take the app's rows with it, and deleting data is the runner's fixture
# sweep's job, not a flow's.
- runFlow: ../../helpers/launch-clean.yaml

# Enter a local session: the attach affordance exists only for
# `Session.Anonymous`, and the E2E build starts `SignedIn`.
- openLink: "todo-debug://seed?session=anonymous"

# Wait for the agenda tabs to appear — the Anonymous session is not blocked
# by the auth screen.
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000

# Navigate to Settings via the menu.
- tapOn:
    id: nav_menu_button
- extendedWaitUntil:
    visible:
      id: menu_settings
    timeout: 5000
- tapOn:
    id: menu_settings

# Navigate to the Account settings tab. The settings navigation is a
# scrollable column and the Account tab is the last of its rows, so it is
# scrolled into view before it is tapped.
- runFlow: ../../helpers/settings-account-tab.yaml

# The "Attach account" button should be visible for Anonymous sessions.
- extendedWaitUntil:
    visible:
      id: auth_attach_account_button
    timeout: 8000
- tapOn:
    id: auth_attach_account_button

# The attach account screen should now be visible.
- extendedWaitUntil:
    visible:
      id: auth_attach_email_input
    timeout: 5000

# The offline data has to be answered before the form can be submitted: the
# submit button stays disabled until a disposition is picked (REQ-UA-005 —
# neither outcome is a default). "Keep" is the choice that leaves the local
# rows where they are. Without it the submit button is disabled for a second
# reason, and the flow would be testing the wrong guard.
- tapOn:
    id: auth_attach_keep_button

# Submit with empty fields — the submit button should be disabled
# (validation prevents submission when both fields are empty).
# Verify the button is disabled by checking it is not clickable / visible.
- assertVisible:
    id: auth_attach_email_input

# Enter only email (no password) — button should still be disabled.
- tapOn:
    id: auth_attach_email_input
- inputText: "user@example.com"
# The keyboard covers the submit button on this screen, so it is hidden after
# each input — a tap that lands on the keyboard is a tap that does nothing.
- hideKeyboard

# Password is empty — submit button should remain disabled.
# We can't directly assert a button is disabled in Maestro, but we can
# verify that tapping it does not trigger a navigation or error.
# The button should be disabled and not react to tap.
- tapOn:
    id: auth_attach_submit_button

# After 3 seconds, if the button was truly disabled, we should still be
# on the attach account screen (no error, no navigation).
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    id: auth_attach_email_input

# Enter a password too short — Supabase requires min 6 chars.
- tapOn:
    id: auth_attach_password_input
- inputText: "123"
- hideKeyboard

# Submit — should fail validation or return a form-error from the app.
- tapOn:
    id: auth_attach_submit_button

# Wait for an error message (either client-side or from the server).
- extendedWaitUntil:
    visible:
      id: auth_error_text
    timeout: 20000
- assertVisible:
    id: auth_error_text
