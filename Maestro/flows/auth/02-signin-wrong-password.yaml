# AUTH-SIGNIN-01 part 1: wrong password shows an error without revealing
# whether the account exists.
#
# preconditions: server configured, user on sign-in screen.
# steps:
#   1. Enter a wrong password.
#   2. Verify the error message is shown and the email is still in the form.
#
# This does NOT test the happy path (correct password) — that requires a real
# Supabase account and is marked skipped in CI without secrets.
#
appId: com.singularity.todo
name: auth-signin-wrong-password
tags:
  - regression
  - auth
  - AUTH-SIGNIN-01
---
# Start from a pre-authenticated snapshot and navigate to the auth screen.
# The emulator is pre-authenticated, so sign-in is not reachable directly.
# Clear state to force the server-config screen, configure, then sign out.
- launchApp:
    appId: com.singularity.todo
    clearState: true
    permissions:
      notifications: allow

# Configure server so the sign-in screen is reachable.
- extendedWaitUntil:
    visible:
      id: auth_save_server_button
    timeout: 15000
# URL and anon key from emulator prefs or CI secrets; tap Save to continue.
- tapOn:
    id: auth_save_server_button

# After server config, the app enters the signed-out state and shows
# the credential form directly (no server config needed on re-entry).
- extendedWaitUntil:
    visible:
      id: auth_email_input
    timeout: 15000

# Enter email and a deliberately wrong password.
- inputText:
    id: auth_email_input
    text: "test@example.com"
- inputText:
    id: auth_password_input
    text: "WrongPassword123!"

# Submit.
- tapOn:
    id: auth_sign_in_button

# The server must reject the wrong password. The error text is shown and
# the email address stays in the form (it does NOT get cleared on error).
- extendedWaitUntil:
    visible:
      id: auth_error_text
    timeout: 10000
- assertVisible:
    id: auth_email_input
