# AUTH-SIGNIN-01 part 1: wrong password shows an error without revealing
# whether the account exists.
#
# preconditions: the app is signed out.
# steps:
#   1. Enter a wrong password.
#   2. Verify the error message is shown and the email is still in the form.
#
# This does NOT test the happy path (correct password) — that requires a real
# Supabase account and is marked skipped in CI without secrets.
#
# ## How the wrong password is rejected
#
# The E2E build replaces the auth repository with a stub, so there is no
# server to reject a password. The stub answers a sign-in with a failure when
# its `signin_failure` flag is set — so the rejected password is produced the
# way the stub produces every other auth outcome. The flag is a file in the
# app's own data directory, written through `run-as` before the flow and
# removed after it, so no other flow inherits it.
#
# ## How the app gets signed out
#
# The stub starts every process signed in, so the sign-in screen is not on the
# screen by default. The signed-out state is reached through the debug session
# link, which calls the same `AuthRepository.signOut()` the app's own "Sign
# out" button calls. No state wipe is used: `clearState: true` takes the
# app's data with it, and deleting data is the runner's fixture sweep's job,
# not a flow's.
appId: com.singularity.todo
name: auth-signin-wrong-password
onFlowStart:
  - runScript:
      file: ../../helpers/scripts/set-stub-flag.js
      env:
        FLAG: signin_failure
        VALUE: "true"
onFlowComplete:
  - runScript:
      file: ../../helpers/scripts/set-stub-flag.js
      env:
        FLAG: signin_failure
        VALUE: "false"
tags:
  - regression
  - auth
  - scenario:AUTH-SIGNIN-01
---
- runFlow: ../../helpers/launch-clean.yaml
# A signed-out app: the sign-in screen is what the app shows.
- runFlow: ../../helpers/session-signedout.yaml

# Enter email and a deliberately wrong password.
- tapOn:
    id: auth_email_input
- inputText: "test@example.com"
- tapOn:
    id: auth_password_input
- inputText: "WrongPassword123!"

# Submit.
- tapOn:
    id: auth_sign_in_button

# The server must reject the wrong password. The error text is shown and
# the email address stays in the form (it does NOT get cleared on error).
- extendedWaitUntil:
    visible:
      id: auth_error_text
    timeout: 20000
- assertVisible:
    id: auth_email_input
