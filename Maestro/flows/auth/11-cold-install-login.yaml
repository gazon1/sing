# AUTH-FIRSTRUN-04: the login screen appears on a cold, empty install.
#
# preconditions: no account, no previous app data at all.
# steps:
#   1. Launch the app and do not touch anything.
#   2. Put the app in a signed-out session.
# expected: the login screen with "Continue Offline" appears, not a spinner.
#
# ## Why this flow exists at all
#
# `launch-clean.yaml` keeps `clearState: false` on purpose: clearing the
# state would take the app's data with it, and deleting data is the runner's
# fixture sweep's job, not a flow's. That decision is right for the flows
# that are about features, and it has one cost — the `Session.Loading →
# Session.SignedOut` transition was exercised by nothing at all.
#
# Then `restoreSession` lost both its bounds and its handler: PR #720 turned the
# no-token path into two DataStore reads, and a session store that hangs or throws
# left `AuthGuard` on `Session.Loading` for the whole life of the install. A device
# on an unfinishable launch screen is not a degraded experience, it is a bricked
# app, and the suite could not have seen it.
#
# The bug needs an empty secure store and a live local-owner store to reach, and a
# snapshot install has neither. This flow is the only one that starts from nothing,
# which makes it the only one that can.
#
# The timeout is REQ-UA-015's budget (10 s) plus margin for a cold start on a
# loaded host. Asserting the *absence* of a spinner would pass just as well and
# prove nothing: the spinner is what a broken launch shows, so only its replacement
# is evidence.
#
# ## How the signed-out app is reached, and what this flow can prove here
#
# The E2E build replaces the auth repository with a stub that starts every
# process signed in and never reads the session store, so the sign-in screen
# is not on the screen by default and the restore path the flow was written
# for is not the one this build runs. The signed-out state is therefore
# reached through the debug session link, which calls the same
# `AuthRepository.signOut()` the app's own "Sign out" button calls. What the
# flow proves here is the part that is reachable: the app comes up, it shows
# the login screen, and it shows no spinner.
appId: com.singularity.todo
name: auth-first-run-login-visible
tags:
  - regression
  - auth
  - scenario:AUTH-FIRSTRUN-04
---
- runFlow: ../../helpers/launch-clean.yaml

# A signed-out app: the login screen is what the app shows.
- runFlow: ../../helpers/session-signedout.yaml

# Present and usable, not merely rendered: a control that is on screen but
# disabled still leaves the user with no way in.
- assertVisible:
    id: auth_email_input
- assertVisible:
    id: auth_continue_offline_button

# The spinner is what a failed restore looks like, so it must be gone by now.
# Asserting its absence is the assertion that names the regression.
- assertNotVisible:
    id: loading_indicator
