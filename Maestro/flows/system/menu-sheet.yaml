# Smoke: the Menu bottom sheet opens and exposes every documented item.
#
# Visibility only — this does not navigate into each destination. It is the
# cheap regression net for the menu's structure, not a coverage of the
# screens behind it.
appId: com.singularity.todo
name: system-menu-sheet
tags:
  - smoke
  - system
---
- runFlow: ../../helpers/launch-clean.yaml
- tapOn:
    id: nav_menu_button
- extendedWaitUntil:
    visible:
      id: menu_sheet
    timeout: 5000

# Account section
- assertVisible:
    id: menu_profile_sync
- assertVisible:
    id: menu_profiles

# Search section
- assertVisible:
    id: menu_quick_search

# Destinations section
- assertVisible:
    id: menu_statistics
- assertVisible:
    id: menu_notes
- assertVisible:
    id: menu_ai_chat
- assertVisible:
    id: menu_search
- assertVisible:
    id: menu_archive
- assertVisible:
    id: menu_settings

- takeScreenshot: system/menu-sheet
