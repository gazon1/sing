# Smoke: the Menu bottom sheet opens and exposes every documented item.
#
# Visibility only — this does not navigate into each destination. It is the
# cheap regression net for the menu's structure, not a coverage of the
# screens behind it.
appId: com.singularity.todo
name: system-menu-sheet
tags:
  - smoke
  - system
---
- runFlow: ../../helpers/launch-clean.yaml
- runFlow: ../../helpers/open-app-menu.yaml
# The sheet renders in its own window; the first menu item is the reliable
# signal that it is open and interactive.
- extendedWaitUntil:
    visible:
      id: menu_settings
    timeout: 5000

# Account section
- assertVisible:
    id: menu_settings
- assertVisible:
    id: menu_profiles

# Search section
- assertVisible:
    id: menu_quick_search

# Destinations section — the lower items are below the fold on a 1080x2400 screen
- scrollUntilVisible:
    element:
      id: menu_aichat
    direction: DOWN
    timeout: 5000
- assertVisible:
    id: menu_statistics
- assertVisible:
    id: menu_notes
- assertVisible:
    id: menu_aichat
# Search and Archive sit above Settings in the sheet (`menu_search` is not an
# entry at all: the Search destination is its own section, addressed by
# `menu_quick_search` above, and the destination list runs Statistics -> Pomodoro).
- scrollUntilVisible:
    element:
      id: menu_archive
    direction: DOWN
    timeout: 5000
- assertVisible:
    id: menu_archive
- scrollUntilVisible:
    element:
      id: menu_settings
    direction: DOWN
    timeout: 5000
- assertVisible:
    id: menu_settings

- takeScreenshot: system/menu-sheet
