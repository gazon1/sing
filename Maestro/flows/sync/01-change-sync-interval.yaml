# Android UI residue of the sync-interval flow.
#
# This flow carries **no** `scenario:` tag, and deliberately so: it exercises the
# path to the Sync tab and the interval-row interaction, not the scenario.
#
# preconditions: signed-in session, Settings → Sync tab open.
# steps:
#   1. Open Settings → Sync through the Android narrow settings sheet.
#   2. Confirm sync controls are reachable and change the interval row.
# expected: the Android Sync settings UI exposes the interval control and accepts
# the interval change interaction. The value change, the immediate apply and the
# restart/reload survival are owned by the desktop carrier
# `SyncSettings01ScenarioTest` (SYNC-SETTINGS-01), not by this flow -- so this
# flow does not claim SYNC-SETTINGS-01, and the android cell of that scenario is
# an honest hole.
#
appId: com.singularity.todo
name: sync-change-interval
tags:
  - regression
  - sync
---
- runFlow: ../../helpers/launch-clean.yaml

# Open the hamburger menu and scroll to Settings.
- runFlow: ../../helpers/open-app-menu.yaml
- scrollUntilVisible:
    element:
      id: menu_settings
    direction: DOWN
    timeout: 5000
# Open Settings.
- tapOn:
    id: menu_settings
- extendedWaitUntil:
    visible:
      id: settings_tab_dropdown
    timeout: 10000

# Open the Sync tab through the narrow settings sheet.
- runFlow:
    file: ../../helpers/settings-tab.yaml
    env:
      SETTINGS_TAB: settings_tab_sync
- extendedWaitUntil:
    visible:
      id: settings_content_sync
    timeout: 8000

# The sync settings screen is visible — confirm key controls are present.
- assertVisible:
    id: sync_auto_sync_switch
- assertVisible:
    id: sync_interval_row
- assertVisible:
    id: sync_now_row

# Tap the interval row. The desktop carrier owns value change/apply/restart
# survival; this flow keeps the Android UI interaction reachable.
- tapOn:
    id: sync_interval_row
- extendedWaitUntil:
    visible:
      id: sync_interval_row
    timeout: 8000
