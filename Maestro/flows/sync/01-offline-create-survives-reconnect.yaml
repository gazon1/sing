# Sync: a task created with no connectivity is kept and appears once back online.
#
# The app is local-first — Room is the source of truth and the sync engine is a
# background concern — so this asserts the user's data survives being offline,
# not that a server round-trip happened.
#
# Uses seed.yaml to create the task while offline.
appId: com.singularity.todo
name: sync-offline-create-survives-reconnect
onFlowComplete:
  - setAirplaneMode: disabled
tags:
  - regression
  - sync
---
- runFlow: ../../helpers/launch-clean.yaml
- setAirplaneMode: enabled
# Create a task while offline via deep-link. The title is fixed and the seed
# replaces, so the row this flow asserts on is the same row every run.
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=Offline%20task"
# The seed writes an undated task, so the row is on the Inbox tab and not on the
# screen the seed leaves the app on — the helper does not navigate, so it cannot
# wait for it. The wait below is the flow's.
- tapOn:
    id: nav_tab_inbox
- extendedWaitUntil:
    visible:
      id: task_item_offline_task
    timeout: 8000
# Back online: the task is still there.
- setAirplaneMode: disabled
- extendedWaitUntil:
    visible:
      id: task_item_offline_task
    timeout: 8000
