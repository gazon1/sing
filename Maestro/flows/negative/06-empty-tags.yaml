# Empty state: the Tags tab of Settings with no tags.
#
# `tags_list` is applied to the list container but does not surface in the
# accessibility tree when the list is empty (the container collapses), so the
# message is asserted instead.
appId: com.singularity.todo
name: negative-empty-tags
tags:
  - scenario:NEGATIVE-06
  - regression
  - negative
---
- runFlow: ../../helpers/launch-clean.yaml
- runFlow: ../../helpers/open-app-menu.yaml
- scrollUntilVisible:
    element:
      id: menu_settings
    direction: DOWN
    timeout: 5000
- tapOn:
    id: menu_settings
- extendedWaitUntil:
    visible:
      id: settings_tab_dropdown
    timeout: 10000
- runFlow:
    file: ../../helpers/settings-tab.yaml
    env:
      SETTINGS_TAB: settings_tab_tags
- extendedWaitUntil:
    visible: "No tags yet"
    timeout: 8000
