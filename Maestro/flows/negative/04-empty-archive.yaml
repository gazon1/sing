# Empty state: the Archive screen with nothing archived.
appId: com.singularity.todo
name: negative-empty-archive
tags:
  - scenario:NEGATIVE-04
  - regression
  - negative
---
- runFlow: ../../helpers/launch-clean.yaml
- tapOn:
    id: nav_menu_button
- extendedWaitUntil:
    visible:
      id: menu_settings
    timeout: 5000
- scrollUntilVisible:
    element:
      id: menu_archive
    direction: DOWN
    timeout: 5000
- tapOn:
    id: menu_archive
- extendedWaitUntil:
    visible: "Archive is empty"
    timeout: 8000
