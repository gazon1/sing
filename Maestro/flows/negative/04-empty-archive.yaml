# Empty state: the Archive screen with nothing archived.
appId: com.singularity.todo
name: negative-empty-archive
tags:
  - scenario:NEGATIVE-04
  - regression
  - negative
---
- runFlow: ../../helpers/launch-clean.yaml
- runFlow: ../../helpers/open-archive.yaml
- extendedWaitUntil:
    visible: "Archive is empty"
    timeout: 8000
# The bulk action moved into the overflow. With nothing completed it stays
# discoverable; the desktop flow pins that it is disabled.
- tapOn:
    id: archive_overflow
- extendedWaitUntil:
    visible:
      id: archive_bulk_action
    timeout: 5000
