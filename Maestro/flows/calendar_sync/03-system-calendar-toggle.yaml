# CAL-SYNC-SYSTEM-02: toggle system calendar sync on Android.
#
# preconditions: Settings → Calendar tab open, system calendar selected.
# steps:
#   1. The system enable switch is visible.
#   2. Toggle it on — the panel's enabled-only block appears.
#   3. Toggle it off — the block is gone again.
#
# On Android (the only platform Maestro runs against) the system calendar IS
# available. The message that says the platform cannot do it
# (CAL-SYNC-SYSTEM-01) is desktop-only — the desktop tier owns it, and no
# Android state reaches it.
#
# прогнан на устройстве: да (2026-11-23) — realme RMX3938, 0O65321F32204DD5
#
appId: com.singularity.todo
name: calendar-sync-system-toggle
tags:
  - regression
  - calendar_sync
  - scenario:CAL-SYNC-SYSTEM-02
---
- runFlow: ../../helpers/launch-clean.yaml

# The system-calendar panel renders the enable switch only when READ/WRITE_CALENDAR
# are granted — without them it renders the permission gate, which is a different
# state and a different scenario. A runtime grant does not survive a reinstall, and
# the qualification runner reinstalls the APK before every attempt, so the flow
# asks for the permission itself instead of trusting the device's history.
- setPermissions:
    permissions:
      calendar: allow

# Open the hamburger menu and scroll to Settings.
- runFlow: ../../helpers/open-app-menu.yaml
- scrollUntilVisible:
    element:
      id: menu_settings
    direction: DOWN
    timeout: 5000
# Open Settings.
- tapOn:
    id: menu_settings
- extendedWaitUntil:
    visible:
      id: settings_tab_dropdown
    timeout: 10000

# Open the Calendar tab through the narrow settings sheet.
- runFlow:
    file: ../../helpers/settings-tab.yaml
    env:
      SETTINGS_TAB: settings_tab_calendar
- extendedWaitUntil:
    visible:
      id: calendar_sync_system_enable_switch
    timeout: 8000

# Select system calendar provider (may already be selected).
- tapOn:
    id: calendar_sync_provider_system_calendar
- extendedWaitUntil:
    visible:
      id: calendar_sync_system_enable_switch
    timeout: 8000

# The switch carries no readable state: the row is a clickable button and the
# switch inside it has no change callback, so neither exposes a checked state.
# What does expose it is the block the panel renders only while the sync is
# enabled — the calendar-app picker, the target-calendar list, the status with
# its "Sync Now" button. The picker is the first of them and the only one on
# screen without scrolling, so it carries the assertion.
#
# The enable flag lives in the app's DataStore and survives a reinstall, so the
# switch can start in either state. Bring it to OFF first: the block on screen
# means the sync is on, and one tap turns it off.
- runFlow:
    when:
      visible:
        id: calendar_sync_system_calendar_app_section
    commands:
      - tapOn:
          id: calendar_sync_system_enable_switch
      - extendedWaitUntil:
          notVisible:
            id: calendar_sync_system_calendar_app_section
          timeout: 8000

# OFF → ON: the block the panel only renders while the sync is enabled appears,
# so the switch really turned the sync on.
- tapOn:
    id: calendar_sync_system_enable_switch
- extendedWaitUntil:
    visible:
      id: calendar_sync_system_calendar_app_section
    timeout: 8000

# ON → OFF: the block is gone again, so the state followed the switch back.
# Both assertions are made from the same scroll position, where the block is on
# screen while the sync is on — an assertion about an element that is merely
# below the fold would pass without proving anything.
- tapOn:
    id: calendar_sync_system_enable_switch
- extendedWaitUntil:
    notVisible:
      id: calendar_sync_system_calendar_app_section
    timeout: 8000
