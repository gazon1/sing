# Backup: a task survives a create-backup / clear-data / restore-backup round trip.
#
# Covers: seed task -> Settings -> Backup -> Create backup -> clear app data ->
# Restore from backup -> task is back.
#
# Backup/restore in this app is a local file round-trip; the test proves the task
# survives a full data wipe and restore without corruption.
# прогнан на устройстве: да (2026-11-06) — realme RMX3938, 0O65321F32204DD5
appId: com.singularity.todo
name: backup-round-trip
tags:
  - backup
  - smoke
---
# 1. Seed a task while online.
# Note: no due= — the task must be undated so it genuinely belongs in Inbox.
# A task with due=today would appear in the Today/agenda view, not Inbox (No Date).
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=BackupRoundTripTask"
- tapOn:
    id: nav_tab_inbox
- extendedWaitUntil:
    visible:
      id: task_item_backuproundtriptask
    timeout: 8000

# 2. Open Settings and navigate to Backup.
- runFlow: ../../helpers/open-settings.yaml
- runFlow:
    file: ../../helpers/settings-tab.yaml
    env:
      SETTINGS_TAB: settings_tab_backup
- extendedWaitUntil:
    visible:
      id: backup_create_button
    timeout: 8000

# 3. Create a backup.
#
# Backup creation now opens the system save dialog (SAF): tapping the button
# launches the picker, the archive is written to the location the user
# confirms. The flow handles the dialog by confirming "Save", then waits for
# the snackbar the ViewModel emits (`BackupUiEvent.ShowSnackbar("Backup created")`).
- runFlow: ../../helpers/backup-create-via-saf.yaml

# 4. Remove the task (simulating a wipe). The backup now lives outside the app
# (SAF), so clearState would no longer delete it; we still delete the task by
# hand to keep the round trip focused on restore. The seed's cleanup link is the
# sanctioned way to remove a fixture: the task detail's own overflow menu is a
# no-op on Android, where the shell owns the only top bar.
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "cleanup=BackupRoundTripTask"

# 5. The task must be gone.
- tapOn:
    id: nav_tab_inbox
- extendedWaitUntil:
    notVisible:
      id: task_item_backuproundtriptask
    timeout: 8000

# 6. Restore from backup.
- runFlow: ../../helpers/open-settings.yaml
- runFlow:
    file: ../../helpers/settings-tab.yaml
    env:
      SETTINGS_TAB: settings_tab_backup
- extendedWaitUntil:
    visible:
      id: backup_restore_button
    timeout: 8000
- tapOn:
    id: backup_restore_button
# The restore now goes through the system file picker (SAF): the archive lives
# where the user saved it, not in the app's hidden backupDir. Pick the backup
# we just created by its file-name prefix, then wait for the snackbar. The text
# is a regex and matches the whole name, so it names the file row and not the
# preview icon, whose description carries the same name inside a sentence.
- extendedWaitUntil:
    visible:
      text: "singularity_backup_[0-9]+.*"
    timeout: 8000
- tapOn:
    text: "singularity_backup_[0-9]+.*"
# Restoring overwrites the profile's data, so the app asks first.
- extendedWaitUntil:
    visible:
      id: dialog_confirm
    timeout: 8000
- tapOn:
    id: dialog_confirm
# The restore reports itself in a snackbar too. The text the flow used to wait
# for ("Restore completed") is not the text the app emits ("Restore complete"),
# and it is translated on this device besides — so the tag is what the flow
# waits for.
- extendedWaitUntil:
    visible:
      id: snackbar_message
    timeout: 8000

# 7. Task is back.
- tapOn:
    id: nav_tab_inbox
- extendedWaitUntil:
    visible:
      id: task_item_backuproundtriptask
    timeout: 8000
