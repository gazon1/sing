# Backup: a task survives a create-backup / clear-data / restore-backup round trip.
#
# Covers: seed task -> Settings -> Backup -> Create backup -> clear app data ->
# Restore from backup -> task is back.
#
# Backup/restore in this app is a local file round-trip; the test proves the task
# survives a full data wipe and restore without corruption.
appId: com.singularity.todo
name: backup-round-trip
tags:
  - backup
  - smoke
---
# 1. Seed a task while online.
# Note: no due= — the task must be undated so it genuinely belongs in Inbox.
# A task with due=today would appear in the Today/agenda view, not Inbox (No Date).
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=${RUN_ID}_BackupRoundTripTask"
- tapOn:
    id: nav_tab_inbox
- extendedWaitUntil:
    visible:
      id: task_item_${RUN_ID}_backuproundtriptask
    timeout: 8000

# 2. Open Settings and navigate to Backup.
- tapOn:
    id: nav_menu_button
# The menu sheet opens with Settings already on screen. Scrolling it with
# scrollUntilVisible pushed the entry down into the system navigation bar,
# where the tap lands on the system HOME button instead of the entry.
- extendedWaitUntil:
    visible:
      id: menu_settings
    timeout: 5000
- tapOn:
    id: menu_settings
- extendedWaitUntil:
    visible:
      id: settings_tab_interface
    timeout: 10000
# The Backup tab is below the fold in the settings nav rail, and the rail is
# the only thing that has to scroll to reach it. The scroll lives in a helper:
# the gesture that moves the rail is not the obvious one — see
# Maestro/helpers/settings-rail-scroll.yaml for the two recipes that turned
# out to do nothing on a device.
- runFlow: ../../helpers/settings-rail-scroll.yaml
- extendedWaitUntil:
    visible:
      id: settings_tab_backup
    timeout: 10000
- tapOn:
    id: settings_tab_backup
- extendedWaitUntil:
    visible:
      id: backup_create_button
    timeout: 8000

# 3. Create a backup.
#
# The result is a snackbar, not a dialog — the ViewModel emits
# `BackupUiEvent.ShowSnackbar("Backup created")`. The flow used to wait for a
# `result_dialog` that the screen has never shown, so it could not pass; and
# it used to wait for the message text, which is the translator's and reads
# "Резервная копия создана" on this device. The snackbar's message is
# addressed by its tag, which says "a snackbar was shown" without saying what
# it said.
- tapOn:
    id: backup_create_button
- extendedWaitUntil:
    visible:
      id: snackbar_message
    timeout: 8000

# 4. Remove the task (simulating a wipe) without clearing app data — clearState
# would also delete the backup stored under filesDir/backups.
- tapOn:
    id: task_item_${RUN_ID}_backuproundtriptask
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 5000
- tapOn:
    id: task_editor_more_menu
- extendedWaitUntil:
    visible:
      id: overflow_delete
    timeout: 5000
- tapOn:
    id: overflow_delete
- back
- extendedWaitUntil:
    visible:
      id: nav_tab_inbox
    timeout: 10000

# 5. The task must be gone.
- extendedWaitUntil:
    notVisible:
      id: task_item_${RUN_ID}_backuproundtriptask
    timeout: 8000

# 6. Restore from backup.
- tapOn:
    id: nav_menu_button
# The menu sheet opens with Settings already on screen. Scrolling it with
# scrollUntilVisible pushed the entry down into the system navigation bar,
# where the tap lands on the system HOME button instead of the entry.
- extendedWaitUntil:
    visible:
      id: menu_settings
    timeout: 5000
- tapOn:
    id: menu_settings
- extendedWaitUntil:
    visible:
      id: settings_tab_interface
    timeout: 10000
# Same rail scroll for the second Settings→Backup navigation (after restore).
- runFlow: ../../helpers/settings-rail-scroll.yaml
- extendedWaitUntil:
    visible:
      id: settings_tab_backup
    timeout: 10000
- tapOn:
    id: settings_tab_backup
- extendedWaitUntil:
    visible:
      id: backup_restore_button
    timeout: 8000
- tapOn:
    id: backup_restore_button
# The restore reports itself in a snackbar too. The text the flow used to wait
# for ("Restore completed") is not the text the app emits ("Restore complete"),
# and it is translated on this device besides — so the tag is what the flow
# waits for.
- extendedWaitUntil:
    visible:
      id: snackbar_message
    timeout: 8000

# 7. Task is back.
- tapOn:
    id: nav_tab_inbox
- extendedWaitUntil:
    visible:
      id: task_item_${RUN_ID}_backuproundtriptask
    timeout: 8000
