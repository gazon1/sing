# Backup: a task survives a create-backup / clear-data / restore-backup round trip.
#
# Covers: seed task -> Settings -> Backup -> Create backup -> clear app data ->
# Restore from backup -> task is back.
#
# Backup/restore in this app is a local file round-trip; the test proves the task
# survives a full data wipe and restore without corruption.
appId: com.singularity.todo
name: backup-round-trip
tags:
  - backup
  - smoke
---
# 1. Seed a task while online.
# Note: no due= — the task must be undated so it genuinely belongs in Inbox.
# A task with due=today would appear in the Today/agenda view, not Inbox (No Date).
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=${RUN_ID}_BackupRoundTripTask"
- tapOn:
    id: nav_tab_inbox
- extendedWaitUntil:
    visible:
      id: task_item_${RUN_ID}_backuproundtriptask
    timeout: 8000

# 2. Open Settings and navigate to Backup.
- tapOn:
    id: nav_menu_button
# The menu sheet opens with Settings already on screen. Scrolling it with
# scrollUntilVisible pushed the entry down into the system navigation bar,
# where the tap lands on the system HOME button instead of the entry.
- extendedWaitUntil:
    visible:
      id: menu_settings
    timeout: 5000
- tapOn:
    id: menu_settings
- extendedWaitUntil:
    visible:
      id: settings_tab_interface
    timeout: 10000
# The Backup tab is below the fold in the settings nav rail, and the rail is
# the only thing that has to scroll to reach it. The scroll lives in a helper:
# the gesture that moves the rail is not the obvious one — see
# Maestro/helpers/settings-rail-scroll.yaml for the two recipes that turned
# out to do nothing on a device.
- runFlow: ../../helpers/settings-rail-scroll.yaml
- extendedWaitUntil:
    visible:
      id: settings_tab_backup
    timeout: 10000
- tapOn:
    id: settings_tab_backup
- extendedWaitUntil:
    visible:
      id: backup_create_button
    timeout: 8000

# 3. Create a backup. The dialog is system-owned so no testTag on its confirm.
#
# The result dialog is asserted structurally (`result_dialog`) rather than by
# its copy. The ViewModel emits "Backup created", and the message is translated
# on this device, so a text match either rots or silently never passes.
- tapOn:
    id: backup_create_button
- extendedWaitUntil:
    visible:
      id: result_dialog
    timeout: 8000

# 4. Clear app data (wiping all tasks), then relaunch.
#
# One command, not three. This said `- stopApp` / `- clearState:` /
# `- launchApp: clearState: false`, and `clearState` is not a Maestro command —
# it is an argument of `launchApp`. The step therefore wiped nothing, and the
# flow went on to assert an empty inbox that still held the task it had just
# created. It could not have passed.
- launchApp:
    appId: com.singularity.todo
    clearState: true
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000

# 5. The task must be gone.
- tapOn:
    id: nav_tab_inbox
- extendedWaitUntil:
    notVisible:
      id: task_item_${RUN_ID}_backuproundtriptask
    timeout: 8000

# 6. Restore from backup.
- tapOn:
    id: nav_menu_button
# The menu sheet opens with Settings already on screen. Scrolling it with
# scrollUntilVisible pushed the entry down into the system navigation bar,
# where the tap lands on the system HOME button instead of the entry.
- extendedWaitUntil:
    visible:
      id: menu_settings
    timeout: 5000
- tapOn:
    id: menu_settings
- extendedWaitUntil:
    visible:
      id: settings_tab_interface
    timeout: 10000
# Same rail scroll for the second Settings→Backup navigation (after restore).
- runFlow: ../../helpers/settings-rail-scroll.yaml
- extendedWaitUntil:
    visible:
      id: settings_tab_backup
    timeout: 10000
- tapOn:
    id: settings_tab_backup
- extendedWaitUntil:
    visible:
      id: backup_restore_button
    timeout: 8000
- tapOn:
    id: backup_restore_button
- extendedWaitUntil:
    visible:
      text: "Restore completed"
    timeout: 30000

# 7. Task is back.
- tapOn:
    id: nav_tab_inbox
- extendedWaitUntil:
    visible:
      id: task_item_${RUN_ID}_backuproundtriptask
    timeout: 8000
