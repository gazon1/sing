# Backup: the push to the cloud asks for the password, and the archive is sealed with it.
#
# Covers: Settings -> Backup -> create backup -> push the archive -> the password
# dialog opens -> the password is typed -> the button hands it over.
#
# The dialog is the feature. The archive is encrypted on the device, under a
# password the person types, and the server never sees the key — so the moment
# that matters is the moment the password is asked for and given. A dialog
# nobody reaches is a dialog nobody tests, and the tags it needs were added in
# the same change as the flow that uses them.
#
# What the flow does not assert: what happens after the password is handed
# over. That is the push itself — it needs a Supabase project, and whether one
# is configured on the device is not this flow's business. What it asserts is
# that the dialog opened, that it takes a password, and that the button gives
# it away.
#
# прогнан на устройстве: да (2026-10-25) — realme RMX3938, 0O65321F32204DD5,
# реальный телефон, не эмулятор
appId: com.singularity.todo
name: backup-cloud-password
tags:
  - backup
---
- runFlow: ../../helpers/launch-clean.yaml

# 1. Settings -> Backup.
- tapOn:
    id: nav_menu_button
- extendedWaitUntil:
    visible:
      id: menu_settings
    timeout: 5000
- tapOn:
    id: menu_settings
- extendedWaitUntil:
    visible:
      id: settings_tab_dropdown
    timeout: 10000
- tapOn:
    id: settings_tab_dropdown
- extendedWaitUntil:
    visible:
      id: settings_tab_backup
    timeout: 10000
- tapOn:
    id: settings_tab_backup
- extendedWaitUntil:
    visible:
      id: backup_create_button
    timeout: 8000

# 2. An archive to push.
- runFlow: ../../helpers/backup-create-via-saf.yaml

# 3. The push asks for the password. The dialog is its own window, so its tags
# only reach Maestro because the dialog maps them as resource ids — that is the
# dialog's own doing, not the screen's.
- extendedWaitUntil:
    visible:
      id: backup_push
    timeout: 8000
- tapOn:
    id: backup_push
- extendedWaitUntil:
    visible:
      id: backup_password_field
    timeout: 8000

# 4. The password is typed and handed over.
#
# The field is a state-based one (TextFieldState), so the IME writes into it
# the way it writes into any other field — a controlled field would swallow the
# text, and the confirm button would stay disabled.
- tapOn:
    id: backup_password_field
- inputText: "correcthorse"
- tapOn:
    id: backup_password_confirm

# 5. The dialog is gone: the password was handed over.
- extendedWaitUntil:
    notVisible:
      id: backup_password_field
    timeout: 8000
