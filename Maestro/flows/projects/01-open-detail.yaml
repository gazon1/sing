# Projects: open a project's detail screen from the project list in the menu.
appId: com.singularity.todo
name: projects-open-detail
tags:
  - regression
  - projects
---
- runFlow: ../../helpers/launch-clean.yaml
# The project list is reached from the menu's Projects section.
- runFlow: ../../helpers/open-app-menu.yaml
# The Projects section sits at the end of the menu, so it is scrolled to.
- scrollUntilVisible:
    element:
      id: menu_all_projects
    direction: DOWN
    timeout: 5000
- tapOn:
    id: menu_all_projects
- extendedWaitUntil:
    visible:
      id: tasks_fab
    timeout: 8000
- tapOn:
    id: tasks_fab
- extendedWaitUntil:
    visible:
      id: project_editor_name_input
    timeout: 5000
- tapOn:
    id: project_editor_name_input
- inputText: "Project Alpha"
- hideKeyboard
- tapOn:
    id: project_editor_save
- extendedWaitUntil:
    visible:
      id: project_card_project_alpha
    timeout: 8000
# The detail screen shows the project's own task list, initially empty.
- tapOn:
    id: project_card_project_alpha
- extendedWaitUntil:
    visible: "Project Alpha"
    timeout: 8000
- assertVisible:
    id: project_detail_tasks_header
- assertVisible:
    id: project_detail_empty
