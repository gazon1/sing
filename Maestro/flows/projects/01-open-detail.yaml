# Projects: open a project's detail screen from the Plans tab.
appId: com.singularity.todo
name: projects-open-detail
tags:
  - regression
  - projects
---
- runFlow: ../../helpers/launch-clean.yaml
- tapOn:
    id: nav_tab_plans
- extendedWaitUntil:
    visible: "No projects yet"
    timeout: 8000
- tapOn:
    id: tasks_fab
- extendedWaitUntil:
    visible:
      id: project_editor_name_input
    timeout: 8000
- tapOn:
    id: project_editor_name_input
- inputText: "Project Alpha"
- hideKeyboard
- tapOn:
    id: project_editor_save
- extendedWaitUntil:
    visible:
      id: project_card_project_alpha
    timeout: 8000
# The detail screen shows the project's own task list, initially empty.
- tapOn:
    id: project_card_project_alpha
- extendedWaitUntil:
    visible: "Project Alpha"
    timeout: 8000
- assertVisible: "Tasks"
- assertVisible: "No tasks yet"
