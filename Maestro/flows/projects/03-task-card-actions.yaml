# Projects: a task row's actions live behind a long press on Android.
#
# Issue #2739 removed the persistent trailing pin/delete icons from touch rows.
# The actions must stay reachable, so this flow opens them from the long-press
# menu: the pin row runs from the menu, and the delete row removes the task end
# to end.
# прогнан на устройстве: да (2026-11-11) — realme RMX3938, 0O65321F32204DD5
appId: com.singularity.todo
name: projects-task-card-actions
tags:
  - regression
  - projects
---
- runFlow: ../../helpers/launch-clean.yaml
- runFlow: ../../helpers/open-app-menu.yaml
# The Projects section sits at the end of the menu, so it is scrolled to.
- scrollUntilVisible:
    element:
      id: menu_all_projects
    direction: DOWN
    timeout: 5000
- tapOn:
    id: menu_all_projects
- extendedWaitUntil:
    visible:
      id: projects_create_button
    timeout: 8000
- tapOn:
    id: projects_create_button
- extendedWaitUntil:
    visible:
      id: project_editor_name_input
    timeout: 5000
- tapOn:
    id: project_editor_name_input
- inputText: "Project Alpha"
- hideKeyboard
- tapOn:
    id: project_editor_save
- extendedWaitUntil:
    visible:
      id: project_card_project_alpha
    timeout: 8000
- tapOn:
    id: project_card_project_alpha
- extendedWaitUntil:
    visible:
      id: project_detail_quick_add
    timeout: 5000
- tapOn:
    id: project_detail_quick_add
- inputText: "Write spec"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: task_item_write_spec
    timeout: 8000

# The touch row draws no trailing action buttons.
- assertNotVisible:
    id: task_card_pin_button
- assertNotVisible:
    id: task_card_delete_button

# The long press is the touch route to the same actions.
- longPressOn:
    id: task_item_write_spec
- extendedWaitUntil:
    visible:
      id: task_card_action_pin
    timeout: 8000
- assertVisible:
    id: task_card_action_delete
- tapOn:
    id: task_card_action_pin
# The menu closes when the row runs the action.
- extendedWaitUntil:
    notVisible:
      id: task_card_action_pin
    timeout: 8000

# The delete row runs the project's soft delete: the row leaves the list.
- longPressOn:
    id: task_item_write_spec
- extendedWaitUntil:
    visible:
      id: task_card_action_delete
    timeout: 8000
- tapOn:
    id: task_card_action_delete
- extendedWaitUntil:
    notVisible:
      id: task_item_write_spec
    timeout: 8000
