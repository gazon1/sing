# Projects: type a custom emoji into the icon picker's free-text field.
#
# The picker offers the catalog and, below it, a field that takes any text. The
# value is the typed text, trimmed — nothing between the field and the icon
# validates, normalizes or looks it up, so a composed sequence reaches the icon
# as the exact string it was typed as.
#
# The flow types one and checks that the project draws it. How the value is
# persisted is the question the JVM tiers answer: the picker's own boundary
# tests carry the string through Room, the backup and the sync document.
#
# The field is addressed by its test tag — it has no stable text of its own, and
# the label is localised.
appId: com.singularity.todo
name: projects-custom-emoji
tags:
  - regression
  - projects
---
- runFlow: ../../helpers/launch-clean.yaml
- runFlow:
    file: ../../helpers/open-menu-item.yaml
    env:
      ENTRY_ID: menu_all_projects
      DEST_ID: projects_create_button
- tapOn:
    id: projects_create_button
- extendedWaitUntil:
    visible:
      id: project_editor_name_input
    timeout: 5000
# The project is created with its name only; the icon is picked on the detail.
- tapOn:
    id: project_editor_name_input
- inputText: "Custom Emoji Flow"
- hideKeyboard
- tapOn:
    id: project_editor_save
- extendedWaitUntil:
    visible:
      id: project_card_custom_emoji_flow
    timeout: 8000
- tapOn: "Custom Emoji Flow"
- extendedWaitUntil:
    visible:
      id: project_detail_tasks_header
    timeout: 8000
# ── Custom entry: the field is below the catalog, so the sheet is scrolled ──
- tapOn: "More"
- scrollUntilVisible:
    element:
      id: project_icon_custom_field
    direction: DOWN
    timeout: 5000
- tapOn:
    id: project_icon_custom_field
# A ZWJ sequence: several code points that have to reach the icon as one
# string. The field takes them as typed — nothing splits or rewrites them.
- inputText: "🧑‍💻"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: project_icon_custom_add
    timeout: 8000
- tapOn:
    id: project_icon_custom_add
# The sheet closes on the pick, and the detail draws what was picked.
- extendedWaitUntil:
    notVisible:
      id: project_icon_custom_field
    timeout: 5000
- assertVisible: "🧑‍💻"
