# Smoke: create a task from the Today agenda and see it land in the list.
#
# Exercises FabActionResolver (Today tab -> "Add task" -> TasksGraph/Create),
# the task editor's save path, and the round-trip of the title through
# TestTags.taskItem() so the row is addressable by its generated tag.
appId: com.singularity.todo
name: tasks-create-task
tags:
  - smoke
  - tasks
---
- runFlow: ../../helpers/launch-clean.yaml
- tapOn:
    id: tasks_fab
- assertVisible:
    id: task_editor_title_input
- tapOn:
    id: task_editor_title_input
# The create screen restores its draft, so the field is not empty when the flow
# arrives: the previous flow's title is still in it. `inputText` appends, and
# the assertion below is an exact match, so the field has to be emptied first.
- eraseText
- inputText: "${RUN_ID} Buy milk"
# Fail here rather than at the save assertion if the keystrokes never landed:
# the title field is a BasicTextField, and a lost IME composition is otherwise
# indistinguishable from a broken save button.
#
# Asserted as text on purpose. The editor is still open, so there is no
# task row — `task_item_buy_milk` only exists once the task is saved (asserted
# below). The field publishes its value as the node's text, so a text selector
# is the right instrument here.
- assertVisible: "${RUN_ID} Buy milk"
- hideKeyboard
- tapOn:
    id: task_editor_save
# A task saved without a due date lands in Inbox, not Today.
- tapOn:
    id: nav_tab_inbox
# Task may be below existing rows — scroll to bring it into view.
- scrollUntilVisible:
    element:
      id: task_item_${RUN_ID}_buy_milk
    direction: DOWN
    timeout: 8000
- assertVisible:
    id: task_item_${RUN_ID}_buy_milk
- takeScreenshot: tasks/create-task
