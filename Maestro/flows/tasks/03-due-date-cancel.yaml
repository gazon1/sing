# Task editor: cancelling the planning sheet leaves the task undated.
#
# The counterpart to set-due-date: a sheet that can be dismissed without a
# write is what makes the destructive path safe. The flow picks a date, backs
# out, and checks that the row still reads the placeholder — a sheet that
# wrote on dismissal would leave the task dated.
appId: com.singularity.todo
name: tasks-due-date-cancel
tags:
  - regression
  - tasks
---
- runFlow: ../../helpers/seed-task.yaml
- tapOn:
    id: task_item_buy_milk
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 5000
# The due-date row is below the fold on phone; scroll it into view first.
- scrollUntilVisible:
    element:
      id: task_editor_due_row
    direction: DOWN
    timeout: 8000
- tapOn:
    id: task_editor_due_row
- extendedWaitUntil:
    visible:
      id: task_scheduling_sheet
    timeout: 8000
# Pick a date, then leave without saving it.
- tapOn:
    id: task_scheduling_today_chip
- tapOn:
    id: task_scheduling_cancel
# The sheet is gone before the row is read: the row must be the one the user
# is left with, not the one still behind the scrim.
- extendedWaitUntil:
    notVisible:
      id: task_scheduling_sheet
    timeout: 8000
- assertVisible:
    id: task_editor_due_date_row_placeholder
# The row still reads the placeholder: nothing was written.
