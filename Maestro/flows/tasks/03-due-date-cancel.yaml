# Task editor: cancelling the date picker leaves the task undated.
#
# The counterpart to set-due-date: a picker that can be dismissed without a write
# is what makes the destructive path safe.
appId: com.singularity.todo
name: tasks-due-date-cancel
tags:
  - regression
  - tasks
---
- runFlow: ../../helpers/seed-task.yaml
- tapOn:
    id: task_item_buy_milk
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 5000
# The due-date row is below the fold on phone; scroll it into view first.
- scrollUntilVisible:
    element:
      id: task_editor_due_row
    direction: DOWN
    timeout: 10000
- tapOn:
    id: task_editor_due_row
- extendedWaitUntil:
    visible:
      id: dialog_date_picker_ok
    timeout: 8000
- tapOn:
    text: ".* 1, 20[0-9][0-9]"
- tapOn:
    id: dialog_date_picker_cancel
- extendedWaitUntil:
    visible:
      id: task_editor_due_date_row_label
    timeout: 8000
- assertVisible:
    id: priority_option_none
