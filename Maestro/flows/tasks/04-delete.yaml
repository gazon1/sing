# Smoke: delete a task from its detail screen's overflow menu.
#
# Covers: task detail open -> overflow menu -> Delete -> pop back -> row gone.
#
# Delete is immediate and reversible: the screen emits `UndoDelete` and shows a
# "Task deleted" snackbar rather than a confirmation dialog, so this flow asserts
# the row is gone on return.
appId: com.singularity.todo
name: smoke-delete-task
tags:
  - smoke
  - tasks
---
- runFlow: ../../helpers/seed-task.yaml
- tapOn:
    id: task_item_buy_milk
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 5000
# The row's title must have carried into the editor — this proves the tap routed
# to *this* task and not merely that some editor opened.
- assertVisible: "Buy milk"
- tapOn:
    id: task_editor_more_menu
- extendedWaitUntil:
    visible:
      id: task_action_delete
    timeout: 5000
- tapOn:
    id: task_action_delete
- back
- extendedWaitUntil:
    visible:
      id: nav_tab_inbox
    timeout: 5000
- extendedWaitUntil:
    notVisible:
      id: task_item_buy_milk
    timeout: 8000
