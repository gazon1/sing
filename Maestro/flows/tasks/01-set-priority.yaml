# Task editor: set the priority from the attribute row.
#
# Regression guard: the priority row's onClick defaulted to an empty lambda, which
# suppressed the row's own picker fallback and made the row a dead tap. See
# docs/decisions/2026-09-29-editor-row-onclick-noop-default.md.
appId: com.singularity.todo
name: tasks-set-priority
tags:
  - regression
  - tasks
---
- runFlow: ../../helpers/seed-task.yaml
- tapOn:
    id: task_item_buy_milk
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 5000
- assertVisible:
    id: priority_option_none
# Priority row is below the fold on phone; scroll it into view.
- scrollUntilVisible:
    element:
      id: task_editor_priority_row
    direction: DOWN
    timeout: 10000
- tapOn:
    id: task_editor_priority_row
- extendedWaitUntil:
    visible:
      id: dialog_title_priority
    timeout: 8000
- tapOn:
    id: priority_option_high
# Edits autosave — the detail screen has no save button; the row relabels.
- extendedWaitUntil:
    visible:
      id: priority_option_high
    timeout: 8000
- assertNotVisible:
    id: priority_option_none
