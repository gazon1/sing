# Task editor: set the priority from the attribute row.
#
# Regression guard: the priority row's onClick defaulted to an empty lambda, which
# suppressed the row's own picker fallback and made the row a dead tap. See
# docs/decisions/2026-09-29-editor-row-onclick-noop-default.md.
appId: com.singularity.todo
name: tasks-set-priority
tags:
  - regression
  - tasks
---
- runFlow: ../../helpers/seed-task.yaml
- tapOn:
    id: task_item_buy_milk
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 5000
# The priority row is above the fold now that the rows come before the sections;
# scrollUntilVisible is a no-op here and keeps the flow working on a narrow device.
- scrollUntilVisible:
    element:
      id: task_editor_priority_row
    direction: DOWN
    timeout: 8000
- tapOn:
    id: task_editor_priority_row
# priority_option_* testTags don't reach the Android accessibility tree from inside
# a ModalBottomSheet (Popupwindow context). Use the stable enum labels instead.
- extendedWaitUntil:
    visible: "No priority"
    timeout: 8000
- tapOn:
    text: "High priority"
# Wait for the sheet to close and the row label to update before asserting.
# Without this, the prior "High priority" text (still in the closing sheet) can
# satisfy the visibility check prematurely.
- waitForAnimationToEnd:
    timeout: 1000
# Now assert the row label shows the new priority (not the old "No priority").
- extendedWaitUntil:
    visible: "High priority"
    timeout: 8000
- assertNotVisible:
    text: "No priority"
