# Task editor: set a due date from the attribute row.
#
# The planning sheet owns the due date, its time, the deadline and the
# «Когда-нибудь» preset. The date it opens on is the day's, and the flow does
# not assert a date the app formats — the preset is picked by its tag, and the
# row is checked for the *absence* of the placeholder instead. The day cells
# carry their date in their testTag, but the month the sheet opens on is the
# current one, and a flow cannot know today's date in advance.
appId: com.singularity.todo
name: tasks-set-due-date
tags:
  - regression
  - tasks
---
- runFlow: ../../helpers/seed-task.yaml
- tapOn:
    id: task_item_buy_milk
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 5000
# Scroll until the due-date row is in view.
- scrollUntilVisible:
    element:
      id: task_editor_due_row
    direction: DOWN
    timeout: 8000
# Tapping the row opens the planning sheet.
- tapOn:
    id: task_editor_due_row
- extendedWaitUntil:
    visible:
      id: task_scheduling_sheet
    timeout: 8000
# «Сегодня» — the preset that sets the date to today.
- tapOn:
    id: task_scheduling_today_chip
# «Сохранить» is the only thing that writes.
- tapOn:
    id: task_scheduling_confirm
- extendedWaitUntil:
    notVisible:
      id: task_scheduling_sheet
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: task_editor_due_date_row_label
    timeout: 8000
# The placeholder is gone: the row carries a date now. The tag names the
# state, so the assertion does not depend on the language of the device.
- assertNotVisible:
    id: task_editor_due_date_row_placeholder
