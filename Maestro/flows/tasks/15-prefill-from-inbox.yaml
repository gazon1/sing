# Agenda: FAB from Inbox tab does NOT pre-fill due date.
#
# Verifies:
# 1. Tapping FAB from Inbox leaves due date blank (no prefill).
# 2. Saving the task without due date lands it in the Inbox "No Date" section.
#
appId: com.singularity.todo
name: tasks-prefill-from-inbox
tags:
  - regression
  - tasks
---
# Launch clean and start on Inbox tab
- runFlow: ../../helpers/launch-clean.yaml
- tapOn:
    id: nav_tab_inbox
# A section header renders only when the section has a task, and the runner
# wipes the content before the flow, so the agenda is empty here: there is no
# header to find, and waiting for one is a claim about nothing. The shell
# affordance the flow needs next is what is waited for instead; the section
# header is asserted later, after the flow has put a task in it.
- extendedWaitUntil:
    visible:
      id: tasks_fab
    timeout: 8000

# Open create via FAB
- tapOn:
    id: tasks_fab

# Verify title field is ready
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 5000

# ── Fill title (no due date set) ──────────────────────────────────────
- tapOn:
    id: task_editor_title_input
- inputText: "${RUN_ID} Task from Inbox tab"

# ── Save ──────────────────────────────────────────────────────────────
- hideKeyboard
- tapOn:
    id: task_editor_save

# ── Verify task appears in No Date section ─────────────────────────────
- extendedWaitUntil:
    visible:
      id: agenda_section_no_date
    timeout: 8000
# Task may be below existing rows — scroll to bring it into view.
- scrollUntilVisible:
    element:
      id: task_item_${RUN_ID}_task_from_inbox_tab
    direction: DOWN
    timeout: 8000
- assertVisible:
    id: task_item_${RUN_ID}_task_from_inbox_tab
- assertVisible:
    id: task_item_${RUN_ID}_task_from_inbox_tab
