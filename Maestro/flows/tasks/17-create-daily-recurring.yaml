# Scenario TASK-REC-01 — create a daily recurring task.
#
# Canonical spec: scripts/src/traceability/scenarios/tasks/recurrence/TASK-REC-01.yaml
#
# The `scenario:TASK-REC-01` tag below is the linkage. It is matched by exact
# string comparison in run-maestro, so `just gm scenario:TASK-REC-01`
# filters to exactly this flow with no new mechanism. The id is the first token
# after the `scenario:` namespace prefix, for the same reason it is the first
# token in a Kotlin `@DisplayName`: a reader — human or scanner — can tell an id
# from prose. The scanner rejects the tag if the id has no spec file.
#
# Why Android carries this half of the scenario: the second half is a journey
# through the agenda — save the task, complete it once, find the next occurrence
# dated a day later — and Maestro drives the real UI, so that part is verifiable
# here. The desktop Compose test carries the composer half: it opens the picker,
# chooses Daily, commits it, and asserts that the row reports the rule.
#
# The claim this flow used to make — that "Compose Multiplatform renders sheets
# into a separate semantics root on desktop, so no JVM Compose test can reach a
# selector inside it" — was measured on a broken row: the editor opened a sheet
# state that nothing rendered, so nothing inside the sheet was found, and a bug
# was read as a platform fact. The measurement today is in
# `docs/decisions/2026-10-21-the-popups-open-their-own-windows-too.md`: a popup
# opens its own window, its content is in the scene, and the cross-root search
# finds it.
appId: com.singularity.todo
name: tasks-create-daily-recurring
tags:
  - scenario:TASK-REC-01
  - smoke
  - tasks
---
- runFlow: ../../helpers/launch-clean.yaml

# ── Open the composer ─────────────────────────────────────────────────
- tapOn:
    id: tasks_fab
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 5000

# ── Give the task a title ─────────────────────────────────────────────
- tapOn:
    id: task_editor_title_input
- inputText: "${RUN_ID} Water the plants"
- hideKeyboard
- waitForAnimationToEnd

# ── Open the recurrence picker ────────────────────────────────────────
# The recurrence row is below the fold on phone after the keyboard is shown.
- scrollUntilVisible:
    element:
      id: task_editor_recurrence_row
    direction: DOWN
    timeout: 8000
- tapOn:
    id: task_editor_recurrence_row
- extendedWaitUntil:
    visible:
      id: recurrence_option_daily
    timeout: 8000

# ── Choose Daily and commit it ────────────────────────────────────────
#
# Unlike the priority sheet, the recurrence sheet does NOT dismiss on
# selection: the host header's Done button applies the rule. Tapping Daily
# alone would leave the sheet open and the task unchanged, which is the whole
# reason this flow asserts the row label afterwards rather than the sheet.
- tapOn:
    id: recurrence_option_daily
- tapOn:
    id: sheet_confirm
- extendedWaitUntil:
    notVisible:
      id: recurrence_option_daily
    timeout: 8000

# ── The row now reports the rule ──────────────────────────────────────
- assertVisible:
    id: task_editor_recurrence_row
- assertVisible:
    id: task_editor_recurrence_label

# ── Save ──────────────────────────────────────────────────────────────
- hideKeyboard
- tapOn:
    id: task_editor_save

# ── The task is created and the composer is closed ────────────────────
# Task may be below existing rows — scroll to bring it into view.
- scrollUntilVisible:
    element:
      id: task_item_${RUN_ID}_water_the_plants
    direction: DOWN
    timeout: 8000
- assertVisible:
    id: task_item_${RUN_ID}_water_the_plants
