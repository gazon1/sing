# Scenario TASK-CHECK-01 — the task screen carries the checklist, and the item
# is ticked there.
#
# Canonical spec: scripts/src/traceability/scenarios/tasks/checklist/TASK-CHECK-01.yaml
#
# The `scenario:TASK-CHECK-01` tag below is the linkage, matched by exact string
# comparison in run-maestro. The id is the first token after the `scenario:`
# namespace prefix, for the same reason it is the first token in a Kotlin
# @DisplayName: a reader — human or scanner — can tell an id from prose.
#
# ## What changed, and why this flow moved
#
# The checklist used to live behind a sheet: the task detail's editor passed
# `checklist = null`, so the section was unreachable from the task screen, and the
# only way in was the "Add checklist" chip of the FirstRunSection — a row that
# exists for the first five minutes of a task's life. The items are inline now,
# so the flow drives the inline section.
#
# ## What this flow covers
#
# 1. A task is created and opened.
# 2. The checklist section is on the task screen, and it is there even though the
#    task has no checklist items — the section carries the add-row.
# 3. An item is typed into the inline add-row and added, with no sheet opening.
# 4. The item's checkbox is ticked and the item is marked as finished.
appId: com.singularity.todo
name: tasks-checklist
tags:
  - scenario:TASK-CHECK-01
  - smoke
  - tasks
---
# ── Launch and create a task ────────────────────────────────────────
- runFlow: ../../../helpers/launch-clean.yaml
- tapOn:
    id: nav_tab_today
# A section header renders only when the section has a task, and the runner
# wipes the content before the flow, so the agenda is empty here: there is no
# header to find, and waiting for one is a claim about nothing. The shell
# affordance the flow needs next is what is waited for instead.
- extendedWaitUntil:
    visible:
      id: tasks_fab
    timeout: 8000

- tapOn:
    id: tasks_fab
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 5000

# A title, so the task can be saved and re-opened.
- tapOn:
    id: task_editor_title_input
- inputText: "${RUN_ID} Grocery run"
- hideKeyboard
- tapOn:
    id: task_editor_save

# ── Open the task ─────────────────────────────────────────────────
- extendedWaitUntil:
    visible:
      id: "task_item_${RUN_ID}_grocery_run"
    timeout: 8000
- tapOn:
    id: "task_item_${RUN_ID}_grocery_run"
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 5000

# ── The checklist section ─────────────────────────────────────────
# It renders whether or not there are items: it is the only place a checklist
# item can be added from the task screen, so a section that hid itself would
# leave no way to add the first one.
- extendedWaitUntil:
    visible:
      id: task_checklist_section
    timeout: 8000

# ── Add an item inline ───────────────────────────────────────────
# The add-row of the section. Nothing opens: the item is typed where it is
# listed.
- tapOn:
    id: checklist_inline_add_input
- inputText: "${RUN_ID} Milk"
- hideKeyboard
- tapOn:
    id: checklist_inline_add_button

# slug("${RUN_ID} Milk") → "<run id>_milk"
- extendedWaitUntil:
    visible:
      id: "checklist_item_${RUN_ID}_milk"
    timeout: 8000

# ── Tick the item ────────────────────────────────────────────────
# A real checkbox, not a tick character in front of the title.
- tapOn:
    id: "checklist_item_checkbox_${RUN_ID}_milk"
- extendedWaitUntil:
    visible:
      id: "checklist_item_checkbox_${RUN_ID}_milk"
      checked: true
    timeout: 8000

# The count of the section is deliberately not asserted here. The composer
# creates a task per run, so the section's own history is not what a second
# run of this flow would see, and a number about the fixture's history is not
# a number about the behaviour. The count is asserted on the desktop tier,
# where the database starts empty.
