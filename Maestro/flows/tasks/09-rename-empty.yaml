# Task editor: clearing the title and attempting to save is rejected (title stays unchanged).
#
# The TaskDomain rejects empty titles at the repository level. The editor remains open
# so the user can type a valid title. The task is NOT renamed to "Untitled" or similar.
#
# Covers: task rename → empty title → validation prevents save → original title intact.
appId: com.singularity.todo
name: tasks-rename-empty
tags:
  - tasks
  - smoke
---
# Seed a task with a known title.
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=RenameMe&due=today"

# Open the task in the editor.
- tapOn:
    id: nav_tab_today
- extendedWaitUntil:
    visible:
      id: task_item_renameme
    timeout: 8000
- tapOn:
    id: task_item_renameme

# Clear the title field: longPress selects all text; eraseText clears it.
# eraseText: 50 makes the clear robust if the selection lands partially.
- tapOn:
    id: task_editor_title_input
- longPressOn:
    id: task_editor_title_input
- eraseText: 50

# Attempt to save the empty title. The editor rejects it and shows the
# validation error instead of persisting an empty/Untitled title.
- tapOn:
    id: task_editor_save
- extendedWaitUntil:
    visible:
      id: task_editor_title_error
    timeout: 8000

# The editor stays open; navigating back leaves the original title intact.
- back
- extendedWaitUntil:
    visible:
      id: task_item_renameme
    timeout: 8000
- assertVisible:
    id: task_item_renameme
