# Tasks: tasks appear in the correct date-bucket section (Today / Upcoming / Overdue).
#
# Covers: seed three tasks (yesterday, today, tomorrow) via debug deep-link ->
# verify each appears in the correct agenda section with its section header testTag.
#
# The three agenda tabs are disjoint: the overdue and today's tasks are in the
# Today tab, tomorrow's in the Upcoming tab, and the undated ones in the Inbox.
#
# The agenda section header uses TestTags.agendaSection(name) so "No Date" ->
# `agenda_section_no_date`, "Overdue" -> `agenda_section_overdue`, etc.
appId: com.singularity.todo
name: tasks-date-buckets
tags:
  - tasks
  - smoke
---
# Seed three tasks with different due dates. The titles are fixed and the seed
# replaces, so each run asserts on the same three rows.
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=YesterdayTask&due=-1d"
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=TodayTask&due=today"
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=TomorrowTask&due=tomorrow"

# Navigate to agenda.
- tapOn:
    id: nav_tab_today

# The seeded entity's arrival signal is the container waited for
# above: it renders only while a row falls in it, so waiting for it is
# waiting for the row (`helpers/seed.yaml`, "What counts as the wait").
- extendedWaitUntil:
    visible:
      id: agenda_section_overdue
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: task_item_yesterdaytask
    timeout: 8000

# Today section should contain TodayTask.
- extendedWaitUntil:
    visible:
      id: agenda_section_today
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: task_item_todaytask
    timeout: 8000

# Tomorrow section should contain TomorrowTask — in the Upcoming tab, which is
# where what is coming lives.
- tapOn:
    id: nav_tab_upcoming
- extendedWaitUntil:
    visible:
      id: agenda_section_tomorrow
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: task_item_tomorrowtask
    timeout: 8000
