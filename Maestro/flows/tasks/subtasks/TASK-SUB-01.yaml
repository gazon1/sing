# Scenario TASK-SUB-01 — subtask add/toggle/delete.
#
# Canonical spec: scripts/src/traceability/scenarios/tasks/subtasks/TASK-SUB-01.yaml
#
# The `scenario:TASK-SUB-01` tag below is the linkage, matched by exact string
# comparison in run-maestro.
#
# ## Platform notes
#
# android: Maestro drives the real Android UI. The SubtasksSection is always
# shown in the task detail view (even when empty) because the "add subtask"
# input row is how a subtask is created. The section uses testTags for all
# interactive elements.
#
# desktop: JVM Compose UI test — TBD.
#
# ## What this flow covers
#
# 1. Seed a parent task via DebugSeedActivity deep-link.
# 2. Open the task detail view — SubtasksSection appears.
# 3. Type a subtask title in the add-subtask input and submit.
# 4. Verify the subtask appears in the list.
# 5. Tap the subtask's checkbox to toggle its completed state.
# 6. Verify the completed state changes.
# 7. Tap the delete (×) button to remove the subtask.
# 8. Verify the subtask is removed from the list.
appId: com.singularity.todo
name: tasks-subtasks
tags:
  - scenario:TASK-SUB-01
  - smoke
  - tasks
---
# ── Seed a parent task ─────────────────────────────────────────────
- runFlow: ../../../helpers/launch-clean.yaml
# `due=today`: a task without a due date lands in the "No Date" bucket,
# which the Today tab does not show — the flow would assert against a task
# it had seeded and could not see.
#
# The title is fixed, and the seed replaces: seeding "Parent Task" again updates
# the row this flow seeded instead of adding a second one. The subtask below is
# typed into the editor, so its title keeps the run id: a typed title is this
# flow's own row, and the run id keeps it apart from any other run's.
- openLink: "todo-debug://seed?task=Parent%20Task&due=today"
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000

# ── Open the task detail view ────────────────────────────────────
- extendedWaitUntil:
    visible:
      id: task_item_parent_task
    timeout: 8000
- tapOn:
    id: task_item_parent_task
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 5000

# ── SubtasksSection: add a subtask ───────────────────────────────
- extendedWaitUntil:
    visible:
      id: subtasks_section
    timeout: 8000
- tapOn:
    id: subtask_add_input
- inputText: "${RUN_ID} Child task one"
- tapOn:
    id: subtask_add_button

# ── Verify subtask appears ──────────────────────────────────────
- extendedWaitUntil:
    visible:
      id: subtask_item_${RUN_ID}_child_task_one
    timeout: 8000

# ── Toggle subtask completed state ───────────────────────────────
# The row is a real checkbox now, not a tap on the title: the title opens the
# subtask as its own task, and the tick character that used to be drawn in
# front of it is gone.
- tapOn:
    id: subtask_checkbox_${RUN_ID}_child_task_one
- extendedWaitUntil:
    visible:
      id: subtask_checkbox_${RUN_ID}_child_task_one
      checked: true
    timeout: 8000

# ── Delete subtask ────────────────────────────────────────────────
- tapOn:
    id: subtask_delete_${RUN_ID}_child_task_one
- extendedWaitUntil:
    notVisible:
      id: subtask_item_${RUN_ID}_child_task_one
    timeout: 8000
- assertNotVisible: subtask_item_${RUN_ID}_child_task_one
