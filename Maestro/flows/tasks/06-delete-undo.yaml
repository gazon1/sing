# Tasks: deleting a task shows an Undo snackbar, and Undo restores the task.
#
# Covers: task detail open -> overflow Delete -> snackbar with Undo action ->
# Undo tap -> task back in the list.
#
# Uses the "Buy milk" task from seed-task helper (slug: `buy_milk`).
appId: com.singularity.todo
name: tasks-delete-undo
tags:
  - tasks
  - smoke
---
- runFlow: ../../helpers/seed-task.yaml
- tapOn:
    id: task_item_buy_milk
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 5000
# Open the overflow menu and delete.
- tapOn:
    id: task_editor_more_menu
- extendedWaitUntil:
    visible:
      id: task_action_delete
    timeout: 5000
- tapOn:
    id: task_action_delete
# After deletion the screen pops back to the list; a snackbar appears with Undo.
# Select by id, never by the label: this project's device locale is Russian, so
# the button reads "Отменить" and `text: "Undo"` can never pass. The button's tag
# is applied by TaggedSnackbarHost — Material3's SnackbarHost renders the action
# internally and leaves no slot to tag it.
- extendedWaitUntil:
    visible:
      id: snackbar_action
    timeout: 8000
# Undo restores the task.
- tapOn:
    id: snackbar_action
- extendedWaitUntil:
    visible:
      id: task_item_buy_milk
    timeout: 8000
