# Tasks: deleting a task shows an Undo snackbar, and Undo restores the task.
#
# Covers: task detail open -> overflow Delete -> Undo snackbar on the detail
# screen -> Undo tap -> back -> task is back in the list.
#
# The snackbar is hosted by the detail screen (its NotificationHost owns the
# event flow), so deletion does NOT pop back by itself — 04-delete covers the
# manual-back path. This flow proves the undo write actually lands by backing
# out and finding the row again.
#
# Uses the "Buy milk" task from seed-task helper (slug: `buy_milk`).
appId: com.singularity.todo
name: tasks-delete-undo
tags:
  - tasks
  - smoke
---
- runFlow: ../../helpers/seed-task.yaml
- tapOn:
    id: task_item_buy_milk
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 5000
# Open the overflow menu and delete.
- tapOn:
    id: task_editor_more_menu
- extendedWaitUntil:
    visible:
      id: overflow_delete
    timeout: 5000
- tapOn:
    id: overflow_delete
# The undo snackbar appears over the detail screen — the screen the user is
# still on after deletion.
#
# Select the action by id, never by the label. This project's device runs in
# Russian, so the button reads "Отменить" and `text: "Undo"` can never pass. The
# tag comes from the tagged snackbar host: Material3's SnackbarHost renders the
# action internally and leaves no slot to tag it, so the host is a project-owned
# component. The host also re-asserts the testTag → resource-id mapping, because
# the snackbar lives in a Popup — its own window, its own semantics root.
- extendedWaitUntil:
    visible:
      id: snackbar_action
    timeout: 8000
# Undo restores the task in place; leave the screen and check the list.
- tapOn:
    id: snackbar_action
- back
- extendedWaitUntil:
    visible:
      id: task_item_buy_milk
    timeout: 8000
