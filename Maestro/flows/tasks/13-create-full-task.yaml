# Agenda: create a task with all attribute fields filled.
#
# Verifies:
# 1. All attribute rows are visible in the task editor (priority, due date,
#    start date, project, tags, recurrence, pin).
# 2. Setting a due date of Today and saving shows the task in the Today section.
# 3. The task shows the correct priority badge.
#
appId: com.singularity.todo
name: tasks-create-full-task
tags:
  - regression
  - tasks
---
# Open editor from FAB
- runFlow: ../../helpers/launch-clean.yaml
- tapOn:
    id: tasks_fab

# The editor is open. The editor restores its draft — and with it the place it
# was left — so the title input can start below the fold. Scrolling up to it
# says both: the editor is open, and the flow starts at the top of it.
- scrollUntilVisible:
    element:
      id: task_editor_title_input
    direction: UP
    timeout: 5000

# ── The attribute rows ─────────────────────────────────────────────────
#
# The editor is taller than a phone viewport, so a row below the fold is not
# on the screen at all. Asserting it anyway is an assertion about the
# viewport, not about the editor — and it fails on a phone while passing on
# the CI emulator, which is the whole problem with a claim that only one
# display can settle.
#
# So every row is scrolled into view first and asserted after. The scroll is
# what makes the assertion mean "the editor has this row".
- scrollUntilVisible:
    element:
      id: task_editor_priority_row
    direction: DOWN
    timeout: 8000
- assertVisible:
    id: task_editor_priority_row

- scrollUntilVisible:
    element:
      id: task_editor_due_row
    direction: DOWN
    timeout: 8000
- assertVisible:
    id: task_editor_due_row

- scrollUntilVisible:
    element:
      id: task_editor_start_date_row
    direction: DOWN
    timeout: 8000
- assertVisible:
    id: task_editor_start_date_row

- scrollUntilVisible:
    element:
      id: task_editor_project_row
    direction: DOWN
    timeout: 8000
- assertVisible:
    id: task_editor_project_row

- scrollUntilVisible:
    element:
      id: task_editor_tags_row
    direction: DOWN
    timeout: 8000
- assertVisible:
    id: task_editor_tags_row

- scrollUntilVisible:
    element:
      id: task_editor_recurrence_row
    direction: DOWN
    timeout: 8000
- assertVisible:
    id: task_editor_recurrence_row

- scrollUntilVisible:
    element:
      id: task_editor_pin_row
    direction: DOWN
    timeout: 8000
- assertVisible:
    id: task_editor_pin_row

# ── Fill title ─────────────────────────────────────────────────────────
- scrollUntilVisible:
    element:
      id: task_editor_title_input
    direction: UP
    timeout: 5000
- tapOn:
    id: task_editor_title_input
# The create screen restores its draft, so the field still holds the previous
# flow's title; `inputText` appends to whatever is there.
- eraseText
- inputText: "${RUN_ID} Full task with all fields"
- hideKeyboard

# ── Set priority to High ──────────────────────────────────────────────
# Priority row may be below the fold — scroll it into view before tapping.
- scrollUntilVisible:
    element:
      id: task_editor_priority_row
    direction: DOWN
    timeout: 8000
- tapOn:
    id: task_editor_priority_row
# priority_option_* testTags don't reach Android accessibility from inside a
# ModalBottomSheet (Popupwindow context). Use stable enum labels instead.
- waitForAnimationToEnd:
    timeout: 1500
- extendedWaitUntil:
    visible: "No priority"
    timeout: 8000
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    text: "High priority"
# Close the sheet (sheet dismisses automatically after selection)

# ── Set due date to Today ─────────────────────────────────────────────
- tapOn:
    id: task_editor_due_row
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: "OK"

# ── Save ──────────────────────────────────────────────────────────────
#
# No `hideKeyboard` here: the keyboard was already hidden above (the due-date
# picker is not a text field), and a `hideKeyboard` with nothing to hide is a
# BACK keypress — which the editor dialog reads as "dismiss me". Measured on a
# real phone (2026-10-28). See
# docs/decisions/2026-10-28-the-keyboard-was-already-down.md.
- tapOn:
    id: task_editor_save

# ── Verify task appears in Today (due date = Today) ───────────────────
- scrollUntilVisible:
    element:
      id: task_item_${RUN_ID}_full_task_with_all_fields
    direction: DOWN
    timeout: 8000
- assertVisible:
    id: task_item_${RUN_ID}_full_task_with_all_fields

# ── Verify priority badge (High = red flag) ───────────────────────────
# The priority is shown as a colored flag icon in the task row.
# We verify the task row exists; detailed badge verification is
# done in the desktop Compose UI test (CreateFullTaskFlowTest).
