# Tasks: a task with a Cyrillic title is created, saved, and displayed correctly.
#
# Covers: seed task with Cyrillic title via debug-deep-link -> task appears in
# agenda with the correct Cyrillic title rendered (not mojibake or □).
#
# Cyrillic input is only possible via the debug deep-link; inputText on Android
# Maestro cannot type non-ASCII characters.
appId: com.singularity.todo
name: tasks-cyrillic-title
tags:
  - tasks
  - smoke
---
# Seed a task with a Cyrillic title using the debug deep-link.
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=%D0%9A%D1%83%D0%BF%D0%B8%D1%82%D1%8C%20%D0%BC%D0%BE%D0%BB%D0%BE%D0%BA%D0%BE&due=today"
      WAIT_FOR: "task_item_купить_молоко"
# The task must appear in Today with its Cyrillic title intact. The helper
# waited for the row; this assertion checks the title rendered, not the arrival.
- assertVisible:
    text: "Купить молоко"
# Verify it is in the task list. It is dated today, so it lives in the Today
# tab: the three agenda tabs are disjoint, and a dated task is not in the inbox.
- assertVisible:
    id: task_item_купить_молоко
