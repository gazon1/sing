# Agenda: after creating a task from a specific tab, we return to that tab.
#
# Verifies:
# 1. Creating from Today and saving returns to Today (task is in Today, not Inbox).
# 2. Creating from Inbox and saving returns to Inbox (task is in No Date).
# This is the per-tab back stack isolation — the save navigates back within
# the tasks nested graph, then pops the TasksGraph from the agenda back stack,
# returning to the source tab.
#
# NOTE: Both fixtures are created through the shared seed helper
# (../../helpers/seed.yaml) with a fixed title. A seeded fixture is deterministic,
# and the seed replaces: seeding the same title again updates the row this flow
# seeded instead of adding a second one. Typing the title into the editor is not
# needed to prove the return-to-tab navigation, and the flow must not depend on
# keyboard/IME behaviour or on the editor's Save button enabling.
#
appId: com.singularity.todo
name: tasks-return-to-source-tab
tags:
  - regression
  - tasks
---
# ── Case 1: Today → FAB → save → task appears in agenda ───────────────
# Seed an overdue task (yesterday). It lands in the Overdue section. The helper
# cannot wait for the overdue row (the Today tab collapses the overdue section
# once the profile holds enough overdue tasks), but the section header is
# rendered either way — so the helper waits for the section (the container
# rule).
- runFlow: ../../helpers/launch-clean.yaml
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=Return%20to%20Today&due=-1d"
      WAIT_FOR: "agenda_section_overdue"
- tapOn:
    id: nav_tab_today
# The seeded task appears in the Overdue section of the Today tab.
# Scroll to make it visible in case it arrived below the fold.
- scrollUntilVisible:
    element:
      id: "task_item_return_to_today"
    direction: DOWN
    timeout: 8000
# Open the seeded task — this opens TaskDetailScreen. Navigating back
# (auto-save on every change) returns to the Today tab with the task visible.
- tapOn:
    id: "task_item_return_to_today"
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 5000
# Navigating away from the detail screen auto-saves (no explicit save needed).
# The outcome: the editor closes and we are back on Today with the task visible.
- pressKey: BACK
- extendedWaitUntil:
    visible:
      id: "task_item_return_to_today"
    timeout: 8000

# ── Case 2: Inbox → FAB → save → task appears in Inbox ────────────────
# Seed a no-date task (lands in Inbox). The Inbox row is not on the Today
# screen the seed leaves the app on; the helper cannot wait for it. The flow
# waits for the row below, after navigating to Inbox and scrolling it into view.
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=Return%20to%20Inbox"
- tapOn:
    id: nav_tab_inbox
- scrollUntilVisible:
    element:
      id: "task_item_return_to_inbox"
    direction: DOWN
    timeout: 8000
# Open the seeded task from Inbox; navigating back auto-saves and returns
# to the Inbox tab.
- tapOn:
    id: "task_item_return_to_inbox"
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 5000
# Back returns to the Inbox tab; the task row is the outcome.
- pressKey: BACK
- extendedWaitUntil:
    visible:
      id: "task_item_return_to_inbox"
    timeout: 8000
