# Agenda: after creating a task from a specific tab, we return to that tab.
#
# Verifies:
# 1. Creating from Today and saving returns to Today (task is in Today, not Inbox).
# 2. Creating from Inbox and saving returns to Inbox (task is in No Date).
# This is the per-tab back stack isolation — the save navigates back within
# the tasks nested graph, then pops the TasksGraph from the agenda back stack,
# returning to the source tab.
#
# NOTE: Both fixtures are created through the shared seed helper
# (../../helpers/seed.yaml) with a ${RUN_ID}-prefixed title. A seeded fixture
# is deterministic and stamped with the per-attempt ${RUN_ID}, so the runner's
# sweep can find exactly this run's rows; typing the title into the editor is
# not needed to prove the return-to-tab navigation, and the flow must not
# depend on keyboard/IME behaviour or on the editor's Save button enabling.
#
appId: com.singularity.todo
name: tasks-return-to-source-tab
tags:
  - regression
  - tasks
---
# ── Case 1: Today → FAB → save → task appears in agenda ───────────────
# Seed an overdue task (yesterday). It lands in the Overdue section, but
# opening it from Today and saving verifies the Today-tab return path.
# The overdue task is visible in the Today tab's Overdue section.
- runFlow: ../../helpers/launch-clean.yaml
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=${RUN_ID}%20Return%20to%20Today&due=-1d"
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000
# The seeded task appears in the Overdue section of the Today tab.
# Scroll to make it visible in case it arrived below the fold.
- scrollUntilVisible:
    element:
      id: "task_item_${RUN_ID}_return_to_today"
    direction: DOWN
    timeout: 8000
# Open the seeded task — this opens TaskDetailScreen. Navigating back
# (auto-save on every change) returns to the Today tab with the task visible.
- tapOn:
    id: "task_item_${RUN_ID}_return_to_today"
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 5000
# Navigating away from the detail screen auto-saves (no explicit save needed).
- pressKey: BACK
# Wait for the editor close animation to finish before the agenda re-renders.
- waitForAnimationToEnd:
    timeout: 2000
# Verify we are back on the Today tab with the task row visible.
- extendedWaitUntil:
    visible:
      id: "task_item_${RUN_ID}_return_to_today"
    timeout: 10000

# ── Case 2: Inbox → FAB → save → task appears in Inbox ────────────────
# Seed a no-date task (lands in Inbox). Open it from Inbox and save —
# the save-navigation returns to the Inbox tab.
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=${RUN_ID}%20Return%20to%20Inbox"
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000
- tapOn:
    id: nav_tab_inbox
- scrollUntilVisible:
    element:
      id: "task_item_${RUN_ID}_return_to_inbox"
    direction: DOWN
    timeout: 8000
# Open the seeded task from Inbox; navigating back auto-saves and returns
# to the Inbox tab.
- tapOn:
    id: "task_item_${RUN_ID}_return_to_inbox"
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 5000
- pressKey: BACK
- waitForAnimationToEnd:
    timeout: 2000
# Verify we are back on the Inbox tab (task row still visible).
- extendedWaitUntil:
    visible:
      id: "task_item_${RUN_ID}_return_to_inbox"
    timeout: 10000
