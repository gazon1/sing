# WhatsNew: a payload the user has already dismissed does not come back, even when the same
# payload is delivered again after a fresh process.
#
# прогнан на устройстве: нет (2026-11-04) — не прогонялся: этот прогон не собирал APK.
#
# This is the second half of the feature's contract, and it is only observable because the seed
# link can deliver a payload *as one that may already be seen* (`whatsnew-seen`) without
# forgetting the recorded dismissal. The first step forgets it, so the flow is repeatable: the
# sheet is shown in this flow, dismissed in this flow, and then refused in this flow.
appId: com.singularity.todo
name: whatsnew-dismissed-payload-stays-hidden
tags:
  - whatsnew
  - persistence
---
- runFlow: ../../helpers/launch-clean.yaml
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "whatsnew=Release%20notes%20demo"
- extendedWaitUntil:
    visible:
      id: genui_whatsnew
    timeout: 15000
- tapOn: "Got it"
- waitForAnimationToEnd
- assertNotVisible:
    id: genui_whatsnew
# A new process, and the same payload delivered again — as one that may already be dismissed.
# It is still armed, so a sheet that ignored the recorded dismissal would appear here.
- runFlow: ../../helpers/relaunch.yaml
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "whatsnew-seen=Release%20notes%20demo"
- waitForAnimationToEnd
- assertNotVisible:
    id: genui_whatsnew
