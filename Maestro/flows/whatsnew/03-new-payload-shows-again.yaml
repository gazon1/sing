# WhatsNew: a payload that differs from the dismissed one is shown again.
#
# прогнан на устройстве: нет (2026-11-05) — не прогонялся: этот прогон не собирал APK. Форма payload разбирается
# юнит-тестом (WhatsNewDemoPayloadTest); прогон на устройстве отслеживается в #1904.
#
# The dismissal is recorded per payload, not as a "release notes are done" flag — a second
# release has to reach the user. Both payloads are delivered by the seed link, and each seed
# forgets the record, so the flow is self-contained: it shows the sheet whatever an earlier run
# left on the device.
appId: com.singularity.todo
name: whatsnew-new-payload-shows-again
tags:
  - whatsnew
---
- runFlow: ../../helpers/launch-clean.yaml
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "whatsnew=Release%20notes%20demo"
- extendedWaitUntil:
    visible:
      id: genui_whatsnew
    timeout: 15000
- tapOn: "Got it"
- waitForAnimationToEnd
- assertNotVisible:
    id: genui_whatsnew
# A different payload has not been dismissed, so it is shown.
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "whatsnew=Release%20notes%20next"
- extendedWaitUntil:
    visible:
      id: genui_whatsnew
    timeout: 15000
- assertVisible: "Release notes next"
