# Plans: a section header names the period it covers.
#
# The header is the only thing that tells the reader which period the rows
# under it belong to. The assertion is on the section's own id, which carries
# the date it covers — the header's *copy* is the app's to change, the date it
# names is not.
appId: com.singularity.todo
name: plans-section-header
tags:
  - plans
  - scenario:PLANS-08
---
- runFlow: ../../helpers/launch-clean.yaml
- runScript: ../../helpers/scripts/date.js
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=Due%20today&due=today"
- runFlow: ../../helpers/open-app-menu.yaml
# Plans is an entry of the app menu, below the fold of the sheet: a row that is
# drawn but off-screen is not a row the user can reach.
- scrollUntilVisible:
    element:
      id: menu_plans
    direction: DOWN
    timeout: 10000
- tapOn:
    id: menu_plans
# The day section names its day.
- runFlow:
    file: ../../helpers/plans-section.yaml
    env:
      PLANS_SECTION: ${output.PLANS_TODAY_SECTION}
# The week section names the week it covers.
- tapOn:
    id: plans_granularity_week
- runFlow:
    file: ../../helpers/plans-section.yaml
    env:
      PLANS_SECTION: ${output.PLANS_WEEK_SECTION}
# The month section names the calendar month.
- tapOn:
    id: plans_granularity_month
- runFlow:
    file: ../../helpers/plans-section.yaml
    env:
      PLANS_SECTION: ${output.PLANS_MONTH_SECTION}
