# Plans: a task is in exactly one section, at every granularity.
#
# The invariant the whole screen rests on: a task shown twice is a duplicated
# row, and a task shown nowhere is work the user believes is scheduled and is
# not.
#
# The section is addressed by its own id, which carries the date it covers, so
# the flow does not write a date down and fail tomorrow.
appId: com.singularity.todo
name: plans-one-section
tags:
  - smoke
  - plans
  - scenario:PLANS-02
---
- runFlow: ../../helpers/launch-clean.yaml
- runScript: ../../helpers/scripts/date.js
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=Only%20once&due=today"
- tapOn:
    id: nav_tab_plans
# The day section holds it.
- runFlow:
    file: ../../helpers/plans-section.yaml
    env:
      PLANS_SECTION: ${output.PLANS_TODAY_SECTION}
- assertVisible:
    id: task_item_only_once
# The week section holds the same task, and the day section is gone: the task
# moved sections, it did not appear twice.
- tapOn:
    id: plans_granularity_week
- runFlow:
    file: ../../helpers/plans-section.yaml
    env:
      PLANS_SECTION: ${output.PLANS_WEEK_SECTION}
- assertVisible:
    id: task_item_only_once
- runFlow:
    file: ../../helpers/plans-section-gone.yaml
    env:
      PLANS_SECTION: ${output.PLANS_TODAY_SECTION}
# The month section holds it too.
- tapOn:
    id: plans_granularity_month
- extendedWaitUntil:
    visible:
      id: task_item_only_once
    timeout: 8000
