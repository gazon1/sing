# Plans: the timeline shows the days in order, each with that day's tasks.
#
# The section's testTag carries the date it covers, so the id is computed from
# the same clock the app reads — a flow that wrote the date down would be a
# flow that fails tomorrow.
appId: com.singularity.todo
name: plans-days-in-order
tags:
  - smoke
  - plans
  - scenario:PLANS-01
---
- runFlow: ../../helpers/launch-clean.yaml
- runScript: ../../helpers/scripts/date.js
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=Due%20today&due=today"
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=Due%20tomorrow&due=tomorrow"
- tapOn:
    id: nav_tab_plans
# A section for today, and a section for tomorrow — two days, two sections.
- extendedWaitUntil:
    visible:
      id: "${output.PLANS_TODAY_SECTION}"
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: "${output.PLANS_TOMORROW_SECTION}"
    timeout: 8000
