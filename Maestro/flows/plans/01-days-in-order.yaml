# Plans: the timeline shows the days in order, each with that day's tasks.
#
# The section's testTag carries the date it covers, so the id is computed from
# the same clock the app reads — a flow that wrote the date down would be a
# flow that fails tomorrow.
appId: com.singularity.todo
name: plans-days-in-order
tags:
  - plans
  - scenario:PLANS-01
---
- runFlow: ../../helpers/launch-clean.yaml
- runScript: ../../helpers/scripts/date.js
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=Due%20today&due=today"
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=Due%20tomorrow&due=tomorrow"
- tapOn:
    id: nav_tab_plans
# A section for today, and a section for tomorrow — two days, two sections.
#
# The today section is the arrival signal for the task seeded as due today: a
# Plans section is drawn only while a row falls in it, so waiting for the
# section is waiting for the row (`helpers/seed.yaml`, "What counts as the
# wait"). The container waited for is the timeline's today section.
- runFlow:
    file: ../../helpers/plans-section.yaml
    env:
      PLANS_SECTION: ${output.PLANS_TODAY_SECTION}
# The seeded row, waited for in place instead of scrolled to: a container wait
# precedes it and a later step still needs the timeline's sections, so a scroll
# here could carry the tomorrow section out of reach (`helpers/seed.yaml`,
# "How to wait for the row itself").
- extendedWaitUntil:
    visible:
      id: task_item_due_today
    timeout: 8000
# The tomorrow section: the same container rule, for the task seeded as due
# tomorrow. It is waited for after the row wait above, so the flow proves both
# sections are reachable rather than assuming the first wait left them in place.
- runFlow:
    file: ../../helpers/plans-section.yaml
    env:
      PLANS_SECTION: ${output.PLANS_TOMORROW_SECTION}
# The tomorrow row is this flow's last step, so nothing depends on the section
# still being on screen: scroll it into view and the wait cannot fail on
# geometry.
- scrollUntilVisible:
    element:
      id: task_item_due_tomorrow
    direction: DOWN
    timeout: 8000
