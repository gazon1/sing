# Plans: the timeline shows the days in order, each with that day's tasks.
#
# The section's testTag carries the date it covers, so the id is computed from
# the same clock the app reads — a flow that wrote the date down would be a
# flow that fails tomorrow.
appId: com.singularity.todo
name: plans-days-in-order
tags:
  - plans
  - scenario:PLANS-01
---
- runFlow: ../../helpers/launch-clean.yaml
- runScript: ../../helpers/scripts/date.js
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=Due%20today&due=today"
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=Due%20tomorrow&due=tomorrow"
- runFlow: ../../helpers/open-app-menu.yaml
# Plans is an entry of the app menu, below the fold of the sheet: a row that is
# drawn but off-screen is not a row the user can reach.
- scrollUntilVisible:
    element:
      id: menu_plans
    direction: DOWN
    timeout: 10000
- tapOn:
    id: menu_plans
# A section for today, and a section for tomorrow — two days, two sections.
- runFlow:
    file: ../../helpers/plans-section.yaml
    env:
      PLANS_SECTION: ${output.PLANS_TODAY_SECTION}
- runFlow:
    file: ../../helpers/plans-section.yaml
    env:
      PLANS_SECTION: ${output.PLANS_TOMORROW_SECTION}
