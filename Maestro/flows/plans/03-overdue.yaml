# Plans: overdue work leads the timeline, in a section of its own.
appId: com.singularity.todo
name: plans-overdue
tags:
  - plans
  - scenario:PLANS-05
---
- runFlow: ../../helpers/launch-clean.yaml
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=Late%20task&due=-1d"
- tapOn:
    id: nav_tab_plans
# The overdue section is above the dated ones: the first section on the screen.
- extendedWaitUntil:
    visible:
      id: plans_section_overdue
    timeout: 8000
# The container above (`plans_section_overdue`) proves the screen drew what can only
# hold the seeded row; this waits for that row itself in place, without
# scrolling, so the section the assertion below names stays on screen (`helpers/seed.yaml`,
# "How to wait for the row itself").
- extendedWaitUntil:
    visible:
      id: task_item_late_task
    timeout: 8000
