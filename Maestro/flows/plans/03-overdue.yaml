# Plans: overdue work leads the timeline, in a section of its own.
appId: com.singularity.todo
name: plans-overdue
tags:
  - plans
  - scenario:PLANS-05
---
- runFlow: ../../helpers/launch-clean.yaml
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=Late%20task&due=-1d"
- runFlow: ../../helpers/open-app-menu.yaml
# Plans is an entry of the app menu, below the fold of the sheet: a row that is
# drawn but off-screen is not a row the user can reach.
- scrollUntilVisible:
    element:
      id: menu_plans
    direction: DOWN
    timeout: 10000
- tapOn:
    id: menu_plans
# The overdue section is above the dated ones: the first section on the screen.
- extendedWaitUntil:
    visible:
      id: plans_section_overdue
    timeout: 8000
