# Plans: an empty horizon says there is nothing scheduled.
appId: com.singularity.todo
name: plans-empty
tags:
  - plans
  - scenario:PLANS-10
---
- runFlow: ../../helpers/launch-clean.yaml
- runFlow: ../../helpers/open-app-menu.yaml
# Plans is an entry of the app menu, below the fold of the sheet: a row that is
# drawn but off-screen is not a row the user can reach.
- scrollUntilVisible:
    element:
      id: menu_plans
    direction: DOWN
    timeout: 10000
- tapOn:
    id: menu_plans
- extendedWaitUntil:
    visible:
      id: plans_empty_state
    timeout: 8000
