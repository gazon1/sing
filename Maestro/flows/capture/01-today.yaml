# The first store screenshot: the Today screen with the work that is due now.
#
# The dataset is the storyboard's (Maestro/capture/demo-dataset.yaml): three
# tasks due today, so the screen is never empty. The flow asserts the section
# and the three rows before the shot — a navigation that lands on a blank list
# must not produce a screenshot.
#
# Tagged `manual`: the capture runs on the store capture device, on purpose,
# and the nightly full suite must not pay for it.
# прогнан на устройстве: нет (2026-11-19) — поток добавлен в #3004, устройство не было доступно
appId: com.singularity.todo
name: capture-today
tags:
  - manual
---
- runFlow: ../../helpers/launch-clean.yaml
- runFlow: ../../capture/demo-dataset.yaml
# The section that holds what is due today. It renders because the dataset put
# tasks in it, so this waits for the content and not for the screen.
- extendedWaitUntil:
    visible:
      id: agenda_section_today
    timeout: 8000
# The three tasks the storyboard promises. The rows are what the reader sees,
# and the screenshot is taken with all three on screen.
- assertVisible:
    id: task_item_review_the_launch_checklist
- assertVisible:
    id: task_item_order_the_kitchen_tiles
- assertVisible:
    id: task_item_book_the_electrician
- waitForAnimationToEnd
- takeScreenshot: 01-today
