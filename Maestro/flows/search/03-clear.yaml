# Search: clearing the query text returns to the idle prompt.
#
# The idle prompt is the search empty placeholder (testTag
# `search_empty_placeholder`, asserted by id so the flow survives translation).
# After clearing, the results must disappear and the prompt must return.
appId: com.singularity.todo
name: search-clear
tags:
  - search
  - scenario:SEARCH-03
---
# Seed a task to ensure there are results to clear.
# `due=today`: a task without a due date lands in the "No Date" bucket,
# which the Today tab does not show — the flow would assert against a task
# it had seeded and could not see.
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=ClearSearchTask2026&due=today"

# Open quick search.
- runFlow: ../../helpers/open-app-menu.yaml
- extendedWaitUntil:
    visible:
      id: menu_settings
    timeout: 5000
- tapOn:
    id: menu_quick_search
- extendedWaitUntil:
    visible:
      id: search_input
    timeout: 5000

# Type a query that produces results.
- tapOn:
    id: search_input
- inputText: "ClearSearchTask2026"
- extendedWaitUntil:
    visible:
      id: task_item_clearsearchtask2026
    timeout: 8000

# Clear the query with the field's own button — the id is the one
# `TestTags.SEARCH_CLEAR_BUTTON` applies, and it is listed in `Maestro/TAGS.md`.
# The keyboard's own erase action worked, but it is not the affordance the
# screen offers: a flow that drives the field's button is a flow that fails if
# the button stops emptying the query.
- tapOn:
    id: search_clear_button

# After clearing, the idle prompt returns.
- extendedWaitUntil:
    visible:
      id: search_empty_placeholder
    timeout: 8000

# Results must be gone.
- extendedWaitUntil:
    notVisible:
      id: task_item_clearsearchtask2026
    timeout: 8000
