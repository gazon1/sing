# Search: the pinned filter toggles task results.
#
# Two tasks exist: one pinned, one not. The test opens the filter sheet
# and toggles pinned-only on/off.
# прогнан на устройстве: нет (2026-10-23) — прогон на устройстве не выполнялся
appId: com.singularity.todo
name: search-filter-pinned
tags:
  - search
  - scenario:SEARCH-05
---
# Seed two tasks.
# `due=today`: a task without a due date lands in the "No Date" bucket,
# which the Today tab does not show — the flow would assert against a task
# it had seeded and could not see.
- openLink: "todo-debug://seed?task=PinnedTask2026&due=today"
- openLink: "todo-debug://seed?task=UnpinnedTask2026&due=today"
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000

# Pin the first task via detail view.
#
# The Today tab, not the Inbox one: both tasks were seeded with `due=today`,
# and a task with a due date is in the Today bucket, not in the Inbox. The
# flow used to tap the Inbox tab and then wait for a task that was not there.
- tapOn:
    id: nav_tab_today
- extendedWaitUntil:
    visible:
      id: task_item_pinnedtask2026
    timeout: 8000
- tapOn:
    id: task_item_pinnedtask2026
- extendedWaitUntil:
    visible:
      text: "PinnedTask2026"
    timeout: 8000
# Scroll and pin it.
- scrollUntilVisible:
    element:
      id: task_editor_pin_row
    direction: DOWN
    timeout: 8000
- tapOn:
    id: task_editor_pin_row
- back

# Open quick search.
- tapOn:
    id: nav_menu_button
- extendedWaitUntil:
    visible:
      id: menu_settings
    timeout: 5000
- tapOn:
    id: menu_quick_search
- extendedWaitUntil:
    visible:
      id: search_input
    timeout: 5000

# Type the query that surfaces both tasks — and switch the mode, because the
# two titles share no beginning.
#
# "PinnedTask2026" and "UnpinnedTask2026" have no common prefix, so no word
# query can find both of them: the word rule finds a word by its beginning.
# The query "Task2026" is in the middle of both titles, which is exactly what
# the contains mode is for — the escape-hatch of the word rule, and the reason
# it exists (F6). The flow used to type "Task2026" in the word mode, where it
# found nothing.
- tapOn:
    id: search_input
- inputText: "Task2026"
- tapOn:
    id: search_mode_contains
- extendedWaitUntil:
    visible:
      id: task_item_pinnedtask2026
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: task_item_unpinnedtask2026
    timeout: 8000

# Open filter sheet via Tune icon (matched through its accessibility label).
- tapOn:
    text: "Filter"
- extendedWaitUntil:
    visible:
      id: search_filter_pinned_switch
    timeout: 8000

# Toggle pinned filter on.
- tapOn:
    id: search_filter_pinned_switch
- tapOn:
    id: search_filter_apply_button

# Only the pinned task remains visible.
- extendedWaitUntil:
    visible:
      id: task_item_pinnedtask2026
    timeout: 8000
- extendedWaitUntil:
    notVisible:
      id: task_item_unpinnedtask2026
    timeout: 8000
