# Search: the pinned filter toggles task results.
#
# Two tasks exist: one pinned, one not. The test opens the filter sheet
# and toggles pinned-only on/off.
appId: com.singularity.todo
name: search-filter-pinned
tags:
  - search
  - scenario:SEARCH-05
---
# Seed two tasks.
- openLink: "todo-debug://seed?task=${RUN_ID}_PinnedTask2026"
- openLink: "todo-debug://seed?task=${RUN_ID}_UnpinnedTask2026"
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000

# Pin the first task via detail view.
- tapOn:
    id: nav_tab_inbox
- extendedWaitUntil:
    visible:
      id: task_item_${RUN_ID}_pinnedtask2026
    timeout: 8000
- tapOn:
    id: task_item_${RUN_ID}_pinnedtask2026
- extendedWaitUntil:
    visible:
      id: task_detail_title
    timeout: 8000
# Scroll and pin it.
- scrollUntilVisible:
    element:
      id: task_detail_pin_button
    direction: DOWN
    timeout: 8000
- tapOn:
    id: task_detail_pin_button
- navigateBack

# Open quick search.
- tapOn:
    id: nav_menu_button
- extendedWaitUntil:
    visible:
      id: menu_settings
    timeout: 5000
- tapOn:
    id: menu_quick_search
- extendedWaitUntil:
    visible:
      id: search_input
    timeout: 5000

# Type query to surface both tasks.
- tapOn:
    id: search_input
- inputText: "Task2026"
- extendedWaitUntil:
    visible:
      id: task_item_${RUN_ID}_pinnedtask2026
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: task_item_${RUN_ID}_unpinnedtask2026
    timeout: 8000

# Open filter sheet via Tune icon.
- tapOn:
    iconDescription: "Filter"
- extendedWaitUntil:
    visible:
      id: search_filter_pinned_switch
    timeout: 8000

# Toggle pinned filter on.
- tapOn:
    id: search_filter_pinned_switch
- tapOn:
    id: search_filter_apply_button

# Only the pinned task remains visible.
- extendedWaitUntil:
    visible:
      id: task_item_${RUN_ID}_pinnedtask2026
    timeout: 8000
- extendedWaitUntil:
    notVisible:
      id: task_item_${RUN_ID}_unpinnedtask2026
    timeout: 8000
