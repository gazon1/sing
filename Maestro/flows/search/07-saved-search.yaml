# Search: a saved search persists across sessions and can be loaded.
#
# The SaveSearchDialog has no testTag on its internal controls, so the
# flow types the search name, submits via keyboard IME action, and
# verifies the saved search chip appears in the row.
appId: com.singularity.todo
name: search-saved-search
tags:
  - search
  - scenario:SEARCH-07
---
# Seed two tasks with a shared prefix.
# `due=today`: a task without a due date lands in the "No Date" bucket,
# which the Today tab does not show — the flow would assert against a task
# it had seeded and could not see.
#
# Both tasks are due today, so both are on the Today screen the seed leaves
# the app on: the helper waits for each row (the row rule).
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=Saved%20Search%202026%20Alpha&due=today"
      WAIT_FOR: "task_item_saved_search_2026_alpha"
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=Saved%20Search%202026%20Beta&due=today"
      WAIT_FOR: "task_item_saved_search_2026_beta"

# Open quick search.
- runFlow: ../../helpers/open-app-menu.yaml
- extendedWaitUntil:
    visible:
      id: menu_settings
    timeout: 5000
- tapOn:
    id: menu_quick_search
- extendedWaitUntil:
    visible:
      id: search_input
    timeout: 5000

# Type query.
- tapOn:
    id: search_input
- inputText: "Saved Search 2026"
# The helper waited for the row on the Today screen; this wait is for the
# result row on the Search screen, which is rendered only after the query is
# typed — the helper does not navigate there.
- extendedWaitUntil:
    visible:
      id: task_item_saved_search_2026_alpha
    timeout: 8000

# Open save dialog via the "Save" chip.
- tapOn:
    id: search_save_chip
- extendedWaitUntil:
    visible:
      text: "Search name"
    timeout: 5000

# Type a name and submit via the dialog's "Save" button (no keyboardActions).
#
# The field is pre-filled with the current query, so `inputText` — which appends
# — would save "<query><run id> My Saved Query" and the chip's id (the slug of
# the name) would carry the query too. The tap is what puts the cursor in the
# field; `eraseText` only has a focus to empty once it is there.
- tapOn:
    id: search_save_dialog_name
- eraseText
- inputText: "${RUN_ID} My Saved Query"
- tapOn:
    id: search_save_dialog_confirm

# Snackbar confirms save.
- extendedWaitUntil:
    visible:
      text: "Search saved"
    timeout: 5000

# The row offers the saved searches whose name matches the *query*, so typing the
# run id narrows it to the chip this run saved. That is also what keeps the flow
# repeatable: saved searches outlive the run that made them, and a blank field
# would offer every one of them, pushing this run's chip off the right end of a
# horizontal row where it is not composed at all.
- tapOn:
    id: search_clear_button
- tapOn:
    id: search_input
- inputText: "${RUN_ID}"

# The chip is addressed by the id its name produces, not by the name: the name
# is the runner's run id plus words, and
# `saved_search_chip_${RUN_ID}_my_saved_query` is the shape
# `TestTags.SavedSearches.chip` gives it.
- extendedWaitUntil:
    visible:
      id: saved_search_chip_${RUN_ID}_my_saved_query
    timeout: 8000

# Navigate away and come back. The search screen is full screen: the bottom bar
# — and every tab on it — is not on the screen while it is showing, so leaving
# is the bar's own back arrow and only then is there a tab to tap.
- tapOn:
    id: shell_back_button
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000
- runFlow: ../../helpers/open-app-menu.yaml
- extendedWaitUntil:
    visible:
      id: menu_settings
    timeout: 5000
- tapOn:
    id: menu_quick_search
- extendedWaitUntil:
    visible:
      id: search_input
    timeout: 5000

# The saved search persists and can be tapped to load the query. The field is
# still holding the run id, so the row is narrowed the same way.
- extendedWaitUntil:
    visible:
      id: saved_search_chip_${RUN_ID}_my_saved_query
    timeout: 8000
- tapOn:
    id: saved_search_chip_${RUN_ID}_my_saved_query
- extendedWaitUntil:
    visible:
      id: task_item_saved_search_2026_alpha
    timeout: 8000

# Leave the search screen. The flow's last state is a full-screen Search, whose
# bottom bar — and `nav_tab_today` with it — is not on the screen. A run that
# ends here hands the next run a `launch-clean` that resumes into Search and
# waits for a tab the screen does not carry.
#
# The bar's own back arrow, not the system `back`: the keyboard is up from the
# last `inputText`, and a system back closes the keyboard instead of leaving
# the screen.
- tapOn:
    id: shell_back_button
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000
