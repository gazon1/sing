# Search: a saved search persists across sessions and can be loaded.
#
# The SaveSearchDialog has no testTag on its internal controls, so the
# flow types the search name, submits via keyboard IME action, and
# verifies the saved search chip appears in the row.
appId: com.singularity.todo
name: search-saved-search
tags:
  - search
  - scenario:SEARCH-07
---
# Seed two tasks with a shared prefix.
# `due=today`: a task without a due date lands in the "No Date" bucket,
# which the Today tab does not show — the flow would assert against a task
# it had seeded and could not see.
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=SavedAlpha2026&due=today"
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=SavedBeta2026&due=today"

# Open quick search.
- runFlow: ../../helpers/open-app-menu.yaml
- extendedWaitUntil:
    visible:
      id: menu_settings
    timeout: 5000
- tapOn:
    id: menu_quick_search
- extendedWaitUntil:
    visible:
      id: search_input
    timeout: 5000

# Type query.
- tapOn:
    id: search_input
- inputText: "Saved2026"
- extendedWaitUntil:
    visible:
      id: task_item_savedalpha2026
    timeout: 8000
# The seeded entity's arrival signal is the container waited for
# above: it renders only while a row falls in it, so waiting for it is
# waiting for the row (`helpers/seed.yaml`, "What counts as the wait").
- extendedWaitUntil:
    visible:
      id: task_item_savedbeta2026
    timeout: 8000

# Open save dialog via the "Save" chip.
- tapOn:
    id: search_save_chip
- extendedWaitUntil:
    visible:
      text: "Search name"
    timeout: 5000

# Type a name and submit via the dialog's "Save" button (no keyboardActions).
- inputText: "${RUN_ID} My Saved Query"
- tapOn:
    id: search_save_dialog_confirm

# Snackbar confirms save.
- extendedWaitUntil:
    visible:
      text: "Search saved"
    timeout: 5000

# The saved search chip should appear in the saved searches row.
# It renders as a FilterChip with the saved name text.
- extendedWaitUntil:
    visible:
      text: "${RUN_ID} My Saved Query"
    timeout: 5000

# Navigate away and come back.
- tapOn:
    id: nav_tab_today
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000
- runFlow: ../../helpers/open-app-menu.yaml
- extendedWaitUntil:
    visible:
      id: menu_settings
    timeout: 5000
- tapOn:
    id: menu_quick_search
- extendedWaitUntil:
    visible:
      id: search_input
    timeout: 5000

# The saved search persists and can be tapped to load the query.
- extendedWaitUntil:
    visible:
      text: "${RUN_ID} My Saved Query"
    timeout: 5000
- tapOn:
    text: "${RUN_ID} My Saved Query"
- extendedWaitUntil:
    visible:
      id: task_item_savedalpha2026
    timeout: 8000
