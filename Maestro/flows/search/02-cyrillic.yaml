# Search: Cyrillic text in query is matched and rendered correctly.
#
# Maestro's `inputText` cannot type non-ASCII on Android, so the Cyrillic
# task is seeded via the debug deep-link and the search query is typed
# normally — the flow verifies that the Cyrillic title stored in the DB
# is correctly displayed in the results list.
appId: com.singularity.todo
name: search-cyrillic
tags:
  - search
  - i18n
  - scenario:SEARCH-02
---
# Seed a task with a Cyrillic title.
# `due=today` dates the task, so it belongs to today's work rather than to
# the "No Date" bucket an undated task lands in.
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=%D0%9F%D0%BE%D0%BA%D1%83%D0%BF%D0%BA%D0%B8&due=today"

# Open quick search from menu.
- runFlow: ../../helpers/open-app-menu.yaml
- extendedWaitUntil:
    visible:
      id: menu_settings
    timeout: 5000
- tapOn:
    id: menu_quick_search
- extendedWaitUntil:
    visible:
      id: search_input
    timeout: 5000

# Type the transliteration of the seeded title: Maestro's inputText cannot
# type Cyrillic, so the query goes in as Latin letters.
- tapOn:
    id: search_input
- inputText: "Pokupki"

# The task with Cyrillic title must appear in results.
#
# The row's id keeps the title's own slug, and the slug is Unicode-aware: a
# non-Latin title stays addressable instead of collapsing into an empty tag.
# The id is therefore the Cyrillic slug of the title, not a Latin spelling of
# it — the Latin spelling names a row that does not exist.
- extendedWaitUntil:
    visible:
      id: task_item_покупки
    timeout: 8000
