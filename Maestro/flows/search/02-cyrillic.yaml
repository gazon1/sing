# Search: Cyrillic text in the query matches and renders a Cyrillic title.
#
# The query is Cyrillic, and so is the seeded title — that is the thing the
# scenario asks for: a person typing "Покупки" gets the task called "Покупки",
# with its characters rendered as Cyrillic rather than as replacement
# characters or mojibake.
#
# ## What the flow asserts, and why each part is needed
#
# 1. The row `task_item_покупки` appears. The id is the slug of the seeded
#    title, and the slug keeps the letters it was given — so a row with this id
#    can only come from a task whose title is the Cyrillic word.
# 2. The row's text is asserted as written. An id proves the title reached the
#    app; the text proves it is drawn as Cyrillic on the screen.
#
# A query of Latin letters would match nothing here, and that is the point of
# the old version's failure: the word rule is a prefix rule over tokens, so
# "Pokupki" is not a prefix of "Покупки". The flow used to search by
# transliteration and assert the transliterated id — a pair that agreed with
# each other and with neither the app's tokenizer nor its slug rule.
#
# `inputText` types Cyrillic on this build, and not because of the keyboard:
# Maestro injects the text, so the flow does not depend on which IME is
# installed or which language it is in. That was measured on the RMX3938 with
# two different keyboards — the phone's own and the Gboard the CI emulator
# runs — and the seeded row came back under both. An earlier version of this
# flow carried the opposite claim, and the flow's coverage was weakened to fit
# it.
appId: com.singularity.todo
name: search-cyrillic
tags:
  - search
  - i18n
  - scenario:SEARCH-02
---
# Seed a task with a Cyrillic title.
# `due=today`: a task without a due date lands in the "No Date" bucket,
# which the Today tab does not show — the flow would assert against a task
# it had seeded and could not see.
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=%D0%9F%D0%BE%D0%BA%D1%83%D0%BF%D0%BA%D0%B8&due=today"

# Open quick search from menu.
- runFlow: ../../helpers/open-app-menu.yaml
- extendedWaitUntil:
    visible:
      id: menu_settings
    timeout: 5000
- tapOn:
    id: menu_quick_search
- extendedWaitUntil:
    visible:
      id: search_input
    timeout: 5000

# Type the Cyrillic word into the query field.
- tapOn:
    id: search_input
- inputText: "Покупки"

# The Cyrillic record reaches the results, and its title renders as Cyrillic.
- extendedWaitUntil:
    visible:
      id: task_item_покупки
    timeout: 8000
- assertVisible: "Покупки"

# Leave the search screen: it is full screen, and the next flow's `launch-clean`
# waits for a tab this screen does not draw.
- tapOn:
    id: shell_back_button
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000
