# Search: Cyrillic text in a task title is matched and rendered correctly.
#
# Maestro's `inputText` drives the IME key by key and cannot type non-ASCII on
# Android, and this Maestro build has no `pasteText` in its flow schema — so the
# query cannot be Cyrillic on the device. What the flow can still say is that a
# Cyrillic record reaches the results list and renders as Cyrillic: it seeds the
# Cyrillic task, searches by a term that record carries, and asserts the row —
# addressed by the id the Cyrillic title slugs to — and its text.
#
# The searched term is `due:today`, which every seeded task carries, so the flow
# does not depend on transliteration that neither the tokenizer nor the index
# produces. A query of Latin letters would match nothing here: the word rule is
# a prefix rule over tokens, so "Pokupki" is not a prefix of "Покупки", and the
# previous version of this flow asserted exactly that mismatch.
appId: com.singularity.todo
name: search-cyrillic
tags:
  - search
  - i18n
  - scenario:SEARCH-02
---
# Seed a task with a Cyrillic title.
# `due=today`: a task without a due date lands in the "No Date" bucket,
# which the Today tab does not show — the flow would assert against a task
# it had seeded and could not see.
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=%D0%9F%D0%BE%D0%BA%D1%83%D0%BF%D0%BA%D0%B8&due=today"

# Open quick search from menu.
- runFlow: ../../helpers/open-app-menu.yaml
- extendedWaitUntil:
    visible:
      id: menu_settings
    timeout: 5000
- tapOn:
    id: menu_quick_search
- extendedWaitUntil:
    visible:
      id: search_input
    timeout: 5000

# Ask for the records that are due today — the seeded task is one of them.
- tapOn:
    id: search_input
- inputText: "due:today"

# The Cyrillic record reaches the results, and its title renders as Cyrillic:
# the row's id is the slug of the title (the slug keeps the letters it was
# given), and the title text is asserted as it is written.
- extendedWaitUntil:
    visible:
      id: task_item_покупки
    timeout: 8000
- assertVisible: "Покупки"
