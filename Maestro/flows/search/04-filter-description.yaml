# Search: the has-description filter toggles task results.
#
# Two tasks exist: one with a description, one without. The test opens
# the filter sheet and toggles has-description on/off. Due to the Tune
# icon having no testTag in the TopAppBar, the filter sheet is opened
# via content description tap.
# прогнан на устройстве: нет (2026-10-23) — прогон на устройстве не выполнялся
appId: com.singularity.todo
name: search-filter-description
tags:
  - search
  - scenario:SEARCH-04
---
# Seed two tasks: one with description, one without.
# `due=today`: a task without a due date lands in the "No Date" bucket,
# which the Today tab does not show — the flow would assert against a task
# it had seeded and could not see.
- openLink: "todo-debug://seed?task=TaskWithDesc2026&desc=HasDescription&due=today"
- openLink: "todo-debug://seed?task=TaskNoDesc2026&due=today"
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000

# Open quick search.
- tapOn:
    id: nav_menu_button
- extendedWaitUntil:
    visible:
      id: menu_settings
    timeout: 5000
- tapOn:
    id: menu_quick_search
- extendedWaitUntil:
    visible:
      id: search_input
    timeout: 5000

# Type the query that surfaces both tasks.
#
# The query is "Task", and it is a *word-prefix* query: the word rule finds a
# word by its beginning, and "Task" is the beginning of both titles. The flow
# used to type "Task2026" — a query that spans the difference between the two
# titles and is therefore a prefix of neither. It was written before the word
# rule, when the app matched anywhere in the text; under the rule that is
# now in force it matched nothing at all, and the flow asserted against a
# result the app could not produce.
#
# The case of a term in the middle of a word is the contains mode's, and
# `09-contains-mode.yaml` is the flow that covers it.
- tapOn:
    id: search_input
- inputText: "Task"
- extendedWaitUntil:
    visible:
      id: task_item_taskwithdesc2026
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: task_item_tasknodesc2026
    timeout: 8000

# Open filter sheet via the Tune icon in the top bar (no testTag — use its label).
- tapOn:
    text: "Filter"
- extendedWaitUntil:
    visible:
      id: search_filter_has_description_switch
    timeout: 8000

# Toggle has-description filter on.
- tapOn:
    id: search_filter_has_description_switch
# Apply.
- tapOn:
    id: search_filter_apply_button
- extendedWaitUntil:
    visible:
      id: task_item_taskwithdesc2026
    timeout: 8000
# Task without description should be hidden.
- extendedWaitUntil:
    notVisible:
      id: task_item_tasknodesc2026
    timeout: 8000
