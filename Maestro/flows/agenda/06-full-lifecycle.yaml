# Full saved-view lifecycle (G-01): empty list → create → results → edit →
# rename → results → delete → empty.
#
# Mirrors desktop SavedViewsFlowTest + SavedAgendaEditFlowTest + the MR-1 fixes:
# Save navigates back to the list (the "Save spins forever" regression), and
# both the list-level Delete and the edit-mode Delete raise the confirm dialog
# ("Delete view?" → dialog_confirm).
#
# The card's overflow menu (⋮) carries a testTag of its own
# (saved_agenda_overflow_button), and so do its rows (saved_agenda_menu_edit,
# saved_agenda_menu_delete) — an earlier version of this flow opened the menu
# with a text selector, because the tags did not exist yet.
#
# прогнан на устройстве: да (2026-11-12) — realme RMX3938, 0O65321F32204DD5
appId: com.singularity.todo
name: agenda-full-lifecycle
tags:
  - regression
  - agenda
---
- runFlow: ../../helpers/launch-clean.yaml

# ── 1. Empty saved-views list ────────────────────────────────────────────
- tapOn:
    id: agenda_saved_views_button
- extendedWaitUntil:
    visible:
      id: saved_agenda_empty_title
    timeout: 8000

# ── 2. FAB → name → Save → back on the list with a card ─────────────────
- tapOn:
    id: saved_agenda_create_fab
- extendedWaitUntil:
    visible:
      id: saved_agenda_name_input
    timeout: 5000
# The name field comes pre-filled ("All"), and the tap that focuses it lands
# where the tap is — in the middle of the text, if the text is long enough. So
# the caret is put past the text (where the caret can only go to the end) and
# the field is cleared, before the name is typed. Without this the typed name
# lands inside the old one and the card's id — the slug of the name — is not
# the id the flow asserts on.
- tapOn:
    id: saved_agenda_name_input
    point: "95%,50%"
- eraseText
- inputText: "${RUN_ID} Journey View"
- hideKeyboard
- tapOn:
    id: saved_agenda_save_button
# MR-1 fix: SaveSuccess pops the editor back to the list.
- extendedWaitUntil:
    notVisible:
      id: saved_agenda_name_input
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: saved_agenda_card_${RUN_ID}_journey_view
    timeout: 8000

# ── 3. Card → Results (view name is the Results top-bar title) ──────────
- tapOn:
    id: saved_agenda_card_${RUN_ID}_journey_view
- extendedWaitUntil:
    visible:
      id: top_bar_back_button
    timeout: 8000
- tapOn:
    id: top_bar_back_button
- extendedWaitUntil:
    visible:
      id: saved_agenda_card_${RUN_ID}_journey_view
    timeout: 8000

# ── 4. Overflow menu → Edit → rename → Save ─────────────────────────────
- tapOn:
    id: saved_agenda_overflow_button
- extendedWaitUntil:
    visible:
      id: saved_agenda_menu_edit
    timeout: 5000
- tapOn:
    id: saved_agenda_menu_edit
- extendedWaitUntil:
    visible:
      id: saved_agenda_name_input
    timeout: 5000
# The same caret business as above: the field holds the old name, and the tap
# that focuses it would leave the caret inside it.
- tapOn:
    id: saved_agenda_name_input
    point: "95%,50%"
- eraseText
- inputText: "${RUN_ID} Journey Renamed"
- hideKeyboard
# The 8 preset section rows push Save below the fold on most devices.
- scrollUntilVisible:
    element:
      id: saved_agenda_save_button
    direction: UP
    timeout: 8000
- tapOn:
    id: saved_agenda_save_button
- extendedWaitUntil:
    notVisible:
      id: saved_agenda_name_input
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: saved_agenda_card_${RUN_ID}_journey_renamed
    timeout: 8000

# ── 5. Overflow menu → Delete → confirm → the list is empty again ─────────
# The list-side Delete asks first: the card's Delete opens the "Delete view?"
# confirmation (SavedAgendaListScreen → SavedAgendaDialog.Delete), and only
# `dialog_confirm` performs the delete. An earlier version of this flow
# assumed the delete was immediate and waited for the empty state while the
# dialog was still up.
- tapOn:
    id: saved_agenda_overflow_button
- extendedWaitUntil:
    visible:
      id: saved_agenda_menu_delete
    timeout: 5000
- tapOn:
    id: saved_agenda_menu_delete
- extendedWaitUntil:
    visible:
      id: dialog_title_delete_view
    timeout: 8000
- tapOn:
    id: dialog_confirm
- extendedWaitUntil:
    visible:
      id: saved_agenda_empty_title
    timeout: 8000
- assertNotVisible:
    id: saved_agenda_card_${RUN_ID}_journey_renamed
