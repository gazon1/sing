    env:
      QUERY: "task=BigOverdue7&due=-1d&count=25&id=bigoverdue7"
- extendedWaitUntil:
    visible:
      id: agenda_section_overdue
      text: "^Overdue .* 175$"
    timeout: 8000
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=BigOverdue8&due=-1d&count=25&id=bigoverdue8"
- extendedWaitUntil:
    visible:
      id: agenda_section_overdue
      text: "^Overdue .* 200$"
    timeout: 8000
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=BigOverdue9&due=-1d&count=25&id=bigoverdue9"
- extendedWaitUntil:
    visible:
      id: agenda_section_overdue
      text: "^Overdue .* 225$"
    timeout: 8000
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=BigOverdue10&due=-1d&count=25&id=bigoverdue10"
- extendedWaitUntil:
    visible:
      id: agenda_section_overdue
      text: "^Overdue .* 250$"
    timeout: 8000
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=BigOverdue11&due=-1d&count=25&id=bigoverdue11"
- extendedWaitUntil:
    visible:
      id: agenda_section_overdue
      text: "^Overdue .* 275$"
    timeout: 8000
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=BigOverdue12&due=-1d&count=25&id=bigoverdue12"
- extendedWaitUntil:
    visible:
      id: agenda_section_overdue
      text: "^Overdue .* 300$"
    timeout: 8000
# Container rule: the Today section renders only because the seeded
# TodayReachable is in it, so this wait is that task arriving — the overdue
# section above it says nothing about it. The helper waits for that section.
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=TodayReachable&due=today&id=todayreachable"
      WAIT_FOR: "agenda_section_today"
- assertVisible:
    id: task_item_todayreachable

# Overdue header shows full count while collapsed and exposes expand/view-all.
- assertVisible:
    text: ".*Overdue.*300.*"
- assertVisible:
    id: agenda_section_toggle_overdue
- assertVisible:
    id: agenda_section_view_all_overdue

# Full Overdue destination contains all overdue tasks (count badge/header).
- tapOn:
    id: agenda_section_view_all_overdue
- extendedWaitUntil:
    visible:
      id: agenda_section_overdue
    timeout: 8000
- assertVisible:
    text: ".*Overdue.*300.*"

# Return and verify expand/collapse restores access in place.
- back
- extendedWaitUntil:
    visible:
      id: agenda_section_today
    timeout: 8000
- tapOn:
    id: agenda_section_toggle_overdue
- extendedWaitUntil:
    visible:
      id: task_item_bigoverdue_1
    timeout: 8000
