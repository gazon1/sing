# Agenda: Today stays usable when the overdue section is very large.
#
# Seeds 300 overdue tasks (debug count) plus one task for today. The Today tab
# must keep today's section reachable without scrolling through overdue history:
# the overdue section is auto-collapsed with an accurate count and an explicit
# expand affordance, and the full Overdue destination contains all overdue tasks.
#
# прогнан на устройстве: да (2026-11-24) — эмулятор Android, emulator-5564
appId: com.singularity.todo
name: agenda-large-overdue
tags:
  - regression
  - agenda
---
- runFlow: ../../helpers/launch-clean.yaml

# The count the flow waits for lives on the Today tab, so the tab is opened
# before the first chunk is written.
- tapOn:
    id: nav_tab_today
#
# The counts this flow waits for are the counts of the rows this flow wrote:
# the profile is empty when the flow starts: the harness that runs the flow
# wipes the device before it (see the header of `helpers/launch-clean.yaml`).
# A row an earlier flow left behind would make every count here wrong, and
# the flow would fail on a count that has nothing to do with the write it is
# about.
#
# The big seed writes three hundred rows, and a row costs the seeder
# tens of milliseconds — 79 ms on the host the flow was measured on (100 rows
# took 7.9 s), and up to 300 ms on a host that is busy with something else. So
# three hundred rows take a minute or more, and that is longer than any
# wait the Maestro layer is given for a row (the item budget is 8 s, and every
# other kind is smaller). A seed that outlasts the budget cannot be waited
# for at all, so the rows are written in chunks: each chunk is a seed of its
# own, each chunk fits inside the wait that follows it, and the chunks add up
# to the three hundred rows the regression is about.
#
# Three hundred rows and not a thousand: the runner gives a flow five
# minutes (`scripts/src/emulator/maestro/_runner.py`), and a chunk costs the
# flow about ten seconds on a loaded host — the seed's own link, the helper's
# failure check, and the wait that follows the chunk. A thousand rows would
# need forty-one chunks and about seven minutes, and the flow would be cut
# off by the runner before its last chunk landed. Three hundred rows are
# fifteen times the count at which the agenda collapses the
# overdue section (`AgendaPresets.LARGE_OVERDUE_THRESHOLD`), so the
# regression the flow is about is the same one either way.
#
# The rows of a chunk are titled after the chunk ("BigOverdue-1"…"BigOverdue-25",
# "BigOverdue2-1"…), because a seed titles its rows after the query it was
# given — two chunks with the same base title would write the same rows twice.
# The first chunk keeps the base title "BigOverdue", so the row the flow
# asserts on at the end ("BigOverdue-1") is the first row of the section: the
# section renders its rows in the order they were written, and the first
# chunk was written first.
#
# Every chunk is waited for, and the wait names the count the app itself
# renders: the header of the section carries the number of rows the section
# holds ("Overdue  ·  137"), so the count can only reach the chunk's total once
# the chunk's rows are in the database. A chunk still being written would leave
# the count short, and the wait would time out on it — the flow fails on the
# chunk that did not land, and not on the aggregate assertion at the end.
#
# The wait is priced at the "item" kind (8 s), because the section header is
# the element it names, and it has to cover the whole write: the seed itself,
# the app that comes up after it, and the agenda that reads the rows back. A
# chunk is twenty-five rows: at 79 ms a row the write takes about 2 s, and at
# 300 ms a row it takes about 7 s — either way it fits inside the 8 s the
# item budget gives it. Twelve chunks of twenty-five rows are the three hundred
# rows the flow is about.
#
# The first chunk brings the overdue section in: the helper waits for that
# section (container rule). The count-text wait below is kept — it asserts the
# chunk's count, not just the section's arrival.
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=BigOverdue&due=-1d&count=25&id=bigoverdue"
      WAIT_FOR: "agenda_section_overdue"
- extendedWaitUntil:
    visible:
      id: agenda_section_overdue
      text: "^Overdue .* 25$"
    timeout: 8000
# Chunks 2-12 add rows to the overdue section chunk 1 brought in. The helper
# cannot WAIT_FOR that section — it was already on screen before these seeds
# ran — and the rows are overdue multi-row chunks (no row wait). Each count-text
# wait below is the caller-side wait for that chunk's write: it observes the
# count change the chunk produced, so it is evidence for this chunk, not for an
# earlier one.
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=BigOverdue2&due=-1d&count=25&id=bigoverdue2"
- extendedWaitUntil:
    visible:
      id: agenda_section_overdue
      text: "^Overdue .* 50$"
    timeout: 8000
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=BigOverdue3&due=-1d&count=25&id=bigoverdue3"
- extendedWaitUntil:
    visible:
      id: agenda_section_overdue
      text: "^Overdue .* 75$"
    timeout: 8000
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=BigOverdue4&due=-1d&count=25&id=bigoverdue4"
- extendedWaitUntil:
    visible:
      id: agenda_section_overdue
      text: "^Overdue .* 100$"
    timeout: 8000
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=BigOverdue5&due=-1d&count=25&id=bigoverdue5"
- extendedWaitUntil:
    visible:
      id: agenda_section_overdue
      text: "^Overdue .* 125$"
    timeout: 8000
- runFlow:
