# Agenda: the inbox holds the tasks that are not dated yet — an undated task sits
# in "No Date", and dating it takes it out of the inbox.
#
# The three agenda tabs are disjoint: the inbox holds the undated tasks, the Today
# tab the overdue and today's ones, the Upcoming tab what is coming. So dating a
# task moves it out of the inbox and into one of the other two.
# Section headers render as "<Section>  ·  <count>".
#
# прогнан на устройстве: да (2026-11-12) — realme RMX3938, 0O65321F32204DD5
appId: com.singularity.todo
name: agenda-smart-lists
tags:
  - regression
  - agenda
---
# Start from a clean-ish slate — use launch-clean (no Room clear available).
- runFlow: ../../helpers/launch-clean.yaml

# Seed an undated task via the DebugSeedActivity deep-link. `due=` is omitted, so
# the task has no due date and Inbox buckets it under "No Date".
#
# Seeding is used instead of driving the editor's title field because it yields a
# deterministic fixture, independent of keyboard/IME behaviour.
#
# The title is fixed, and the seed replaces: seeding "SDNoDate" again updates the
# row this flow seeded instead of adding a second one. A per-run prefix would have
# avoided the collision by making every run's row a different row — at the price of
# a name, a test tag and a failure message that changed on every run. This flow
# dates the task, so a leftover copy would have been dated too and would have
# broken the "not on Today" assertion below; with a replacing seed the leftover is
# the same row.
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=SDNoDate"
- tapOn:
    id: nav_tab_inbox
- extendedWaitUntil:
    visible:
      id: nav_tab_inbox
    timeout: 10000

# The row's testTag is the slugified title: TestTags.taskItem("SDNoDate").
# Scroll to it rather than waiting for it in place: launch-clean does not clear
# Room, so tasks from other runs may still be listed above this one.
- scrollUntilVisible:
    element:
      id: "task_item_sdnodate"
    direction: DOWN
    timeout: 8000

# Scroll to "No Date" section — it may contain stale tasks too.
- scrollUntilVisible:
    element:
      id: agenda_section_no_date
    direction: DOWN
    timeout: 8000
- assertVisible:
    id: agenda_section_no_date
# The task appears in the "No Date" section (with possible stale companions).

# Verify the task is NOT on the Today tab. The section header only renders when the
# section is non-empty, and the only seeded task is undated — so wait for the tab
# itself to compose and assert absence directly.
- tapOn:
    id: nav_tab_today
- extendedWaitUntil:
    visible:
      id: tasks_fab
    timeout: 8000
- assertNotVisible:
    id: "task_item_sdnodate"

# Go back to Inbox and date the task.
- tapOn:
    id: nav_tab_inbox
- extendedWaitUntil:
    visible:
      id: "task_item_sdnodate"
    timeout: 8000
- tapOn:
    id: "task_item_sdnodate"
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 5000

# The due-row is below the fold on phone — scroll to it first.
- scrollUntilVisible:
    element:
      id: task_editor_due_row
    direction: DOWN
    timeout: 8000
- tapOn:
    id: task_editor_due_row

# Tapping the due row opens the scheduling sheet — the one sheet that owns the
# due date, the time and the deadline. Assert the sheet BODY rather than its
# heading: the heading is copy the sheet is free to reword, the tag is not.
#
# The day is picked with the sheet's own "Today" chip, not with a day cell: a
# day cell carries only the library's date description, and the grid composes
# only the cells that fit on screen — on a short phone the row the day is in is
# not composed at all. The chip is app-owned and always on top of the sheet.
- extendedWaitUntil:
    visible:
      id: task_scheduling_sheet
    timeout: 8000
- tapOn:
    id: task_scheduling_today_chip

# Confirm the date. The sheet body scrolls, so the actions row can start below
# the fold — scroll it into reach first, then tap Save by its testTag.
- scrollUntilVisible:
    element:
      id: task_scheduling_confirm
    direction: DOWN
    timeout: 8000
- tapOn:
    id: task_scheduling_confirm

# Confirm closes the sheet and applies the date (the detail editor edits live),
# so wait for the sheet to close before leaving the editor.
- extendedWaitUntil:
    notVisible:
      id: task_scheduling_sheet
    timeout: 8000
# Back returns to Inbox; the dated task leaves the inbox.
- back
- extendedWaitUntil:
    visible:
      id: nav_tab_inbox
    timeout: 10000

- assertNotVisible:
    id: "task_item_sdnodate"

# The dated task is not lost — it is in the Today tab now (the Upcoming tab would
# hold it if it were dated later than today). The Today tab shows the work-day
# blocks on a working day, and those hold the timed tasks only, so the row is
# looked for without pinning it to a section header.
- tapOn:
    id: nav_tab_today
- extendedWaitUntil:
    visible:
      id: "task_item_sdnodate"
    timeout: 8000
