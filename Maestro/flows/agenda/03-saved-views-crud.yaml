# Agenda: save the current agenda as a named view, then delete it.
#
# Save-current seeds the editor with the active definition *and* pre-fills the
# name with the agenda's title ("Today"), so the field must be cleared before
# typing — inputText appends. Saving returns to the agenda, not to the list.
# Delete is only offered in edit mode, which is what the second half exercises.
appId: com.singularity.todo
name: agenda-saved-views-crud
tags:
  - regression
  - agenda
---
- runFlow: ../../helpers/launch-clean.yaml
- tapOn:
    id: agenda_save_current_button
- extendedWaitUntil:
    visible:
      id: saved_agenda_name_input
    timeout: 8000
- tapOn:
    id: saved_agenda_name_input
- eraseText
- inputText: "Focus"
- hideKeyboard
- tapOn:
    id: saved_agenda_save_button
# Save pops the editor: SaveSuccess maps to Notification.NavigateBack
# (SavedAgendaScreen.kt), and SavedAgendaCreateFlowTest pins that contract on
# desktop. An earlier version of this flow said the opposite and tapped the
# top-bar arrow expecting a "Discard changes?" guard — which made it a race,
# since the guard appeared only if the tap beat the pop. Assert the pop.
# Note: Notification.Text("Saved", null) is a no-op (ResultDialog early-exits
# when text==null); a real toast needs Notification.Undo. See
# deferred-backlog.md#saved-views-crud-flow-selects-a-snackbar-that-does-not-exist.
- extendedWaitUntil:
    notVisible:
      id: saved_agenda_name_input
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: agenda_saved_views_button
    timeout: 8000
# The view is now in the list.
- tapOn:
    id: agenda_saved_views_button
- extendedWaitUntil:
    visible: "Saved Views"
    timeout: 8000
- assertVisible: "Focus"
# Open it in the editor. Tapping the card body opens the *results* screen, not
# the editor — Edit lives in the card's overflow menu (SavedAgendaCard.kt), and
# Delete is only offered from edit mode, which is what the second half needs.
- tapOn: "⋮"
- extendedWaitUntil:
    visible: "Edit"
    timeout: 8000
- tapOn: "Edit"
- extendedWaitUntil:
    visible:
      id: saved_agenda_name_input
    timeout: 8000
- assertVisible:
    id: saved_agenda_delete_button
- tapOn:
    id: saved_agenda_delete_button
- extendedWaitUntil:
    visible: "Delete view?"
    timeout: 8000
# By label, not by id: an AlertDialog is its own Android window, and the
# testTagsAsResourceId semantics property is not inherited into it, so
# dialog_confirm never appears in the UIAutomator hierarchy. The tag is still
# correct for the desktop Compose tests, which read the semantics tree.
- tapOn: "Delete"

- extendedWaitUntil:
    visible: "Saved Views"
    timeout: 8000
- assertNotVisible: "Focus"
