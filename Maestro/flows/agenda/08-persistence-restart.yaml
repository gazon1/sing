# Persistence: a saved view survives a full app restart (G-03).
#
# The restart is the sanctioned one — `relaunch.yaml`: the app is stopped and
# started again, so the process is gone and the Room database is not. The wipe
# belongs to the runner, which cleans the device before the flow, not to a
# helper: a restart here keeps what the flow wrote, and the flow started from
# a clean device. This is the Android mirror of the backup/restore concern in
# deferred-backlog (agenda_views were added to BackupPayload in MR-1; this
# journey pins plain restart persistence).
appId: com.singularity.todo
name: agenda-persistence-restart
tags:
  - regression
  - agenda
---
- runFlow: ../../helpers/launch-clean.yaml

# ── 1. Create a view ────────────────────────────────────────────────────
- tapOn:
    id: agenda_saved_views_button
- extendedWaitUntil:
    visible:
      id: saved_agenda_create_fab
    timeout: 8000
- tapOn:
    id: saved_agenda_create_fab
- extendedWaitUntil:
    visible:
      id: saved_agenda_name_input
    timeout: 5000
- tapOn:
    id: saved_agenda_name_input
- eraseText
- inputText: "${RUN_ID} Persistent View"
- hideKeyboard
- tapOn:
    id: saved_agenda_save_button
- extendedWaitUntil:
    notVisible:
      id: saved_agenda_name_input
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: saved_agenda_card_${RUN_ID}_persistent_view
    timeout: 8000

# ── 2. Kill the process (state preserved) and relaunch ──────────────────
# The sanctioned restart: stop the app, start it again, keep the database.
- runFlow: ../../helpers/relaunch.yaml
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000

# ── 3. The view is still in the list ────────────────────────────────────
- tapOn:
    id: agenda_saved_views_button
- extendedWaitUntil:
    visible:
      id: saved_agenda_card_${RUN_ID}_persistent_view
    timeout: 8000
