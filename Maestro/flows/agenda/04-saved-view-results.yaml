# Agenda: tap a saved view card in the list → see the results screen
# with tasks matching that view's definition.
#
# The flow:
# 1. Seed an active task so the "Active tasks" section has content.
# 2. Create a saved view named "My Active Tasks" with an Active-tasks section.
# 3. Navigate to Saved Views list.
# 4. Tap the "My Active Tasks" card → SavedAgendaResults screen.
# 5. Verify the view's title in the top bar.
# 6. Verify the seeded task appears (matches the Active-tasks filter).
#
# прогнан на устройстве: да (2026-11-12) — realme RMX3938, 0O65321F32204DD5
appId: com.singularity.todo
name: agenda-saved-view-results
tags:
  - regression
  - agenda
---
# ── Seed one active task ───────────────────────────────────────────────────
- runFlow: ../../helpers/seed-task.yaml

# ── Create saved view: Inbox tab → Save Current → name → save ───────────────
# The tab matters. seed-task creates an *undated* task, and the saved view
# evaluates that definition's sections against real tasks: of the three tabs,
# only the Inbox preset has a "No Date" section, so a view saved from Today
# (Overdue + Today) can never show it. The desktop twin of this flow makes the
# same choice and says why — see OpenSavedViewShowsMatchingTasksFlowTest.
- tapOn:
    id: nav_tab_inbox
- extendedWaitUntil:
    visible:
      id: agenda_overflow_button
    timeout: 8000
# Save-current lives in the agenda bar's overflow menu.
- tapOn:
    id: agenda_overflow_button
- extendedWaitUntil:
    visible:
      id: agenda_save_current_button
    timeout: 5000
- tapOn:
    id: agenda_save_current_button
- extendedWaitUntil:
    visible:
      id: saved_agenda_name_input
    timeout: 5000
- tapOn:
    id: saved_agenda_name_input
- eraseText
- inputText: "${RUN_ID} My Active Tasks"
- hideKeyboard
- tapOn:
    id: saved_agenda_save_button
# Save pops the editor: SaveSuccess maps to Notification.NavigateBack
# (SavedAgendaScreen.kt), and the desktop twin pins that contract on
# SavedAgendaCreateFlowTest. An earlier version of this flow assumed the
# editor stayed open and tapped the top-bar arrow to leave it — an arrow that
# is not on the agenda screen at all (the shell draws `shell_back_button`
# there), so the flow died on "Element not found: top_bar_back_button".
# Assert the pop instead.
#
# No `hideKeyboard` here: the keyboard was already hidden above, and a
# `hideKeyboard` with nothing to hide is a BACK keypress — which the editor
# reads as "dismiss me". Measured on a real phone (2026-10-28). See
# docs/decisions/2026-10-28-the-keyboard-was-already-down.md.
- extendedWaitUntil:
    notVisible:
      id: saved_agenda_name_input
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: agenda_saved_views_button
    timeout: 8000

# ── Open Saved Views list ────────────────────────────────────────────────────
- tapOn:
    id: agenda_saved_views_button
- extendedWaitUntil:
    visible:
      id: saved_agenda_create_fab
    timeout: 8000
# The "My Active Tasks" card should be visible.
- assertVisible:
    id: saved_agenda_card_${RUN_ID}_my_active_tasks

# ── Tap the card → SavedAgendaResults screen ────────────────────────────────
- tapOn:
    id: saved_agenda_card_${RUN_ID}_my_active_tasks
# The results screen shows the view name in the top bar.
- extendedWaitUntil:
    visible:
      id: top_bar_back_button
    timeout: 8000
# The seeded "Buy milk" task matches the Active-tasks filter and should appear.
- extendedWaitUntil:
    visible:
      id: task_item_buy_milk
    timeout: 8000
- assertVisible:
    id: task_item_buy_milk
