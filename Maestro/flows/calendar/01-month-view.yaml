# Calendar: the Month view renders the current month with weekday columns.
#
# The month title is asserted by the node that holds it, not by its wording.
# The title is a formatted string — "October 2026" — whose wording, word order
# and month name belong to the app, and the app is free to change them; a flow
# that asserts the title asserts the app's copy. The day cell's testTag carries
# the same fact as data, and data cannot be reworded.
appId: com.singularity.todo
name: calendar-month-view
tags:
  - smoke
  - calendar
---
- runFlow: ../../helpers/launch-clean.yaml
- runScript: ../../helpers/scripts/date.js
# The Calendar left the bottom bar; it is an entry of the app menu.
- runFlow: ../../helpers/open-app-menu.yaml
- tapOn:
    id: menu_calendar
# The grid is showing the current month: today's cell is one of its cells.
- runFlow:
    file: ../../helpers/calendar-day-cell.yaml
    env:
      DAY_CELL: ${output.TODAY_CELL}
# The view names the period it is showing. The tag is on the title node, so
# the assertion survives a reworded month name: what is checked is that the
# calendar named the period, not which words it used.
- assertVisible:
    id: calendar_month_title
# Weekday columns, addressed by testTag so the flow survives translation.
- assertVisible:
    id: calendar_weekday_mon
- assertVisible:
    id: calendar_weekday_sun
# The month runs from the 1st to the last day, and both are cells of the grid.
- runFlow:
    file: ../../helpers/calendar-day-cell.yaml
    env:
      DAY_CELL: ${output.FIRST_CELL}
- runFlow:
    file: ../../helpers/calendar-day-cell.yaml
    env:
      DAY_CELL: ${output.LAST_CELL}
# The view-mode dropdown shows the current mode only after it is opened.
# The trigger carries a testTag; the month item inside only exists when expanded.
- tapOn:
    id: calendar_view_mode_trigger
- extendedWaitUntil:
    visible:
      id: calendar_view_mode_month
    timeout: 8000
