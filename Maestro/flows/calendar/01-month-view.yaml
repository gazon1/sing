# Calendar: the Month view renders the current month with weekday columns.
#
# Day cells carry no testTag and no contentDescription — only their number as
# text, which is what this asserts on.
appId: com.singularity.todo
name: calendar-month-view
tags:
  - smoke
  - calendar
---
- runFlow: ../../helpers/launch-clean.yaml
- runScript: ../../helpers/scripts/date.js
- tapOn:
    id: nav_tab_calendar
- extendedWaitUntil:
    visible: ${output.monthTitle}
    timeout: 8000
# Weekday columns.
- assertVisible: "Mon"
- assertVisible: "Sun"
# A month's worth of numbered day cells, first and last of the grid.
- assertVisible: "1"
- assertVisible: ${output.lastDay}
# The view-mode control reports the current mode.
- assertVisible: "Month"
