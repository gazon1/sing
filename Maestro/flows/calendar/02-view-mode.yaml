# Calendar: switch the view mode between the four available modes.
#
# The mode control shows the *current* mode; tapping it opens the four-way
# switcher. The control is addressed by its testTag and not by the mode name
# it happens to display: the name is the app's copy, and the copy is not what
# this flow is about.
appId: com.singularity.todo
name: calendar-view-mode
tags:
  - regression
  - calendar
---
- runFlow: ../../helpers/launch-clean.yaml
- runScript: ../../helpers/scripts/date.js
- tapOn:
    id: nav_tab_calendar
# The grid is showing the current month: today's cell is one of its cells.
- runFlow:
    file: ../../helpers/calendar-day-cell.yaml
    env:
      DAY_CELL: ${output.TODAY_CELL}
# The view-mode selector button shows the current mode. Tap it to open the
# dropdown — the dropdown items (calendar_view_mode_*) only exist in the
# hierarchy when the dropdown is expanded.
- tapOn:
    id: calendar_view_mode_trigger
- extendedWaitUntil:
    visible:
      id: calendar_view_mode_month
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: calendar_view_mode_week
    timeout: 8000
- assertVisible:
    id: calendar_view_mode_day
- assertVisible:
    id: calendar_view_mode_4_days
- tapOn:
    id: calendar_view_mode_week
# The dropdown closes after selection.  The flow is a smoke test — a crash
# or hang would fail the flow; we simply verify it completes without error.
- waitForAnimationToEnd
