# Calendar: switch the view mode between the four available modes.
#
# The mode control is labelled with the *current* mode ("Month"); tapping it
# opens the four-way switcher.
appId: com.singularity.todo
name: calendar-view-mode
tags:
  - regression
  - calendar
---
- runFlow: ../../helpers/launch-clean.yaml
- runScript: ../../helpers/scripts/date.js
- tapOn:
    id: nav_tab_calendar
- extendedWaitUntil:
    visible: ${output.monthTitle}
    timeout: 8000
# The view-mode selector button shows the current mode text ("Month").
# Tap it to open the dropdown — the dropdown items (calendar_view_mode_*) only
# exist in the hierarchy when the dropdown is expanded.
- tapOn:
    text: "Month"
- extendedWaitUntil:
    visible:
      id: calendar_view_mode_month
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: calendar_view_mode_week
    timeout: 8000
- assertVisible:
    id: calendar_view_mode_day
- assertVisible:
    id: calendar_view_mode_four_days
- tapOn:
    id: calendar_view_mode_week
# The dropdown closes after selection.  The flow is a smoke test — a crash
# or hang would fail the flow; we simply verify it completes without error.
- waitForAnimationToEnd
