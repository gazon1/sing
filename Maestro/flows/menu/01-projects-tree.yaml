# The menu carries the projects as a tree, and the way to the full list.
#
# The project is seeded with the id it carries, so the node in the tree is
# addressed by that id rather than by the name the user reads — a name is copy,
# and an id is not.
appId: com.singularity.todo
name: menu-projects-tree
tags:
  - menu
  - scenario:MENU-01
---
- runFlow: ../../helpers/launch-clean.yaml
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "project=Roadmap&id=roadmap"
- runFlow: ../../helpers/open-app-menu.yaml
# The section is folded by default, so the tree is not drawn until the user
# unfolds it.
- runFlow: ../../helpers/expand-projects-section.yaml
# The way to the full list is above the tree, so it is reachable whether the
# tree is unfolded or not.
- scrollUntilVisible:
    element:
      id: menu_all_projects
    direction: DOWN
    timeout: 5000
- assertVisible:
    id: menu_all_projects
# The tree sits at the end of the menu, below the fold — a row that is drawn
# but off-screen is not a row the user can see.
- scrollUntilVisible:
    element:
      id: menu_project_node_roadmap
    direction: DOWN
    timeout: 8000
- assertVisible:
    id: menu_project_node_roadmap
