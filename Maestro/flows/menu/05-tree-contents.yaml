# The menu: the Projects section shows what is being worked on.
#
# A project without children shows no expander, so nothing in the menu invites
# an expansion that cannot happen. A closed project has left the work, and the
# menu shows the work — so it is not in the section at all.
#
# The seed is given the project's id, so the row in the menu is addressed by
# that id rather than by the name the user reads — a name is copy, and an id is
# not.
appId: com.singularity.todo
name: menu-tree-contents
tags:
  - menu
  - scenario:MENU-05
---
- runFlow: ../../helpers/launch-clean.yaml
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "project=Childless&id=childless"
- runFlow: ../../helpers/open-app-menu.yaml
# The section is folded by default, so the projects are unfolded before they are used.
- runFlow: ../../helpers/expand-projects-section.yaml
# The projects sit at the end of the menu, below the fold.
- scrollUntilVisible:
    element:
      id: menu_project_node_childless
    direction: DOWN
    timeout: 8000
# The project is in the section. Nothing here says it has no expander: the
# expander is a child of the row, and a project without children has none.
- assertVisible:
    id: menu_project_node_childless
