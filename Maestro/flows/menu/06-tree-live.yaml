# The menu: the tree reflects creations and renames made elsewhere.
#
# The tree is not a snapshot: it is drawn from the profile's projects, so what
# happened elsewhere is what the tree shows. Neither the creation nor the
# rename needs the app to be restarted, and neither needs the menu to be
# closed and opened by the user afterwards.
#
# The menu is a modal sheet on Android, and a change made on another surface
# closes it — a sheet the user cannot reach past is not a menu the user can
# change a project behind. So the Android carrier reads the tree through a new
# opening and checks that it is current. The liveness itself — the tree
# updating while the menu is open — is what the Desktop drawer's test covers,
# where the drawer and the app share one window.
#
# The seeds are given the ids the projects carry, so the nodes in the tree are
# addressed by those ids rather than by the names the user reads — a name is
# copy, and an id is not.
appId: com.singularity.todo
name: menu-tree-live
tags:
  - smoke
  - menu
  - scenario:MENU-03
---
- runFlow: ../../helpers/launch-clean.yaml
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "project=Roadmap&id=roadmap"
- runFlow: ../../helpers/open-app-menu.yaml
# The tree is drawn, so the profile's projects are in it.
- scrollUntilVisible:
    element:
      id: menu_project_node_roadmap
    direction: DOWN
    timeout: 8000
# A project is created elsewhere, and another one is renamed elsewhere: a seed
# that names an id that is already there owns that row and gives it another
# name.
- openLink: "todo-debug://seed?project=Latecomer&id=latecomer"
- openLink: "todo-debug://seed?project=Renamed&id=roadmap"
- runFlow: ../../helpers/open-app-menu.yaml
# The creation is in the tree.
- scrollUntilVisible:
    element:
      id: menu_project_node_latecomer
    direction: DOWN
    timeout: 8000
- assertVisible:
    id: menu_project_node_latecomer
# And the rename is too: the row is the same row, under another name.
- assertVisible:
    id: menu_project_node_roadmap
- assertVisible:
    text: "Renamed"
