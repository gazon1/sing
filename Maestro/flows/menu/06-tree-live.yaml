# The menu: the tree reflects creations and renames made elsewhere.
#
# The tree is not a snapshot: it watches the projects, so a project created in
# another screen shows up without the menu being closed and reopened in between.
#
# The project is created through the project's own screen — the list, the FAB,
# the editor — and the tree then shows what the editor wrote.
appId: com.singularity.todo
name: menu-tree-live
tags:
  - smoke
  - menu
  - scenario:MENU-03
---
- runFlow: ../../helpers/launch-clean.yaml
- runFlow: ../../helpers/open-app-menu.yaml
# The full project list is reached from the menu's Projects section.
- scrollUntilVisible:
    element:
      id: menu_all_projects
    direction: DOWN
    timeout: 5000
- tapOn:
    id: menu_all_projects
- extendedWaitUntil:
    visible:
      id: tasks_fab
    timeout: 8000
# A project is created in its own screen, not in the tree.
- tapOn:
    id: tasks_fab
- extendedWaitUntil:
    visible:
      id: project_editor_name_input
    timeout: 5000
- tapOn:
    id: project_editor_name_input
- inputText: "Latecomer"
- hideKeyboard
- tapOn:
    id: project_editor_save
- extendedWaitUntil:
    visible:
      id: project_card_latecomer
    timeout: 8000
# The tree shows it. The project's id was generated by the editor, so the row is
# addressed by the name the user reads.
- runFlow: ../../helpers/open-app-menu.yaml
- scrollUntilVisible:
    element:
      id: menu_projects_section
    direction: DOWN
    timeout: 8000
- assertVisible:
    text: "Latecomer"
