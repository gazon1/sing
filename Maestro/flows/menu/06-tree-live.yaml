# Device-only residue of the menu project-tree liveness flow.
#
# Behavior (project creation and rename reflected in the menu while the menu is
# open) is owned by
# desktopApp/src/jvmTest/.../feature/flows/menu/ProjectsMenuLiveScenarioTest.kt
# (MENU-03 desktop carrier).
#
# This flow keeps only the Android modal-sheet residue: a change made elsewhere
# closes the sheet, and reopening it must expose current project rows by their
# stable resource ids. No creation/rename behavior is asserted beyond the
# resource-id presence after reopen.
#
# The seeded ids address rows by stable ids rather than copy.
appId: com.singularity.todo
name: menu-tree-live
tags:
  - menu
  - scenario:MENU-03
---
- runFlow: ../../helpers/launch-clean.yaml
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "project=Roadmap&id=roadmap"
- runFlow: ../../helpers/open-app-menu.yaml
# The section is folded by default, so the projects are unfolded before they are used.
- runFlow: ../../helpers/expand-projects-section.yaml
- scrollUntilVisible:
    element:
      id: menu_project_node_roadmap
    direction: DOWN
    timeout: 8000
- assertVisible:
    id: menu_project_node_roadmap

# A project change made on another surface closes the Android modal sheet. The
# device residue is that reopening the sheet exposes the current tree by
# resource id.
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "project=Renamed&id=roadmap"
- runFlow: ../../helpers/open-app-menu.yaml
- runFlow: ../../helpers/expand-projects-section.yaml
- scrollUntilVisible:
    element:
      id: menu_project_node_roadmap
    direction: DOWN
    timeout: 8000
- assertVisible:
    id: menu_project_node_roadmap
