# Device-only residue of the menu project-tree liveness flow.
#
# This flow carries **no** `scenario:` tag, and deliberately so: the behaviour it
# exercises is not the scenario. The liveness claim (a project created or
# renamed elsewhere shows up in the menu) is owned by
# desktopApp/src/jvmTest/.../feature/flows/menu/ProjectsMenuLiveScenarioTest.kt
# (the MENU-03 carrier on the desktop tier).
#
# What is left here is the Android modal-sheet residue: a change made elsewhere
# closes the sheet, and reopening it must expose current project rows by their
# stable resource ids. No creation/rename behaviour is asserted beyond the
# resource-id presence after reopen, so the flow no longer claims MENU-03 --
# a tag it does not earn would print a covered cell the flow never verified.
# The android cell of MENU-03 is therefore an honest hole.
#
# The seeded ids address rows by stable ids rather than copy.
appId: com.singularity.todo
name: menu-tree-live
tags:
  - menu
---
- runFlow: ../../helpers/launch-clean.yaml
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "project=Roadmap&id=roadmap"
- runFlow: ../../helpers/open-app-menu.yaml
# The section is folded by default, so the projects are unfolded before they are used.
- runFlow: ../../helpers/expand-projects-section.yaml
- scrollUntilVisible:
    element:
      id: menu_project_node_roadmap
    direction: DOWN
    timeout: 8000
# The first seed is asserted on by the name it gave the project, and not by
# the row's id: the row is the same row the rename below rewrites, and an
# assertion on it stands for the write that was in effect when it ran — the
# first seed's, not the rename's.
- assertVisible:
    text: "Roadmap"

# A project change made on another surface closes the Android modal sheet. The
# device residue is that reopening the sheet exposes the current tree by
# resource id.
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "project=Renamed&id=roadmap"
- runFlow: ../../helpers/open-app-menu.yaml
- runFlow: ../../helpers/expand-projects-section.yaml
# The renamed project is waited for by the name the rename gave it. The row
# the rename rewrote was on screen before the seed ran, so a wait for the row
# returns at once and proves nothing about the write the flow asserts on; the
# new name is the only handle that tells this write from the earlier one.
- extendedWaitUntil:
    visible:
      text: "Renamed"
    timeout: 8000
- scrollUntilVisible:
    element:
      id: menu_project_node_roadmap
    direction: DOWN
    timeout: 8000
- assertVisible:
    id: menu_project_node_roadmap
