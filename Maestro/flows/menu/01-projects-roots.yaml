# The Android menu lists the root projects, and a nested project is reached
# through its parent's own screen.
#
# The menu is a sheet, and a sheet that drew the whole hierarchy would be a
# tree of hundreds of rows in the place the user opens to get somewhere else.
# So the sheet lists the root projects, and a child is behind its parent: the
# parent's screen says how many children it has, and that entry opens them
# (ADR `2026-11-12-android-menu-roots-only.md`).
#
# The seeds are given the ids the projects carry, so the rows are addressed by
# those ids rather than by the names the user reads — a name is copy, and an id
# is not. The child is seeded below the parent by the parent's id, because a
# deep link cannot know a generated id.
appId: com.singularity.todo
name: menu-projects-roots
tags:
  - menu
  - scenario:MENU-08
---
- runFlow: ../../helpers/launch-clean.yaml
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "project=Parent&id=parent"
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "project=Child&id=child&parent=parent"
- runFlow: ../../helpers/open-app-menu.yaml
# The section is folded by default, so the projects are unfolded before they are
# used.
- runFlow: ../../helpers/expand-projects-section.yaml
# The projects sit at the end of the menu, below the fold.
- scrollUntilVisible:
    element:
      id: menu_project_node_parent
    direction: DOWN
    timeout: 8000
- assertVisible:
    id: menu_project_node_parent
# The child is not in the menu: the list holds the roots, and the child is
# behind its parent.
#
# The sheet is scrolled to its end first. At the end of the sheet the last row
# is the last project of the list — in the menu that is the parent, and in the
# tree that would be the child, which the tree draws right below its parent.
# So the check is made where a tree would show the child, and it cannot pass
# by the child being under the fold.
- swipe:
    start: "50%, 80%"
    end: "50%, 20%"
    duration: 1000
- assertNotVisible:
    id: menu_project_node_child
# The root project is a way into the project: tapping it opens that project's
# own screen, which names it in the bar.
- tapOn:
    id: menu_project_node_parent
- extendedWaitUntil:
    visible:
      id: shell_bar_title
      text: "Parent"
    timeout: 8000
# The parent's screen says how many sub-projects it has, and that chip is the
# way into them.
- extendedWaitUntil:
    visible:
      id: project_detail_children_chip
    timeout: 8000
- tapOn:
    id: project_detail_children_chip
# The sheet holds the children, addressed by their own ids.
- extendedWaitUntil:
    visible:
      id: project_child_row_child
    timeout: 8000
- tapOn:
    id: project_child_row_child
# The child's own screen opens, and it says which project it is.
- extendedWaitUntil:
    visible:
      id: shell_bar_title
      text: "Child"
    timeout: 8000
# Back from the child lands on the parent: the way down into the hierarchy is
# also the way back out of it.
- tapOn:
    id: top_bar_back_button
- extendedWaitUntil:
    visible:
      id: shell_bar_title
      text: "Parent"
    timeout: 8000
# And back from the parent lands on the projects list, which is where the menu
# put the user.
- tapOn:
    id: top_bar_back_button
- extendedWaitUntil:
    visible:
      id: shell_bar_title
      text: "Projects"
    timeout: 8000
