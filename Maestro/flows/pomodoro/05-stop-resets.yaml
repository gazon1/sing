# Pomodoro: stop returns the timer to its initial paused state.
appId: com.singularity.todo
name: pomodoro-stop-resets
tags:
  - scenario:POMODORO-05
  - regression
  - pomodoro
---
- runFlow: ../../helpers/seed-task.yaml
- runFlow: ../../helpers/open-app-menu.yaml
# Pomodoro is an entry of the app menu, below the fold of the sheet: a row that is
# drawn but off-screen is not a row the user can reach.
- scrollUntilVisible:
    element:
      id: menu_pomodoro
    direction: DOWN
    timeout: 10000
- tapOn:
    id: menu_pomodoro
- extendedWaitUntil:
    visible:
      id: pomodoro_phase_label
    timeout: 8000
- tapOn:
    id: pomodoro_task_chip_buy_milk
- extendedWaitUntil:
    visible:
      id: pomodoro_focus_chip
    timeout: 8000
- tapOn:
    id: pomodoro_skip_button
- extendedWaitUntil:
    visible:
      id: pomodoro_phase_label
    timeout: 8000
# Stop drops the focus task and the phase, back to a fresh Work cycle.
- tapOn:
    id: pomodoro_stop_button
- extendedWaitUntil:
    visible:
      id: pomodoro_play_button
    timeout: 8000
- assertNotVisible:
    id: pomodoro_focus_chip
