# Pomodoro: pick a focus task by chip, which starts the timer.
#
# The chips only exist when the Pomodoro task provider yields tasks, so this
# flow seeds one first.
appId: com.singularity.todo
name: pomodoro-start-focus-task
tags:
  - scenario:POMODORO-02
  - regression
  - pomodoro
---
- runFlow: ../../helpers/seed-task.yaml
- tapOn:
    id: nav_tab_pomodoro
- extendedWaitUntil:
    visible:
      id: pomodoro_phase_label
    timeout: 8000
# Selecting a chip starts the timer on that task.
- tapOn:
    id: pomodoro_task_chip_buy_milk
- extendedWaitUntil:
    visible:
      id: pomodoro_focus_chip
    timeout: 8000
# Tapping the chip both selects and starts. The pause control only exists while
# the timer runs, so this is what proves the start — the phase label is visible
# either way.
- assertVisible:
    id: pomodoro_pause_button
- assertVisible:
    id: pomodoro_phase_label
