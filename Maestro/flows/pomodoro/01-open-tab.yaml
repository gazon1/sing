# Pomodoro: the screen renders its timer and controls.
#
# The timer is the only Pomodoro surface — there is no history or stats screen.
appId: com.singularity.todo
name: pomodoro-open-tab
tags:
  - smoke
  - pomodoro
---
- runFlow: ../../helpers/launch-clean.yaml
- runFlow:
    file: ../../helpers/open-menu-item.yaml
    env:
      ENTRY_ID: menu_pomodoro
      DEST_ID: pomodoro_phase_label
# A fresh timer sits at its full work duration, paused, on cycle 1.
- assertVisible:
    id: pomodoro_timer_label
- assertVisible:
    id: pomodoro_phase_label
- assertVisible:
    id: pomodoro_cycle_label
- assertVisible:
    id: pomodoro_stop_button
- assertVisible:
    id: pomodoro_play_button
- assertVisible:
    id: pomodoro_skip_button
