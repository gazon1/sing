# Pomodoro: pause and resume the running timer.
#
# Play/pause is one control whose icon depends on isRunning; the flow drives it
# twice and asserts the phase label survives both transitions.
appId: com.singularity.todo
name: pomodoro-pause-resume
tags:
  - scenario:POMODORO-03
  - regression
  - pomodoro
---
- runFlow: ../../helpers/seed-task.yaml
- runFlow:
    file: ../../helpers/open-menu-item.yaml
    env:
      ENTRY_ID: menu_pomodoro
      DEST_ID: pomodoro_phase_label
- tapOn:
    id: pomodoro_task_chip_buy_milk
- extendedWaitUntil:
    visible:
      id: pomodoro_focus_chip
    timeout: 8000
# Chip selection starts the timer (running) — use PAUSE_BUTTON.
- tapOn:
    id: pomodoro_pause_button
- assertVisible:
    id: pomodoro_timer_label
# Paused — use PLAY_BUTTON.
- tapOn:
    id: pomodoro_play_button
- assertVisible:
    id: pomodoro_timer_label
- assertVisible:
    id: pomodoro_phase_label
