# Profile: tasks are isolated per profile — data in one profile is invisible in another.
#
# Covers: create a second profile -> seed a task into it -> switch to default profile ->
# verify the seeded task is not visible -> switch back and verify it is.
#
# Profile isolation is the core data boundary; this is the regression guard for a bug where
# all profiles shared the same Room database namespace.
appId: com.singularity.todo
name: profile-isolation
tags:
  - profile
  - smoke
---
# 1. Ensure we are on the default profile with an empty inbox.
- runFlow: ../../helpers/launch-clean.yaml
- tapOn:
    id: nav_tab_inbox
- extendedWaitUntil:
    visible:
      id: nav_tab_inbox
    timeout: 10000

# 2. Open the Profiles screen and create a second profile.
- tapOn:
    id: nav_menu_button
- extendedWaitUntil:
    visible:
      id: menu_settings
    timeout: 5000
- scrollUntilVisible:
    element:
      id: menu_profiles
    direction: DOWN
    timeout: 5000
- tapOn:
    id: menu_profiles
- extendedWaitUntil:
    visible:
      id: profile_create_button
    timeout: 8000
- tapOn:
    id: profile_create_button
- extendedWaitUntil:
    visible:
      id: profile_create_name_input
    timeout: 5000
- inputText: "Work"
# The keyboard covers the dialog's buttons: the confirm button was not on the
# screen, so the tap could not reach it. The keyboard is dismissed first.
- hideKeyboard
- tapOn:
    id: dialog_confirm
- extendedWaitUntil:
    visible:
      id: profile_item_work
    timeout: 8000

# 3. Switch to the Work profile, then seed a task while it is active.
#
# Two separate links, deliberately. DebugSeedActivity dispatches on a `when`
# whose first matching key wins, so `?task=X&profile=Y` creates the task in the
# *current* profile and silently ignores `profile=Y` — the seed lands in
# Personal, and the assertion below then fails for a reason that has nothing to
# do with isolation.
- tapOn:
    id: nav_menu_button
- extendedWaitUntil:
    visible:
      id: menu_settings
    timeout: 5000
- scrollUntilVisible:
    element:
      id: menu_profiles
    direction: DOWN
    timeout: 5000
- tapOn:
    id: menu_profiles
- extendedWaitUntil:
    visible:
      id: profile_item_work
    timeout: 8000
- tapOn:
    id: profile_item_work
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000
- openLink: "todo-debug://seed?task=WorkTask"
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000
- tapOn:
    id: nav_tab_inbox
- extendedWaitUntil:
    visible:
      id: task_item_worktask
    timeout: 8000

# 4. Switch back to the Personal (default) profile.
- tapOn:
    id: nav_menu_button
- extendedWaitUntil:
    visible:
      id: menu_settings
    timeout: 5000
- scrollUntilVisible:
    element:
      id: menu_profiles
    direction: DOWN
    timeout: 5000
- tapOn:
    id: menu_profiles
- extendedWaitUntil:
    visible:
      id: profile_item_personal
    timeout: 8000
- tapOn:
    id: profile_item_personal
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000

# 5. Verify the Work task is NOT visible in Personal.
- tapOn:
    id: nav_tab_inbox
- assertNotVisible:
    id: task_item_worktask
