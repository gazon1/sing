# Lifecycle: rotating while the task editor is open keeps it usable.
appId: com.singularity.todo
name: lifecycle-rotate-in-editor
tags:
  - regression
  - lifecycle
---
- runFlow: ../../helpers/seed-task.yaml
- tapOn:
    id: task_item_buy_milk
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 8000
- setOrientation: LANDSCAPE_LEFT
# Use extendedWaitUntil to detect when the editor has re-rendered after rotation.
# extendedWaitUntil polls the accessibility tree rather than waiting for a global
# animation signal, so it correctly handles Compose re-composition after a
# configuration change.
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 15000
# Still the editor, and the title survived the configuration change.
# NOTE: asserted as text because the editor is still open across the rotation
# and no task row is mounted; `task_item_buy_milk` only applies once it closes.
- assertVisible: "Buy milk"
- setOrientation: PORTRAIT
# Same: poll the tree until the editor re-appears after the configuration change.
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 15000
