# Lifecycle: rotating while the task editor is open keeps it usable.
appId: com.singularity.todo
name: lifecycle-rotate-in-editor
tags:
  - regression
  - lifecycle
---
- runFlow: ../../helpers/seed-task.yaml
- tapOn:
    id: task_item_buy_milk
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 8000
- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd:
    timeout: 2000
# Still the editor, and the title survived the configuration change.
- assertVisible:
    id: task_editor_title_input
# NOTE: asserted as text because the editor is still open across the rotation
# and no task row is mounted; `task_item_buy_milk` only applies once it closes.
- assertVisible: "Buy milk"
- setOrientation: PORTRAIT
- waitForAnimationToEnd:
    # 2000 ms is enough for LANDSCAPE on the CI emulator, but PORTRAIT is
    # measurably slower — the full settle takes up to 4 s. 5000 ms gives
    # the editor ViewModel time to restore its state from the saved state handle
    # before we assert on task_editor_title_input.
    timeout: 5000
- assertVisible:
    id: task_editor_title_input
