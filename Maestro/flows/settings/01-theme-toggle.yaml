# Settings > Interface: toggling the theme mode does not break the screen.
#
# After #210 the theme selector is a three-way segmented button (System / Light / Dark).
# The theme is visual, and neither the a11y tree nor Maestro exposes the selected segment
# state, so the assertion is that the screen survives the toggle and stays navigable —
# which is what would catch a crash on theme change.
appId: com.singularity.todo
name: settings-theme-toggle
tags:
  - regression
  - settings
---
- runFlow: ../../helpers/launch-clean.yaml
- tapOn:
    id: nav_menu_button
- extendedWaitUntil:
    visible:
      id: menu_settings
    timeout: 5000
- tapOn:
    id: menu_settings
- extendedWaitUntil:
    visible:
      id: settings_tab_interface
    timeout: 8000
- assertVisible:
    id: settings_theme_mode_System
- assertVisible:
    id: settings_theme_mode_Light
- assertVisible:
    id: settings_theme_mode_Dark
- assertVisible:
    id: settings_accent_swatch_blue
# Select Dark mode; screen must stay navigable.
- tapOn:
    id: settings_theme_mode_Dark
# Still interactive, and the rest of the tab is intact.
- assertVisible:
    id: settings_font_size_slider
- tapOn:
    id: settings_tab_agenda
- extendedWaitUntil:
    visible:
      id: settings_tab_interface
    timeout: 5000
