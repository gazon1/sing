# Settings > Interface: toggling the theme mode does not break the screen.
#
# After #210 the theme selector is a three-way segmented button (System / Light / Dark).
# The theme is visual, and neither the a11y tree nor Maestro exposes the selected segment
# state, so the assertion is that the screen survives the toggle and stays navigable —
# which is what would catch a crash on theme change.
appId: com.singularity.todo
name: settings-theme-toggle
tags:
  - regression
  - settings
---
- runFlow: ../../helpers/launch-clean.yaml
- tapOn:
    id: nav_menu_button
- extendedWaitUntil:
    visible:
      id: menu_profile_sync
    timeout: 5000
- tapOn:
    id: menu_profile_sync
- extendedWaitUntil:
    visible:
      id: settings_tab_interface
    timeout: 8000
# The theme section header and accent color section should both be present.
- assertVisible: "Theme"
- assertVisible: "Accent Color"
# Tap the Dark segment of the theme-mode segmented button.
- tapOn:
    text: "Dark"
# Still interactive, and the rest of the tab is intact.
- assertVisible: "Font Size"
# Switch to Light to verify the toggle works both directions.
- tapOn:
    text: "Light"
- assertVisible: "Font Size"
# Switch to System as the final state.
- tapOn:
    text: "System"
- assertVisible: "Font Size"
- tapOn:
    id: settings_tab_agenda
- extendedWaitUntil:
    visible:
      id: settings_tab_interface
    timeout: 5000
