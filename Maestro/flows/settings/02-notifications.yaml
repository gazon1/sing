# Settings > Notifications: the notification surface renders its controls.
appId: com.singularity.todo
name: settings-notifications
tags:
  - regression
  - settings
---
- runFlow: ../../helpers/launch-clean.yaml
- runFlow: ../../helpers/open-settings.yaml
- tapOn:
    id: settings_tab_dropdown
- extendedWaitUntil:
    visible:
      id: settings_tab_notifications
    timeout: 10000
- tapOn:
    id: settings_tab_notifications
- extendedWaitUntil:
    visible:
      id: settings_notifications_enabled_switch
    timeout: 8000
- assertVisible:
    id: settings_notifications_sound_switch
