# Settings > Notifications: the notification surface renders its controls.
appId: com.singularity.todo
name: settings-notifications
tags:
  - regression
  - settings
---
- runFlow: ../../helpers/launch-clean.yaml
- tapOn:
    id: nav_menu_button
- extendedWaitUntil:
    visible:
      id: menu_settings
    timeout: 5000
- tapOn:
    id: menu_settings
- extendedWaitUntil:
    visible:
      id: settings_tab_notifications
    timeout: 8000
- tapOn:
    id: settings_tab_notifications
- extendedWaitUntil:
    visible:
      id: settings_notifications_enabled_switch
    timeout: 8000
- assertVisible:
    id: reminder_defaults_section
- assertVisible:
    id: settings_notifications_sound_switch
- assertVisible:
    id: reminder_offset_radio_at_due_time
