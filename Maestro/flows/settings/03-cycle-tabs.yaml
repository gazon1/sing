# Smoke: open Settings from the menu and cycle through all 11 tabs without crash.
#
# Covers: menu sheet -> Settings entry -> SettingsNavRail (12 tabs).
#
# This flow is the regression guard for a crash that shipped: the screen used to
# die with `subclassesOfSealed only supports automatic adding of subclasses of
# sealed types`, because `Settings` was a lone `data object` outside the app's
# sealed NavKey root. Opening Settings at all was a crash. See
# docs/decisions/2026-09-29-single-sealed-navkey-root.md.
#
# Tag ids are lower-case: TestTags.settingsTab() routes through slug(), which
# lowercases the enum name. `SettingsTab.AIProvider` -> `settings_tab_aiprovider`.
appId: com.singularity.todo
name: smoke-settings-cycle-tabs
tags:
  - smoke
  - settings
---
- runFlow: ../../helpers/launch-clean.yaml
- tapOn:
    id: nav_menu_button
- extendedWaitUntil:
    visible:
      id: menu_settings
    timeout: 5000
# Settings sits below the fold on a phone screen — scroll to it before tapping.
- scrollUntilVisible:
    element:
      id: menu_settings
    direction: DOWN
    timeout: 5000
- tapOn:
    id: menu_settings
- extendedWaitUntil:
    visible:
      id: settings_tab_interface
    timeout: 10000

# Cycle all 12 tabs. A crash or hang on any tab fails the flow.
# The NavRail is a fixed 80dp column with a private ScrollView — scroll each
# tab into view before tapping so it is guaranteed to be in the viewport.
- tapOn:
    id: settings_tab_interface
- tapOn:
    id: settings_tab_agenda
- tapOn:
    id: settings_tab_notifications
- tapOn:
    id: settings_tab_aiprovider
- tapOn:
    id: settings_tab_workschedule
- tapOn:
    id: settings_tab_calendar
- tapOn:
    id: settings_tab_sync
- tapOn:
    id: settings_tab_tags
- tapOn:
    id: settings_tab_taggroups
# Files, Backup, Account are below the fold on a phone viewport.
# Files sits at y≈2239 — 175dp beyond the NavRail visible bottom (≈y=2064).
# Swipe UP from the bottom of the NavRail (point [105, 2000]) — this pulls
# the content below upward, which scrolls the NavRail ScrollView DOWN to bring
# Files into the visible area. Maestro's scrollUntilVisible uses swipeFromCenter
# which scrolls the WRONG scrollable (full-screen), so we use explicit swipes.
- swipe:
    start: 105, 2000
    end: 105, 1600
    duration: 1000
- swipe:
    start: 105, 2000
    end: 105, 1600
    duration: 1000
- swipe:
    start: 105, 2000
    end: 105, 1600
    duration: 1000
- waitForAnimationToEnd
- tapOn:
    id: settings_tab_files
- swipe:
    start: 105, 2000
    end: 105, 1600
    duration: 1000
- waitForAnimationToEnd
- tapOn:
    id: settings_tab_backup
- swipe:
    start: 105, 2000
    end: 105, 1600
    duration: 1000
- waitForAnimationToEnd
- tapOn:
    id: settings_tab_account
