# Smoke: open Settings from the menu and cycle through all 13 tabs without crash.
#
# Covers: menu sheet -> Settings entry -> the narrow settings sheet (13 tabs).
#
# This flow is the regression guard for a crash that shipped: the screen used to
# die with `subclassesOfSealed only supports automatic adding of subclasses of
# sealed types`, because `Settings` was a lone `data object` outside the app's
# sealed NavKey root. Opening Settings at all was a crash. See
# docs/decisions/2026-09-29-single-sealed-navkey-root.md.
#
# Tag ids are lower-case: TestTags.settingsTab() routes through slug(), which
# lowercases the enum name. `SettingsTab.AIProvider` -> `settings_tab_aiprovider`.
appId: com.singularity.todo
name: smoke-settings-cycle-tabs
tags:
  - smoke
  - settings
---
- runFlow: ../../helpers/launch-clean.yaml
- runFlow: ../../helpers/open-app-menu.yaml
- extendedWaitUntil:
    visible:
      id: menu_settings
    timeout: 5000
# Settings sits below the fold on a phone screen — scroll to it before tapping.
- scrollUntilVisible:
    element:
      id: menu_settings
    direction: DOWN
    timeout: 5000
- tapOn:
    id: menu_settings
- extendedWaitUntil:
    visible:
      id: settings_tab_dropdown
    timeout: 10000

# Cycle all 13 tabs through the narrow settings sheet. The helper opens the
# sheet, scrolls the row into view and taps it; a crash or hang on any tab
# fails the flow.
- runFlow:
    file: ../../helpers/settings-tab.yaml
    env:
      SETTINGS_TAB: settings_tab_interface
- runFlow:
    file: ../../helpers/settings-tab.yaml
    env:
      SETTINGS_TAB: settings_tab_agenda
- runFlow:
    file: ../../helpers/settings-tab.yaml
    env:
      SETTINGS_TAB: settings_tab_notifications
- runFlow:
    file: ../../helpers/settings-tab.yaml
    env:
      SETTINGS_TAB: settings_tab_aiprovider
- runFlow:
    file: ../../helpers/settings-tab.yaml
    env:
      SETTINGS_TAB: settings_tab_workschedule
- runFlow:
    file: ../../helpers/settings-tab.yaml
    env:
      SETTINGS_TAB: settings_tab_calendar
- runFlow:
    file: ../../helpers/settings-tab.yaml
    env:
      SETTINGS_TAB: settings_tab_sync
- runFlow:
    file: ../../helpers/settings-tab.yaml
    env:
      SETTINGS_TAB: settings_tab_tags
- runFlow:
    file: ../../helpers/settings-tab.yaml
    env:
      SETTINGS_TAB: settings_tab_taggroups
- runFlow:
    file: ../../helpers/settings-tab.yaml
    env:
      SETTINGS_TAB: settings_tab_tasks
- runFlow:
    file: ../../helpers/settings-tab.yaml
    env:
      SETTINGS_TAB: settings_tab_files
- runFlow:
    file: ../../helpers/settings-tab.yaml
    env:
      SETTINGS_TAB: settings_tab_backup
- runFlow:
    file: ../../helpers/settings-tab.yaml
    env:
      SETTINGS_TAB: settings_tab_account
