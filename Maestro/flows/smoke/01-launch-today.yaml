# Smoke: the app cold-starts into the shell and the primary affordances render.
#
# Covers the whole boot chain in one assertion set: AppVersionGate ->
# AuthGuard (anonymous session) -> Nav3 startRoute (AgendaGraph/Today) ->
# androidShellNav3Root (bottom bar + FAB).
#
# The bar holds the four destinations of `DestinationKind.tabs` — Inbox, Today,
# Upcoming, Calendar — and the "Menu" button for the ones that are not tabs.
appId: com.singularity.todo
name: smoke-launch-today
tags:
  - smoke
---
- runFlow: ../../helpers/launch-clean.yaml
- assertVisible:
    id: tasks_fab
- assertVisible:
    id: nav_tab_inbox
- assertVisible:
    id: nav_tab_today
- assertVisible:
    id: nav_tab_upcoming
- assertVisible:
    id: nav_tab_calendar
- assertVisible:
    id: nav_menu_button
- takeScreenshot: smoke/01-launch-today
