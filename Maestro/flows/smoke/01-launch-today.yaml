# Smoke: the app cold-starts into the shell and the primary affordances render.
#
# Covers the whole boot chain in one assertion set: AppVersionGate ->
# AuthGuard (anonymous session) -> Nav3 startRoute (AgendaGraph/Today) ->
# androidShellNav3Root (bottom bar + FAB).
#
# This flow asserts the boot chain, not the tab set. It used to enumerate the
# whole bar — the same five `assertVisible` and two `assertNotVisible` that
# Maestro/flows/nav/01-tab-set.yaml carries — and since both files are
# `smoke`-tagged, the pull-request tier paid for the same seven assertions on
# every push and the two copies were free to drift apart. The set has one owner
# now (`DestinationKind.tabs`: Inbox, Today, Upcoming, Calendar, plus the Menu
# button); this flow asserts only that the chain landed on an agenda tab with
# the shell's FAB, which is what "the app came up" means.
appId: com.singularity.todo
name: smoke-launch-today
tags:
  - smoke
---
- runFlow: ../../helpers/launch-clean.yaml
- assertVisible:
    id: tasks_fab
# The start route and the shell's FAB: the chain reached the agenda shell.
- assertVisible:
    id: nav_tab_today
# The Menu button is part of "the app came up" too, because it is the only route
# to Plans, Pomodoro, the projects and Settings: a boot that came up without it
# looks perfect on the agenda tab and strands every one of those destinations.
# The tab *set* is not asserted here — Maestro/flows/nav/01-tab-set.yaml owns
# that contract and carries the `smoke` tag, so it is in the same pull-request
# run (the runner selects smoke flows by parsing each flow's `tags:` header) —
# but the Menu entry is asserted here, on the boot chain this flow is about.
- assertVisible:
    id: nav_menu_button
- takeScreenshot: smoke/01-launch-today
