# Smoke: the app cold-starts into the shell and the primary affordances render.
#
# Covers the whole boot chain in one assertion set: AppVersionGate ->
# AuthGuard (anonymous session) -> Nav3 startRoute (AgendaGraph/Today) ->
# androidShellNav3Root (bottom bar + FAB).
#
# The bar's set is `DestinationKind.tabs` — Inbox, Today, Upcoming, Calendar,
# plus the Menu button. Plans and Pomodoro are menu destinations and are not
# tabs, so asserting them here would assert a bar the app does not draw.
appId: com.singularity.todo
name: smoke-launch-today
tags:
  - smoke
---
- runFlow: ../../helpers/launch-clean.yaml
- assertVisible:
    id: tasks_fab
- assertVisible:
    id: nav_tab_inbox
- assertVisible:
    id: nav_tab_today
- assertVisible:
    id: nav_tab_upcoming
- assertVisible:
    id: nav_tab_calendar
- assertVisible:
    id: nav_menu_button
- assertNotVisible:
    id: nav_tab_plans
- assertNotVisible:
    id: nav_tab_pomodoro
- takeScreenshot: smoke/01-launch-today
