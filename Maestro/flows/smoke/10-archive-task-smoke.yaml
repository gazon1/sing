# Smoke: complete a task, then archive it from the long-press context menu.
#
# Covers: completion checkbox -> long-press row -> context-menu sheet ->
# Archive -> row gone.
appId: com.singularity.todo
name: smoke-archive-task
tags:
  - smoke
  - tasks
---
- runFlow: ../../helpers/seed-task.yaml
# Complete it first: archiving is a lifecycle action on done work.
- tapOn:
    id: task_checkbox_buy_milk
- extendedWaitUntil:
    visible:
      id: task_checkbox_buy_milk
      checked: true
    timeout: 5000
- longPressOn:
    id: task_item_buy_milk
- extendedWaitUntil:
    visible:
      id: task_context_menu_sheet
    timeout: 8000
- tapOn:
    id: sheet_item_Archive
- extendedWaitUntil:
    notVisible:
      id: task_item_buy_milk
    timeout: 8000
