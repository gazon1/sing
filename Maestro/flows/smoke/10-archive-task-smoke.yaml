# Smoke: complete a task, then archive it.
#
# Covers: completion checkbox -> task detail -> overflow menu -> Архивировать
# -> back to the list -> row gone.
#
# Archive is reached through the detail overflow menu, the same place as delete.
# Long-pressing the agenda row was tried first and does NOT open a context menu
# there — it navigates into the editor — so it is not a usable handle.
appId: com.singularity.todo
name: smoke-archive-task
tags:
  - smoke
  - tasks
---
- runFlow: ../../helpers/seed-task.yaml
# Complete it first: archiving is a lifecycle action on done work.
- tapOn:
    id: task_checkbox_buy_milk
- extendedWaitUntil:
    visible:
      id: task_checkbox_buy_milk
      checked: true
    timeout: 5000
- tapOn:
    id: task_item_buy_milk
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 5000
- assertVisible: "Buy milk"
- tapOn:
    id: task_editor_more_menu
- extendedWaitUntil:
    visible:
      text: "Архивировать"
    timeout: 5000
- tapOn:
    text: "Архивировать"
- back
- extendedWaitUntil:
    visible:
      id: nav_tab_inbox
    timeout: 5000
- extendedWaitUntil:
    notVisible:
      id: task_item_buy_milk
    timeout: 8000
