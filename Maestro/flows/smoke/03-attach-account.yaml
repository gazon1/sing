# Smoke: attach an email/password account to the anonymous session.
#
# Covers: anonymous session -> Settings -> Account tab -> Attach Account ->
# attach form -> agenda home.
#
# AUTH-ATTACH-01 smoke path.
appId: com.singularity.todo
name: smoke-attach-account
tags:
  - smoke
  - auth
  - AUTH-ATTACH-01
---
- runFlow: ../../helpers/launch-clean.yaml

# Verify anonymous session lands on agenda (no auth screen shown with StubAuthRepository).
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 15000

# Open menu -> Settings.
- tapOn:
    id: nav_menu_button
- extendedWaitUntil:
    visible:
      id: menu_settings
    timeout: 5000
- tapOn:
    id: menu_settings

# Switch to Account tab.
# The settings nav rail is a scrollable column of twelve ~76dp rows, so the
# trailing tabs (Backup, Account) are below the fold on a phone viewport —
# the screen looks complete, but the tab is not on it. Swipe the rail first,
# the way Maestro/flows/settings/03-cycle-tabs.yaml does.
- swipe:
    start: 105, 2000
    end: 105, 1600
    duration: 1000
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: settings_tab_account
    timeout: 10000
- tapOn:
    id: settings_tab_account

# Attach account button visible only for anonymous sessions.
- extendedWaitUntil:
    visible:
      id: auth_attach_account_button
    timeout: 10000
- tapOn:
    id: auth_attach_account_button

# Fill and submit the attach form.
- extendedWaitUntil:
    visible:
      id: auth_attach_email_input
    timeout: 10000
- inputText:
    id: auth_attach_email_input
    text: "alice@example.com"
- inputText:
    id: auth_attach_password_input
    text: "ValidPassword123!"
- tapOn:
    id: auth_attach_submit_button

# Verify navigation to agenda.
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 15000
- assertVisible:
    id: nav_tab_inbox
- takeScreenshot: smoke/03-attach-account
