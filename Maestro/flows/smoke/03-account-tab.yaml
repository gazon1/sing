# Smoke: the Account tab opens from the settings nav rail.
#
# The rail is a scrollable column of twelve ~76dp rows, so the trailing tabs
# (Files, Backup, Account) are below the fold on a phone viewport — the screen
# looks complete, but the tab is not on it. This flow walks the rail the way a
# user does and lands on Account.
#
# What is asserted is what the E2E build can actually show. The "Attach
# account" button is rendered only for `Session.Anonymous`, and the E2E build
# replaces the auth repository with `StubAuthRepository`, whose session is
# `Session.SignedIn` from the first frame ("the session is immediately
# `Session.SignedIn` and the auth screen never appears"). The attach affordance
# is therefore unreachable in this environment, and a flow that waits for it
# waits forever for an element that cannot be on the screen. The signed-in
# account section is the thing this tab really shows, so that is what is
# asserted.
#
# The attach path itself is covered by Maestro/flows/auth/07-account-attach.yaml
# (scenario AUTH-ATTACH-01), which needs an anonymous session to exist at all.
appId: com.singularity.todo
name: smoke-account-tab
tags:
  - smoke
  - settings
---
- runFlow: ../../helpers/launch-clean.yaml

# The agenda is up (the stub session never shows the auth screen).
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000

# Open menu -> Settings.
- tapOn:
    id: nav_menu_button
- extendedWaitUntil:
    visible:
      id: menu_settings
    timeout: 5000
- tapOn:
    id: menu_settings

# Switch to Account tab.
# The settings nav rail is a scrollable column of thirteen rows, so the
# trailing tabs (Files, Backup, Account) are below the fold on a phone viewport
# — the screen looks complete, but the tab is not on it.
#
# The scroll lives in a helper: the gesture that moves the rail is not the
# obvious one, and two recipes that looked right turned out to do nothing on a
# device. See Maestro/helpers/settings-rail-scroll.yaml.
- runFlow: ../../helpers/settings-rail-scroll.yaml
- extendedWaitUntil:
    visible:
      id: settings_tab_account
    timeout: 10000
- tapOn:
    id: settings_tab_account

# The Account tab is open: its account section is on the screen.
- extendedWaitUntil:
    visible:
      id: auth_sign_out_button
    timeout: 8000
- assertVisible:
    id: auth_sign_out_button
- takeScreenshot: smoke/03-account-tab
