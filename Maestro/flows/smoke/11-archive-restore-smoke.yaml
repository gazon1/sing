# Smoke: archive a task, then restore it from the Archive screen.
#
# Prerequisites: an archived task exists (created by archive-task-smoke).
# This flow assumes the same session: run archive-task-smoke first,
# then this flow without clearing state.
appId: com.singularity.todo
name: smoke-archive-restore
tags:
  - smoke
  - archive
---
# Navigate to Archive via the menu sheet.
- tapOn:
    id: nav_menu_button
- extendedWaitUntil:
    visible:
      id: menu_archive
    timeout: 5000
- tapOn:
    id: menu_archive
- extendedWaitUntil:
    visible:
      id: task_item_buy_milk
    timeout: 5000
# The task is visible in the archive list.
- assertVisible: "Buy milk"
# Restore: swipe right (startToEnd) to reveal the restore action.
- swipe:
    startX: 50
    startY: 200
    endX: 800
    endY: 200
- extendedWaitUntil:
    gone:
      id: task_item_buy_milk
    timeout: 5000
# After restore the task should reappear in Inbox.
- tapOn:
    id: nav_tab_inbox
- extendedWaitUntil:
    visible:
      id: task_item_buy_milk
    timeout: 5000
