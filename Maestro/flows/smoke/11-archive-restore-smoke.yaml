# Smoke: an archived task is listed in the Archive screen.
#
# Covers: archive a task -> Menu -> Archive -> the row is there.
#
# Note: there is deliberately no restore assertion. The app has no restore UI —
# `TaskDetailIntent.Domain.Restore` exists in the model but is not wired to any
# screen, and the Archive screen offers only "archive all completed". Archiving is
# currently a one-way door. Tracked in
# docs/decisions/2026-09-29-archive-has-no-restore-ui.md. This flow will need a
# restore step once that gap is closed.
appId: com.singularity.todo
name: smoke-archive-restore
tags:
  - smoke
  - archive
---
- runFlow: ../../helpers/seed-task.yaml
# Archive it through the detail overflow menu.
- tapOn:
    id: task_item_buy_milk
- extendedWaitUntil:
    visible:
      id: task_editor_title_input
    timeout: 5000
- tapOn:
    id: task_editor_more_menu
- extendedWaitUntil:
    visible:
      text: "Архивировать"
    timeout: 5000
- tapOn:
    text: "Архивировать"
- back
- extendedWaitUntil:
    notVisible:
      id: task_item_buy_milk
    timeout: 8000
# Open the Archive screen from the menu sheet.
- tapOn:
    id: nav_menu_button
- extendedWaitUntil:
    visible:
      id: menu_profile_sync
    timeout: 5000
- scrollUntilVisible:
    element:
      id: menu_archive
    direction: DOWN
    timeout: 8000
- tapOn:
    id: menu_archive
- extendedWaitUntil:
    visible:
      id: task_item_buy_milk
    timeout: 8000
- assertVisible: "Buy milk"
