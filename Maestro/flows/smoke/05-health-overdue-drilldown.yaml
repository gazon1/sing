# Smoke: OVERDUE health bucket in Statistics navigates to the Inbox agenda with
# overdue items — regression for the pre-MR2 state where only OVERDUE was
# actionable and BLOCKED/STAGNANT were no-ops.
#
# Fixture: one overdue task (seeded via `due=-1d`).
appId: com.singularity.todo
name: smoke-health-overdue-drilldown
tags:
  - smoke
  - statistics
---
- runFlow: ../../helpers/launch-clean.yaml

# Seed an overdue task so the Overdue section is non-empty.
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=${RUN_ID}%20Overdue%20Task&due=-1d"

# Wait for the task to appear on Today (Inbox) before opening Statistics.
- scrollUntilVisible:
    element:
      id: "task_item_${RUN_ID}_overdue_task"
    direction: DOWN
    timeout: 8000

# Open the hamburger menu.
- tapOn:
    id: nav_menu_button
# The menu sheet opens with Statistics already on screen. Scrolling it with
# scrollUntilVisible pushed the entry down into the system navigation bar,
# where the tap landed on the system HOME button and left the app — which is
# why the tab was never on screen to be found.
- extendedWaitUntil:
    visible:
      id: menu_statistics
    timeout: 5000
- tapOn:
    id: menu_statistics

# Statistics opens on the Tasks tab; the bucket cards live on the Health tab.
# Waiting for a bucket without selecting the tab waits for something that is
# on the next tab — which is what the flow did, and it failed for 15 s.
# The first tab is the proof that the statistics screen is up: tapping the
# Health tab before the screen arrives taps nothing.
- extendedWaitUntil:
    visible:
      id: statistics_tab_tasks
    timeout: 10000
- tapOn:
    id: statistics_tab_health
- extendedWaitUntil:
    visible:
      id: health_bucket_overdue
    timeout: 8000

# Drill down into OVERDUE — should navigate to the Inbox agenda showing overdue tasks.
- tapOn:
    id: health_bucket_overdue

# The Inbox agenda shows an "Overdue" section header when overdue tasks exist.
- extendedWaitUntil:
    visible:
      id: agenda_section_overdue
    timeout: 8000
- assertVisible:
    id: agenda_section_overdue
