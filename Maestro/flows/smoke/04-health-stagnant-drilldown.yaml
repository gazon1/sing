# Smoke: STAGNANT health bucket in Statistics navigates to the Stagnant agenda.
#
# Fixture: one undated task whose updatedAt is at least 21 days in the past.
# A task stamped "now" is never stagnant — the health window is 21 days without
# movement — so the fixture is seeded with `updatedAt=-22d`, which puts both
# timestamps in the past. That is what the stagnation bucket is defined by.
#
# Navigation tested regardless of fixture:
#   Statistics → tap health_bucket_stagnant → AgendaGraph(Stagnant) → "Not touched in a while" section
appId: com.singularity.todo
name: smoke-health-stagnant-drilldown
tags:
  - smoke
  - statistics
---
- runFlow: ../../helpers/launch-clean.yaml

# Seed an undated task that has not moved for 22 days.
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=${RUN_ID}%20Stagnant%20Task&updatedAt=-22d"

# Open the hamburger menu.
- tapOn:
    id: nav_menu_button
# The menu sheet opens with Statistics already on screen. Scrolling it with
# scrollUntilVisible pushed the entry down into the system navigation bar,
# where the tap landed on the system HOME button and left the app — which is
# why the tab was never on screen to be found.
- extendedWaitUntil:
    visible:
      id: menu_statistics
    timeout: 5000
- tapOn:
    id: menu_statistics

# Statistics opens on the Tasks tab; the bucket cards live on the Health tab.
# Waiting for a bucket without selecting the tab waits for something that is
# on the next tab — which is what the flow did, and it failed for 15 s.
# The first tab is the proof that the statistics screen is up: tapping the
# Health tab before the screen arrives taps nothing.
- extendedWaitUntil:
    visible:
      id: statistics_tab_tasks
    timeout: 10000
- tapOn:
    id: statistics_tab_health
- extendedWaitUntil:
    visible:
      id: health_bucket_stagnant
    timeout: 8000

# Drill down into STAGNANT.
- tapOn:
    id: health_bucket_stagnant

# The Stagnant agenda should show with a "Not touched in a while" section header
# (section name from AgendaPresets.byStagnant().sections.first().name).
- extendedWaitUntil:
    visible:
      id: agenda_section_not_touched_in_a_while
    timeout: 8000
- assertVisible:
    id: agenda_section_not_touched_in_a_while
