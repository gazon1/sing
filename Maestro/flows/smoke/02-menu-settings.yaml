# Smoke: open Settings from the menu sheet and return.
#
# Covers: menu sheet -> Settings entry -> settings_tab_interface visible -> back.
# This is the smoke subset's settings coverage — full tab cycling is in
# settings/03-cycle-tabs.yaml.
appId: com.singularity.todo
name: smoke-settings-open
tags:
  - smoke
  - settings
---
- runFlow: ../../helpers/launch-clean.yaml
- tapOn:
    id: nav_menu_button
- extendedWaitUntil:
    visible:
      id: menu_settings
    timeout: 5000
- scrollUntilVisible:
    element:
      id: menu_settings
    direction: DOWN
    timeout: 5000
- tapOn:
    id: menu_settings
- extendedWaitUntil:
    visible:
      id: settings_tab_dropdown
    timeout: 10000
- back
- extendedWaitUntil:
    visible:
      id: nav_tab_today
    timeout: 30000
