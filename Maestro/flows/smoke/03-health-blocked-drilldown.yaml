# Smoke: BLOCKED health bucket in Statistics navigates to the Blocked agenda.
#
# Fixture: one task with an unmet dependency (blocked by another incomplete task).
# A dependency is what makes a task blocked, and a fresh task can never be one,
# so the flow seeds two tasks: the blocker first, then the blocked task with
# `dependsOn` naming the blocker by title (a deep link cannot know an id it has
# not created itself).
#
# Navigation tested regardless of fixture:
#   Statistics → tap health_bucket_blocked → AgendaGraph(Blocked) → "Blocked" section
appId: com.singularity.todo
name: smoke-health-blocked-drilldown
tags:
  - smoke
  - statistics
---
- runFlow: ../../helpers/launch-clean.yaml

# The blocker: an incomplete task that nothing depends on yet.
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=${RUN_ID}%20Blocker"

# The blocked task: depends on the blocker, which is not completed.
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "task=${RUN_ID}%20Blocked%20Task&dependsOn=${RUN_ID}%20Blocker"

# Open the hamburger menu.
- tapOn:
    id: nav_menu_button
# The menu sheet is taller than a phone viewport, and its trailing items sit
# under the system navigation bar: a tap there lands on the system HOME
# button and leaves the app, which is why the tab was never on screen to be
# found. Scrolling it with scrollUntilVisible pushed the entry *down* into the
# same bar, so the sheet is scrolled by hand instead — and the swipe is
# a share of the screen, so it means the same thing on a 1080×2400 emulator
# and a 720×1600 phone.
- extendedWaitUntil:
    visible:
      id: menu_sheet
    timeout: 5000
- swipe:
    start: "50%, 80%"
    end: "50%, 30%"
    duration: 1000
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: menu_statistics
    timeout: 5000
- tapOn:
    id: menu_statistics

# Statistics opens on the Tasks tab; the bucket cards live on the Health tab.
# Waiting for a bucket without selecting the tab waits for something that is
# on the next tab — which is what the flow did, and it failed for 15 s.
# The first tab is the proof that the statistics screen is up: tapping the
# Health tab before the screen arrives taps nothing.
- extendedWaitUntil:
    visible:
      id: statistics_tab_tasks
    timeout: 10000
- tapOn:
    id: statistics_tab_health
- extendedWaitUntil:
    visible:
      id: health_bucket_blocked
    timeout: 8000

# Drill down into BLOCKED.
- tapOn:
    id: health_bucket_blocked

# The Blocked agenda should show with a "Blocked" section header.
- extendedWaitUntil:
    visible:
      id: agenda_section_blocked
    timeout: 8000
- assertVisible:
    id: agenda_section_blocked

# The section header confirms the correct agenda definition is loaded.
- assertVisible:
    id: agenda_section_blocked
