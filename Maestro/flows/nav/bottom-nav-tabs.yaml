# Smoke: every bottom-bar tab is reachable, and each routes the FAB correctly.
#
# The FAB expectations encode the real contract from `FabActionResolver`:
# Inbox/Today/Upcoming are `AgendaGraph` routes, and all three get "Add task".
# Plans is a menu destination, and it still gets "Add task" — the timeline
# creates the work that is due, not a project. Pomodoro is a non-agenda
# destination and gets nothing. The Calendar is a tab.
# Getting this wrong made this flow fail on Upcoming, so the assertions are
# written to match the resolver rather than to match a guess.
#
# `selected: true` is not usable here: the accessibility layer does not expose
# the selection state on the same node that carries the test tag.
appId: com.singularity.todo
name: nav-bottom-nav-tabs
tags:
  - smoke
  - nav
---
- runFlow: ../../helpers/launch-clean.yaml

# Inbox — FAB reads "Add task".
- tapOn:
    id: nav_tab_inbox
- assertVisible:
    id: tasks_fab
- assertVisible:
    id: nav_tab_inbox

# Today — the start destination, also "Add task".
- tapOn:
    id: nav_tab_today
- assertVisible:
    id: tasks_fab
- assertVisible:
    id: nav_tab_today

# Upcoming — the FAB reads "Add task" as on Inbox and Today.
- tapOn:
    id: nav_tab_upcoming
- assertVisible:
    id: tasks_fab
- assertVisible:
    id: nav_tab_upcoming

# Calendar — the fourth tab. It has no shell FAB, and that is read off
# `fabActionForNav3` rather than guessed: its `when` has branches for
# AgendaGraph (Add task), ProjectsGraph (Add project) and Plans (Add task) and
# nothing else, so `AppDestination.Calendar` falls into `else -> null`. If the
# Calendar ever earns a FAB, the resolver grows a branch and this assertion is
# the one that has to change.
#
# The post-tap assertion is the month title, not `nav_tab_calendar`: the tab is
# in the bar whether or not the tap did anything, so asserting it here would
# pass on a tap that went nowhere.
#
# The month title is waited for BEFORE the FAB is read. `assertNotVisible` has a
# short implicit wait, so asking it straight after the tap asks the question
# while the agenda screen may still own the shell — a race that passes on a warm
# device and flakes on CI. The wait makes "the Calendar screen is up" true
# first; only then is "and its shell has no FAB" a statement about the Calendar
# rather than about a transition nobody waited for.
- tapOn:
    id: nav_tab_calendar
- extendedWaitUntil:
    visible:
      id: calendar_month_title
    timeout: 8000
- assertNotVisible:
    id: tasks_fab

# Back to an agenda tab before leaving for the menu destinations, so the
# next assertion starts from a known FAB state.
- tapOn:
    id: nav_tab_today
- assertVisible:
    id: tasks_fab

# Plans — a menu destination, below the fold of the sheet. The FAB stays
# "Add task": the timeline creates the work that is due.
- runFlow: ../../helpers/open-plans.yaml
- assertVisible:
    id: tasks_fab
# The bar is still there — a menu destination is a top-level screen — but the
# Plans entry is not one of its tabs.
- assertVisible:
    id: nav_menu_button
- assertNotVisible:
    id: nav_tab_plans

# Pomodoro — no shell FAB.
- runFlow: ../../helpers/open-pomodoro.yaml
- assertNotVisible:
    id: tasks_fab
- assertVisible:
    id: nav_menu_button
- assertNotVisible:
    id: nav_tab_pomodoro
