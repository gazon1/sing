# Smoke: every bottom-bar tab is reachable.
#
# Written as a linear sequence rather than a `repeat` loop on purpose: when a
# tab fails, the failing command in the report names that tab, instead of
# pointing at a loop iteration index.
#
# Note on assertions: the accessibility layer does not surface the
# `selected` state of a NavigationBarItem on the same node that carries its
# test tag, so `selected: true` is not a usable selector here. Reachability is
# asserted instead — the tab node is present and, on the agenda tabs, the FAB
# follows the tab's routing (the real behaviour worth protecting).
appId: com.singularity.todo
name: nav-bottom-nav-tabs
tags:
  - smoke
  - nav
---
- runFlow: ../../helpers/launch-clean.yaml

# Inbox — FAB reads "Add task" on every agenda tab.
- tapOn:
    id: nav_tab_inbox
- assertVisible:
    id: tasks_fab
- assertVisible:
    id: nav_tab_inbox

# Today — the start destination.
- tapOn:
    id: nav_tab_today
- assertVisible:
    id: tasks_fab
- assertVisible:
    id: nav_tab_today

# Upcoming.
- tapOn:
    id: nav_tab_upcoming
- assertVisible:
    id: tasks_fab
- assertVisible:
    id: nav_tab_upcoming

# Plans — the FAB switches to "Add project" on this tab.
- tapOn:
    id: nav_tab_plans
- assertVisible:
    id: tasks_fab
- assertVisible:
    id: nav_tab_plans

# Pomodoro — no FAB on this tab.
- tapOn:
    id: nav_tab_pomodoro
- assertNotVisible:
    id: tasks_fab
- assertVisible:
    id: nav_tab_pomodoro

# Calendar — no FAB on this tab either.
- tapOn:
    id: nav_tab_calendar
- assertNotVisible:
    id: tasks_fab
- assertVisible:
    id: nav_tab_calendar
