# Smoke: every bottom-bar tab is reachable, and each routes the FAB correctly.
#
# The FAB expectations encode the real contract from `FabActionResolver`:
# Inbox/Today/Upcoming are `AgendaGraph` routes, but only Inbox and Today get
# "Add task" — Upcoming deliberately has none. Plans gets "Add task" too: the
# plan tab creates the work that is due, not a project.
# Pomodoro is a non-agenda destination and gets nothing. The Calendar is not a
# tab any more — it is an entry of the app menu, and it is checked there.
# Getting this wrong made this flow fail on Upcoming, so the assertions are
# written to match the resolver rather than to match a guess.
#
# `selected: true` is not usable here: the accessibility layer does not expose
# the selection state on the same node that carries the test tag.
appId: com.singularity.todo
name: nav-bottom-nav-tabs
tags:
  - smoke
  - nav
---
- runFlow: ../../helpers/launch-clean.yaml

# Inbox — FAB reads "Add task".
- tapOn:
    id: nav_tab_inbox
- assertVisible:
    id: tasks_fab
- assertVisible:
    id: nav_tab_inbox

# Today — the start destination, also "Add task".
- tapOn:
    id: nav_tab_today
- assertVisible:
    id: tasks_fab
- assertVisible:
    id: nav_tab_today

# Upcoming — no FAB by design.
- tapOn:
    id: nav_tab_upcoming
- assertNotVisible:
    id: tasks_fab
- assertVisible:
    id: nav_tab_upcoming

# Back to an agenda tab before leaving for the other destinations, so the
# next assertion starts from a known FAB state.
- tapOn:
    id: nav_tab_today
- assertVisible:
    id: tasks_fab

# Plans — the FAB stays "Add task": the plan tab creates the work that is due.
- tapOn:
    id: nav_tab_plans
- assertVisible:
    id: tasks_fab
- assertVisible:
    id: nav_tab_plans

# Pomodoro — no shell FAB.
- tapOn:
    id: nav_tab_pomodoro
- assertNotVisible:
    id: tasks_fab
- assertVisible:
    id: nav_tab_pomodoro

# Calendar — it left the bottom bar and is an entry of the app menu.
- runFlow: ../../helpers/open-app-menu.yaml
- assertVisible:
    id: menu_calendar
