# Both platforms offer the same menu, and the bar carries what the menu does not.
#
# The Android sheet and the Desktop drawer draw one model, so the entries they
# offer are the same. This flow reads the sheet's entries: the projects' section
# and the way to the full list are what the two surfaces share besides the
# destinations, and the Desktop drawer reads the same model.
#
# The Calendar is not one of those entries — it is a tab of the bar. The flow
# asserts that too: a destination that left the menu has to be somewhere, and a
# reader who checks only the sheet cannot tell "moved" from "lost".
#
# The project's id is given to the seed, so the node in the tree is addressed by
# that id rather than by the name the user reads — a name is copy, and an id is
# not.
appId: com.singularity.todo
name: nav-menu-parity
tags:
  - nav
  - scenario:NAV-02
---
- runFlow: ../../helpers/launch-clean.yaml
- runFlow:
    file: ../../helpers/seed.yaml
    env:
      QUERY: "project=Roadmap&id=roadmap"
# The Calendar is a tab, not an entry of the menu.
- assertVisible:
    id: nav_tab_calendar
- runFlow: ../../helpers/open-app-menu.yaml
# The projects are in the menu, as a tree, with the way to the full list under it.
- scrollUntilVisible:
    element:
      id: menu_project_node_roadmap
    direction: DOWN
    timeout: 8000
- assertVisible:
    id: menu_all_projects
