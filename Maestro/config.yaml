# Maestro workspace configuration.
#
# `appId` here is a default for flows that do not declare their own header;
# every flow in flows/ also declares it explicitly so a flow stays runnable
# in isolation with `maestro test <file>`.
#
# Selector source of truth: shared/src/commonMain/kotlin/com/singularity/todo/core/ui/TestTags.kt
#
# Canonical tags (used in flow `tags:` headers):
#   scenario:<ID>  — traceability linkage to a spec in scripts/src/traceability/scenarios/
#                    (e.g. scenario:TASK-REC-01). The only value-carrying tag;
#                    the others below are bare words. Matched by exact string
#                    comparison, so filtering needs no code change. This is the
#                    documented exception to the "lowercase with hyphens" rule
#                    in CONVENTIONS.md — keep the two files in step.
#   smoke        — minimal regression suite, run on every PR
#   regression   — guards a specific fixed bug
#   known-bug    — tracks a confirmed bug; failure is expected
#   persistence  — tests data survives process restart
#   sync         — tests offline/sync behaviour
#   agenda       — agenda feature area
#   tasks        — tasks feature area
#   notes        — notes feature area
#   pomodoro     — pomodoro feature area
#   settings     — settings feature area
#   calendar     — calendar feature area
#   archive      — archive feature area
#   profile      — profile feature area
#   projects     — projects feature area
appId: com.singularity.todo
name: Singularity Todo

# Document the assumed phone viewport for all flows.
# scrollUntilVisible is viewport-relative in Maestro, but these numbers make
# the assumption explicit and testable. 320×640 @ 2.0 density is the Moto G4
# AVD used in CI; flow behaviour on tablet or desktop viewports is UNTESTED.
screenMetrics:
  width: 320
  height: 640
  density: 2.0

# Per-attempt fixture identity.
#
# run-maestro overrides this with a fresh id on every attempt and
# sweeps the fixtures stamped with it once the flow passes. A flow that seeds
# a fixture it later mutates should give the fixture a title of its own, not
# one stamped with ${RUN_ID}: the seed replaces the row it names, so the title
# a flow seeds is the title the flow can assert on, in every run. See
# docs/decisions/2026-10-28-the-seed-replaces-the-task-it-names.md.
#
# The `manual` default is for `maestro test <flow>` run directly against a
# device: there is no runner to mint an id or to clean up afterwards, so a
# manual run is a debugging session, not an isolated one — start it from a
# `pm clear` slate.
env:
  RUN_ID: manual
